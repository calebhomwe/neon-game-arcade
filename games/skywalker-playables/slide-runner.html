<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Slide Runner</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(255,0,255,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=Math.min(window.innerWidth-20,420);H=C.height=Math.min(window.innerHeight-20,720)}resize();window.addEventListener('resize',resize);
let player,obstacles,frame,score,timeLeft,state,trail=[],particles=[],scorePopups=[],shakeTime=0,neonPulse=0,playerLane,speedBoost=0,laneWidth;
function init(){player={lane:1,x:W/2,y:H-100};obstacles=[];frame=0;score=0;timeLeft=30;state='play';trail=[];particles=[];scorePopups=[];shakeTime=0;neonPulse=0;playerLane=1;speedBoost=0;laneWidth=W/3}
C.addEventListener('pointerdown',e=>{if(state==='over'||state==='win'){init();return}let r=C.getBoundingClientRect(),mx=e.clientX-r.left;if(mx<W/2)playerLane=Math.max(0,playerLane-1);else playerLane=Math.min(2,playerLane+1)});
document.addEventListener('keydown',e=>{if(e.code==='ArrowLeft')playerLane=Math.max(0,playerLane-1);if(e.code==='ArrowRight')playerLane=Math.min(2,playerLane+1)});
function update(){if(state!=='play')return;frame++;neonPulse+=.05;timeLeft-=1/60;player.x+=(W*.25*(playerLane-1)-player.x)*.2;speedBoost=Math.min(3,speedBoost+.001);
if(frame%Math.max(15,45-score)===0){let lane=Math.floor(Math.random()*3),types=['barrier','spike','wide'];obstacles.push({x:W*.25*(lane-1),y:-30,w:types[lane%3]==='wide'?80:55,h:types[lane%3]==='wide'?25:20,lane,type:types[lane%3],col:`hsl(${300+Math.random()*60},100%,60%)`})}
for(let o of obstacles){o.y+=(2.5+score*.08+speedBoost);if(o.y>H){score++;o.dead=true;scorePopups.push({x:o.x,y:H-50,txt:'+1',life:25,vy:-1.5})}
if(player.x>o.x-o.w/2&&player.x<o.x+o.w/2&&player.y>o.y-o.h/2&&player.y<o.y+o.h/2){state='over';shakeTime=12;spawnCrashParticles();return}}
obstacles=obstacles.filter(o=>!o.dead);
trail.push({x:player.x,y:player.y+15,life:10});for(let t of trail)t.life--;trail=trail.filter(t=>t.life>0);
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life--}particles=particles.filter(p=>p.life>0);
for(let sp of scorePopups){sp.y+=sp.vy;sp.life--}scorePopups=scorePopups.filter(sp=>sp.life>0);
if(timeLeft<=0){state='win';spawnWinParticles()}if(shakeTime>0)shakeTime--}
function spawnCrashParticles(){for(let i=0;i<20;i++){let a=Math.random()*Math.PI*2;particles.push({x:player.x,y:player.y,vx:Math.cos(a)*(Math.random()*6+2),vy:Math.sin(a)*(Math.random()*6+2),life:30,s:Math.random()*4+2,col:['#ff00ff','#0ff','#ff4757'][Math.floor(Math.random()*3)]})}}
function spawnWinParticles(){for(let i=0;i<60;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*8+2),vy:Math.sin(a)*(Math.random()*8+2)-3,life:50,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`)}}}
function draw(){X.save();if(shakeTime>0)X.translate((Math.random()-.5)*shakeTime*2,(Math.random()-.5)*shakeTime*2);
X.clearRect(-15,-15,W+30,H+30);
// Synthwave grid floor
let grad=X.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#0a0a1a');grad.addColorStop(.5,'#1a0a2a');grad.addColorStop(1,'#0a0a1a');X.fillStyle=grad;X.fillRect(0,0,W,H);
// Horizontal grid lines
X.strokeStyle=`rgba(255,0,255,${.1+Math.sin(neonPulse)*.05})`;X.lineWidth=1;for(let y=0;y<H;y+=30){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
// Vertical grid lines (perspective)
for(let i=-2;i<=2;i++){let lx=W/2+i*laneWidth;X.strokeStyle='rgba(255,0,255,.08)';X.beginPath();X.moveTo(lx,0);X.lineTo(lx,H);X.stroke()}
// Player trail
for(let t of trail){X.globalAlpha=t.life/10*.4;X.fillStyle='#ff00ff';X.beginPath();X.arc(t.x,t.y,4*(t.life/10),0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Obstacles
for(let o of obstacles){X.fillStyle=o.col;X.shadowColor=o.col;X.shadowBlur=12;
if(o.type==='barrier'){X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);X.fillStyle='rgba(255,255,255,.2)';X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,3)}
else if(o.type==='spike'){X.beginPath();X.moveTo(o.x,o.y-o.h/2);X.lineTo(o.x+o.w/2,o.y+h/2);X.lineTo(o.x-o.w/2,o.y+o.h/2);X.closePath();X.fill()}
else{X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);X.fillStyle='rgba(255,255,255,.15)';X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,4)}
X.shadowBlur=0}
// Player
X.fillStyle='#0ff';X.shadowColor='#0ff';X.shadowBlur=20;X.beginPath();X.arc(player.x,player.y,14,0,Math.PI*2);X.fill();X.shadowBlur=0;
X.fillStyle='rgba(255,255,255,.5)';X.beginPath();X.arc(player.x-3,player.y-3,5,0,Math.PI*2);X.fill();
// Speed lines
if(speedBoost>1){X.strokeStyle=`rgba(0,255,255,${(speedBoost-1)*.1})`;X.lineWidth=1;for(let i=0;i<3;i++){let ly=Math.random()*H;X.beginPath();X.moveTo(0,ly);X.lineTo(20,ly);X.stroke()}}
// Particles
for(let p of particles){X.globalAlpha=p.life/50;X.fillStyle=p.col;X.shadowColor=p.col;X.shadowBlur=8;X.beginPath();X.arc(p.x,p.y,p.s*(p.life/50),0,Math.PI*2);X.fill();X.shadowBlur=0}X.globalAlpha=1;
// Score popups
for(let sp of scorePopups){X.globalAlpha=sp.life/25;X.fillStyle='#0ff';X.shadowColor='#0ff';X.shadowBlur=6;X.font='bold 16px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y);X.shadowBlur=0}X.globalAlpha=1;
// HUD
X.fillStyle='#fff';X.font='bold 22px "Segoe UI"';X.textAlign='center';X.fillText('Dodged: '+score,W/2,30);
X.textAlign='right';X.fillStyle=timeLeft<10?'#ff4757':'#fff';X.shadowColor=X.fillStyle;X.shadowBlur=8;X.fillText(Math.ceil(timeLeft)+'s',W-10,30);X.shadowBlur=0;
X.restore();
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);X.fillStyle='#ff4757';X.shadowColor='#ff4757';X.shadowBlur=15;X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('CRASHED!',W/2,H/2-20);X.shadowBlur=0;X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Dodged: '+score,W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to retry',W/2,H/2+55)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);X.fillStyle='#0f0';X.shadowColor='#0f0';X.shadowBlur=20;X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 SURVIVED! \u2728',W/2,H/2-20);X.shadowBlur=0;X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Dodged: '+score+' obstacles',W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+55)}}
function loop(){update();draw();requestAnimationFrame(loop)}init();loop()
</script></body></html>
