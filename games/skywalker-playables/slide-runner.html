<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Slide Runner</title><script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script><script src="sky-arcade.js"></script><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(255,0,255,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,CRECT,needDraw=true;function resize(){W=Math.min(window.innerWidth-20,420);H=Math.min(window.innerHeight-20,720);SKY.fit(C,X,W,H);CRECT=C.getBoundingClientRect();bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#0a0a1a');bgGrad.addColorStop(.5,'#1a0a2a');bgGrad.addColorStop(1,'#0a0a1a');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}function pNotDead(o){return !o.dead}
let player,obstacles,frame,score,timeLeft,state,trail=[],particles=[],scorePopups=[],shakeTime=0,neonPulse=0,playerLane,speedBoost=0,laneWidth,obsTimer=0;
let best=0,base=2.5,cheat={ghost:false,slow:false,small:false};
function saveBest(){if(SKY.saveBest(score))best=score}
function laneX(l){return W/2+W*.28*(l-1)}
function init(){player={lane:1,x:W/2,y:H-100};best=SKY.best();base=SKY.pick(2,2.5,3.2);obstacles=[];frame=0;score=0;timeLeft=30;state='ready';trail=[];particles=[];scorePopups=[];shakeTime=0;neonPulse=0;playerLane=1;speedBoost=0;laneWidth=W/3;obsTimer=0}
C.addEventListener('pointerdown',e=>{if(state==='over'||state==='win'){init();return}if(state==='ready'){state='play';return}sx=e.clientX;let mx=e.clientX-CRECT.left;tapSide=mx<W/2?-1:1});
let sx=null,tapSide=0;function move(d){let n=Math.max(0,Math.min(2,playerLane+d));if(n!==playerLane){playerLane=n;SKY.sfx('whoosh',{volume:.35})}}
C.addEventListener('pointermove',e=>{if(sx===null||state!=='play')return;let dx=e.clientX-sx;if(Math.abs(dx)>30){move(Math.sign(dx));sx=null}});
addEventListener('pointerup',()=>{if(sx!==null&&state==='play')move(tapSide);sx=null});
document.addEventListener('keydown',e=>{if(state==='ready'&&(e.code==='Space'||e.code==='ArrowLeft'||e.code==='ArrowRight')){state='play';return}if((state==='over'||state==='win')&&e.code==='Space'){init();return}if(state!=='play')return;if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1)});
function update(dt){if(state!=='play')return;frame++;neonPulse+=.05*dt;timeLeft-=dt/60;player.x+=(laneX(playerLane)-player.x)*(1-Math.pow(1-.2,dt));speedBoost=Math.min(3,speedBoost+.001*dt);
obsTimer+=dt;let obsInterval=Math.max(15,SKY.pick(55,45,36)-score);if(obsTimer>=obsInterval&&obstacles.length<30){obsTimer-=obsInterval;let lane=Math.floor(Math.random()*3),types=['barrier','spike','wide'];obstacles.push({x:laneX(lane),y:-30,w:types[lane%3]==='wide'?80:55,h:types[lane%3]==='wide'?25:20,lane,type:types[lane%3],col:`hsl(${300+Math.random()*60},100%,60%)`})}
for(let o of obstacles){o.y+=(base+score*.08+speedBoost)*(cheat.slow?.5:1)*dt;if(o.y>H){score++;o.dead=true;if(score%10===0)SKY.sfx('coin',{volume:.5});scorePopups.push({x:o.x,y:H-50,txt:'+1',life:25,vy:-1.5})}
let pr=cheat.small?0:6;if(!cheat.ghost&&player.x+pr>o.x-o.w/2&&player.x-pr<o.x+o.w/2&&player.y+pr>o.y-o.h/2&&player.y-pr<o.y+o.h/2){state='over';shakeTime=SKY.shake(12);spawnCrashParticles();SKY.sfx('explode',{volume:.7});saveBest();return}}
prune(obstacles,pNotDead);
if(trail.length<20)trail.push({x:player.x,y:player.y+15,life:10});for(let t of trail)t.life-=dt;prune(trail,pLife);
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.05*dt;p.life-=dt}prune(particles,pLife);
for(let sp of scorePopups){sp.y+=sp.vy*dt;sp.life-=dt}prune(scorePopups,pLife);
if(timeLeft<=0){state='win';spawnWinParticles();SKY.sfx('win');saveBest()}if(shakeTime>0)shakeTime-=dt}
function spawnCrashParticles(){if(particles.length>180)return;for(let i=0;i<20;i++){let a=Math.random()*Math.PI*2;particles.push({x:player.x,y:player.y,vx:Math.cos(a)*(Math.random()*6+2),vy:Math.sin(a)*(Math.random()*6+2),life:30,s:Math.random()*4+2,col:['#ff00ff','#0ff','#ff4757'][Math.floor(Math.random()*3)]})}}
function spawnWinParticles(){if(particles.length>180)return;for(let i=0;i<60;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*8+2),vy:Math.sin(a)*(Math.random()*8+2)-3,life:50,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`})}}
function draw(){X.save();if(shakeTime>0)X.translate((Math.random()-.5)*shakeTime*2,(Math.random()-.5)*shakeTime*2);
X.clearRect(-15,-15,W+30,H+30);
// Synthwave grid floor
X.fillStyle=bgGrad;X.fillRect(0,0,W,H);
// Horizontal grid lines
X.globalAlpha=.1+Math.sin(neonPulse)*.05;X.strokeStyle='#ff00ff';X.lineWidth=1;for(let y=0;y<H;y+=30){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}X.globalAlpha=1;
// Vertical grid lines (perspective)
for(let i=-2;i<=2;i++){let lx=W/2+i*laneWidth;X.strokeStyle='rgba(255,0,255,.08)';X.beginPath();X.moveTo(lx,0);X.lineTo(lx,H);X.stroke()}
// Player trail
for(let t of trail){X.globalAlpha=t.life/10*.4;X.fillStyle='#ff00ff';X.beginPath();X.arc(t.x,t.y,4*(t.life/10),0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Obstacles
for(let o of obstacles){
if(o.type==='barrier'){X.drawImage(glow(o.col),o.x-o.w/2-12,o.y-o.h/2-12,o.w+24,o.h+24);X.fillStyle=o.col;X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);X.fillStyle='rgba(255,255,255,.2)';X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,3)}
else if(o.type==='spike'){glowAt(o.col,o.x,o.y,o.w/2+12);X.fillStyle=o.col;X.beginPath();X.moveTo(o.x,o.y-o.h/2);X.lineTo(o.x+o.w/2,o.y+o.h/2);X.lineTo(o.x-o.w/2,o.y+o.h/2);X.closePath();X.fill()}
else{X.drawImage(glow(o.col),o.x-o.w/2-12,o.y-o.h/2-12,o.w+24,o.h+24);X.fillStyle=o.col;X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);X.fillStyle='rgba(255,255,255,.15)';X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,4)}}
// Player
let prad=cheat.small?7:14;glowAt('#0ff',player.x,player.y,34);X.fillStyle='#0ff';X.beginPath();X.arc(player.x,player.y,prad,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,.5)';X.beginPath();X.arc(player.x-3,player.y-3,5,0,Math.PI*2);X.fill();
// Speed lines
if(speedBoost>1){X.strokeStyle=`rgba(0,255,255,${(speedBoost-1)*.1})`;X.lineWidth=1;for(let i=0;i<3;i++){let ly=Math.random()*H;X.beginPath();X.moveTo(0,ly);X.lineTo(20,ly);X.stroke()}}
// Particles
for(let p of particles){let pr=p.s*(p.life/50);X.globalAlpha=p.life/50;glowAt(p.col,p.x,p.y,pr+8);X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,pr,0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Score popups
for(let sp of scorePopups){X.globalAlpha=sp.life/25;X.fillStyle='#0ff';X.font='bold 16px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y)}X.globalAlpha=1;
// HUD
X.fillStyle='#fff';X.font='bold 22px "Segoe UI"';X.textAlign='center';X.fillText('Dodged: '+score,W/2,30);X.font='bold 14px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('BEST '+best,W/2,50);X.font='bold 22px "Segoe UI"';
X.textAlign='right';X.fillStyle=timeLeft<10?'#ff4757':'#fff';X.fillText(Math.ceil(timeLeft)+'s',W-10,30);
X.restore();
if(state==='ready'&&SKY.tut)SKY.drawTut(X,W,H,{title:'SLIDE RUNNER',color:'#ff00ff',gesture:'swipe',steps:['Swipe left or right, tap either half of the screen, or press the arrow keys to slide between the 3 lanes.','Neon barriers, spikes and wide blocks fall towards you: be in another lane when they arrive.','Every obstacle that passes scores 1. The fall speeds up the longer you last. Survive 30 seconds.']});
else if(state==='ready'){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,H);glowAt('#ff00ff',W/2,H/2-30,110);X.fillStyle='#ff00ff';X.font='bold 26px "Segoe UI"';X.textAlign='center';X.fillText('SLIDE RUNNER',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Tap left/right to switch lanes',W/2,H/2+5);X.fillStyle='rgba(255,255,255,.5)';X.fillText('\u25B6 Tap to start',W/2,H/2+35)}
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-20,100);X.fillStyle='#ff4757';X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('CRASHED!',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Dodged: '+score,W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('Best: '+best,W/2,H/2+42);X.fillText('\u25B6 Tap to retry',W/2,H/2+68)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#0f0',W/2,H/2-20,110);X.fillStyle='#0f0';X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 SURVIVED! \u2728',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Dodged: '+score+' obstacles',W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('Best: '+best,W/2,H/2+42);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+68)}}
let pState='',lastT=performance.now();function loop(t){if(document.hidden){lastT=performance.now();return requestAnimationFrame(loop)}let dt=Math.min((t-lastT)/1000,.05)*60;lastT=t;update(dt);if(state!==pState){pState=state;needDraw=true}if(state==='play'||state==='ready')needDraw=true;SKY.tick(state,score);if(needDraw){needDraw=false;draw()}requestAnimationFrame(loop)}SKY.setup({id:'slide-runner',color:'#ff00ff',pauseButton:'tl',
onRestart(){init();state='play'},onExit(){init()},onDiff(){init()},
onHint(){if(state!=='play')return 'Tap to start, then swipe towards the lane you want.';let near=[0,1,2].map(l=>Math.max(-1,...obstacles.filter(o=>o.lane===l&&o.y<player.y+20).map(o=>o.y)));
if(near[playerLane]<player.y-280)return 'Your lane is clear for now. '+Math.ceil(timeLeft)+' s to go.';let best=[0,1,2].sort((a,b)=>near[a]-near[b]||Math.abs(a-playerLane)-Math.abs(b-playerLane))[0];
return best===playerLane?'Hold your lane: the others are blocked sooner.':'An obstacle is coming down your lane. Slide '+(best<playerLane?'left':'right')+' to the '+['left','middle','right'][best]+' lane.'},
cheats:{GHOSTRUN:['Slide straight through obstacles',()=>{cheat.ghost=true}],SLOWMO:['Obstacles fall at half speed',()=>{cheat.slow=true}],TINYRUNNER:['Your runner shrinks to half size, so tight gaps fit',()=>{cheat.small=true}]}});
init();requestAnimationFrame(loop)
</script></body></html>
