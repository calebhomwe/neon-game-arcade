<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Slide Runner</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(255,0,255,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,CRECT,needDraw=true;function resize(){W=C.width=Math.min(window.innerWidth-20,420);H=C.height=Math.min(window.innerHeight-20,720);CRECT=C.getBoundingClientRect();bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#0a0a1a');bgGrad.addColorStop(.5,'#1a0a2a');bgGrad.addColorStop(1,'#0a0a1a');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}function pNotDead(o){return !o.dead}
let player,obstacles,frame,score,timeLeft,state,trail=[],particles=[],scorePopups=[],shakeTime=0,neonPulse=0,playerLane,speedBoost=0,laneWidth;
function init(){player={lane:1,x:W/2,y:H-100};obstacles=[];frame=0;score=0;timeLeft=30;state='ready';trail=[];particles=[];scorePopups=[];shakeTime=0;neonPulse=0;playerLane=1;speedBoost=0;laneWidth=W/3}
C.addEventListener('pointerdown',e=>{if(state==='over'||state==='win'){init();return}if(state==='ready'){state='play';return}let mx=e.clientX-CRECT.left;if(mx<W/2)playerLane=Math.max(0,playerLane-1);else playerLane=Math.min(2,playerLane+1)});
document.addEventListener('keydown',e=>{if(state==='ready'&&(e.code==='Space'||e.code==='ArrowLeft'||e.code==='ArrowRight')){state='play';return}if(e.code==='ArrowLeft')playerLane=Math.max(0,playerLane-1);if(e.code==='ArrowRight')playerLane=Math.min(2,playerLane+1)});
function update(){if(state!=='play')return;frame++;neonPulse+=.05;timeLeft-=1/60;player.x+=(W*.25*(playerLane-1)-player.x)*.2;speedBoost=Math.min(3,speedBoost+.001);
if(frame%Math.max(15,45-score)===0&&obstacles.length<30){let lane=Math.floor(Math.random()*3),types=['barrier','spike','wide'];obstacles.push({x:W*.25*(lane-1),y:-30,w:types[lane%3]==='wide'?80:55,h:types[lane%3]==='wide'?25:20,lane,type:types[lane%3],col:`hsl(${300+Math.random()*60},100%,60%)`})}
for(let o of obstacles){o.y+=(2.5+score*.08+speedBoost);if(o.y>H){score++;o.dead=true;scorePopups.push({x:o.x,y:H-50,txt:'+1',life:25,vy:-1.5})}
if(player.x>o.x-o.w/2&&player.x<o.x+o.w/2&&player.y>o.y-o.h/2&&player.y<o.y+o.h/2){state='over';shakeTime=12;spawnCrashParticles();return}}
prune(obstacles,pNotDead);
if(trail.length<20)trail.push({x:player.x,y:player.y+15,life:10});for(let t of trail)t.life--;prune(trail,pLife);
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life--}prune(particles,pLife);
for(let sp of scorePopups){sp.y+=sp.vy;sp.life--}prune(scorePopups,pLife);
if(timeLeft<=0){state='win';spawnWinParticles()}if(shakeTime>0)shakeTime--}
function spawnCrashParticles(){if(particles.length>180)return;for(let i=0;i<20;i++){let a=Math.random()*Math.PI*2;particles.push({x:player.x,y:player.y,vx:Math.cos(a)*(Math.random()*6+2),vy:Math.sin(a)*(Math.random()*6+2),life:30,s:Math.random()*4+2,col:['#ff00ff','#0ff','#ff4757'][Math.floor(Math.random()*3)]})}}
function spawnWinParticles(){if(particles.length>180)return;for(let i=0;i<60;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*8+2),vy:Math.sin(a)*(Math.random()*8+2)-3,life:50,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`})}}
function draw(){X.save();if(shakeTime>0)X.translate((Math.random()-.5)*shakeTime*2,(Math.random()-.5)*shakeTime*2);
X.clearRect(-15,-15,W+30,H+30);
// Synthwave grid floor
X.fillStyle=bgGrad;X.fillRect(0,0,W,H);
// Horizontal grid lines
X.globalAlpha=.1+Math.sin(neonPulse)*.05;X.strokeStyle='#ff00ff';X.lineWidth=1;for(let y=0;y<H;y+=30){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}X.globalAlpha=1;
// Vertical grid lines (perspective)
for(let i=-2;i<=2;i++){let lx=W/2+i*laneWidth;X.strokeStyle='rgba(255,0,255,.08)';X.beginPath();X.moveTo(lx,0);X.lineTo(lx,H);X.stroke()}
// Player trail
for(let t of trail){X.globalAlpha=t.life/10*.4;X.fillStyle='#ff00ff';X.beginPath();X.arc(t.x,t.y,4*(t.life/10),0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Obstacles
for(let o of obstacles){
if(o.type==='barrier'){X.drawImage(glow(o.col),o.x-o.w/2-12,o.y-o.h/2-12,o.w+24,o.h+24);X.fillStyle=o.col;X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);X.fillStyle='rgba(255,255,255,.2)';X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,3)}
else if(o.type==='spike'){glowAt(o.col,o.x,o.y,o.w/2+12);X.fillStyle=o.col;X.beginPath();X.moveTo(o.x,o.y-o.h/2);X.lineTo(o.x+o.w/2,o.y+o.h/2);X.lineTo(o.x-o.w/2,o.y+o.h/2);X.closePath();X.fill()}
else{X.drawImage(glow(o.col),o.x-o.w/2-12,o.y-o.h/2-12,o.w+24,o.h+24);X.fillStyle=o.col;X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);X.fillStyle='rgba(255,255,255,.15)';X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,4)}}
// Player
glowAt('#0ff',player.x,player.y,34);X.fillStyle='#0ff';X.beginPath();X.arc(player.x,player.y,14,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,.5)';X.beginPath();X.arc(player.x-3,player.y-3,5,0,Math.PI*2);X.fill();
// Speed lines
if(speedBoost>1){X.strokeStyle=`rgba(0,255,255,${(speedBoost-1)*.1})`;X.lineWidth=1;for(let i=0;i<3;i++){let ly=Math.random()*H;X.beginPath();X.moveTo(0,ly);X.lineTo(20,ly);X.stroke()}}
// Particles
for(let p of particles){let pr=p.s*(p.life/50);X.globalAlpha=p.life/50;glowAt(p.col,p.x,p.y,pr+8);X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,pr,0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Score popups
for(let sp of scorePopups){X.globalAlpha=sp.life/25;X.fillStyle='#0ff';X.font='bold 16px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y)}X.globalAlpha=1;
// HUD
X.fillStyle='#fff';X.font='bold 22px "Segoe UI"';X.textAlign='center';X.fillText('Dodged: '+score,W/2,30);
X.textAlign='right';X.fillStyle=timeLeft<10?'#ff4757':'#fff';X.fillText(Math.ceil(timeLeft)+'s',W-10,30);
X.restore();
if(state==='ready'){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,H);glowAt('#ff00ff',W/2,H/2-30,110);X.fillStyle='#ff00ff';X.font='bold 26px "Segoe UI"';X.textAlign='center';X.fillText('SLIDE RUNNER',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Tap left/right to switch lanes',W/2,H/2+5);X.fillStyle='rgba(255,255,255,.5)';X.fillText('\u25B6 Tap to start',W/2,H/2+35)}
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-20,100);X.fillStyle='#ff4757';X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('CRASHED!',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Dodged: '+score,W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to retry',W/2,H/2+55)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#0f0',W/2,H/2-20,110);X.fillStyle='#0f0';X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 SURVIVED! \u2728',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Dodged: '+score+' obstacles',W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+55)}}
let pState='';function loop(){if(document.hidden)return requestAnimationFrame(loop);update();if(state!==pState){pState=state;needDraw=true}if(state==='play')needDraw=true;if(needDraw){needDraw=false;draw()}requestAnimationFrame(loop)}init();loop()
</script></body></html>
