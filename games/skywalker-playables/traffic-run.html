<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Traffic Run</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(255,165,0,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,needDraw=true;function resize(){W=C.width=Math.min(window.innerWidth-20,420);H=C.height=Math.min(window.innerHeight-20,720);bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#2a2a2a');bgGrad.addColorStop(1,'#3a3a3a');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}
let player,traffic,fuel,frame,score,timeLeft,state,laneOff=0,particles=[],scorePopups=[],shakeTime=0,neonPulse=0;
function init(){player={lane:1,x:W/3,y:H-100};traffic=[];fuel=[];frame=0;score=0;timeLeft=45;state='ready';laneOff=0;particles=[];scorePopups=[];shakeTime=0;neonPulse=0}
C.addEventListener('pointerdown',e=>{if(state==='over'||state==='win'){init();return}if(state==='ready'){state='play';return}let r=C.getBoundingClientRect(),mx=e.clientX-r.left;if(mx<W/2)player.lane=Math.max(0,player.lane-1);else player.lane=Math.min(2,player.lane+1)});
document.addEventListener('keydown',e=>{if(state==='ready'&&(e.code==='Space'||e.code==='ArrowLeft'||e.code==='ArrowRight')){state='play';return}if(e.code==='ArrowLeft')player.lane=Math.max(0,player.lane-1);if(e.code==='ArrowRight')player.lane=Math.min(2,player.lane+1)});
function update(){if(state!=='play')return;frame++;laneOff=(laneOff+3)%30;neonPulse+=.04;player.x+=(W*.3*(player.lane-1)-player.x)*.15;timeLeft-=1/60;
if(frame%Math.max(10,32-score)===0&&traffic.length<30){let lane=Math.floor(Math.random()*3);let colors=['#ff4757','#ffa502','#1e90ff','#a55eea','#2ed573','#ff6b81'];traffic.push({x:W*.3*(lane-1),y:-60,w:38,h:55,lane,col:colors[Math.floor(Math.random()*colors.length)],type:'car'})}
if(frame%100===0&&fuel.length<10){let lane=Math.floor(Math.random()*3);fuel.push({x:W*.3*(lane-1),y:-20,collected:false})}
for(let t of traffic){t.y+=2.5+score*.07;if(t.y>H){t.dead=true}}
// Fix collision check
for(let i=0;i<traffic.length;i++){let t=traffic[i];if(t.dead)continue;if(Math.abs(player.x-t.x)<30&&Math.abs(player.y-t.y)<35){state='over';shakeTime=12;spawnCrashParticles();break}}
for(let f of fuel){f.y+=2.5;if(!f.collected&&Math.abs(player.x-f.x)<25&&Math.abs(player.y-f.y)<25){f.collected=true;timeLeft+=5;score+=10;scorePopups.push({x:f.x,y:f.y-15,txt:'+5s!',life:30,vy:-1.5});for(let i=0;i<8;i++)particles.push({x:f.x,y:f.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:20,s:Math.random()*3+2,col:'#2ed573'})}}
prune(traffic,t=>!t.dead);prune(fuel,f=>!f.collected);if(timeLeft<=0)state='win';if(shakeTime>0)shakeTime--}
function spawnCrashParticles(){if(particles.length>300)return;for(let i=0;i<20;i++){let a=Math.random()*Math.PI*2;particles.push({x:player.x,y:player.y,vx:Math.cos(a)*(Math.random()*6+2),vy:Math.sin(a)*(Math.random()*6+2),life:30,s:Math.random()*4+2,col:['#ff4757','#ffa502'][Math.floor(Math.random()*2)]})}}
function spawnWinParticles(){if(particles.length>300)return;for(let i=0;i<60;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*8+2),vy:Math.sin(a)*(Math.random()*8+2)-3,life:50,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`})}}
function draw(){X.save();if(shakeTime>0)X.translate((Math.random()-.5)*shakeTime*2,(Math.random()-.5)*shakeTime*2);
X.clearRect(-15,-15,W+30,H+30);
// Highway
X.fillStyle=bgGrad;X.fillRect(0,0,W,H);
// Lane dividers
X.setLineDash([20,15]);X.strokeStyle='rgba(255,255,255,.4)';X.lineWidth=2;for(let i=0;i<2;i++){let lx=W*.3*(i+.5);X.beginPath();for(let y=-30+laneOff;y<H;y+=35){X.moveTo(lx,y);X.lineTo(lx,y+18)}}X.stroke();X.setLineDash([]);
// Road edges
X.fillStyle='#ffd700';X.fillRect(0,0,3,H);X.fillRect(W-3,0,3,H);
// Traffic
for(let t of traffic){glowAt(t.col,t.x,t.y,30);X.fillStyle=t.col;X.fillRect(t.x-18,t.y-25,36,50);X.fillStyle='rgba(0,0,0,.3)';X.fillRect(t.x-14,t.y-22,28,12);X.fillRect(t.x-14,t.y+10,28,12);X.fillStyle='#ffff00';X.fillRect(t.x-12,t.y-24,5,3);X.fillRect(t.x+7,t.y-24,5,3);X.fillStyle='#ff0000';X.fillRect(t.x-12,t.y+20,5,3);X.fillRect(t.x+7,t.y+20,5,3)}
// Fuel
for(let f of fuel){if(f.collected)continue;glowAt('#2ed573',f.x,f.y,24);X.fillStyle='#2ed573';X.beginPath();X.arc(f.x,f.y,12,0,Math.PI*2);X.fill();X.fillStyle='#fff';X.font='bold 14px sans-serif';X.textAlign='center';X.fillText('+',f.x,f.y+5)}
// Player
glowAt('#00d2d3',player.x,player.y,29);X.fillStyle='#00d2d3';X.beginPath();X.arc(player.x,player.y,14,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,.5)';X.beginPath();X.arc(player.x-3,player.y-3,5,0,Math.PI*2);X.fill();
// Particles
for(let p of particles){let pr=p.s*(p.life/30);X.globalAlpha=p.life/30;glowAt(p.col,p.x,p.y,pr+6);X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,pr,0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Score popups
for(let sp of scorePopups){X.globalAlpha=sp.life/30;X.fillStyle='#2ed573';X.font='bold 16px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y)}X.globalAlpha=1;
// HUD
X.fillStyle='#fff';X.font='bold 22px "Segoe UI"';X.textAlign='center';X.fillText('Score: '+score,W/2,30);
X.textAlign='right';X.fillStyle=timeLeft<10?'#ff4757':'#fff';X.fillText(Math.ceil(timeLeft)+'s',W-10,30);
X.restore();
if(state==='ready'){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,H);glowAt('#ffa502',W/2,H/2-30,110);X.fillStyle='#ffa502';X.font='bold 26px "Segoe UI"';X.textAlign='center';X.fillText('TRAFFIC RUN',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Tap left/right to change lanes',W/2,H/2+5);X.fillStyle='rgba(255,255,255,.5)';X.fillText('\u25B6 Tap to start',W/2,H/2+35)}
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-20,100);X.fillStyle='#ff4757';X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('CRASHED!',W/2,H/2-20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to retry',W/2,H/2+40)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#0f0',W/2,H/2-20,110);X.fillStyle='#0f0';X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 SAFE TRIP! \u2728',W/2,H/2-20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+40)}}
let pState='';function loop(){if(document.hidden)return requestAnimationFrame(loop);update();if(state!==pState){pState=state;needDraw=true}if(state==='play')needDraw=true;if(needDraw){needDraw=false;draw()}requestAnimationFrame(loop)}init();loop()
</script></body></html>
