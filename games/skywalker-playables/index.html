<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>YouTube Playables Studio</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a2e;font-family:'Segoe UI',sans-serif;color:#fff;min-height:100vh;overflow-x:hidden}.header{text-align:center;padding:40px 20px 20px;background:linear-gradient(180deg,#1a1a3e 0%,#0a0a2e 100%)}.header h1{font-size:36px;background:linear-gradient(90deg,#0cf,#a55eea,#ff6b81);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:-1px}.header p{color:rgba(255,255,255,.5);font-size:15px}.filters{display:flex;justify-content:center;gap:10px;padding:15px 20px;flex-wrap:wrap}.filter-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;transition:all .2s}.filter-btn:hover,.filter-btn.active{background:linear-gradient(90deg,#0cf,#a55eea);color:#fff;border-color:transparent}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:20px;max-width:1000px;margin:0 auto}.card{background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:16px;padding:24px 16px;text-align:center;cursor:pointer;transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s;text-decoration:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:160px;position:relative;overflow:hidden}.card::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.1),transparent 70%);pointer-events:none}.card:hover{transform:translateY(-6px) scale(1.04);box-shadow:0 12px 40px rgba(0,0,0,.5)}.card .icon{font-size:40px;margin-bottom:10px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}.card .name{font-weight:700;font-size:16px;margin-bottom:6px;text-shadow:0 1px 3px rgba(0,0,0,.3)}.card .desc{font-size:12px;opacity:.8;line-height:1.3}.category-badge{position:absolute;top:10px;right:10px;font-size:10px;background:rgba(0,0,0,.3);padding:3px 8px;border-radius:10px;backdrop-filter:blur(4px)}.game-frame{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a2e;z-index:1000;display:none;flex-direction:column}.game-frame.active{display:flex}.game-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(180deg,rgba(26,26,62,.95),rgba(10,10,46,.95));backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1)}.back-btn{padding:8px 20px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer;font-size:14px;transition:all .2s;display:flex;align-items:center;gap:6px}.back-btn:hover{background:linear-gradient(90deg,#0cf,#a55eea);border-color:transparent}.game-title{font-weight:700;font-size:16px}.game-container{flex:1;display:flex;justify-content:center;align-items:center;padding:20px}.game-container iframe{width:100%;height:100%;border-radius:12px;box-shadow:0 0 60px rgba(0,200,255,.2);max-width:100%;max-height:100%}.stats{text-align:center;padding:20px;color:rgba(255,255,255,.4);font-size:13px}.stats span{color:rgba(255,255,255,.7);font-weight:600}.footer{text-align:center;padding:30px 20px;color:rgba(255,255,255,.3);font-size:12px;border-top:1px solid rgba(255,255,255,.05);margin-top:30px}@media(max-width:600px){.header h1{font-size:28px}.grid{grid-template-columns:repeat(2,1fr);gap:12px;padding:15px}.card{min-height:140px;padding:20px 12px}.card .icon{font-size:32px}.game-container{padding:10px}.game-container iframe{width:100%!important;height:100%!important;border-radius:8px}}</style></head>
<body>
<div class="header"><h1>&#x1F3AE; YouTube Playables Studio</h1><p>22 Interactive Mini-Games &mdash; Built for Mobile & Desktop</p></div>
<div class="filters">
<button class="filter-btn active" onclick="filterGames('all')">All Games</button>
<button class="filter-btn" onclick="filterGames('arcade')">Arcade</button>
<button class="filter-btn" onclick="filterGames('puzzle')">Puzzle</button>
<button class="filter-btn" onclick="filterGames('action')">Action</button>
<button class="filter-btn" onclick="filterGames('skill')">Skill</button>
</div>
<div class="grid" id="gameGrid"></div>
<div class="stats">Powered by <span>Skywalker Studio</span> &bull; All games run locally in your browser</div>
<div class="footer">&copy; 2026 Skywalker Studio &mdash; YouTube Playable Ad Collection</div>
<div class="game-frame" id="gameFrame"><div class="game-header"><button class="back-btn" onclick="closeGame()">&#x2190; Back to Games</button><span class="game-title" id="gameTitle"></span></div><div class="game-container"><iframe id="gameIframe" frameborder="0" allowfullscreen></iframe></div></div>
<script>
const games=[{name:'Flap & Fly',file:'flappy-bird.html',icon:'&#x2708;&#xFE0F;',desc:'Tap to dodge pipes',cat:'arcade',c1:'#ff4757',c2:'#ff6b81'},{name:'Brick Breaker',file:'breakout.html',icon:'&#x1F9F1;',desc:'Smash all bricks',cat:'arcade',c1:'#ffa502',c2:'#ffbe76'},{name:'Snake',file:'snake.html',icon:'&#x1F40D;',desc:'Classic snake game',cat:'arcade',c1:'#2ed573',c2:'#7bed9f'},{name:'Pull the Pin',file:'key-unlock.html',icon:'&#x1F511;',desc:'Drain water, grab key',cat:'puzzle',c1:'#1e90ff',c2:'#70a1ff'},{name:'Turret Defense',file:'turret-defense.html',icon:'&#x1F52C;',desc:'Survive 10 waves',cat:'action',c1:'#a55eea',c2:'#d63031'},{name:'Stack Tower',file:'stack-tower.html',icon:'&#x1F3DA;&#xFE0F;',desc:'Stack 20 blocks',cat:'skill',c1:'#ff6b81',c2:'#ee5a24'},{name:'Slingshot',file:'slingshot.html',icon:'&#x1F3AF;',desc:'Destroy 3 targets',cat:'skill',c1:'#00d2d3',c2:'#01a3a4'},{name:'Rope Swing',file:'rope-swing.html',icon:'&#x1F33F;',desc:'Swing to the end',cat:'skill',c1:'#5f27cd',c2:'#341f97'},{name:'Sniper Shot',file:'sniper-shot.html',icon:'&#x1F3B5;',desc:'Hit 3 targets',cat:'action',c1:'#ff4757',c2:'#c0392b'},{name:'Match Swipe',file:'match-swipe.html',icon:'&#x1F48E;',desc:'Match-3 puzzle',cat:'puzzle',c1:'#a55eea',c2:'#6c5ce7'},{name:'Slide Runner',file:'slide-runner.html',icon:'&#x1F3C3;',desc:'Dodge neon obstacles',cat:'action',c1:'#ff00ff',c2:'#8e44ad'},{name:'Lane Switcher',file:'lane-switcher.html',icon:'&#x1F6E3;&#xFE0F;',desc:'3-lane survival',cat:'action',c1:'#1e90ff',c2:'#00b4d8'},{name:'Parking Puzzle',file:'parking-puzzle.html',icon:'&#x1F697;',desc:'Park in 3 levels',cat:'puzzle',c1:'#2ed573',c2:'#27ae60'},{name:'Traffic Run',file:'traffic-run.html',icon:'&#x1F697;',desc:'Dodge highway traffic',cat:'action',c1:'#ffa502',c2:'#e67e22'},{name:'Hole Eater',file:'hole-eater.html',icon:'&#x1F573;&#xFE0F;',desc:'Grow by eating',cat:'arcade',c1:'#0cf',c2:'#0984e3'},{name:'Cut the Rope',file:'cut-rope.html',icon:'&#x1F485;',desc:'Drop ball on platform',cat:'puzzle',c1:'#ffd700',c2:'#f39c12'},{name:'Spike Jump',file:'spike-jump.html',icon:'&#x1F5E3;&#xFE0F;',desc:'Jump over spikes',cat:'skill',c1:'#ff4757',c2:'#e74c3c'},{name:'Grow or Shrink',file:'grow-shrink.html',icon:'&#x1F50D;',desc:'Match door sizes',cat:'puzzle',c1:'#a55eea',c2:'#8e44ad'},{name:'Swim Dodge',file:'swim-dodge.html',icon:'&#x1F41F;',desc:'Escape jellyfish',cat:'action',c1:'#0cf',c2:'#0097e6'},{name:'Color Match',file:'color-match.html',icon:'&#x1F3A8;',desc:'Catch matching colors',cat:'puzzle',c1:'#ff6b81',c2:'#e84393'},{name:'Maze Runner',file:'maze-runner.html',icon:'&#x1F6A7;',desc:'Navigate 3 mazes',cat:'puzzle',c1:'#0cf',c2:'#00cec9'},{name:'Balance Tile',file:'balance-tile.html',icon:'&#x2696;&#xFE0F;',desc:'Don\'t fall off!',cat:'skill',c1:'#ffa502',c2:'#fdcb6e'}];
let currentFilter='all';
function renderGames(filter='all'){const grid=document.getElementById('gameGrid');grid.innerHTML='';const filtered=filter==='all'?games:games.filter(g=>g.cat===filter);filtered.forEach((g,i)=>{const card=document.createElement('a');card.className='card';card.style.cssText=`--c1:${g.c1};--c2:${g.c2};animation-delay:${i*0.03}s`;card.href='#';card.onclick=(e)=>{e.preventDefault();openGame(g)};card.innerHTML=`<span class="category-badge">${g.cat}</span><span class="icon">${g.icon}</span><div class="name">${g.name}</div><div class="desc">${g.desc}</div>`;grid.appendChild(card)})}
function filterGames(cat){currentFilter=cat;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().includes(cat)||cat==='all'&&b.textContent.includes('All')));renderGames(cat)}
function openGame(g){document.getElementById('gameFrame').classList.add('active');document.getElementById('gameTitle').textContent=g.name;document.getElementById('gameIframe').src=g.file;document.body.style.overflow='hidden'}
function closeGame(){document.getElementById('gameFrame').classList.remove('active');document.getElementById('gameIframe').src='';document.body.style.overflow=''}
renderGames();
</script></body></html>
