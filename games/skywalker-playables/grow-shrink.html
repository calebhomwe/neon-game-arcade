<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Grow or Shrink</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(165,94,234,.3)</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=Math.min(window.innerWidth-20,420);H=C.height=Math.min(window.innerHeight-20,720)}resize();window.addEventListener('resize',resize);
let player,gates,level,state,sizeTimer,mx=W/2,particles=[],scorePopups=[],shakeTime=0,pulseT=0;
const GCOL=['#ff4757','#ffa502','#2ed573','#1e90ff','#a55eea'];
function init(){player={x:W/2,y:H-100,r:20};gates=[];level=0;state='ready';sizeTimer=0;particles=[];scorePopups=[];shakeTime=0;pulseT=0}
function loadGate(){let gateW=70+Math.random()*100;gateSize=gateW*.55+Math.random()*gateW*.15;player.r=18+Math.random()*12;mx=W/2;gates=[{x:W+60,w:gateW,size:gateSize,passed:false,col:GCOL[level%GCOL.length],pulse:0}];state='play'}
C.addEventListener('pointermove',e=>{let r=C.getBoundingClientRect();mx=e.clientX-r.left});
document.addEventListener('keydown',e=>{if(e.code==='Space'){if(state==='over'||state==='win')init();else if(state==='ready')loadGate()}});
let gateSize=80;
function update(){if(state!=='play')return;pulseT+=.03;sizeTimer++;mx+=(W/2-mx)*.05;player.x=mx+Math.sin(sizeTimer*.03)*50;
for(let g of gates){g.pulse+=.05;g.x-=2;if(!g.passed&&g.x+g.w<player.x){g.passed=true;
let diff=Math.abs(player.r-g.size/2);if(diff>18){state='over';shakeTime=12;spawnCrashParticles();return}else{level++;scorePopups.push({x:g.x+g.w/2,y:g.y||H*.35,txt:diff<8?'PERFECT!':'PASSED!',life:40,vy:-1.5});
if(level>=5){state='win';spawnWinParticles()}else{loadGate()}}}}}
if(shakeTime>0)shakeTime--;
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life--}particles=particles.filter(p=>p.life>0);
for(let sp of scorePopups){sp.y+=sp.vy;sp.life--}scorePopups=scorePopups.filter(sp=>sp.life>0)}
function spawnCrashParticles(){for(let i=0;i<20;i++){let a=Math.random()*Math.PI*2;particles.push({x:player.x,y:player.y,vx:Math.cos(a)*(Math.random()*6+2),vy:Math.sin(a)*(Math.random()*6+2),life:30,s:Math.random()*4+2,col:'#ff4757'})}}
function spawnWinParticles(){for(let i=0;i<60;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*8+2),vy:Math.sin(a)*(Math.random()*8+2)-3,life:50,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`)}}}
function draw(){X.save();if(shakeTime>0)X.translate((Math.random()-.5)*shakeTime*2,(Math.random()-.5)*shakeTime*2);
X.clearRect(-15,-15,W+30,H+30);
// Background
let grad=X.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#1a1025');grad.addColorStop(1,'#0f0a18');X.fillStyle=grad;X.fillRect(0,0,W,H);
// Size indicator circle (ghost)
X.strokeStyle='rgba(165,94,234,.1)';X.lineWidth=1;X.beginPath();X.arc(player.x,player.y,player.r+10+Math.sin(pulseT)*3,0,Math.PI*2);X.stroke();
// Gates
for(let g of gates){let pulse=1+Math.sin(g.pulse)*.05;X.save();X.translate(g.x+g.w/2,g.y||H*.35);X.scale(pulse,pulse);X.translate(-(g.x+g.w/2),-(g.y||H*.35));
X.fillStyle=g.col;X.shadowColor=g.col;X.shadowBlur=12;X.fillRect(g.x,g.y||H*.35,g.w,(g.size||60));X.shadowBlur=0;
X.strokeStyle='#fff';X.lineWidth=2;X.strokeRect(g.x,g.y||H*.35,g.w,(g.size||60));
X.fillStyle='rgba(255,255,255,.5)';X.font='bold 12px sans-serif';X.textAlign='center';X.fillText((g.size||60).toFixed(0),g.x+g.w/2,(g.y||H*.35)-8);
X.restore()}
// Player
X.fillStyle='#fff';X.shadowColor='#fff';X.shadowBlur=12;X.beginPath();X.arc(player.x,player.y,player.r,0,Math.PI*2);X.fill();X.shadowBlur=0;
X.fillStyle=GCOL[level%GCOL.length];X.beginPath();X.arc(player.x,player.y,player.r*.6,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,.4)';X.beginPath();X.arc(player.x-player.r*.3,player.y-player.r*.3,player.r*.25,0,Math.PI*2);X.fill();
// Particles
for(let p of particles){X.globalAlpha=p.life/50;X.fillStyle=p.col;X.shadowColor=p.col;X.shadowBlur=6;X.beginPath();X.arc(p.x,p.y,p.s*(p.life/50),0,Math.PI*2);X.fill();X.shadowBlur=0}X.globalAlpha=1;
// Score popups
for(let sp of scorePopups){X.globalAlpha=sp.life/40;X.fillStyle=sp.txt.includes('PERFECT')?'#ffd700':'#fff';X.shadowColor=X.fillStyle;X.shadowBlur=8;X.font=sp.txt.includes('PERFECT')?'bold 20px "Segoe UI"':'bold 16px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y);X.shadowBlur=0}X.globalAlpha=1;
// HUD
X.fillStyle='#fff';X.font='bold 22px "Segoe UI"';X.textAlign='center';X.fillText('Gate '+(level+1)+' / 5',W/2,30);
X.restore();
if(state==='ready'){X.fillStyle='rgba(255,255,255,.85)';X.font='bold 24px "Segoe UI"';X.textAlign='center';X.fillText('GROW OR SHRINK',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Match the door size to pass through',W/2,H/2+5);X.font='14px "Segoe UI"';X.fillStyle='rgba(255,255,255,.4)';X.fillText('Tap to start',W/2,H/2+35)}
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);X.fillStyle='#ff4757';X.shadowColor='#ff4757';X.shadowBlur=15;X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('WRONG SIZE!',W/2,H/2-20);X.shadowBlur=0;X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to retry',W/2,H/2+40)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);X.fillStyle='#a55eea';X.shadowColor='#a55eea';X.shadowBlur=20;X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 ALL GATES PASSED! \u2728',W/2,H/2-20);X.shadowBlur=0;X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+40)}}
function loop(){update();draw();requestAnimationFrame(loop)}init();loop()
</script></body></html>
