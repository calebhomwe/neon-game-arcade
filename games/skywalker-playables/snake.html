<!DOCTYPE html>
<html lang="en"><head><script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Snake</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 80px rgba(0,255,100,.6);transition:box-shadow 0.3s ease;}.c:focus{outline:none;box-shadow:0 0 80px rgba(0,255,100,.8);}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,COLS,ROWS,SZ,bgGrad,gridSpr,needDraw=true,gameInited=false,graceTicks=0;function buildGrid(){gridSpr=document.createElement('canvas');gridSpr.width=W;gridSpr.height=H;let g=gridSpr.getContext('2d');for(let i=0;i<COLS;i++)for(let j=0;j<ROWS;j++){if((i+j)%2===0){g.fillStyle='rgba(255,255,255,0.02)';g.fillRect(i*SZ,j*SZ+40,SZ,SZ)}}}function resize(){const oc=COLS,orr=ROWS;const dpr=Math.min(window.devicePixelRatio||1,2);W=Math.min(window.innerWidth-20,520);H=Math.min(window.innerHeight-20,720);C.style.width=W+'px';C.style.height=H+'px';C.width=Math.round(W*dpr);C.height=Math.round(H*dpr);X.setTransform(dpr,0,0,dpr,0,0);COLS=Math.floor(W/22);ROWS=Math.floor((H-40)/22);SZ=Math.floor(Math.min(W/COLS,(H-40)/ROWS));bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#081a08');bgGrad.addColorStop(1,'#122a12');buildGrid();if(gameInited&&oc&&(COLS!==oc||ROWS!==orr)){if(state==='ready'){snake=[{x:Math.floor(COLS/2),y:Math.floor(ROWS/2)}];dir={x:1,y:0};nextDir={x:1,y:0}}else{for(const s of snake){s.x=Math.max(0,Math.min(COLS-1,s.x));s.y=Math.max(0,Math.min(ROWS-1,s.y))}}if(food){food.x=Math.max(0,Math.min(COLS-1,food.x));food.y=Math.max(1,Math.min(ROWS-1,food.y))}graceTicks=Math.max(graceTicks,3)}needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}
const SCACHE=new Map();function segCol(h,l){let h2=Math.round(h/5)*5,l2=Math.round(l/5)*5,k=h2+':'+l2;let c=SCACHE.get(k);if(!c){if(SCACHE.size>120)SCACHE.clear();c='hsl('+h2+', 90%, '+l2+'%)';SCACHE.set(k,c)}return c}
let emojiSpr=null;function emojiImg(){if(!emojiSpr){emojiSpr=document.createElement('canvas');emojiSpr.width=emojiSpr.height=28;let g=emojiSpr.getContext('2d');g.font='24px "Segoe UI"';g.textAlign='center';g.textBaseline='middle';g.fillText('\uD83D\uDC0D',14,15)}return emojiSpr}
let snake,dir,nextDir,food,score,over,won,state,tick,spd,interval,particles=[],scorePopups=[],trail=[],pulseT=0,glowOffset=0,snakeGlow=0;
function init(){snake=[{x:Math.floor(COLS/2),y:Math.floor(ROWS/2)}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;over=false;won=false;state='ready';particles=[];scorePopups=[];trail=[];pulseT=0;glowOffset=0;snakeGlow=0;graceTicks=3;gameInited=true;placeFood();startSpeed()}
function startSpeed(){clearInterval(interval);spd=130;interval=setInterval(update,spd)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play'&&!over&&!won){clearInterval(interval);interval=0}}else if(state==='play'&&!over&&!won&&!interval){interval=setInterval(update,spd)}});
function placeFood(){do{food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*(ROWS-1))+1}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function setDir(dx,dy){if(dir.x!==-dx||dir.y!==-dy)nextDir={x:dx,y:dy}}
document.addEventListener('keydown',e=>{if(e.code==='ArrowUp'||e.code==='KeyW')setDir(0,-1);if(e.code==='ArrowDown'||e.code==='KeyS')setDir(0,1);if(e.code==='ArrowLeft'||e.code==='KeyA')setDir(-1,0);if(e.code==='ArrowRight'||e.code==='KeyD')setDir(1,0);if(state==='ready'&&(e.code==='Space'||e.code.startsWith('Arrow')||e.code.startsWith('Key')))state='play';if((over||won)&&e.code==='Space')init()});
let tx,ty;C.addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY;if(over||won){init();return}if(state==='ready'){state='play';return}});
C.addEventListener('pointerup',e=>{let dx=e.clientX-tx,dy=e.clientY-ty;if(Math.abs(dx)+Math.abs(dy)<15)return;if(Math.abs(dx)>Math.abs(dy)){setDir(dx>0?1:-1,0)}else{setDir(0,dy>0?1:-1)}});
function update(){if(state!=='play')return;dir={...nextDir};let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(graceTicks>0){graceTicks--;head.x=Math.max(0,Math.min(COLS-1,head.x));head.y=Math.max(0,Math.min(ROWS-1,head.y))}
if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){over=true;clearInterval(interval);spawnDeathParticles();return}
snake.unshift(head);
if(head.x===food.x&&head.y===food.y){score++;
// Enhanced food particles
for(let i=0;i<15;i++){
    let a=Math.PI*2/15*i;
    particles.push({
        x:food.x*SZ+SZ/2,
        y:food.y*SZ+SZ/2,
        vx:Math.cos(a)*3,
        vy:Math.sin(a)*3,
        life:30,
        s:Math.random()*4+2,
        col:'#ff4757',
        gravity:0.05
    });
}
scorePopups.push({
    x:head.x*SZ+SZ/2,
    y:head.y*SZ,
    txt:'+'+score,
    life:40,
    vy:-1.8,
    scale:1
});
if(score>=30){won=true;clearInterval(interval);spawnWinParticles()}else{placeFood();if(spd>65){spd-=5;startSpeed()}}}else{let tail=snake.pop();trail.push({x:tail.x,y:tail.y,life:15});for(let t of trail)t.life--;prune(trail,t=>t.life>0)}
// Update particles with gravity
for(let p of particles){
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=p.gravity || 0;
    p.life--;
}
prune(particles,pLife);
// Update score popups with scaling
for(let sp of scorePopups){
    sp.y+=sp.vy;
    sp.life--;
    sp.scale = 1.3 - (40-sp.life)/40 * 0.3;
}
prune(scorePopups,pLife);
glowOffset += 0.05;
snakeGlow = 1 + Math.sin(glowOffset*2)*0.5;
}
function spawnDeathParticles(){
    if(particles.length>300)return;
    // Add death particles with better distribution
    for(let s of snake){
        for(let i=0;i<6;i++){
            particles.push({
                x:s.x*SZ+SZ/2,
                y:s.y*SZ+SZ/2,
                vx:(Math.random()-.5)*6,
                vy:(Math.random()-.5)*6,
                life:40,
                s:Math.random()*4+2,
                col:`hsl(${120+Math.random()*40},90%,50%)`,
                gravity:0.1
            });
        }
    }
    // Add a special explosion effect
    for(let i=0;i<30;i++){
        setTimeout(()=>{
            let a=Math.random()*Math.PI*2;
            particles.push({
                x:snake[0].x*SZ+SZ/2,
                y:snake[0].y*SZ+SZ/2,
                vx:Math.cos(a)*5,
                vy:Math.sin(a)*5,
                life:50,
                s:Math.random()*3+1,
                col:'#ff4757',
                gravity:0.08
            });
        }, i*20);
    }
}
function spawnWinParticles(){
    if(particles.length>300)return;
    for(let i=0;i<80;i++){
        let a=Math.random()*Math.PI*2;
        particles.push({
            x:W/2,
            y:H/2,
            vx:Math.cos(a)*(Math.random()*10+2),
            vy:Math.sin(a)*(Math.random()*10+2),
            life:70,
            s:Math.random()*5+3,
            col:`hsl(${Math.random()*360},100%,60%)`,
            gravity:0.05
        });
    }
}
function draw(){
    X.clearRect(0,0,W,H);
    X.fillStyle=bgGrad;
    X.fillRect(0,0,W,H);
    
    pulseT+=.03;
    
    // Pre-rendered checkerboard grid
    X.drawImage(gridSpr,0,0);
    
    // Snake trail with glow effect
    for(let t of trail){
        X.globalAlpha=t.life/15*0.4;
        X.fillStyle='#2ed573';
        X.beginPath();
        X.arc(t.x*SZ+SZ/2,t.y*SZ+SZ/2,SZ*.3,0,Math.PI*2);
        X.fill();
    }
    X.globalAlpha=1;
    
    // Enhanced food with pulsing effect and glow
    let foodPulse=1+Math.sin(pulseT*3)*.2;
    glowAt('#ff4757',food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ/2.5*foodPulse+15);
    X.fillStyle='#ff4757';
    X.beginPath();
    X.arc(food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ/2.5*foodPulse,0,Math.PI*2);
    X.fill();
    
    // Food inner highlight
    X.fillStyle='rgba(255,255,255,0.6)';
    X.beginPath();
    X.arc(food.x*SZ+SZ/2-2,food.y*SZ+SZ/2-2,SZ/7,0,Math.PI*2);
    X.fill();
    
    // Snake body with enhanced visual effects
    for(let i=snake.length-1;i>=0;i--){
        let s=snake[i],t=i/Math.max(snake.length,1);
        let sz2=SZ-2-Math.min(i*.05,4);
        let ox=(SZ-sz2)/2;
        let hue=120+t*50;
        let light=55-t*20;
        
        // Snake body with cached color
        X.fillStyle=segCol(hue,light);
        
        // Add glow for head
        if(i === 0){
            glowAt(segCol(hue,60),s.x*SZ+SZ/2,s.y*SZ+SZ/2+40,sz2*.75+12);
            X.beginPath();
            X.roundRect(s.x*SZ+ox,s.y*SZ+ox+40,sz2,sz2,6);
            X.fill();
        } else {
            X.beginPath();
            X.roundRect(s.x*SZ+ox,s.y*SZ+ox+40,sz2,sz2,6);
            X.fill();
        }
        
        // Snake body pattern
        X.fillStyle='rgba(255,255,255,0.1)';
        X.beginPath();
        X.arc(s.x*SZ+SZ/2, s.y*SZ+SZ/2+40, sz2*0.3, 0, Math.PI*2);
        X.fill();
    }
    
    // Enhanced snake eyes with glow
    if(snake[0]){
        let h=snake[0];
        let ex=h.x*SZ+SZ/2+dir.x*4,ey=h.y*SZ+SZ/2+dir.y*40;
        
        // Outer eye white
        X.fillStyle='#fff';
        X.beginPath();
        X.arc(ex-3,ey-2,4,0,Math.PI*2);
        X.fill();
        
        X.beginPath();
        X.arc(ex+3,ey-2,4,0,Math.PI*2);
        X.fill();
        
        // Inner eye pupils
        X.fillStyle='#1a1a2e';
        X.beginPath();
        X.arc(ex+dir.x*1.5-3,ey-2+dir.y*1.5,2,0,Math.PI*2);
        X.fill();
        
        X.beginPath();
        X.arc(ex+dir.x*1.5+3,ey-2+dir.y*1.5,2,0,Math.PI*2);
        X.fill();
        
        // Eye shine
        X.fillStyle='#fff';
        X.beginPath();
        X.arc(ex+dir.x*1.5-3,ey-2+dir.y*1.5,1,0,Math.PI*2);
        X.fill();
        
        X.beginPath();
        X.arc(ex+dir.x*1.5+3,ey-2+dir.y*1.5,1,0,Math.PI*2);
        X.fill();
    }
    
    // Enhanced particles with gravity
    for(let p of particles){
        let pr=p.s*(p.life/50);
        X.globalAlpha=p.life/50;
        glowAt(p.col,p.x,p.y,pr+6);
        X.fillStyle=p.col;
        X.beginPath();
        X.arc(p.x,p.y,pr,0,Math.PI*2);
        X.fill();
    }
    X.globalAlpha=1;
    
    // Enhanced score popups with scaling
    for(let sp of scorePopups){
        X.globalAlpha=sp.life/40;
        X.save();
        X.translate(sp.x, sp.y);
        X.scale(sp.scale, sp.scale);
        X.fillStyle='#ffd700';
        X.font='bold 24px "Segoe UI"';
        X.textAlign='center';
        X.fillText(sp.txt,0,0);
        X.restore();
    }
    X.globalAlpha=1;
    
    // Enhanced HUD
    let hudTxt='Length: '+score+' / 30';
    X.drawImage(emojiImg(),W/2-146,12);
    X.fillStyle='#fff';
    X.font='bold 28px "Segoe UI"';
    X.textAlign='left';
    X.fillText(hudTxt,W/2-112,32);
    X.textAlign='center';
    
    // Enhanced ready state
    if(state==='ready'){
        glowAt('#ffffff',W/2,H/2-20,90);
        X.fillStyle='rgba(255,255,255,0.9)';
        X.font='bold 30px "Segoe UI"';
        X.fillText('SNAKE',W/2,H/2-20);
        
        // Pulsing instruction
        let pulse = 0.8 + Math.sin(pulseT*5)*0.2;
        X.globalAlpha=pulse;
        X.fillStyle='rgba(255,255,255,0.8)';
        X.font='bold 22px "Segoe UI"';
        X.fillText('Swipe or arrow keys',W/2,H/2+15);
        X.globalAlpha=1;
        
        X.font='16px "Segoe UI"';
        X.fillStyle='rgba(255,255,255,0.6)';
        X.fillText('Tap to start',W/2,H/2+45);
    }
    
    // Enhanced game over/win screens
    if(over||won){
        X.fillStyle='rgba(0,0,0,0.8)';
        X.fillRect(0,0,W,H);
        
        // Animated border
        X.strokeStyle=won ? 'rgba(46, 213, 115, 0.8)' : 'rgba(255, 71, 87, 0.8)';
        X.lineWidth=3;
        X.strokeRect(W/2-150, H/2-90, 300, 180);
        
        // Main message
        glowAt(won?'#2ed573':'#ff4757',W/2,H/2-20,120);
        X.fillStyle=won?'#2ed573':'#ff4757';
        X.font='bold 45px "Segoe UI"';
        X.textAlign='center';
        X.fillText(won?'\u2728 PERFECT! \u2728':'GAME OVER',W/2,H/2-20);
        
        // Score display
        X.fillStyle='#fff';
        X.font='bold 26px "Segoe UI"';
        X.fillText('Length: '+score,W/2,H/2+20);
        
        // Pulsing retry text
        let retryPulse = 0.7 + Math.sin(pulseT*5)*0.2;
        X.globalAlpha=retryPulse;
        X.font='20px "Segoe UI"';
        X.fillStyle='rgba(255,255,255,0.8)';
        X.fillText('\u25B6 Tap or Space to retry',W/2,H/2+60);
        X.globalAlpha=1;
    }
}
let pKey='';function loop(){if(document.hidden)return requestAnimationFrame(loop);let key=state+(over?'-o':'')+(won?'-w':'');if(key!==pKey){pKey=key;needDraw=true}if(state==='play'&&!over&&!won)needDraw=true;if(needDraw){needDraw=false;draw()}requestAnimationFrame(loop)}init();loop()
</script><script>
(()=>{
const GAME_ID='sky-snake',TITLE='Snake',BEST_KEY=GAME_ID+'-best',SEEN_KEY=GAME_ID+'-seen',DIFF_KEY=GAME_ID+'-difficulty',PAUSE_BUTTON='br';
const HOWTO=["Press Play to start Snake.", "Use the game controls shown below once the run begins.", "Finish the objective, then replay to beat your best result."],TIPS=["Short, controlled moves beat panic inputs.", "Read the next obstacle before you commit.", "If a run falls apart, replay quickly while the pattern is fresh."],KEYBOARD="Arrow keys or WASD steer; Space starts or restarts.",TOUCH="Swipe to steer the snake.";
const CODE_LIST=[
  {code:'PARTY',effect:'Party lights: hue-shift the whole run.'},
  {code:'CHILL',effect:'Chill mode: slow the whole run down.'},
  {code:'BOOST',effect:'Take a quick advantage for this run.'}
];
const read=(k,f)=>{try{const v=localStorage.getItem(k);return v==null?f:v;}catch(e){return f;}};
const readNum=(k,f=0)=>{const v=parseInt(read(k,''),10);return Number.isFinite(v)?v:f;};
let arcadeBest=readNum(BEST_KEY,0),difficulty=read(DIFF_KEY,'normal')||'normal',titleOpen=false,resultOpen=false,reportedOver=false,party=false,chill=false,frameAcc=0;
const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const rawSetItem=window.localStorage&&localStorage.setItem?localStorage.setItem.bind(localStorage):null;
if(rawSetItem){localStorage.setItem=function(key,val){if(String(key)===BEST_KEY&&window.ArcadeSDK&&ArcadeSDK.cheated)return;return rawSetItem(key,val);};}
if(typeof saveBest==='function'){const keepSaveBest=saveBest;saveBest=function(){if(window.ArcadeSDK&&ArcadeSDK.cheated)return;return keepSaveBest();};}
function difficultyScale(){const base=difficulty==='easy'?0.85:difficulty==='hard'?1.18:1;return chill?base*0.72:base;}
function scoreValue(){try{return Math.max(0,Math.round(score||0||0));}catch(e){return 0;}}
function persistBest(force){const score=scoreValue();if((force||score>arcadeBest)&&!(window.ArcadeSDK&&ArcadeSDK.cheated)){arcadeBest=score;try{localStorage.setItem(BEST_KEY,String(arcadeBest));}catch(e){}}return arcadeBest;}
function sceneName(){
  if(resultOpen) return 'over';
  if(titleOpen) return 'title';
  if(typeof over==='boolean'&&over) return 'over';
  if(typeof won==='boolean'&&won) return 'over';
  if(state==='play'||state==='aiming') return 'play';
  if(state==='over'||state==='win') return 'over';
  return 'title';
}
function postScene(){if(window.ArcadeSDK)ArcadeSDK.state({scene:sceneName(),score:scoreValue()});}
function applyIntervalScale(){if(typeof interval!=='undefined'&&typeof spd==='number'&&typeof update==='function'){clearInterval(interval);interval=setInterval(update,Math.max(40,Math.round(spd/difficultyScale())));}}
function setDiffButtons(){diffWrap.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===difficulty));}
function setDifficulty(next){difficulty=next;try{localStorage.setItem(DIFF_KEY,difficulty);}catch(e){}setDiffButtons();applyIntervalScale();needDraw=true;}
function hideTitle(){titleOpen=false;overlay.hidden=true;}
function hideResult(){resultOpen=false;results.hidden=true;}
function showTitle(forceTutorial){titleOpen=true;resultOpen=false;overlay.hidden=false;results.hidden=true;const first=read(SEEN_KEY,'0')!=='1';titleInfo.innerHTML='<h1>'+TITLE+'</h1><p>'+(forceTutorial||first?'Learn it in three quick steps and jump in.':'Back at the title. Pick a difficulty and play again.')+'</p><ol>'+HOWTO.map(s=>'<li>'+s+'</li>').join('')+'</ol><div class="sky-mini">💡 '+(TIPS[0]||'')+'</div>';setDiffButtons();postScene();}
function showResult(){resultOpen=true;persistBest();resultTitle.textContent=(state==='win'||(typeof won==='boolean'&&won))?'Run complete!':'Run over';resultScore.textContent='Score: '+scoreValue();resultBest.textContent='Best: '+arcadeBest;results.hidden=false;codesBadge.hidden=!(window.ArcadeSDK&&ArcadeSDK.cheated);postScene();}
function startRun(){reportedOver=false;hideResult();hideTitle();try{localStorage.setItem(SEEN_KEY,'1');}catch(e){}state="play";applyIntervalScale();postScene();needDraw=true;}
function restartRun(){if(typeof init==='function')init();startRun();}
function exitToTitle(){if(typeof init==='function')init();hideResult();showTitle(false);applyIntervalScale();needDraw=true;}
function genericBoost(){let changed=false;if(typeof lives==='number'){lives=Math.min(lives+1,9);changed=true;}if(typeof timeLeft==='number'){timeLeft+=10;changed=true;}if(typeof timer==='number'){timer+=8;changed=true;}if(typeof score==='number'){score+=25;changed=true;}if(typeof targetScore==='number'){targetScore=Math.max(20,targetScore-20);changed=true;}if(typeof targetKills==='number'){targetKills=Math.max(1,targetKills-2);changed=true;}return changed;}
function applyBoost(){let changed=genericBoost();if(!changed&&typeof score==='number')score+=10;needDraw=true;return {ok:true,message:CODE_LIST[2].effect};}
function onHint(){return state!=="play"?"Press Play, then use the quick tutorial steps on the title card.":(TIPS[1]||TIPS[0]||"Stay calm and make the next clean move.");}
const shell=document.createElement('div');
shell.innerHTML=`<style>#sky-codes-on{position:fixed;top:12px;left:12px;z-index:9998;background:#ffd257;color:#111;padding:6px 12px;border-radius:999px;font:900 12px/1 'Segoe UI',system-ui,sans-serif;letter-spacing:.12em}#sky-codes-on[hidden]{display:none}#sky-arcade-ui,#sky-arcade-results{position:fixed;inset:0;display:grid;place-items:center;padding:18px;z-index:9997}#sky-arcade-ui{background:rgba(4,8,18,.62);backdrop-filter:blur(6px)}#sky-arcade-results{background:rgba(4,8,18,.48)}#sky-arcade-ui[hidden],#sky-arcade-results[hidden]{display:none}#sky-arcade-ui .card,#sky-arcade-results .card{width:min(100%,420px);border-radius:22px;padding:22px 20px 18px;background:linear-gradient(180deg,rgba(12,18,42,.96),rgba(7,10,26,.96));border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 55px rgba(0,0,0,.35);font-family:'Segoe UI',system-ui,sans-serif;color:#fff}#sky-arcade-ui h1,#sky-arcade-results h2{margin:0 0 8px;font-size:clamp(28px,8vw,38px);line-height:.95}#sky-arcade-ui p,#sky-arcade-results p,#sky-arcade-ui li{font-size:14px;line-height:1.45;color:rgba(255,255,255,.82)}#sky-arcade-ui ol{padding-left:20px;margin:12px 0}#sky-arcade-ui button,#sky-arcade-results button{appearance:none;border:0;border-radius:16px;min-height:44px;padding:12px 16px;font:800 16px 'Segoe UI',system-ui,sans-serif;cursor:pointer}#sky-arcade-play,#sky-arcade-replay{width:100%;background:linear-gradient(135deg,#43ddff,#1c9ee8);color:#04122b;box-shadow:0 10px 22px rgba(0,180,255,.28)}#sky-arcade-ui .sky-mini,#sky-arcade-results .sky-mini{font-size:13px;color:rgba(255,255,255,.68)}#sky-arcade-ui .diff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}#sky-arcade-ui .diff button{background:rgba(255,255,255,.08);color:#dfe7ff;border:1px solid rgba(255,255,255,.12)}#sky-arcade-ui .diff button.active{background:#ffd257;color:#16171d}@media (prefers-reduced-motion:reduce){#sky-arcade-ui{backdrop-filter:none}}</style><div id="sky-codes-on" hidden>CODES ON</div><div id="sky-arcade-ui"><div class="card"><div id="sky-arcade-info"></div><div class="diff"><button type="button" data-mode="easy">Easy</button><button type="button" data-mode="normal">Normal</button><button type="button" data-mode="hard">Hard</button></div><button id="sky-arcade-play" type="button">Play</button><p class="sky-mini">Keyboard: ${KEYBOARD}</p><p class="sky-mini">Touch: ${TOUCH}</p></div></div><div id="sky-arcade-results" hidden><div class="card"><h2 id="sky-arcade-result-title"></h2><p id="sky-arcade-result-score"></p><p id="sky-arcade-result-best"></p><button id="sky-arcade-replay" type="button">Play again</button><p class="sky-mini">Tip: ${TIPS[1]||TIPS[0]||''}</p></div></div>`;
document.body.appendChild(shell);
const overlay=shell.querySelector('#sky-arcade-ui'),results=shell.querySelector('#sky-arcade-results'),titleInfo=shell.querySelector('#sky-arcade-info'),resultTitle=shell.querySelector('#sky-arcade-result-title'),resultScore=shell.querySelector('#sky-arcade-result-score'),resultBest=shell.querySelector('#sky-arcade-result-best'),codesBadge=shell.querySelector('#sky-codes-on'),diffWrap=overlay.querySelector('.diff');
diffWrap.querySelectorAll('button').forEach(btn=>btn.onclick=()=>setDifficulty(btn.dataset.mode));
overlay.querySelector('#sky-arcade-play').onclick=startRun;results.querySelector('#sky-arcade-replay').onclick=restartRun;
window.addEventListener('keydown',e=>{if(!(titleOpen||resultOpen))return;if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopImmediatePropagation();resultOpen?restartRun():startRun();}},true);
if(typeof update==='function'){
  const coreUpdate=update;
  update=function(...args){
    const scale=difficultyScale();
    if(args.length===0){
      if(typeof dtK==='number'){
        const keep=dtK;dtK*=scale;coreUpdate();dtK=keep;
      }else{
        frameAcc+=scale;
        let guard=0;
        while(frameAcc>=1&&guard<3){coreUpdate();frameAcc-=1;guard++;}
      }
    }else if(args.length===1){
      coreUpdate(args[0]*scale);
    }else if(args.length===2){
      coreUpdate(args[0]*scale,args[1]*scale);
    }else{
      coreUpdate(...args);
    }
    if(reduced){if(typeof shakeTime==='number')shakeTime=0;if(typeof camShake==='number')camShake=0;if(typeof muzzleFlash==='number')muzzleFlash=0;}
    C.style.filter=party?'hue-rotate('+((Date.now()/18)%360)+'deg) saturate(1.25)':'';
  };
}
const monitor=()=>{const scene=sceneName();if(scene==='over'&&!reportedOver){reportedOver=true;showResult();}if(scene==='play')reportedOver=false;requestAnimationFrame(monitor);};requestAnimationFrame(monitor);
if(window.ArcadeSDK) ArcadeSDK.init({onRestart:restartRun,onExit:exitToTitle,onTutorial:()=>showTitle(true),onHint:onHint,cheats:CODE_LIST,onCheat:(code)=>{if(code==='PARTY'){party=true;codesBadge.hidden=false;needDraw=true;return {ok:true,message:CODE_LIST[0].effect};}if(code==='CHILL'){chill=true;codesBadge.hidden=false;applyIntervalScale();needDraw=true;return {ok:true,message:CODE_LIST[1].effect};}if(code==='BOOST'){codesBadge.hidden=false;return applyBoost();}},pauseButton:PAUSE_BUTTON});
showTitle(false);
})();
</script>
</body></html>
