<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Flap &amp; Fly</title><script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script><script src="sky-arcade.js"></script><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 80px rgba(0,200,255,.6);transition:box-shadow 0.3s ease;}.c:focus{outline:none;box-shadow:0 0 80px rgba(0,255,255,.8);}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,needDraw=true;function resize(){W=Math.min(window.innerWidth-20,420);H=Math.min(window.innerHeight-20,720);SKY.fit(C,X,W,H);bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#080a2a');bgGrad.addColorStop(0.3,'#0c103a');bgGrad.addColorStop(0.6,'#100a3a');bgGrad.addColorStop(1,'#120a30');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}function pPipe(p){return p.x>-PW}function pTr(t){return t.life>0}
const PGC=[],STC=[],TRC=[],WCC=[];
function pipeGrad(k){let g=PGC[k];if(!g){let h=k*15;g=X.createLinearGradient(0,0,PW,0);g.addColorStop(0,'hsl('+h+', 80%, 40%)');g.addColorStop(0.3,'hsl('+((h+30)%360)+', 90%, 50%)');g.addColorStop(0.7,'hsl('+((h+60)%360)+', 80%, 45%)');g.addColorStop(1,'hsl('+((h+90)%360)+', 70%, 40%)');PGC[k]=g}return g}
function stripeCol(k){let s=STC[k];if(!s){s='hsla('+((k*15+180)%360)+', 50%, 30%, 0.3)';STC[k]=s}return s}
function trailCol(k){let s=TRC[k];if(!s){s='hsl('+(k*15)+', 80%, 50%)';TRC[k]=s}return s}
const G=.48,J=-8,PW=64,BR=18;let GAP=150,PIPE_SPD=3,GOAL=10,best=0,cheat={ghost:false,wide:false,feather:false};
let bird,pipes,frame,score,state,over,won,stars=[],clouds=[],particles=[],scorePopups=[],shakeX=0,shakeY=0,shakeTime=0,glowOffset=0,effectsEnabled=true,birdRad=null,birdBeak=null,pipeTimer=0;

// Initialize stars with colors
for(let i=0;i<120;i++){
    let layer = Math.floor(Math.random()*4);
    stars.push({
        x:Math.random()*W,
        y:Math.random()*H*.7,
        s:Math.random()*1.5+0.5,
        t:Math.random()*Math.PI*2,
        layer:layer,
        color:layer === 0 ? '#ffffff' : layer === 1 ? '#aaccff' : layer === 2 ? '#88ddff' : '#aaffcc',
        twinkleSpeed:0.01+Math.random()*0.02
    });
    let sc=stars[i].color;stars[i].rgb='rgb('+parseInt(sc.slice(1,3),16)+','+parseInt(sc.slice(3,5),16)+','+parseInt(sc.slice(5,7),16)+')';
}

// Initialize clouds with better properties
for(let i=0;i<8;i++){
    let sizeFactor = 0.8+Math.random()*0.7;
    clouds.push({
        x:Math.random()*W*1.5-W*0.3,
        y:H*.2+Math.random()*H*.3,
        w:(60+Math.random()*80)*sizeFactor,
        h:(20+Math.random()*15)*sizeFactor,
        s:.1+Math.random()*.4,
        opacity:0.03+Math.random()*0.03,
        detail:Math.random()>0.5
    });
}

function init(){
    bird={
        x:W*.28,
        y:H*.42,
        v:0,
        rot:0,
        wingT:0,
        trail:[],
        glowPhase:0
    };
    pipes=[];
    frame=0;
    pipeTimer=0;
    score=0;
    over=false;
    won=false;
    state='ready';
    GAP=SKY.pick(185,155,135)+(cheat.wide?60:0);PIPE_SPD=SKY.pick(2.6,3,3.5);GOAL=SKY.pick(5,10,15);best=SKY.best();
    particles=[];
    scorePopups=[];
    shakeTime=0;
    addPipe();
}

function addPipe(){
    let minY=120,maxY=H-GAP-120;
    let topH=Math.random()*(maxY-minY)+minY;
    pipes.push({
        x:W,
        topH,
        passed:false,
        trail:[],
        glowPhase:Math.random()*Math.PI*2
    });
}

function flap(){
    if(state==='ready'){
        state='play';
        bird.v=J;
        spawnFlapParticles();SKY.sfx('whoosh',{volume:.4});
    }else if(state==='play'){
        bird.v=J;
        spawnFlapParticles();SKY.sfx('whoosh',{volume:.4});
    }else if(over||won){
        init();
        state='play';
        bird.v=J;
    }
}

document.addEventListener('pointerdown',e=>{if(e.target&&e.target.closest&&e.target.closest('button,#arcade-sdk'))return;flap()});
document.addEventListener('keydown',e=>{
    if(e.code==='Space'||e.code==='ArrowUp'){
        e.preventDefault();
        flap();
    }
});

// Enhanced flap particles with better physics
function spawnFlapParticles(){
    if(particles.length>220)return;
    for(let i=0;i<8;i++){
        let angle = Math.PI + (Math.random()-0.5)*0.5; // Behind the bird
        let speed = 1+Math.random()*2;
        particles.push({
            x:bird.x-12,
            y:bird.y,
            vx:Math.cos(angle)*speed + (Math.random()-0.5),
            vy:Math.sin(angle)*speed + (Math.random()-0.5),
            life:20+Math.random()*15,
            s:Math.random()*3+1,
            col:`hsla(${45+Math.random()*20}, 100%, 70%, ${0.8+Math.random()*0.2})`,
            gravity:0.05
        });
    }
}

// Enhanced score particles with better spread
function spawnScoreParticle(x,y){
    if(particles.length>220)return;
    for(let i=0;i<12;i++){
        let a=Math.PI*2/12*i;
        let speed = 2+Math.random()*2;
        particles.push({
            x,y,
            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,
            life:25+Math.random()*10,
            s:Math.random()*3+1,
            col:`hsl(${45+Math.random()*15}, 100%, 65%)`,
            gravity:0.02
        });
    }
    scorePopups.push({
        x,y:y-20,
        text:'+1',
        life:40,
        vy:-1.2,
        scale:1
    });
}

// Enhanced death particles with better visual impact
function spawnDeathParticles(){
    if(particles.length>220)return;
    for(let i=0;i<40;i++){
        let a=Math.random()*Math.PI*2;
        let speed = 2+Math.random()*4;
        particles.push({
            x:bird.x,
            y:bird.y,
            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,
            life:30+Math.random()*20,
            s:Math.random()*4+2,
            col:['#ffd700','#ff4757','#ff8c00','#ffaa00','#ff6600'][Math.floor(Math.random()*5)],
            gravity:0.08
        });
    }
    shakeTime=SKY.shake(25);
    // Create explosion effect
    for(let i=0;i<30;i++){
        setTimeout(()=>{
            if(particles.length>260)return;
            let a=Math.random()*Math.PI*2;
            let speed = 1+Math.random()*3;
            particles.push({
                x:bird.x,
                y:bird.y,
                vx:Math.cos(a)*speed,
                vy:Math.sin(a)*speed,
                life:20+Math.random()*15,
                s:Math.random()*3+1,
                col:['#ffd700','#ff4757','#ff8c00'][Math.floor(Math.random()*3)],
                gravity:0.05
            });
        }, i*30);
    }
}

function update(){
    if(state==='over'||state==='win'){
        frame++;
        if(shakeTime>0){shakeX=(Math.random()-.5)*shakeTime*.8;shakeY=(Math.random()-.5)*shakeTime*.8;shakeTime--}else{shakeX=0;shakeY=0}
        for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.life--}
        prune(particles,pLife);
        for(let sp of scorePopups){sp.y+=sp.vy;sp.life--}
        prune(scorePopups,pLife);
        return;
    }
    if(state!=='play')return;
    frame++;
    glowOffset += 0.05;

    bird.v+=G*(cheat.feather?.6:1)*dtK;
    bird.y+=bird.v*dtK;
    bird.rot=Math.max(-.4,Math.min(bird.v*.1,.9));
    bird.wingT+=.5; // Faster wing movement
    
    // Add bird trail
    if(frame % 5 === 0 && state === 'play'){
        if(bird.trail.length<30)bird.trail.push({x:bird.x-8, y:bird.y, life:10});
    }
    for(let t of bird.trail)t.life--;
    prune(bird.trail,pTr);

    if(shakeTime>0){
        shakeX=(Math.random()-.5)*shakeTime*.8;
        shakeY=(Math.random()-.5)*shakeTime*.8;
        shakeTime--;
    }else{
        shakeX=0;
        shakeY=0;
    }

    pipeTimer+=dtK;if(pipeTimer>=90){pipeTimer-=90;addPipe();}

    for(let p of pipes){
        p.x-=PIPE_SPD*dtK;

        // Add pipe glow effect
        p.glowPhase += 0.05;
        
        // Add pipe trail
        if(frame % 8 === 0){
            if(p.trail.length<20)p.trail.push({x:p.x+PW/2, y:p.topH+GAP/2, life:15});
        }
        for(let t of p.trail)t.life--;
        prune(p.trail,pTr);
        
        if(!p.passed&&p.x+PW<bird.x){
            p.passed=true;
            score++;
            spawnScoreParticle(p.x+PW/2,bird.y);SKY.sfx('coin',{volume:.6});
        }
        
        let bx=bird.x-BR+4,by=bird.y-BR+4,bw=BR*2-8,bh=BR*2-8;
        if(!cheat.ghost&&bx<p.x+PW&&bx+bw>p.x&&by<p.topH)return die();
        if(!cheat.ghost&&bx<p.x+PW&&bx+bw>p.x&&by+bh>p.topH+GAP)return die();
    }
    
    prune(pipes,pPipe);
    
    if(bird.y>H-BR-5||bird.y<-BR)die();
    
    // Update particles with gravity
    for(let p of particles){
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=p.gravity;
        p.life--;
    }
    prune(particles,pLife);
    
    // Update score popups
    for(let sp of scorePopups){
        sp.y+=sp.vy;
        sp.life--;
        sp.scale = 1.2 - (40-sp.life)/40 * 0.2; // Scale down as life decreases
    }
    prune(scorePopups,pLife);
    
    // Update clouds
    for(let c of clouds){
        c.x-=c.s;
        if(c.x+c.w<0)c.x=W+50;
    }
    
    if(score>=GOAL){
        won=true;
        state='win';
        spawnDeathParticles();SKY.sfx('win');if(SKY.saveBest(score))best=score;
    }
}

function die(){
    if(over)return;
    spawnDeathParticles();
    over=true;
    state='over';
    shakeTime=SKY.shake(25);SKY.sfx('lose');if(SKY.saveBest(score))best=score;
}

function draw(){
    X.save();
    X.translate(shakeX,shakeY);
    
    X.clearRect(-15,-15,W+30,H+30);
    
    // Enhanced background gradient with animated glow
    X.fillStyle=bgGrad;
    X.fillRect(0,0,W,H);
    
    // Draw animated stars with twinkling effect
    for(let s of stars){
        let alpha = (0.3 + Math.sin(frame*0.05+s.t)*0.2) * (s.layer === 0 ? 1 : 0.7);
        X.globalAlpha=alpha;
        X.fillStyle=s.rgb;
        X.beginPath();
        X.arc(s.x,s.y,s.s,0,Math.PI*2);
        X.fill();
    }
    X.globalAlpha=1;
    
    // Draw clouds with better depth and detail
    for(let c of clouds){
        X.globalAlpha=c.opacity;
        X.fillStyle='rgba(255,255,255,0.08)';
        X.beginPath();
        X.ellipse(c.x+c.w*0.3,c.y,c.w*0.3,c.h*0.7,0,0,Math.PI*2);
        X.fill();
        X.ellipse(c.x+c.w*0.7,c.y,c.w*0.4,c.h*0.6,0,0,Math.PI*2);
        X.fill();
        X.ellipse(c.x+c.w*0.5,c.y-c.h*0.3,c.w*0.35,c.h*0.5,0,0,Math.PI*2);
        X.fill();
        
        // Add cloud details
        if(c.detail){
            X.fillStyle='rgba(255,255,255,0.05)';
            X.beginPath();
            X.ellipse(c.x+c.w*0.45,c.y+c.h*0.2, c.w*0.15, c.h*0.2, 0, 0, Math.PI*2);
            X.fill();
        }
        X.globalAlpha=1;
    }
    
    // Enhanced pipes with animated glow and details
    for(let p of pipes){
        // Calculate dynamic pipe colors
        let hue = (frame*0.5 + p.glowPhase*30) % 360;
        let k = Math.floor(hue/15)%24;
        X.save();
        X.translate(p.x,0);
        X.fillStyle=pipeGrad(k);
        
        // Draw top pipe
        X.fillRect(0,0,PW,p.topH);
        // Pipe cap
        X.fillRect(-8,p.topH-25,PW+16,25);
        
        // Draw bottom pipe
        X.fillRect(0,p.topH+GAP,PW,H-p.topH-GAP);
        // Pipe cap
        X.fillRect(-8,p.topH+GAP,PW+16,25);
        
        // Add pipe highlights
        X.fillStyle='rgba(255,255,255,0.15)';
        X.fillRect(4,0,6,p.topH-20);
        X.fillRect(4,p.topH+GAP+20,6,H);
        
        // Add pipe texture stripes
        X.fillStyle=stripeCol(k);
        for(let i=0; i<p.topH/40; i++){
            X.fillRect(10, i*40+10, PW-20, 8);
        }
        for(let i=0; i<(H-p.topH-GAP)/40; i++){
            X.fillRect(10, p.topH+GAP+i*40+10, PW-20, 8);
        }
        
        // Draw pipe trail
        for(let t of p.trail){
            X.globalAlpha=t.life/15*0.3;
            X.fillStyle=trailCol(k);
            let size = 3 + Math.sin(frame*0.1 + t.x*0.01)*1.5;
            X.beginPath();
            X.arc(t.x-p.x,t.y,size,0,Math.PI*2);
            X.fill();
        }
        X.globalAlpha=1;
        X.restore();
    }
    
    // Draw bird trail
    for(let t of bird.trail){
        let alpha = t.life/10 * 0.4;
        X.globalAlpha=alpha;
        X.fillStyle='rgba(255,215,0,0.3)';
        X.beginPath();
        X.arc(t.x, t.y, BR*0.4, 0, Math.PI*2);
        X.fill();
    }
    X.globalAlpha=1;
    
    // Enhanced Bird with animated glow and details
    X.save();
    X.translate(bird.x,bird.y);
    X.rotate(bird.rot);
    
    // Animated wing with better physics
    let wingY=Math.sin(bird.wingT)*8;
    let wk=Math.round(40+Math.sin(frame*0.2)*10);let wingColor=WCC[wk];if(!wingColor){if(WCC.length>12)WCC.length=0;wingColor='hsl('+wk+', 90%, 50%)';WCC[wk]=wingColor}
    X.fillStyle=wingColor;
    X.beginPath();
    X.moveTo(-8,2);
    X.quadraticCurveTo(-18,wingY-5,-14,wingY+8);
    X.quadraticCurveTo(-8,6,-8,2);
    X.fill();
    
    // Enhanced body glow with pulsing effect
    let bodyGlow = 20 + Math.sin(frame*0.2)*5;
    glowAt(PK.color(),0,0,BR+bodyGlow);
    X.fillStyle=PK.color();
    X.beginPath();
    X.arc(0,0,BR,0,Math.PI*2);
    X.fill();
    
    // Enhanced body gradient overlay
    if(!birdRad){birdRad=X.createRadialGradient(-3,-3,2,0,0,BR);
    birdRad.addColorStop(0,'rgba(255,255,200,0.8)');
    birdRad.addColorStop(0.5,'rgba(255,220,50,0.6)');
    birdRad.addColorStop(1,'rgba(255,180,0,0)')}
    X.fillStyle=birdRad;
    X.beginPath();
    X.arc(0,0,BR,0,Math.PI*2);
    X.fill();
    
    // Enhanced bird pattern
    X.fillStyle='rgba(255,100,0,0.3)';
    X.beginPath();
    X.arc(-5,-3,6,0,Math.PI*2);
    X.fill();
    
    // Beak with gradient
    if(!birdBeak){birdBeak=X.createLinearGradient(BR-2,-3,BR+12,0);
    birdBeak.addColorStop(0,'#ff6348');
    birdBeak.addColorStop(1,'#ff8c69')}
    X.fillStyle=birdBeak;
    X.beginPath();
    X.moveTo(BR-2,-3);
    X.lineTo(BR+12,0);
    X.lineTo(BR-2,3);
    X.closePath();
    X.fill();
    
    // Enhanced eye with reflection
    X.fillStyle='#fff';
    X.beginPath();
    X.arc(4,-5,7,0,Math.PI*2);
    X.fill();
    
    // Pupil with depth
    X.fillStyle='#1a1a2e';
    X.beginPath();
    X.arc(6,-5,3.5,0,Math.PI*2);
    X.fill();
    
    // Enhanced eye shine
    X.fillStyle='#fff';
    X.beginPath();
    X.arc(7.5,-6.5,2,0,Math.PI*2);
    X.fill();
    
    // Additional eye highlight
    X.fillStyle='rgba(255,255,255,0.6)';
    X.beginPath();
    X.arc(5,-4,1.2,0,Math.PI*2);
    X.fill();
    
    X.restore();
    
    // Enhanced particles with gravity and fading
    for(let p of particles){
        let pr=p.s*(p.life/40);
        X.globalAlpha=p.life/40;
        glowAt(p.col,p.x,p.y,pr+6);
        X.fillStyle=p.col;
        X.beginPath();
        X.arc(p.x,p.y,pr,0,Math.PI*2);
        X.fill();
    }
    X.globalAlpha=1;
    
    // Enhanced score popups with scaling
    for(let sp of scorePopups){
        X.globalAlpha=sp.life/40;
        X.save();
        X.translate(sp.x, sp.y);
        X.scale(sp.scale, sp.scale);
        X.fillStyle='#ffd700';
        X.font='bold 28px "Segoe UI"';
        X.textAlign='center';
        X.fillText(sp.text,0,0);
        X.restore();
    }
    X.globalAlpha=1;
    
    // Enhanced score display with glow
    X.fillStyle='#fff';
    X.font='bold 54px "Segoe UI"';
    X.textAlign='center';
    X.fillText(score,W/2,60);
    X.font='bold 14px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('GOAL '+GOAL+'  \u00B7  BEST '+best,W/2,84);
    
    // Enhanced ready state with glowing text
    if(state==='ready'&&SKY.tut)SKY.drawTut(X,W,H,{title:'FLAP & FLY',color:'#00c8ff',gesture:'tap',steps:['Each tap (or Space / Up) flaps the bird upward. Gravity pulls it down between taps.','Fly through the gap in each pipe pair.','Touching a pipe, the floor or the top ends the run. Pass '+GOAL+' pipes to win.']});
    else if(state==='ready'){
        glowAt('#ffffff',W/2,H*.35,110);
        X.fillStyle='rgba(255,255,255,0.95)';
        X.font='bold 32px "Segoe UI"';
        X.fillText('FLAP & FLY',W/2,H*.35);
        
        // Pulse effect for call to action
        let pulse = 0.8 + Math.sin(frame*0.1)*0.2;
        X.globalAlpha=pulse;
        X.fillStyle='rgba(255,255,255,0.8)';
        X.font='bold 24px "Segoe UI"';
        X.fillText('TAP TO FLY',W/2,H*.45);
        X.globalAlpha=1;
        
        X.font='18px "Segoe UI"';
        X.fillStyle='rgba(255,255,255,0.5)';
        X.fillText('Dodge the pipes!',W/2,H*.52);
    }
    
    // Enhanced game over/win screens
    if(over||won){
        // Semi-transparent overlay
        X.fillStyle='rgba(0,0,0,0.75)';
        X.fillRect(0,0,W,H);
        
        // Animated border for game over screen
        X.strokeStyle=won ? 'rgba(85, 239, 196, 0.8)' : 'rgba(255, 71, 87, 0.8)';
        X.lineWidth=3;
        X.strokeRect(20, H*.25, W-40, H*.35);
        
        // Main message with glow
        glowAt(won?'#55efc4':'#ff4757',W/2,H*.38,130);
        X.fillStyle=won?'#55efc4':'#ff4757';
        X.font='bold 46px "Segoe UI"';
        X.textAlign='center';
        X.fillText(won?'\u2728 YOU WIN! \u2728':'GAME OVER',W/2,H*.38);
        
        // Score display
        X.fillStyle='#fff';
        X.font='bold 32px "Segoe UI"';
        X.fillText(score+' / '+GOAL,W/2,H*.50);
        X.font='bold 18px "Segoe UI"';X.fillStyle='rgba(255,255,255,.75)';X.fillText('Best: '+best,W/2,H*.545);
        
        // Retry instruction with pulse
        let retryPulse = 0.7 + Math.sin(frame*0.15)*0.2;
        X.globalAlpha=retryPulse;
        X.font='20px "Segoe UI"';
        X.fillStyle='rgba(255,255,255,0.7)';
        X.fillText('\u25B6 TAP TO RETRY',W/2,H*.60);PK.drawTip(X,W,H*.665);
        X.globalAlpha=1;
    }
    
    X.restore();
}

let pState='';
let lastT=0,dtK=1;
function loop(now){
    if(document.hidden){lastT=0;return requestAnimationFrame(loop);}
    const dt=lastT?Math.min((now-lastT)/1000,.05):1/60;lastT=now;
    dtK=dt*60;
    update();
    if(state!==pState){pState=state;needDraw=true}
    if(state==='play'||state==='ready'||particles.length>0||shakeTime>0||scorePopups.length>0)needDraw=true;SKY.tick(state,score);
    if(needDraw){needDraw=false;draw()}
    requestAnimationFrame(loop);
}
SKY.setup({id:'flappy-bird',color:'#00c8ff',pauseButton:'tl',
onRestart(){init();state='play';bird.v=J},onExit(){init()},onDiff(){init()},
onHint(){if(state!=='play')return 'Tap once to take off, then tap in a steady rhythm.';let p=pipes.find(q=>q.x+PW>bird.x-BR);if(!p)return 'Keep a steady height near the middle.';
let mid=p.topH+GAP/2,d=Math.round(bird.y-mid);return Math.abs(d)<25?'You are level with the next gap: tap just often enough to hold this height.':d>0?'The next gap is '+d+' px above you: tap a little faster.':'The next gap is '+(-d)+' px below you: let the bird fall before you tap.'},
cheats:{GHOSTBIRD:['Fly straight through pipes',()=>{cheat.ghost=true}],WIDEGAP:['Pipe gaps are 60 px taller',()=>{cheat.wide=true;GAP+=60;pipes.forEach(p=>p.topH-=30)}],FEATHER:['Gravity drops by 40%: the bird floats',()=>{cheat.feather=true}]}});
const PKC={key:'sky-PK-flappy-bird',color:'#00c8ff',unit:' pipes',goals:[4,6,9],lower:false,mile:[3,6,10],shopTop:false,tips:['Tap in a steady rhythm: little taps keep the bird level.','Aim for the middle of each gap, not the edges.','Start flapping before the first pipe arrives to pick your height.']};
/* ---- arcade progression kit: player level + XP, coins, stars, a date-seeded daily
   challenge, small achievements and buyable skins (one localStorage blob per game) ---- */
const PK=(function(cfg){
const day=()=>new Date().toISOString().slice(0,10);
const SKINS=[['Classic',0],['Sunset',12],['Mint',25],['Galaxy',45]],SKINCOL=['#ffd700','#ff7f50','#2ed573','#a55eea'];
const DEF={best:0,coins:0,xp:0,stars:0,plays:0,wins:0,skins:['Classic'],skin:'Classic',ach:[],daily:'',dailyOK:false,cur:0};
let S=Object.assign({},DEF),hud,tCard,tShop,tst,tstT=0,lastScore=null,lastScene='',lastSave=0,everOver=false,retryB=null;
function seed(s){let h=9;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),387420489)>>>0;return h}
function goal(){return cfg.goals[seed(day())%cfg.goals.length]}
function lvl(){return Math.max(1,Math.floor(Math.sqrt(S.xp/12))+1)}
function load(){try{const v=JSON.parse(localStorage.getItem(cfg.key));if(v&&typeof v==='object')Object.assign(S,v)}catch(e){}
if(S.daily!==day()){S.daily=day();S.dailyOK=false}if(!S.skins.length)S.skins=['Classic']}
function save(){try{localStorage.setItem(cfg.key,JSON.stringify(S))}catch(e){}}
function color(){let i=-1;for(let k=0;k<SKINS.length;k++)if(SKINS[k][0]===S.skin)i=k;return i>=0?SKINCOL[i]:cfg.color}
function tip(){return cfg.tips[S.plays%cfg.tips.length]}
function toast(m){if(!tst){tst=document.createElement('div');tst.id='pkToast';tst.style.cssText='position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:9;background:rgba(10,10,46,.92);border:2px solid '+cfg.color+';color:#fff;font:700 14px "Segoe UI",sans-serif;padding:10px 18px;border-radius:22px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap';document.body.appendChild(tst)}
tst.textContent=m;tst.style.opacity='1';clearTimeout(tstT);tstT=setTimeout(()=>{tst.style.opacity='0'},2600)}
function checkAch(){const list=[];for(let i=0;i<cfg.mile.length;i++)list.push(['m'+i,i,4+i*4,'']);
list.push(['first',-1,4,'First run played'],['rich',-1,6,'Banked 40 coins'],['vet',-1,10,'Reached player level 3']);
for(const it of list){if(S.ach.indexOf(it[0])>=0)continue;let ok=false,label=it[3];
if(it[1]>=0){const m=cfg.mile[it[1]];ok=cfg.lower?(S.best>0&&S.best<=m):S.best>=m;label='Milestone: '+m+cfg.unit+' in one run'}
else if(it[0]==='first')ok=S.plays>=1;else if(it[0]==='rich')ok=S.coins>=40;else ok=lvl()>=3;
if(ok){S.ach.push(it[0]);S.coins+=it[2];S.stars++;toast('\uD83C\uDFC5 '+label+' \u00B7 +'+it[2]+' coins \u00B7 +1 star');SKY.sfx('unlock',{volume:.5})}}}
function awardRun(score,won){if(SKY.cheated){save();return}S.plays++;if(won)S.wins++;
if(!cfg.lower){if(score>S.best)S.best=score}else if(score>0&&(S.best===0||score<S.best))S.best=score;
checkAch();const g=goal();
if(!S.dailyOK&&(cfg.lower?(won&&score>0&&score<=g):score>=g)){S.dailyOK=true;S.coins+=10;S.stars++;toast('\u2600 Daily challenge done! +10 coins \u00B7 +1 star');SKY.sfx('win',{volume:.45})}
const pts=cfg.lower?3:Math.max(1,Math.round(score)),old=lvl();S.xp+=pts+(won?15:0);S.coins+=Math.max(1,Math.round(pts/2))+(won?8:0);
if(lvl()>old){const n=lvl()-old;S.coins+=5*n;toast('\u2B06 Player level '+lvl()+'! +'+(5*n)+' coins');SKY.sfx('levelup',{volume:.5})}
checkAch();save();repaint()}
function el(id,css){const d=document.createElement('div');d.id=id;d.style.cssText=css;document.body.appendChild(d);return d}
function place(){const c=document.querySelector('canvas');if(!c)return;const r=c.getBoundingClientRect();
if(tCard)tCard.style.top=(r.top+6)+'px';if(tShop)tShop.style.top=(cfg.shopTop?r.top+58:r.bottom-124)+'px'}
function buildUI(){hud=el('pkHud','position:fixed;left:10px;bottom:10px;z-index:4;pointer-events:none;font:700 12px "Segoe UI",sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.55;text-align:left;white-space:nowrap');
tCard=el('pkTitle','position:fixed;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;font:700 13px "Segoe UI",sans-serif;color:#fff;background:rgba(8,8,30,.75);border:1px solid '+cfg.color+';border-radius:16px;padding:5px 14px;text-align:center;white-space:nowrap;line-height:1.5');
tShop=el('pkShop','position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px');
SKINS.forEach(s=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',s[0]+' skin');
b.style.cssText='min-width:86px;min-height:40px;border-radius:20px;border:2px solid rgba(255,255,255,.3);background:rgba(10,10,46,.85);color:#fff;font:600 13px "Segoe UI",sans-serif;cursor:pointer;padding:0 10px';
b.addEventListener('pointerdown',e=>e.stopPropagation());
b.addEventListener('click',e=>{e.stopPropagation();
if(S.skins.indexOf(s[0])>=0){S.skin=s[0];SKY.sfx('tap')}
else if(S.coins>=s[1]){S.coins-=s[1];S.skins.push(s[0]);S.skin=s[0];SKY.sfx('unlock',{volume:.5});toast('\u2728 Skin unlocked: '+s[0])}
else{SKY.sfx('error',{volume:.35});toast('Need '+(s[1]-S.coins)+' more coins for '+s[0])}
save();repaint();b.blur()});tShop.appendChild(b)});
window.addEventListener('resize',place);place()}
function repaint(){const l=lvl(),a=12*(l-1)*(l-1),b=12*l*l,f=Math.max(1,Math.min(5,Math.round(5*Math.min(1,(S.xp-a)/Math.max(1,b-a))))),g=goal();
if(hud)hud.innerHTML='LVL '+l+' '+'\u2588'.repeat(f)+'\u2591'.repeat(5-f)+' \u00B7 coins '+S.coins+' \u00B7 \u2605 '+S.stars+' stars<br>Daily: '+(S.dailyOK?'done today \u2713':'reach '+g+cfg.unit+' \u00B7 +10 coins');
if(tCard)tCard.innerHTML='Best '+S.best+cfg.unit+' \u00B7 LVL '+l+' \u00B7 \u2605 '+S.stars+' \u00B7 coins '+S.coins+'<br>'+(S.dailyOK?'Daily challenge \u2713 done today':'\u2600 Daily: reach '+g+cfg.unit+' \u2192 +10 coins');
if(tShop)for(let i=0;i<tShop.children.length;i++){const bd=tShop.children[i],s=SKINS[i],own=S.skins.indexOf(s[0])>=0;
bd.textContent=own?(S.skin===s[0]?s[0]+' \u2713':s[0]):s[0]+' \u00B7 '+s[1]+' coins';
bd.style.opacity=own||S.coins>=s[1]?'1':'.55';bd.style.borderColor=S.skin===s[0]?cfg.color:'rgba(255,255,255,.3)'}}
function drawTip(X,w,y){X.save();X.globalAlpha=.85;X.fillStyle='#fff';X.font='13px "Segoe UI",sans-serif';X.textAlign='center';X.fillText('Tip: '+tip(),w/2,y);X.restore()}
const tick0=SKY.tick;
SKY.tick=function(state,score){tick0(state,score);
const sc=state==='ready'?'title':(state==='over'||state==='win'||state==='done'?'over':'play');
if(sc!==lastScene){if(lastScene==='play'&&sc==='over'){awardRun(score||0,state==='win'||state==='done');everOver=true;}lastScene=sc;
if(tCard)tCard.style.display=sc==='title'?'block':'none';if(tShop)tShop.style.display=(sc==='title'&&!everOver)?'flex':'none';if(retryB)retryB.style.display=sc==='over'?'block':'none'}
if(sc==='play'&&typeof score==='number'&&score!==lastScore){lastScore=score;S.cur=score;
if(!S.dailyOK&&!cfg.lower&&score>=goal()){S.dailyOK=true;S.coins+=10;S.stars++;toast('\u2600 Daily challenge done! +10 coins \u00B7 +1 star');SKY.sfx('win',{volume:.45});repaint()}
const n=performance.now();if(n-lastSave>1500){lastSave=n;save()}}};
retryB=document.createElement('button');retryB.type='button';retryB.id='pkRetry';retryB.textContent='▶ Retry';
retryB.style.cssText='position:fixed;left:50%;top:62%;transform:translateX(-50%);z-index:7;display:none;min-width:130px;min-height:48px;border-radius:24px;border:2px solid '+cfg.color+';background:rgba(10,10,46,.92);color:#fff;font:900 16px "Segoe UI",sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5)';
retryB.addEventListener('click',function(e){e.stopPropagation();retryTap();});document.body.appendChild(retryB);
function retryTap(){var c=document.querySelector('canvas');if(!c)return;var r=c.getBoundingClientRect();var x=r.left+r.width/2,y=r.top+r.height*0.42;
['pointerdown','pointerup'].forEach(function(t){try{c.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:1,pointerType:'touch',isPrimary:true}))}catch(e){}});
setTimeout(function(){['pointerdown','pointerup'].forEach(function(t){try{c.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:1,pointerType:'touch',isPrimary:true}))}catch(e){}})},320);}
load();buildUI();repaint();
return {color,tip,drawTip,save,state:S};
})(PKC);

init();
loop()
