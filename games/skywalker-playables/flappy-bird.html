<!DOCTYPE html>
<html lang="en"><head><script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Flap &amp; Fly</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items=center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 80px rgba(0,200,255,.6);transition:box-shadow 0.3s ease;}.c:focus{outline:none;box-shadow:0 0 80px rgba(0,255,255,.8);}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,needDraw=true;function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);W=Math.min(window.innerWidth-20,420);H=Math.min(window.innerHeight-20,720);C.style.width=W+'px';C.style.height=H+'px';C.width=Math.round(W*dpr);C.height=Math.round(H*dpr);X.setTransform(dpr,0,0,dpr,0,0);bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#080a2a');bgGrad.addColorStop(0.3,'#0c103a');bgGrad.addColorStop(0.6,'#100a3a');bgGrad.addColorStop(1,'#120a30');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}function pPipe(p){return p.x>-PW}function pTr(t){return t.life>0}
const PGC=[],STC=[],TRC=[],WCC=[];
function pipeGrad(k){let g=PGC[k];if(!g){let h=k*15;g=X.createLinearGradient(0,0,PW,0);g.addColorStop(0,'hsl('+h+', 80%, 40%)');g.addColorStop(0.3,'hsl('+((h+30)%360)+', 90%, 50%)');g.addColorStop(0.7,'hsl('+((h+60)%360)+', 80%, 45%)');g.addColorStop(1,'hsl('+((h+90)%360)+', 70%, 40%)');PGC[k]=g}return g}
function stripeCol(k){let s=STC[k];if(!s){s='hsla('+((k*15+180)%360)+', 50%, 30%, 0.3)';STC[k]=s}return s}
function trailCol(k){let s=TRC[k];if(!s){s='hsl('+(k*15)+', 80%, 50%)';TRC[k]=s}return s}
const G=.48,J=-8,PW=64,GAP=150,PIPE_SPD=3,BR=18;
let bird,pipes,frame,score,state,over,won,stars=[],clouds=[],particles=[],scorePopups=[],shakeX=0,shakeY=0,shakeTime=0,glowOffset=0,effectsEnabled=true,birdRad=null,birdBeak=null,pipeTimer=0;

// Initialize stars with colors
for(let i=0;i<120;i++){
    let layer = Math.floor(Math.random()*4);
    stars.push({
        x:Math.random()*W,
        y:Math.random()*H*.7,
        s:Math.random()*1.5+0.5,
        t:Math.random()*Math.PI*2,
        layer:layer,
        color:layer === 0 ? '#ffffff' : layer === 1 ? '#aaccff' : layer === 2 ? '#88ddff' : '#aaffcc',
        twinkleSpeed:0.01+Math.random()*0.02
    });
    let sc=stars[i].color;stars[i].rgb='rgb('+parseInt(sc.slice(1,3),16)+','+parseInt(sc.slice(3,5),16)+','+parseInt(sc.slice(5,7),16)+')';
}

// Initialize clouds with better properties
for(let i=0;i<8;i++){
    let sizeFactor = 0.8+Math.random()*0.7;
    clouds.push({
        x:Math.random()*W*1.5-W*0.3,
        y:H*.2+Math.random()*H*.3,
        w:(60+Math.random()*80)*sizeFactor,
        h:(20+Math.random()*15)*sizeFactor,
        s:.1+Math.random()*.4,
        opacity:0.03+Math.random()*0.03,
        detail:Math.random()>0.5
    });
}

function init(){
    bird={
        x:W*.28,
        y:H*.42,
        v:0,
        rot:0,
        wingT:0,
        trail:[],
        glowPhase:0
    };
    pipes=[];
    frame=0;
    pipeTimer=0;
    score=0;
    over=false;
    won=false;
    state='ready';
    particles=[];
    scorePopups=[];
    shakeTime=0;
    addPipe();
}

function addPipe(){
    let minY=120,maxY=H-GAP-120;
    let topH=Math.random()*(maxY-minY)+minY;
    pipes.push({
        x:W,
        topH,
        passed:false,
        trail:[],
        glowPhase:Math.random()*Math.PI*2
    });
}

function flap(){
    if(state==='ready'){
        state='play';
        bird.v=J;
        spawnFlapParticles();
    }else if(state==='play'){
        bird.v=J;
        spawnFlapParticles();
    }else if(over||won){
        init();
    }
}

document.addEventListener('pointerdown',flap);
document.addEventListener('keydown',e=>{
    if(e.code==='Space'||e.code==='ArrowUp'){
        e.preventDefault();
        flap();
    }
});

// Enhanced flap particles with better physics
function spawnFlapParticles(){
    if(particles.length>220)return;
    for(let i=0;i<8;i++){
        let angle = Math.PI + (Math.random()-0.5)*0.5; // Behind the bird
        let speed = 1+Math.random()*2;
        particles.push({
            x:bird.x-12,
            y:bird.y,
            vx:Math.cos(angle)*speed + (Math.random()-0.5),
            vy:Math.sin(angle)*speed + (Math.random()-0.5),
            life:20+Math.random()*15,
            s:Math.random()*3+1,
            col:`hsla(${45+Math.random()*20}, 100%, 70%, ${0.8+Math.random()*0.2})`,
            gravity:0.05
        });
    }
}

// Enhanced score particles with better spread
function spawnScoreParticle(x,y){
    if(particles.length>220)return;
    for(let i=0;i<12;i++){
        let a=Math.PI*2/12*i;
        let speed = 2+Math.random()*2;
        particles.push({
            x,y,
            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,
            life:25+Math.random()*10,
            s:Math.random()*3+1,
            col:`hsl(${45+Math.random()*15}, 100%, 65%)`,
            gravity:0.02
        });
    }
    scorePopups.push({
        x,y:y-20,
        text:'+1',
        life:40,
        vy:-1.2,
        scale:1
    });
}

// Enhanced death particles with better visual impact
function spawnDeathParticles(){
    if(particles.length>220)return;
    for(let i=0;i<40;i++){
        let a=Math.random()*Math.PI*2;
        let speed = 2+Math.random()*4;
        particles.push({
            x:bird.x,
            y:bird.y,
            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,
            life:30+Math.random()*20,
            s:Math.random()*4+2,
            col:['#ffd700','#ff4757','#ff8c00','#ffaa00','#ff6600'][Math.floor(Math.random()*5)],
            gravity:0.08
        });
    }
    shakeTime=25;
    // Create explosion effect
    for(let i=0;i<30;i++){
        setTimeout(()=>{
            if(particles.length>260)return;
            let a=Math.random()*Math.PI*2;
            let speed = 1+Math.random()*3;
            particles.push({
                x:bird.x,
                y:bird.y,
                vx:Math.cos(a)*speed,
                vy:Math.sin(a)*speed,
                life:20+Math.random()*15,
                s:Math.random()*3+1,
                col:['#ffd700','#ff4757','#ff8c00'][Math.floor(Math.random()*3)],
                gravity:0.05
            });
        }, i*30);
    }
}

function update(){
    if(state==='over'||state==='win'){
        frame++;
        if(shakeTime>0){shakeX=(Math.random()-.5)*shakeTime*.8;shakeY=(Math.random()-.5)*shakeTime*.8;shakeTime--}else{shakeX=0;shakeY=0}
        for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.life--}
        prune(particles,pLife);
        for(let sp of scorePopups){sp.y+=sp.vy;sp.life--}
        prune(scorePopups,pLife);
        return;
    }
    if(state!=='play')return;
    frame++;
    glowOffset += 0.05;

    bird.v+=G*dtK;
    bird.y+=bird.v*dtK;
    bird.rot=Math.max(-.4,Math.min(bird.v*.1,.9));
    bird.wingT+=.5; // Faster wing movement
    
    // Add bird trail
    if(frame % 5 === 0 && state === 'play'){
        if(bird.trail.length<30)bird.trail.push({x:bird.x-8, y:bird.y, life:10});
    }
    for(let t of bird.trail)t.life--;
    prune(bird.trail,pTr);

    if(shakeTime>0){
        shakeX=(Math.random()-.5)*shakeTime*.8;
        shakeY=(Math.random()-.5)*shakeTime*.8;
        shakeTime--;
    }else{
        shakeX=0;
        shakeY=0;
    }

    pipeTimer+=dtK;if(pipeTimer>=90){pipeTimer-=90;addPipe();}

    for(let p of pipes){
        p.x-=PIPE_SPD*dtK;

        // Add pipe glow effect
        p.glowPhase += 0.05;
        
        // Add pipe trail
        if(frame % 8 === 0){
            if(p.trail.length<20)p.trail.push({x:p.x+PW/2, y:p.topH+GAP/2, life:15});
        }
        for(let t of p.trail)t.life--;
        prune(p.trail,pTr);
        
        if(!p.passed&&p.x+PW<bird.x){
            p.passed=true;
            score++;
            spawnScoreParticle(p.x+PW/2,bird.y);
        }
        
        let bx=bird.x-BR+4,by=bird.y-BR+4,bw=BR*2-8,bh=BR*2-8;
        if(bx<p.x+PW&&bx+bw>p.x&&by<p.topH)return die();
        if(bx<p.x+PW&&bx+bw>p.x&&by+bh>p.topH+GAP)return die();
    }
    
    prune(pipes,pPipe);
    
    if(bird.y>H-BR-5||bird.y<-BR)die();
    
    // Update particles with gravity
    for(let p of particles){
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=p.gravity;
        p.life--;
    }
    prune(particles,pLife);
    
    // Update score popups
    for(let sp of scorePopups){
        sp.y+=sp.vy;
        sp.life--;
        sp.scale = 1.2 - (40-sp.life)/40 * 0.2; // Scale down as life decreases
    }
    prune(scorePopups,pLife);
    
    // Update clouds
    for(let c of clouds){
        c.x-=c.s;
        if(c.x+c.w<0)c.x=W+50;
    }
    
    if(score>=5){
        won=true;
        state='win';
        spawnDeathParticles();
    }
}

function die(){
    if(over)return;
    spawnDeathParticles();
    over=true;
    state='over';
    shakeTime=25;
    if(score>=5)won=true;
}

function draw(){
    X.save();
    X.translate(shakeX,shakeY);
    
    X.clearRect(-15,-15,W+30,H+30);
    
    // Enhanced background gradient with animated glow
    X.fillStyle=bgGrad;
    X.fillRect(0,0,W,H);
    
    // Draw animated stars with twinkling effect
    for(let s of stars){
        let alpha = (0.3 + Math.sin(frame*0.05+s.t)*0.2) * (s.layer === 0 ? 1 : 0.7);
        X.globalAlpha=alpha;
        X.fillStyle=s.rgb;
        X.beginPath();
        X.arc(s.x,s.y,s.s,0,Math.PI*2);
        X.fill();
    }
    X.globalAlpha=1;
    
    // Draw clouds with better depth and detail
    for(let c of clouds){
        X.globalAlpha=c.opacity;
        X.fillStyle='rgba(255,255,255,0.08)';
        X.beginPath();
        X.ellipse(c.x+c.w*0.3,c.y,c.w*0.3,c.h*0.7,0,0,Math.PI*2);
        X.fill();
        X.ellipse(c.x+c.w*0.7,c.y,c.w*0.4,c.h*0.6,0,0,Math.PI*2);
        X.fill();
        X.ellipse(c.x+c.w*0.5,c.y-c.h*0.3,c.w*0.35,c.h*0.5,0,0,Math.PI*2);
        X.fill();
        
        // Add cloud details
        if(c.detail){
            X.fillStyle='rgba(255,255,255,0.05)';
            X.beginPath();
            X.ellipse(c.x+c.w*0.45,c.y+c.h*0.2, c.w*0.15, c.h*0.2, 0, 0, Math.PI*2);
            X.fill();
        }
        X.globalAlpha=1;
    }
    
    // Enhanced pipes with animated glow and details
    for(let p of pipes){
        // Calculate dynamic pipe colors
        let hue = (frame*0.5 + p.glowPhase*30) % 360;
        let k = Math.floor(hue/15)%24;
        X.save();
        X.translate(p.x,0);
        X.fillStyle=pipeGrad(k);
        
        // Draw top pipe
        X.fillRect(0,0,PW,p.topH);
        // Pipe cap
        X.fillRect(-8,p.topH-25,PW+16,25);
        
        // Draw bottom pipe
        X.fillRect(0,p.topH+GAP,PW,H-p.topH-GAP);
        // Pipe cap
        X.fillRect(-8,p.topH+GAP,PW+16,25);
        
        // Add pipe highlights
        X.fillStyle='rgba(255,255,255,0.15)';
        X.fillRect(4,0,6,p.topH-20);
        X.fillRect(4,p.topH+GAP+20,6,H);
        
        // Add pipe texture stripes
        X.fillStyle=stripeCol(k);
        for(let i=0; i<p.topH/40; i++){
            X.fillRect(10, i*40+10, PW-20, 8);
        }
        for(let i=0; i<(H-p.topH-GAP)/40; i++){
            X.fillRect(10, p.topH+GAP+i*40+10, PW-20, 8);
        }
        
        // Draw pipe trail
        for(let t of p.trail){
            X.globalAlpha=t.life/15*0.3;
            X.fillStyle=trailCol(k);
            let size = 3 + Math.sin(frame*0.1 + t.x*0.01)*1.5;
            X.beginPath();
            X.arc(t.x-p.x,t.y,size,0,Math.PI*2);
            X.fill();
        }
        X.globalAlpha=1;
        X.restore();
    }
    
    // Draw bird trail
    for(let t of bird.trail){
        let alpha = t.life/10 * 0.4;
        X.globalAlpha=alpha;
        X.fillStyle='rgba(255,215,0,0.3)';
        X.beginPath();
        X.arc(t.x, t.y, BR*0.4, 0, Math.PI*2);
        X.fill();
    }
    X.globalAlpha=1;
    
    // Enhanced Bird with animated glow and details
    X.save();
    X.translate(bird.x,bird.y);
    X.rotate(bird.rot);
    
    // Animated wing with better physics
    let wingY=Math.sin(bird.wingT)*8;
    let wk=Math.round(40+Math.sin(frame*0.2)*10);let wingColor=WCC[wk];if(!wingColor){if(WCC.length>12)WCC.length=0;wingColor='hsl('+wk+', 90%, 50%)';WCC[wk]=wingColor}
    X.fillStyle=wingColor;
    X.beginPath();
    X.moveTo(-8,2);
    X.quadraticCurveTo(-18,wingY-5,-14,wingY+8);
    X.quadraticCurveTo(-8,6,-8,2);
    X.fill();
    
    // Enhanced body glow with pulsing effect
    let bodyGlow = 20 + Math.sin(frame*0.2)*5;
    glowAt('hsl(45, 100%, 60%)',0,0,BR+bodyGlow);
    X.fillStyle='#ffd700';
    X.beginPath();
    X.arc(0,0,BR,0,Math.PI*2);
    X.fill();
    
    // Enhanced body gradient overlay
    if(!birdRad){birdRad=X.createRadialGradient(-3,-3,2,0,0,BR);
    birdRad.addColorStop(0,'rgba(255,255,200,0.8)');
    birdRad.addColorStop(0.5,'rgba(255,220,50,0.6)');
    birdRad.addColorStop(1,'rgba(255,180,0,0)')}
    X.fillStyle=birdRad;
    X.beginPath();
    X.arc(0,0,BR,0,Math.PI*2);
    X.fill();
    
    // Enhanced bird pattern
    X.fillStyle='rgba(255,100,0,0.3)';
    X.beginPath();
    X.arc(-5,-3,6,0,Math.PI*2);
    X.fill();
    
    // Beak with gradient
    if(!birdBeak){birdBeak=X.createLinearGradient(BR-2,-3,BR+12,0);
    birdBeak.addColorStop(0,'#ff6348');
    birdBeak.addColorStop(1,'#ff8c69')}
    X.fillStyle=birdBeak;
    X.beginPath();
    X.moveTo(BR-2,-3);
    X.lineTo(BR+12,0);
    X.lineTo(BR-2,3);
    X.closePath();
    X.fill();
    
    // Enhanced eye with reflection
    X.fillStyle='#fff';
    X.beginPath();
    X.arc(4,-5,7,0,Math.PI*2);
    X.fill();
    
    // Pupil with depth
    X.fillStyle='#1a1a2e';
    X.beginPath();
    X.arc(6,-5,3.5,0,Math.PI*2);
    X.fill();
    
    // Enhanced eye shine
    X.fillStyle='#fff';
    X.beginPath();
    X.arc(7.5,-6.5,2,0,Math.PI*2);
    X.fill();
    
    // Additional eye highlight
    X.fillStyle='rgba(255,255,255,0.6)';
    X.beginPath();
    X.arc(5,-4,1.2,0,Math.PI*2);
    X.fill();
    
    X.restore();
    
    // Enhanced particles with gravity and fading
    for(let p of particles){
        let pr=p.s*(p.life/40);
        X.globalAlpha=p.life/40;
        glowAt(p.col,p.x,p.y,pr+6);
        X.fillStyle=p.col;
        X.beginPath();
        X.arc(p.x,p.y,pr,0,Math.PI*2);
        X.fill();
    }
    X.globalAlpha=1;
    
    // Enhanced score popups with scaling
    for(let sp of scorePopups){
        X.globalAlpha=sp.life/40;
        X.save();
        X.translate(sp.x, sp.y);
        X.scale(sp.scale, sp.scale);
        X.fillStyle='#ffd700';
        X.font='bold 28px "Segoe UI"';
        X.textAlign='center';
        X.fillText(sp.text,0,0);
        X.restore();
    }
    X.globalAlpha=1;
    
    // Enhanced score display with glow
    X.fillStyle='#fff';
    X.font='bold 54px "Segoe UI"';
    X.textAlign='center';
    X.fillText(score,W/2,60);
    
    // Enhanced ready state with glowing text
    if(state==='ready'){
        glowAt('#ffffff',W/2,H*.35,110);
        X.fillStyle='rgba(255,255,255,0.95)';
        X.font='bold 32px "Segoe UI"';
        X.fillText('FLAP & FLY',W/2,H*.35);
        
        // Pulse effect for call to action
        let pulse = 0.8 + Math.sin(frame*0.1)*0.2;
        X.globalAlpha=pulse;
        X.fillStyle='rgba(255,255,255,0.8)';
        X.font='bold 24px "Segoe UI"';
        X.fillText('TAP TO FLY',W/2,H*.45);
        X.globalAlpha=1;
        
        X.font='18px "Segoe UI"';
        X.fillStyle='rgba(255,255,255,0.5)';
        X.fillText('Dodge the pipes!',W/2,H*.52);
    }
    
    // Enhanced game over/win screens
    if(over||won){
        // Semi-transparent overlay
        X.fillStyle='rgba(0,0,0,0.75)';
        X.fillRect(0,0,W,H);
        
        // Animated border for game over screen
        X.strokeStyle=won ? 'rgba(85, 239, 196, 0.8)' : 'rgba(255, 71, 87, 0.8)';
        X.lineWidth=3;
        X.strokeRect(20, H*.25, W-40, H*.35);
        
        // Main message with glow
        glowAt(won?'#55efc4':'#ff4757',W/2,H*.38,130);
        X.fillStyle=won?'#55efc4':'#ff4757';
        X.font='bold 46px "Segoe UI"';
        X.textAlign='center';
        X.fillText(won?'\u2728 YOU WIN! \u2728':'GAME OVER',W/2,H*.38);
        
        // Score display
        X.fillStyle='#fff';
        X.font='bold 32px "Segoe UI"';
        X.fillText(score+' / 5',W/2,H*.50);
        
        // Retry instruction with pulse
        let retryPulse = 0.7 + Math.sin(frame*0.15)*0.2;
        X.globalAlpha=retryPulse;
        X.font='20px "Segoe UI"';
        X.fillStyle='rgba(255,255,255,0.7)';
        X.fillText('\u25B6 TAP TO RETRY',W/2,H*.60);
        X.globalAlpha=1;
    }
    
    X.restore();
}

let pState='';
let lastT=0,dtK=1;
function loop(now){
    if(document.hidden){lastT=0;return requestAnimationFrame(loop);}
    const dt=lastT?Math.min((now-lastT)/1000,.05):1/60;lastT=now;
    dtK=dt*60;
    update();
    if(state!==pState){pState=state;needDraw=true}
    if(state==='play'||particles.length>0||shakeTime>0||scorePopups.length>0)needDraw=true;
    if(needDraw){needDraw=false;draw()}
    requestAnimationFrame(loop);
}
init();
loop()
</script><script>
(()=>{
const GAME_ID='sky-flappy-bird',TITLE='Flap & Fly',BEST_KEY=GAME_ID+'-best',SEEN_KEY=GAME_ID+'-seen',DIFF_KEY=GAME_ID+'-difficulty',PAUSE_BUTTON='br';
const HOWTO=["Press Play to start Flap & Fly.", "Use the game controls shown below once the run begins.", "Finish the objective, then replay to beat your best result."],TIPS=["Short, controlled moves beat panic inputs.", "Read the next obstacle before you commit.", "If a run falls apart, replay quickly while the pattern is fresh."],KEYBOARD="Space or Arrow Up flaps.",TOUCH="Tap anywhere to flap.";
const CODE_LIST=[
  {code:'PARTY',effect:'Party lights: hue-shift the whole run.'},
  {code:'CHILL',effect:'Chill mode: slow the whole run down.'},
  {code:'BOOST',effect:'Take a quick advantage for this run.'}
];
const read=(k,f)=>{try{const v=localStorage.getItem(k);return v==null?f:v;}catch(e){return f;}};
const readNum=(k,f=0)=>{const v=parseInt(read(k,''),10);return Number.isFinite(v)?v:f;};
let best=readNum(BEST_KEY,0),difficulty=read(DIFF_KEY,'normal')||'normal',titleOpen=false,resultOpen=false,reportedOver=false,party=false,chill=false,frameAcc=0;
const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const rawSetItem=window.localStorage&&localStorage.setItem?localStorage.setItem.bind(localStorage):null;
if(rawSetItem){localStorage.setItem=function(key,val){if(String(key)===BEST_KEY&&window.ArcadeSDK&&ArcadeSDK.cheated)return;return rawSetItem(key,val);};}
if(typeof saveBest==='function'){const keepSaveBest=saveBest;saveBest=function(){if(window.ArcadeSDK&&ArcadeSDK.cheated)return;return keepSaveBest();};}
function difficultyScale(){const base=difficulty==='easy'?0.85:difficulty==='hard'?1.18:1;return chill?base*0.72:base;}
function scoreValue(){try{return Math.max(0,Math.round(score||0||0));}catch(e){return 0;}}
function persistBest(force){const score=scoreValue();if((force||score>best)&&!(window.ArcadeSDK&&ArcadeSDK.cheated)){best=score;try{localStorage.setItem(BEST_KEY,String(best));}catch(e){}}return best;}
function sceneName(){
  if(resultOpen) return 'over';
  if(titleOpen) return 'title';
  if(typeof over==='boolean'&&over) return 'over';
  if(typeof won==='boolean'&&won) return 'over';
  if(state==='play'||state==='aiming') return 'play';
  if(state==='over'||state==='win') return 'over';
  return 'title';
}
function postScene(){if(window.ArcadeSDK)ArcadeSDK.state({scene:sceneName(),score:scoreValue()});}
function applyIntervalScale(){if(typeof interval!=='undefined'&&typeof spd==='number'&&typeof update==='function'){clearInterval(interval);interval=setInterval(update,Math.max(40,Math.round(spd/difficultyScale())));}}
function setDiffButtons(){diffWrap.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===difficulty));}
function setDifficulty(next){difficulty=next;try{localStorage.setItem(DIFF_KEY,difficulty);}catch(e){}setDiffButtons();applyIntervalScale();needDraw=true;}
function hideTitle(){titleOpen=false;overlay.hidden=true;}
function hideResult(){resultOpen=false;results.hidden=true;}
function showTitle(forceTutorial){titleOpen=true;resultOpen=false;overlay.hidden=false;results.hidden=true;const first=read(SEEN_KEY,'0')!=='1';titleInfo.innerHTML='<h1>'+TITLE+'</h1><p>'+(forceTutorial||first?'Learn it in three quick steps and jump in.':'Back at the title. Pick a difficulty and play again.')+'</p><ol>'+HOWTO.map(s=>'<li>'+s+'</li>').join('')+'</ol><div class="sky-mini">💡 '+(TIPS[0]||'')+'</div>';setDiffButtons();postScene();}
function showResult(){resultOpen=true;persistBest();resultTitle.textContent=(state==='win'||(typeof won==='boolean'&&won))?'Run complete!':'Run over';resultScore.textContent='Score: '+scoreValue();resultBest.textContent='Best: '+best;results.hidden=false;codesBadge.hidden=!(window.ArcadeSDK&&ArcadeSDK.cheated);postScene();}
function startRun(){reportedOver=false;hideResult();hideTitle();try{localStorage.setItem(SEEN_KEY,'1');}catch(e){}flap();applyIntervalScale();postScene();needDraw=true;}
function restartRun(){if(typeof init==='function')init();startRun();}
function exitToTitle(){if(typeof init==='function')init();hideResult();showTitle(false);applyIntervalScale();needDraw=true;}
function genericBoost(){let changed=false;if(typeof lives==='number'){lives=Math.min(lives+1,9);changed=true;}if(typeof timeLeft==='number'){timeLeft+=10;changed=true;}if(typeof timer==='number'){timer+=8;changed=true;}if(typeof score==='number'){score+=25;changed=true;}if(typeof targetScore==='number'){targetScore=Math.max(20,targetScore-20);changed=true;}if(typeof targetKills==='number'){targetKills=Math.max(1,targetKills-2);changed=true;}return changed;}
function applyBoost(){let changed=genericBoost();if(!changed&&typeof score==='number')score+=10;needDraw=true;return {ok:true,message:CODE_LIST[2].effect};}
function onHint(){return state!=="play"?"Press Play, then use the quick tutorial steps on the title card.":(TIPS[1]||TIPS[0]||"Stay calm and make the next clean move.");}
const shell=document.createElement('div');
shell.innerHTML=`<style>#sky-codes-on{position:fixed;top:12px;left:12px;z-index:9998;background:#ffd257;color:#111;padding:6px 12px;border-radius:999px;font:900 12px/1 'Segoe UI',system-ui,sans-serif;letter-spacing:.12em}#sky-codes-on[hidden]{display:none}#sky-arcade-ui,#sky-arcade-results{position:fixed;inset:0;display:grid;place-items:center;padding:18px;z-index:9997}#sky-arcade-ui{background:rgba(4,8,18,.62);backdrop-filter:blur(6px)}#sky-arcade-results{background:rgba(4,8,18,.48)}#sky-arcade-ui[hidden],#sky-arcade-results[hidden]{display:none}#sky-arcade-ui .card,#sky-arcade-results .card{width:min(100%,420px);border-radius:22px;padding:22px 20px 18px;background:linear-gradient(180deg,rgba(12,18,42,.96),rgba(7,10,26,.96));border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 55px rgba(0,0,0,.35);font-family:'Segoe UI',system-ui,sans-serif;color:#fff}#sky-arcade-ui h1,#sky-arcade-results h2{margin:0 0 8px;font-size:clamp(28px,8vw,38px);line-height:.95}#sky-arcade-ui p,#sky-arcade-results p,#sky-arcade-ui li{font-size:14px;line-height:1.45;color:rgba(255,255,255,.82)}#sky-arcade-ui ol{padding-left:20px;margin:12px 0}#sky-arcade-ui button,#sky-arcade-results button{appearance:none;border:0;border-radius:16px;min-height:44px;padding:12px 16px;font:800 16px 'Segoe UI',system-ui,sans-serif;cursor:pointer}#sky-arcade-play,#sky-arcade-replay{width:100%;background:linear-gradient(135deg,#43ddff,#1c9ee8);color:#04122b;box-shadow:0 10px 22px rgba(0,180,255,.28)}#sky-arcade-ui .sky-mini,#sky-arcade-results .sky-mini{font-size:13px;color:rgba(255,255,255,.68)}#sky-arcade-ui .diff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}#sky-arcade-ui .diff button{background:rgba(255,255,255,.08);color:#dfe7ff;border:1px solid rgba(255,255,255,.12)}#sky-arcade-ui .diff button.active{background:#ffd257;color:#16171d}@media (prefers-reduced-motion:reduce){#sky-arcade-ui{backdrop-filter:none}}</style><div id="sky-codes-on" hidden>CODES ON</div><div id="sky-arcade-ui"><div class="card"><div id="sky-arcade-info"></div><div class="diff"><button type="button" data-mode="easy">Easy</button><button type="button" data-mode="normal">Normal</button><button type="button" data-mode="hard">Hard</button></div><button id="sky-arcade-play" type="button">Play</button><p class="sky-mini">Keyboard: ${KEYBOARD}</p><p class="sky-mini">Touch: ${TOUCH}</p></div></div><div id="sky-arcade-results" hidden><div class="card"><h2 id="sky-arcade-result-title"></h2><p id="sky-arcade-result-score"></p><p id="sky-arcade-result-best"></p><button id="sky-arcade-replay" type="button">Play again</button><p class="sky-mini">Tip: ${TIPS[1]||TIPS[0]||''}</p></div></div>`;
document.body.appendChild(shell);
const overlay=shell.querySelector('#sky-arcade-ui'),results=shell.querySelector('#sky-arcade-results'),titleInfo=shell.querySelector('#sky-arcade-info'),resultTitle=shell.querySelector('#sky-arcade-result-title'),resultScore=shell.querySelector('#sky-arcade-result-score'),resultBest=shell.querySelector('#sky-arcade-result-best'),codesBadge=shell.querySelector('#sky-codes-on'),diffWrap=overlay.querySelector('.diff');
diffWrap.querySelectorAll('button').forEach(btn=>btn.onclick=()=>setDifficulty(btn.dataset.mode));
overlay.querySelector('#sky-arcade-play').onclick=startRun;results.querySelector('#sky-arcade-replay').onclick=restartRun;
window.addEventListener('keydown',e=>{if(!(titleOpen||resultOpen))return;if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopImmediatePropagation();resultOpen?restartRun():startRun();}},true);
if(typeof update==='function'){
  const coreUpdate=update;
  update=function(...args){
    const scale=difficultyScale();
    if(args.length===0){
      if(typeof dtK==='number'){
        const keep=dtK;dtK*=scale;coreUpdate();dtK=keep;
      }else{
        frameAcc+=scale;
        let guard=0;
        while(frameAcc>=1&&guard<3){coreUpdate();frameAcc-=1;guard++;}
      }
    }else if(args.length===1){
      coreUpdate(args[0]*scale);
    }else if(args.length===2){
      coreUpdate(args[0]*scale,args[1]*scale);
    }else{
      coreUpdate(...args);
    }
    if(reduced){if(typeof shakeTime==='number')shakeTime=0;if(typeof camShake==='number')camShake=0;if(typeof muzzleFlash==='number')muzzleFlash=0;}
    C.style.filter=party?'hue-rotate('+((Date.now()/18)%360)+'deg) saturate(1.25)':'';
  };
}
const monitor=()=>{const scene=sceneName();if(scene==='over'&&!reportedOver){reportedOver=true;showResult();}if(scene==='play')reportedOver=false;requestAnimationFrame(monitor);};requestAnimationFrame(monitor);
if(window.ArcadeSDK) ArcadeSDK.init({onRestart:restartRun,onExit:exitToTitle,onTutorial:()=>showTitle(true),onHint:onHint,cheats:CODE_LIST,onCheat:(code)=>{if(code==='PARTY'){party=true;codesBadge.hidden=false;needDraw=true;return {ok:true,message:CODE_LIST[0].effect};}if(code==='CHILL'){chill=true;codesBadge.hidden=false;applyIntervalScale();needDraw=true;return {ok:true,message:CODE_LIST[1].effect};}if(code==='BOOST'){codesBadge.hidden=false;return applyBoost();}},pauseButton:PAUSE_BUTTON});
showTitle(false);
})();
</script>
</body></html>
