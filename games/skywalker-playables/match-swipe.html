<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Match Swipe</title><script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script><script src="sky-arcade.js"></script><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(165,94,234,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,COLS=6,ROWS=8,SZ,grid,score,targetScore,moves,state,particles=[],selTile=null,combo=0,comboTimer=0,best=0,hintMove=null,cheat={show:false,dbl:false};
const SHAPES=['circle','diamond','triangle','square','hexagon'],GCOLORS=['#ff4757','#ffa502','#2ed573','#1e90ff','#a55eea'],NAMES=['red circle','orange diamond','green triangle','blue square','purple hexagon'],OFFY=60;
let bgGrad,CRECT,needDraw=true;function resize(){W=Math.min(window.innerWidth-20,420);H=Math.min(window.innerHeight-20,720);SKY.fit(C,X,W,H);SZ=Math.floor(Math.min(W/COLS,(H-OFFY-50)/ROWS));CRECT=C.getBoundingClientRect();bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#1a1025');bgGrad.addColorStop(1,'#0f0a18');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}
function offX(){return (W-COLS*SZ)/2}
function init(){grid=[];score=0;targetScore=100;moves=SKY.pick(25,20,15)+(cheat.moreMoves||0);best=SKY.best();state='ready';particles=[];selTile=null;combo=0;comboTimer=0;hintMove=null;makeGrid()}
function rnd(){return Math.floor(Math.random()*SHAPES.length)}
// A fresh board has no ready-made lines and at least one possible move.
function makeGrid(){do{for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++){let t;do{t=rnd()}while((c>1&&grid[r][c-1].type===t&&grid[r][c-2].type===t)||(r>1&&grid[r-1][c].type===t&&grid[r-2][c].type===t));grid[r][c]={type:t,alive:true,animScale:1,flash:0}}}}while(!findMove())}
function lines(){let out=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-2;c++){let t=grid[r][c].type;if(grid[r][c+1].type===t&&grid[r][c+2].type===t)out.push([[r,c],[r,c+1],[r,c+2]])}
for(let r=0;r<ROWS-2;r++)for(let c=0;c<COLS;c++){let t=grid[r][c].type;if(grid[r+1][c].type===t&&grid[r+2][c].type===t)out.push([[r,c],[r+1,c],[r+2,c]])}return out}
function sw(r1,c1,r2,c2){let t=grid[r1][c1];grid[r1][c1]=grid[r2][c2];grid[r2][c2]=t}
function findMove(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(let [dr,dc] of [[0,1],[1,0]]){let r2=r+dr,c2=c+dc;if(r2>=ROWS||c2>=COLS)continue;sw(r,c,r2,c2);let n=lines().length;sw(r,c,r2,c2);if(n)return {r,c,r2,c2}}return null}
function snapG(){return {g:grid.map(r=>r.map(t=>({type:t.type,alive:t.alive,animScale:t.animScale,flash:t.flash}))),score,moves}}
let hist=[];
function undoMove(){if(state!=='play'||!hist.length)return;let h=hist.pop();grid=h.g.map(r=>r.map(t=>({type:t.type,alive:t.alive,animScale:t.animScale,flash:t.flash})));score=h.score;moves=h.moves;combo=0;selTile=null;hintMove=null;SKY.sfx('swap',{volume:.4});needDraw=true}
function showHint(){if(state!=='play')return;const m=findMove();if(m){hintMove=m;SKY.sfx('powerup',{volume:.4})}}
function trySwap(r1,c1,r2,c2){const snap=snapG();sw(r1,c1,r2,c2);if(!lines().length){sw(r1,c1,r2,c2);SKY.sfx('error',{volume:.5});particles.push({x:W/2,y:H-24,vx:0,vy:0,life:30,s:0,col:'#ff6b81',text:'No match: swap undone'});return}
hist.push(snap);if(hist.length>12)hist.shift();moves--;combo=0;hintMove=null;SKY.sfx('swap',{volume:.5});checkMatches();
if(!findMove()){makeGrid();particles.push({x:W/2,y:H/2+30,vx:0,vy:0,life:45,s:0,col:'#fff',text:'No moves left: new board'})}
if(moves<=0){state=score>=targetScore?'win':'over';SKY.sfx(state==='win'?'win':'lose');if(SKY.saveBest(score))best=score}}
function cellAt(e){let mx=e.clientX-CRECT.left,my=e.clientY-CRECT.top;let c=Math.floor((mx-offX())/SZ),r=Math.floor((my-OFFY)/SZ);return r<0||r>=ROWS||c<0||c>=COLS?null:{r,c}}
let down=null;
C.addEventListener('pointerdown',e=>{if(state==='win'||state==='over'){init();state='play';return}if(state==='ready'){state='play';return}if(state!=='play')return;let t=cellAt(e);if(!t)return;down={t,x:e.clientX,y:e.clientY};
if(selTile&&Math.abs(selTile.r-t.r)+Math.abs(selTile.c-t.c)===1){trySwap(selTile.r,selTile.c,t.r,t.c);selTile=null;down=null}else{selTile=t;SKY.sfx('tap',{volume:.3})}});
C.addEventListener('pointermove',e=>{if(!down||state!=='play')return;let dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.max(Math.abs(dx),Math.abs(dy))<SZ*.45)return;
let r2=down.t.r+(Math.abs(dy)>Math.abs(dx)?Math.sign(dy):0),c2=down.t.c+(Math.abs(dx)>=Math.abs(dy)?Math.sign(dx):0);if(r2>=0&&r2<ROWS&&c2>=0&&c2<COLS)trySwap(down.t.r,down.t.c,r2,c2);down=null;selTile=null});
addEventListener('pointerup',()=>{down=null});
// Keyboard: arrows move a cursor, Space picks a tile then an arrow swaps it.
let cur={r:0,c:0},kSel=false;
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='win'||state==='over'){init();state='play';return}if(state==='ready'){state='play';return}kSel=!kSel;selTile=kSel?{r:cur.r,c:cur.c}:null;return}
let d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.code];if(!d||state!=='play')return;e.preventDefault();let r2=cur.r+d[0],c2=cur.c+d[1];if(r2<0||r2>=ROWS||c2<0||c2>=COLS)return;
if(kSel){trySwap(cur.r,cur.c,r2,c2);kSel=false;selTile=null}cur={r:r2,c:c2};needDraw=true});
function checkMatches(){let ls;while((ls=lines()).length){ls.forEach(matchLine);dropTiles();fillEmpty()}}
function matchLine(cells){combo++;comboTimer=60;let pts=combo*10*(cheat.dbl?2:1);score+=pts;SKY.sfx(combo>1?'combo':'match',{volume:.6});
for(let [r,c]of cells){let tile=grid[r][c];if(!tile.alive)continue;tile.alive=false;tile.flash=15;
if(particles.length<220)for(let i=0;i<6;i++)particles.push({x:offX()+c*SZ+SZ/2,y:OFFY+r*SZ+SZ/2,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:25,s:Math.random()*4+2,col:GCOLORS[tile.type]})}
if(combo>1){particles.push({x:W/2,y:H/2,vx:0,vy:0,life:30,s:0,col:'#ffd700',text:''+combo+'x COMBO!'})}}
function dropTiles(){for(let c=0;c<COLS;c++){let empty=0;for(let r=ROWS-1;r>=0;r--){if(!grid[r][c].alive)empty++;else if(empty>0){grid[r+empty][c]=grid[r][c];grid[r][c]={alive:false,type:-1}}}}}
function fillEmpty(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(!grid[r][c].alive)grid[r][c]={type:rnd(),alive:true,animScale:0,flash:0}}}
function update(dt){let f=dt*60;for(let p of particles){p.x+=p.vx*f;p.y+=p.vy*f;p.vy+=p.text?0:.05*f;p.life-=f}prune(particles,pLife);
if(comboTimer>0)comboTimer-=f;else combo=0;
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(grid[r][c].animScale<1)grid[r][c].animScale=Math.min(1,grid[r][c].animScale+.1*f);if(grid[r][c].flash>0)grid[r][c].flash=Math.max(0,grid[r][c].flash-f)}
if(cheat.show&&state==='play'&&!hintMove)hintMove=findMove()}
function drawShape(type,x,y,sz,col){glowAt(col,x,y,sz/2.2+8);X.fillStyle=col;
if(type===0){X.beginPath();X.arc(x,y,sz/2.8,0,Math.PI*2)}else if(type===1){X.beginPath();X.moveTo(x,y-sz/2.2);X.lineTo(x+sz/2.5,y);X.lineTo(x,y+sz/2.2);X.lineTo(x-sz/2.5,y);X.closePath()}else if(type===2){X.beginPath();X.moveTo(x,y-sz/2.2);X.lineTo(x+sz/2.5,y+sz/2.5);X.lineTo(x-sz/2.5,y+sz/2.5);X.closePath()}else if(type===3){X.beginPath();X.rect(x-sz/2.8,y-sz/2.8,sz/1.4,sz/1.4)}else{X.beginPath();for(let i=0;i<6;i++){let a=Math.PI/3*i-Math.PI/6;X.lineTo(x+Math.cos(a)*sz/2.5,y+Math.sin(a)*sz/2.5)}X.closePath()}X.fill();
X.fillStyle='rgba(255,255,255,.25)';X.beginPath();X.arc(x-sz/8,y-sz/8,sz/6,0,Math.PI*2);X.fill()}
function draw(){X.clearRect(0,0,W,H);X.fillStyle=bgGrad;X.fillRect(0,0,W,H);
let ox=offX(),oy=OFFY;
X.fillStyle='rgba(255,255,255,.03)';X.fillRect(ox,oy,COLS*SZ,ROWS*SZ);
if(hintMove){let a=.35+.25*Math.sin(performance.now()/180);X.strokeStyle=PK.color();X.globalAlpha=a;X.lineWidth=3;[[hintMove.r,hintMove.c],[hintMove.r2,hintMove.c2]].forEach(([r,c])=>X.strokeRect(ox+c*SZ+2,oy+r*SZ+2,SZ-4,SZ-4));X.globalAlpha=1}
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(!grid[r][c].alive)continue;let tile=grid[r][c];
let x=ox+c*SZ+SZ/2,y=oy+r*SZ+SZ/2;let s=tile.animScale;
if(selTile&&selTile.r===r&&selTile.c===c){X.fillStyle='rgba(255,255,255,.15)';X.fillRect(ox+c*SZ,oy+r*SZ,SZ,SZ)}
if(tile.flash>0){X.globalAlpha=tile.flash/15*.5;X.fillStyle='#fff';X.beginPath();X.arc(x,y,SZ*.4*s,0,Math.PI*2);X.fill();X.globalAlpha=1}
X.save();X.translate(x,y);X.scale(s,s);X.translate(-x,-y);drawShape(tile.type,x,y,Math.max(2,SZ-tile.flash*.3),GCOLORS[tile.type]);X.restore()}
if(state==='play'&&kUsed){X.strokeStyle=PK.color();X.lineWidth=2;X.strokeRect(ox+cur.c*SZ+1,oy+cur.r*SZ+1,SZ-2,SZ-2)}
for(let p of particles){if(p.text){X.globalAlpha=Math.min(1,p.life/30);X.fillStyle=p.col;X.font='bold 20px "Segoe UI"';X.textAlign='center';X.fillText(p.text,p.x,p.y);X.globalAlpha=1}else{let pr=p.s*(p.life/25);X.globalAlpha=p.life/25;glowAt(p.col,p.x,p.y,pr+6);X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,pr,0,Math.PI*2);X.fill()}}X.globalAlpha=1;
X.fillStyle='#fff';X.font='bold 22px "Segoe UI"';X.textAlign='center';X.fillText(score+' / '+targetScore,W/2,28);
X.font='bold 14px "Segoe UI"';X.textAlign='left';X.fillStyle=moves<=3?'#ff4757':'rgba(255,255,255,.85)';X.fillText('MOVES '+moves,12,50);X.textAlign='right';X.fillStyle='rgba(255,255,255,.7)';X.fillText('BEST '+best,W-12,50);
if(combo>1){X.fillStyle='#ffd700';X.font='bold 16px "Segoe UI"';X.textAlign='right';X.fillText(combo+'x',W-15,28)}
if(state==='ready'&&SKY.tut)SKY.drawTut(X,W,H,{title:'MATCH SWIPE',color:'#a55eea',gesture:'swipe',steps:['Swipe a shape onto its neighbour (or tap one, then the other) to swap them.','A swap only counts if it lines up 3 or more of the same shape; otherwise it is undone for free.','Lines vanish, new shapes fall, and chain reactions build a combo.','Reach 100 points before your moves run out.']});
else if(state==='ready'){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,H);glowAt('#a55eea',W/2,H/2-30,110);X.fillStyle='#a55eea';X.font='bold 26px "Segoe UI"';X.textAlign='center';X.fillText('MATCH SWIPE',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Swipe shapes into lines of 3',W/2,H/2+5);X.fillStyle='rgba(255,255,255,.5)';X.fillText('▶ Tap to start',W/2,H/2+35)}
if(state==='win'||state==='over'){let won=state==='win',col=won?'#a55eea':'#ff4757';X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt(col,W/2,H/2-20,110);X.fillStyle=col;X.font='bold 32px "Segoe UI"';X.textAlign='center';X.fillText(won?'✨ MATCH MASTER! ✨':'OUT OF MOVES',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Score: '+score+'   Best: '+best,W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('▶ Tap to play again',W/2,H/2+55);PK.drawTip(X,W,H/2+79)}}
let kUsed=false;document.addEventListener('keydown',e=>{if(e.code.startsWith('Arrow'))kUsed=true},true);C.addEventListener('pointerdown',()=>{kUsed=false},true);
let pState='',last=performance.now();function loop(now){if(document.hidden){last=performance.now();return requestAnimationFrame(loop)}let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);if(state!==pState){pState=state;needDraw=true}if(state==='play'||state==='ready'||particles.length>0)needDraw=true;SKY.tick(state,score);if(needDraw){needDraw=false;draw()}requestAnimationFrame(loop)}
SKY.setup({id:'match-swipe',color:'#a55eea',pauseButton:'tr',buttons:[{label:'↶ Undo',aria:'Undo last swap',fn:undoMove},{label:'💡 Hint',aria:'Show a possible swap',fn:showHint}],
onRestart(){init();state='play'},onExit(){init()},onDiff(){init()},
onHint(){if(state!=='play')return 'Tap to start, then swipe one shape onto a neighbour to make a line of three.';let m=findMove();if(!m)return 'No swap works here; the board will reshuffle.';hintMove=m;
return 'Swap the '+NAMES[grid[m.r][m.c].type]+' in row '+(m.r+1)+', column '+(m.c+1)+' with the '+NAMES[grid[m.r2][m.c2].type]+' '+(m.r2>m.r?'below':'to its right')+' it (now outlined in gold).'},
cheats:{MOREMOVES:['10 extra moves',()=>{cheat.moreMoves=(cheat.moreMoves||0)+10;moves+=10}],SHOWMOVE:['A working swap is always outlined in gold',()=>{cheat.show=true}],DOUBLEPTS:['Every line scores double',()=>{cheat.dbl=true}]}});
const PKC={key:'sky-PK-match-swipe',color:'#a55eea',unit:' pts',goals:[40,60,90],lower:false,mile:[30,60,100],shopTop:false,tips:["Chain matches quickly: each combo line is worth more.","Set up L and T shapes: one swap can trigger two lines.","Moves are the budget: a reshuffled board gives no extra moves."]};
/* ---- arcade progression kit: player level + XP, coins, stars, a date-seeded daily
   challenge, small achievements and buyable skins (one localStorage blob per game) ---- */
const PK=(function(cfg){
const day=()=>new Date().toISOString().slice(0,10);
const SKINS=[['Classic',0],['Sunset',12],['Mint',25],['Galaxy',45]],SKINCOL=['#ffd700','#ff7f50','#2ed573','#a55eea'];
const DEF={best:0,coins:0,xp:0,stars:0,plays:0,wins:0,skins:['Classic'],skin:'Classic',ach:[],daily:'',dailyOK:false,cur:0};
let S=Object.assign({},DEF),hud,tCard,tShop,tst,tstT=0,lastScore=null,lastScene='',lastSave=0,everOver=false,retryB=null;
function seed(s){let h=9;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),387420489)>>>0;return h}
function goal(){return cfg.goals[seed(day())%cfg.goals.length]}
function lvl(){return Math.max(1,Math.floor(Math.sqrt(S.xp/12))+1)}
function load(){try{const v=JSON.parse(localStorage.getItem(cfg.key));if(v&&typeof v==='object')Object.assign(S,v)}catch(e){}
if(S.daily!==day()){S.daily=day();S.dailyOK=false}if(!S.skins.length)S.skins=['Classic']}
function save(){try{localStorage.setItem(cfg.key,JSON.stringify(S))}catch(e){}}
function color(){let i=-1;for(let k=0;k<SKINS.length;k++)if(SKINS[k][0]===S.skin)i=k;return i>=0?SKINCOL[i]:cfg.color}
function tip(){return cfg.tips[S.plays%cfg.tips.length]}
function toast(m){if(!tst){tst=document.createElement('div');tst.id='pkToast';tst.style.cssText='position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:9;background:rgba(10,10,46,.92);border:2px solid '+cfg.color+';color:#fff;font:700 14px "Segoe UI",sans-serif;padding:10px 18px;border-radius:22px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap';document.body.appendChild(tst)}
tst.textContent=m;tst.style.opacity='1';clearTimeout(tstT);tstT=setTimeout(()=>{tst.style.opacity='0'},2600)}
function checkAch(){const list=[];for(let i=0;i<cfg.mile.length;i++)list.push(['m'+i,i,4+i*4,'']);
list.push(['first',-1,4,'First run played'],['rich',-1,6,'Banked 40 coins'],['vet',-1,10,'Reached player level 3']);
for(const it of list){if(S.ach.indexOf(it[0])>=0)continue;let ok=false,label=it[3];
if(it[1]>=0){const m=cfg.mile[it[1]];ok=cfg.lower?(S.best>0&&S.best<=m):S.best>=m;label='Milestone: '+m+cfg.unit+' in one run'}
else if(it[0]==='first')ok=S.plays>=1;else if(it[0]==='rich')ok=S.coins>=40;else ok=lvl()>=3;
if(ok){S.ach.push(it[0]);S.coins+=it[2];S.stars++;toast('\uD83C\uDFC5 '+label+' \u00B7 +'+it[2]+' coins \u00B7 +1 star');SKY.sfx('unlock',{volume:.5})}}}
function awardRun(score,won){if(SKY.cheated){save();return}S.plays++;if(won)S.wins++;
if(!cfg.lower){if(score>S.best)S.best=score}else if(score>0&&(S.best===0||score<S.best))S.best=score;
checkAch();const g=goal();
if(!S.dailyOK&&(cfg.lower?(won&&score>0&&score<=g):score>=g)){S.dailyOK=true;S.coins+=10;S.stars++;toast('\u2600 Daily challenge done! +10 coins \u00B7 +1 star');SKY.sfx('win',{volume:.45})}
const pts=cfg.lower?3:Math.max(1,Math.round(score)),old=lvl();S.xp+=pts+(won?15:0);S.coins+=Math.max(1,Math.round(pts/2))+(won?8:0);
if(lvl()>old){const n=lvl()-old;S.coins+=5*n;toast('\u2B06 Player level '+lvl()+'! +'+(5*n)+' coins');SKY.sfx('levelup',{volume:.5})}
checkAch();save();repaint()}
function el(id,css){const d=document.createElement('div');d.id=id;d.style.cssText=css;document.body.appendChild(d);return d}
function place(){const c=document.querySelector('canvas');if(!c)return;const r=c.getBoundingClientRect();
if(tCard)tCard.style.top=(r.top+6)+'px';if(tShop)tShop.style.top=(cfg.shopTop?r.top+58:r.bottom-124)+'px'}
function buildUI(){hud=el('pkHud','position:fixed;left:10px;bottom:10px;z-index:4;pointer-events:none;font:700 12px "Segoe UI",sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.55;text-align:left;white-space:nowrap');
tCard=el('pkTitle','position:fixed;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;font:700 13px "Segoe UI",sans-serif;color:#fff;background:rgba(8,8,30,.75);border:1px solid '+cfg.color+';border-radius:16px;padding:5px 14px;text-align:center;white-space:nowrap;line-height:1.5');
tShop=el('pkShop','position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px');
SKINS.forEach(s=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',s[0]+' skin');
b.style.cssText='min-width:86px;min-height:40px;border-radius:20px;border:2px solid rgba(255,255,255,.3);background:rgba(10,10,46,.85);color:#fff;font:600 13px "Segoe UI",sans-serif;cursor:pointer;padding:0 10px';
b.addEventListener('pointerdown',e=>e.stopPropagation());
b.addEventListener('click',e=>{e.stopPropagation();
if(S.skins.indexOf(s[0])>=0){S.skin=s[0];SKY.sfx('tap')}
else if(S.coins>=s[1]){S.coins-=s[1];S.skins.push(s[0]);S.skin=s[0];SKY.sfx('unlock',{volume:.5});toast('\u2728 Skin unlocked: '+s[0])}
else{SKY.sfx('error',{volume:.35});toast('Need '+(s[1]-S.coins)+' more coins for '+s[0])}
save();repaint();b.blur()});tShop.appendChild(b)});
window.addEventListener('resize',place);place()}
