<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Maze Runner</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(0,255,255,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,COLS,ROWS,SZ,grid,player,exit,state,timer,mazesComplete,particles=[],scorePopups=[],shakeTime=0,pulseT=0;
let bgGrad,CRECT,needDraw=true;function resize(){W=C.width=Math.min(window.innerWidth-20,480);H=C.height=Math.min(window.innerHeight-20,720);COLS=9;ROWS=11;SZ=Math.floor(Math.min(W/COLS,(H-60)/ROWS));CRECT=C.getBoundingClientRect();bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#0a1a2a');bgGrad.addColorStop(1,'#0a0a1a');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}
function init(){mazesComplete=0;state='ready';particles=[];scorePopups=[];shakeTime=0;pulseT=0}
function loadMaze(){grid=[];for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++)grid[r][c]=1}
// Simple maze generation - carve paths
for(let r=1;r<ROWS-1;r+=2)for(let c=1;c<COLS-1;c+=2){grid[r][c]=0;if(r>1&&c>1){if(Math.random()<.5)grid[r-1][c]=0;else grid[r][c-1]=0}else if(r>1)grid[r-1][c]=0;else if(c>1)grid[r][c-1]=0}
grid[1][1]=0;player={x:1,y:1};exit={x:COLS-2,y:ROWS-2};grid[exit.y][exit.x]=0;timer=30;state='play'}
C.addEventListener('pointerdown',()=>{if(state==='over'||state==='win'){init();return}if(state==='ready')loadMaze()});
document.addEventListener('keydown',e=>{if(e.code==='Space'){if(state==='over'||state==='win'){init();return}if(state==='ready')loadMaze()}
if(state!=='play')return;let nx=player.x,ny=player.y;if(e.code==='ArrowUp'||e.code==='KeyW')ny--;if(e.code==='ArrowDown'||e.code==='KeyS')ny++;if(e.code==='ArrowLeft'||e.code==='KeyA')nx--;if(e.code==='ArrowRight'||e.code==='KeyD')nx++;
if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&grid[ny][nx]===0){player.x=nx;player.y=ny;spawnStepParticles();if(player.x===exit.x&&player.y===exit.y){mazesComplete++;if(mazesComplete>=3){state='win';spawnWinParticles()}else{scorePopups.push({x:exit.x*SZ+SZ/2,y:exit.y*SZ,txt:'MAZE DONE!',life:40,vy:-1.5});loadMaze()}}}});
let tx,ty;C.addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY});
C.addEventListener('pointerup',e=>{if(state!=='play')return;let dx=e.clientX-tx,dy=e.clientY-ty;if(Math.abs(dx)+Math.abs(dy)<15)return;let nx=player.x,ny=player.y;if(Math.abs(dx)>Math.abs(dy)){nx+=dx>0?1:-1}else{ny+=dy>0?1:-1}
if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&grid[ny][nx]===0){player.x=nx;player.y=ny;spawnStepParticles();if(player.x===exit.x&&player.y===exit.y){mazesComplete++;if(mazesComplete>=3){state='win';spawnWinParticles()}else{scorePopups.push({x:exit.x*SZ+SZ/2,y:exit.y*SZ,txt:'MAZE DONE!',life:40,vy:-1.5});loadMaze()}}}});
function spawnStepParticles(){if(particles.length>200)return;for(let i=0;i<3;i++)particles.push({x:player.x*SZ+SZ/2,y:player.y*SZ+SZ/2,vx:(Math.random()-.5)*2,vy:-Math.random()*2,life:10,s:Math.random()*2+1,col:'#0cf'})}
function spawnWinParticles(){if(particles.length>180)return;for(let i=0;i<80;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*10+2),vy:Math.sin(a)*(Math.random()*10+2)-3,life:60,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`})}}
function update(){if(state!=='play')return;pulseT+=.03;timer-=1/60;if(timer<=0)state='over';if(shakeTime>0)shakeTime--;
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life--}prune(particles,pLife);
for(let sp of scorePopups){sp.y+=sp.vy;sp.life--}prune(scorePopups,pLife)}
function draw(){if(!grid){X.clearRect(0,0,W,H);X.fillStyle='#fff';X.font='bold 30px sans-serif';X.textAlign='center';X.fillText('MAZE RUNNER',W/2,H/2-10);X.font='16px sans-serif';X.fillStyle='rgba(255,255,255,.6)';X.fillText('Tap to start',W/2,H/2+24);return}X.save();if(shakeTime>0)X.translate((Math.random()-.5)*shakeTime*2,(Math.random()-.5)*shakeTime*2);
X.clearRect(-15,-15,W+30,H+30);
X.fillStyle=bgGrad;X.fillRect(0,0,W,H);
let offX=(W-COLS*SZ)/2,offY=50;
// Walls with glow
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(grid[r][c]===1){glowAt('#0cf',offX+c*SZ+SZ/2,offY+r*SZ+SZ/2,SZ/2+4+Math.sin(pulseT+c*.5+r*.3)*2);X.fillStyle='#0cf';X.fillRect(offX+c*SZ,offY+r*SZ,SZ,SZ)}}
// Exit
glowAt('#0f0',offX+exit.x*SZ+SZ/2,offY+exit.y*SZ+SZ/2,SZ/2+15+Math.sin(pulseT*3)*5);X.fillStyle='#0f0';X.fillRect(offX+exit.x*SZ+2,offY+exit.y*SZ+2,SZ-4,SZ-4);
// Player
glowAt('#fff',offX+player.x*SZ+SZ/2,offY+player.y*SZ+SZ/2,SZ/3+12);X.fillStyle='#fff';X.beginPath();X.arc(offX+player.x*SZ+SZ/2,offY+player.y*SZ+SZ/2,SZ/3,0,Math.PI*2);X.fill();
// Particles
for(let p of particles){X.globalAlpha=p.life/15;X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,p.s*(p.life/15),0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Score popups
for(let sp of scorePopups){X.globalAlpha=sp.life/40;X.fillStyle='#0f0';X.font='bold 18px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y)}X.globalAlpha=1;
// HUD
X.fillStyle='#fff';X.font='bold 22px "Segoe UI"';X.textAlign='center';X.fillText('Mazes: '+mazesComplete+'/3',W/2,28);
X.textAlign='right';X.fillStyle=timer<10?'#ff4757':'#fff';X.font='bold 18px "Segoe UI"';X.fillText(Math.ceil(timer)+'s',W-10,28);
X.restore();
if(state==='ready'){X.fillStyle='rgba(255,255,255,.85)';X.font='bold 24px "Segoe UI"';X.textAlign='center';X.fillText('MAZE RUNNER',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Swipe or arrow keys to navigate',W/2,H/2+5);X.font='14px "Segoe UI"';X.fillStyle='rgba(255,255,255,.4)';X.fillText('Reach the green exit in 3 mazes',W/2,H/2+35)}
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-20,100);X.fillStyle='#ff4757';X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('TIME UP!',W/2,H/2-20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to retry',W/2,H/2+40)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#0cf',W/2,H/2-20,110);X.fillStyle='#0cf';X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 MAZE MASTER! \u2728',W/2,H/2-20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+40)}}
let pState='';function loop(){if(document.hidden)return requestAnimationFrame(loop);update();if(state!==pState){pState=state;needDraw=true}if(state==='play')needDraw=true;if(needDraw){needDraw=false;draw()}requestAnimationFrame(loop)}init();loop()
</script></body></html>
