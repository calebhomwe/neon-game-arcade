<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,CRECT,needDraw=true;function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);W=Math.min(window.innerWidth-20,420);H=Math.min(window.innerHeight-20,720);C.style.width=W+'px';C.style.height=H+'px';C.width=Math.round(W*dpr);C.height=Math.round(H*dpr);X.setTransform(dpr,0,0,dpr,0,0);CRECT=C.getBoundingClientRect();bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#FFF8DC');bgGrad.addColorStop(.5,'#FFE4B5');bgGrad.addColorStop(1,'#DEB887');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}

const LEVELS=[
{anchor:{x:W/2,y:80},platform:{x:W/2-50,y:H-120,w:100,h:15}},
{anchor:{x:W*.3,y:80},platform:{x:W*.6-50,y:H-120,w:100,h:15}},
{anchor:{x:W*.5,y:80},platform:{x:W/2-50,y:H-120,w:100,h:15}}
];
function init(){currentLevel=0;fell=false;levelComplete=false;particles=[];scorePopups=[];shakeTime=0;loadLevel()}

C.addEventListener('pointerdown',e=>{if(state==='ready'){state='play';return}if(currentLevel>=LEVELS.length){currentLevel=0;loadLevel();state='play';return}if(ball.falling&&fell){loadLevel();return}if(ball.falling&&levelComplete){currentLevel++;if(currentLevel>=LEVELS.length){state='win'}else{loadLevel()};return}

if(shakeTime>0)shakeTime-=dt;

function draw(){X.save();if(shakeTime>0)X.translate((Math.random()-.5)*shakeTime*2,(Math.random()-.5)*shakeTime*2);

(()=>{

function restartRun(){if(typeof init==='function')init();startRun();}
function exitToTitle(){if(typeof init==='function')init();hideResult();showTitle(false);applyIntervalScale();needDraw=true;}
function genericBoost(){let changed=false;if(typeof lives==='number'){lives=Math.min(lives+1,9);changed=true;}if(typeof timeLeft==='number'){timeLeft+=10;changed=true;}if(typeof timer==='number'){timer+=8;changed=true;}if(typeof score==='number'){score+=25;changed=true;}if(typeof targetScore==='number'){targetScore=Math.max(20,targetScore-20);changed=true;}if(typeof targetKills==='number'){targetKills=Math.max(1,targetKills-2);changed=true;}return changed;}
function applyBoost(){let changed=genericBoost();if(typeof currentLevel==='number'){currentLevel=Math.min(currentLevel+1,LEVELS.length-1);loadLevel();state='play';};changed=true;if(!changed&&typeof score==='number')score+=10;needDraw=true;return {ok:true,message:CODE_LIST[2].effect};}
function onHint(){if(state!=="play") return "Start the level, then cut only when the ball is over the star.";
if(state==="win") return "You cleared every rope setup. Replay for a cleaner run.";
if(fell) return "Retry and wait until the ball swings directly above the star before you slice.";

const lv=LEVELS[Math.min(currentLevel,LEVELS.length-1)], target=lv.platform.x+lv.platform.w/2;

e-ui"><div class="card"><div id="sky-arcade-info"></div><div class="diff"><button type="button" data-mode="easy">Easy</button><button type="button" data-mode="normal">Normal</button><button type="button" data-mode="hard">Hard</button></div><button id="sky-arcade-play" type="button">Play</button><p class="sky-mini">Keyboard: ${KEYBOARD}</p><p class="sky-mini">Touch: ${TOUCH}</p></div></div><div id="sky-arcade-results" hidden><div class="card"><h2 id="sky-arcade-result-title"></h2><p id="sky-arcade-result-score"></p><p id="sky-arcade-result-best"></p><button id="sky-arcade-replay" type="button">Play again</button><p class="sky-mini">Tip: ${TIPS[1]||TIPS[0]||''}</p></div></div>`;
document.body.appendChild(shell);

if(typeof update==='function'){

  };
}
const monitor=()=>{const scene=sceneName();if(scene==='over'&&!reportedOver){reportedOver=true;showResult();}if(scene==='play')reportedOver=false;requestAnimationFrame(monitor);};requestAnimationFrame(monitor);
if(window.ArcadeSDK) ArcadeSDK.init({onRestart:restartRun,onExit:exitToTitle,onTutorial:()=>showTitle(true),onHint:onHint,cheats:CODE_LIST,onCheat:(code)=>{if(code==='PARTY'){party=true;codesBadge.hidden=false;needDraw=true;return {ok:true,message:CODE_LIST[0].effect};}if(code==='CHILL'){chill=true;codesBadge.hidden=false;applyIntervalScale();needDraw=true;return {ok:true,message:CODE_LIST[1].effect};}if(code==='BOOST'){codesBadge.hidden=false;return applyBoost();}},pauseButton:PAUSE_BUTTON});
showTitle(false);
})();
</script>
