<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stack Tower</title><script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script><script src="sky-arcade.js"></script><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(165,94,234,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,needDraw=true;function resize(){W=Math.min(window.innerWidth-20,420);H=Math.min(window.innerHeight-20,720);SKY.fit(C,X,W,H);bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#1a1025');bgGrad.addColorStop(1,'#0f0a18');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}
let blocks,blockW,blockH,camY,score,state,dir,speed,lastCol,particles=[],scorePopups=[],perfectCount=0,camTargetY=0,shakeTime=0,fallingPieces=[];
const COLORS=['#ff4757','#ffa502','#2ed573','#1e90ff','#a55eea','#ff6b81','#00d2d3','#ff9ff3'];
let best=0,cheat={wide:false,slow:false,guide:false,rainbow:false};
function init(){blockW=W*.65;blockH=24;camY=0;camTargetY=0;score=0;perfectCount=0;state='ready';dir=1;speed=SKY.pick(2.6,3.5,4.4);best=SKY.best();lastCol=0;shakeTime=0;particles=[];scorePopups=[];fallingPieces=[];blocks=[{x:0,w:blockW,h:blockH,y:H-60,col:COLORS[0]}];nextBlock()}
function nextBlock(){let b=blocks[blocks.length-1];let nx=b.x+(Math.random()>.5?60:-60);blockW=cheat.wide?W*.65:b.w;let ci=(lastCol+1)%COLORS.length;lastCol=ci;blocks.push({x:nx,w:blockW,h:blockH,y:b.y-blockH,col:COLORS[ci],animIn:1})}
C.addEventListener('pointerdown',()=>{if(state==='over'||state==='win'){init();return}if(state==='ready'){state='play';return}if(state!=='play')return;dropBlock()});
document.addEventListener('keydown',e=>{if(e.code==='Space'){if(state==='over'||state==='win')init();else if(state==='ready')state='play';else if(state==='play')dropBlock()}});
function dropBlock(){let top=blocks[blocks.length-1],prev=blocks[blocks.length-2];top.animIn=0;
let overlap=Math.min(top.x+top.w,prev.x+prev.w)-Math.max(top.x,prev.x);
if(overlap<=0){state='over';shakeTime=SKY.shake(10);spawnFallParticles(top);SKY.sfx('lose');if(SKY.saveBest(score))best=score;return}
let perfect=Math.abs(overlap-top.w)<8;
let newX=Math.max(top.x,prev.x);top.w=overlap;top.y=prev.y-blockH;blockW=top.w;score++;
SKY.sfx(perfect?'combo':'place');if(perfect){perfectCount++;spawnPerfectParticles(newX+overlap/2,top.y);scorePopups.push({x:newX+overlap/2,y:top.y,txt:'PERFECT! x'+perfectCount,life:40,vy:-1.5});speed=Math.min(speed+.3,SKY.pick(5,99,99))}else{perfectCount=0;scorePopups.push({x:newX+overlap/2,y:top.y,txt:'+'+score,life:30,vy:-1.5})}
if(score>=20){state='win';spawnWinParticles();SKY.sfx('win');if(SKY.saveBest(score))best=score;return}
let cutW=top.w-overlap;if(cutW>5){let cutX=top.x<prev.x?top.x:top.x+top.w-cutW;fallingPieces.push({x:cutX,y:top.y,w:cutW,h:blockH,col:top.col,vy:0,vx:(Math.random()-.5)*3,rot:0,rotSpd:(Math.random()-.5)*.2})}
nextBlock()}
function spawnPerfectParticles(x,y){if(particles.length>280)return;for(let i=0;i<20;i++){let a=Math.PI*2/20*i;particles.push({x,y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,life:30,s:Math.random()*4+2,col:'#ffd700'})}}
function spawnFallParticles(block){for(let i=0;i<8;i++)particles.push({x:block.x+Math.random()*block.w,y:block.y+blockH/2,vx:(Math.random()-.5)*4,vy:Math.random()*3+1,life:25,s:Math.random()*3+2,col:block.col})}
function spawnWinParticles(){if(particles.length>300)return;for(let i=0;i<80;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*10+2),vy:Math.sin(a)*(Math.random()*10+2)-3,life:60,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`})}}
function update(dt){if(state!=='play')return;
if(shakeTime>0)shakeTime--;else{let sx=(Math.random()-.5)*shakeTime;let sy=(Math.random()-.5)*shakeTime}
let top=blocks[blocks.length-1];if(top&&top.animIn!==0){top.animIn=Math.max(0,top.animIn-.1*dt)}
if(top&&top.animIn<=0){top.x+=dir*speed*(cheat.slow?.5:1)*dt;if(top.x+blockW>W){dir=-1}else if(top.x<0){dir=1}}
if(blocks.length>12){let base=blocks[Math.max(0,blocks.length-10)];camTargetY=base.y-H+120;camY+=(camTargetY-camY)*.1;for(let b of blocks)b.y-=base.y-(H-60)}
for(let fp of fallingPieces){fp.vy+=.5;fp.y+=fp.vy;fp.x+=fp.vx;fp.rot+=fp.rotSpd}prune(fallingPieces,fp=>fp.y<H+50);
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life--}prune(particles,pLife);
for(let sp of scorePopups){sp.y+=sp.vy;sp.life--}prune(scorePopups,pLife)}
function draw(){X.save();let sx=shakeTime?(Math.random()-.5)*shakeTime*1.5:0,sy=shakeTime?(Math.random()-.5)*shakeTime*1.5:0;X.translate(sx,sy);
X.clearRect(-10,-10,W+20,H+20);
X.fillStyle=bgGrad;X.fillRect(0,0,W,H);
// Background grid lines
X.strokeStyle='rgba(165,94,234,.05)';X.lineWidth=1;for(let y=0;y<H;y+=40){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
let offY=-camY;
// Falling pieces
for(let fp of fallingPieces){X.save();X.translate(fp.x+fp.w/2,fp.y+fp.h/2);X.rotate(fp.rot);X.globalAlpha=.7;X.fillStyle=fp.col;X.fillRect(-fp.w/2,-fp.h/2,fp.w,fp.h);X.restore()}X.globalAlpha=1;
// Blocks
for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];let by=b.y+offY;if(by<-50||by>H+50)continue;
let shade=b.col;glowAt(shade,b.x+b.w/2,by+b.h/2,b.w/2+10);
if(cheat.rainbow)shade='hsl('+((i*25+performance.now()/10)%360)+',90%,60%)';X.fillStyle=shade;
X.beginPath();X.roundRect(b.x,by,b.w,b.h,3);X.fill();
// Top highlight
X.fillStyle='rgba(255,255,255,.25)';X.fillRect(b.x+1,by+1,b.w-2,4);
// Side shadow
X.fillStyle='rgba(0,0,0,.15)';X.fillRect(b.x+b.w-3,by,3,b.h)}
if(cheat.guide&&state==='play'&&blocks.length>1){let pv=blocks[blocks.length-2];X.setLineDash([6,6]);X.strokeStyle='rgba(255,255,255,.55)';X.lineWidth=2;X.beginPath();X.moveTo(pv.x,0);X.lineTo(pv.x,pv.y+offY);X.moveTo(pv.x+pv.w,0);X.lineTo(pv.x+pv.w,pv.y+offY);X.stroke();X.setLineDash([])}
// Perfect streak indicator
if(perfectCount>0){glowAt('#ffd700',W-45,35,35);X.fillStyle='#ffd700';X.font='bold 18px "Segoe UI"';X.textAlign='right';X.fillText('\u2B50 x'+perfectCount,W-15,35)}
// Score
X.fillStyle='#fff';X.font='bold 24px "Segoe UI"';X.textAlign='center';X.fillText(score,W/2,35);X.font='bold 14px "Segoe UI"';X.textAlign='left';X.fillStyle='rgba(255,255,255,.7)';X.fillText('BEST '+best,14,30);
// Score popups
for(let sp of scorePopups){X.globalAlpha=sp.life/40;X.fillStyle=sp.txt.includes('PERFECT')?'#ffd700':'#fff';X.font=sp.txt.includes('PERFECT')?'bold 18px "Segoe UI"':'bold 16px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y+offY)}X.globalAlpha=1;
// Particles
for(let p of particles){let pr=p.s*(p.life/60);X.globalAlpha=p.life/60;glowAt(p.col,p.x,p.y+offY,pr+6);X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y+offY,pr,0,Math.PI*2);X.fill()}X.globalAlpha=1;
X.restore();
if(state==='ready'&&SKY.tut)SKY.drawTut(X,W,H,{title:'STACK TOWER',color:'#a55eea',gesture:'tap',steps:['A block slides left and right above the tower.','Tap (or press Space) to drop it.','Only the part over the stack stays, so the next block is narrower.','Land 20 blocks to finish the tower.']});
else if(state==='ready'){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,H);glowAt('#a55eea',W/2,H/2-30,110);X.fillStyle='#a55eea';X.font='bold 26px "Segoe UI"';X.textAlign='center';X.fillText('STACK TOWER',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Tap to drop the moving block',W/2,H/2+5);X.fillStyle='rgba(255,255,255,.5)';X.fillText('\u25B6 Tap to start',W/2,H/2+35)}
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-20,100);X.fillStyle='#ff4757';X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('MISSED!',W/2,H/2-20);X.fillStyle='#fff';X.font='24px "Segoe UI"';X.fillText('Blocks: '+score+'   Best: '+best,W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to retry',W/2,H/2+55)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#a55eea',W/2,H/2-20,110);X.fillStyle='#a55eea';X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 TOWER COMPLETE! \u2728',W/2,H/2-20);X.fillStyle='#fff';X.font='24px "Segoe UI"';X.fillText('Score: '+score+' / 20   Best: '+best,W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+55)}}
let pState='',lastT=performance.now();function loop(t){if(document.hidden){lastT=performance.now();return requestAnimationFrame(loop)}let dt=Math.min((t-lastT)/1000,.05)*60;lastT=t;update(dt);if(state!==pState){pState=state;needDraw=true}if(state==='play'||state==='ready')needDraw=true;SKY.tick(state,score);if(needDraw){needDraw=false;draw()}requestAnimationFrame(loop)}SKY.setup({id:'stack-tower',color:'#a55eea',pauseButton:'tl',
onRestart(){init();state='play'},onExit(){init()},onDiff(){init()},
onHint(){if(state!=='play')return 'Tap to start, then tap again to drop the first block.';let t=blocks[blocks.length-1],p=blocks[blocks.length-2],d=Math.round(t.x-p.x);
return Math.abs(d)<8?'The block is lined up right now: drop it for a PERFECT.':'The block is '+Math.abs(d)+' px to the '+(d>0?'right':'left')+' of the stack and moving '+(dir>0?'right':'left')+'. Drop it when its edges meet the stack edges.'},
cheats:{WIDEBLOCK:['Every new block comes back at full width',()=>{cheat.wide=true}],SLOWMO:['Blocks slide at half speed',()=>{cheat.slow=true}],GUIDELINE:['Dashed lines mark the stack edges',()=>{cheat.guide=true}],RAINBOW:['Rainbow tower colours',()=>{cheat.rainbow=true}]}});
init();requestAnimationFrame(loop)
const PKC={key:'sky-PK-stack-tower',color:'#feca57',unit:' blocks',goals:[15, 22, 30],lower:false,mile:[8, 15, 25],shopTop:false,tips:['Tap when the block is dead-centre; the overhang is sawn off.','The swing speeds up as you grow — the first ten are your margin.','A PERFECT chain widens your next block — keep them coming.']};
/* ---- arcade progression kit: player level + XP, coins, stars, a date-seeded daily
   challenge, small achievements and buyable skins (one localStorage blob per game) ---- */
const PK=(function(cfg){
const day=()=>new Date().toISOString().slice(0,10);
const SKINS=[['Classic',0],['Sunset',12],['Mint',25],['Galaxy',45]],SKINCOL=['#ffd700','#ff7f50','#2ed573','#a55eea'];
const DEF={best:0,coins:0,xp:0,stars:0,plays:0,wins:0,skins:['Classic'],skin:'Classic',ach:[],daily:'',dailyOK:false,cur:0};
let S=Object.assign({},DEF),hud,tCard,tShop,tst,tstT=0,lastScore=null,lastScene='',lastSave=0,everOver=false,retryB=null;
function seed(s){let h=9;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),387420489)>>>0;return h}
function goal(){return cfg.goals[seed(day())%cfg.goals.length]}
function lvl(){return Math.max(1,Math.floor(Math.sqrt(S.xp/12))+1)}
function load(){try{const v=JSON.parse(localStorage.getItem(cfg.key));if(v&&typeof v==='object')Object.assign(S,v)}catch(e){}
if(S.daily!==day()){S.daily=day();S.dailyOK=false}if(!S.skins.length)S.skins=['Classic']}
function save(){try{localStorage.setItem(cfg.key,JSON.stringify(S))}catch(e){}}
function color(){let i=-1;for(let k=0;k<SKINS.length;k++)if(SKINS[k][0]===S.skin)i=k;return i>=0?SKINCOL[i]:cfg.color}
function tip(){return cfg.tips[S.plays%cfg.tips.length]}
function toast(m){if(!tst){tst=document.createElement('div');tst.id='pkToast';tst.style.cssText='position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:9;background:rgba(10,10,46,.92);border:2px solid '+cfg.color+';color:#fff;font:700 14px "Segoe UI",sans-serif;padding:10px 18px;border-radius:22px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap';document.body.appendChild(tst)}
tst.textContent=m;tst.style.opacity='1';clearTimeout(tstT);tstT=setTimeout(()=>{tst.style.opacity='0'},2600)}
function checkAch(){const list=[];for(let i=0;i<cfg.mile.length;i++)list.push(['m'+i,i,4+i*4,'']);
list.push(['first',-1,4,'First run played'],['rich',-1,6,'Banked 40 coins'],['vet',-1,10,'Reached player level 3']);
for(const it of list){if(S.ach.indexOf(it[0])>=0)continue;let ok=false,label=it[3];
if(it[1]>=0){const m=cfg.mile[it[1]];ok=cfg.lower?(S.best>0&&S.best<=m):S.best>=m;label='Milestone: '+m+cfg.unit+' in one run'}
else if(it[0]==='first')ok=S.plays>=1;else if(it[0]==='rich')ok=S.coins>=40;else ok=lvl()>=3;
if(ok){S.ach.push(it[0]);S.coins+=it[2];S.stars++;toast('\uD83C\uDFC5 '+label+' \u00B7 +'+it[2]+' coins \u00B7 +1 star');SKY.sfx('unlock',{volume:.5})}}}
function awardRun(score,won){if(SKY.cheated){save();return}S.plays++;if(won)S.wins++;
if(!cfg.lower){if(score>S.best)S.best=score}else if(score>0&&(S.best===0||score<S.best))S.best=score;
checkAch();const g=goal();
if(!S.dailyOK&&(cfg.lower?(won&&score>0&&score<=g):score>=g)){S.dailyOK=true;S.coins+=10;S.stars++;toast('\u2600 Daily challenge done! +10 coins \u00B7 +1 star');SKY.sfx('win',{volume:.45})}
const pts=cfg.lower?3:Math.max(1,Math.round(score)),old=lvl();S.xp+=pts+(won?15:0);S.coins+=Math.max(1,Math.round(pts/2))+(won?8:0);
if(lvl()>old){const n=lvl()-old;S.coins+=5*n;toast('\u2B06 Player level '+lvl()+'! +'+(5*n)+' coins');SKY.sfx('levelup',{volume:.5})}
checkAch();save();repaint()}
function el(id,css){const d=document.createElement('div');d.id=id;d.style.cssText=css;document.body.appendChild(d);return d}
function place(){const c=document.querySelector('canvas');if(!c)return;const r=c.getBoundingClientRect();
if(tCard)tCard.style.top=(r.top+6)+'px';if(tShop)tShop.style.top=(cfg.shopTop?r.top+58:r.bottom-124)+'px'}
function buildUI(){hud=el('pkHud','position:fixed;left:10px;bottom:10px;z-index:4;pointer-events:none;font:700 12px "Segoe UI",sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.55;text-align:left;white-space:nowrap');
tCard=el('pkTitle','position:fixed;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;font:700 13px "Segoe UI",sans-serif;color:#fff;background:rgba(8,8,30,.75);border:1px solid '+cfg.color+';border-radius:16px;padding:5px 14px;text-align:center;white-space:nowrap;line-height:1.5');
tShop=el('pkShop','position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px');
SKINS.forEach(s=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',s[0]+' skin');
b.style.cssText='min-width:86px;min-height:40px;border-radius:20px;border:2px solid rgba(255,255,255,.3);background:rgba(10,10,46,.85);color:#fff;font:600 13px "Segoe UI",sans-serif;cursor:pointer;padding:0 10px';
b.addEventListener('pointerdown',e=>e.stopPropagation());
b.addEventListener('click',e=>{e.stopPropagation();
if(S.skins.indexOf(s[0])>=0){S.skin=s[0];SKY.sfx('tap')}
else if(S.coins>=s[1]){S.coins-=s[1];S.skins.push(s[0]);S.skin=s[0];SKY.sfx('unlock',{volume:.5});toast('\u2728 Skin unlocked: '+s[0])}
else{SKY.sfx('error',{volume:.35});toast('Need '+(s[1]-S.coins)+' more coins for '+s[0])}
save();repaint();b.blur()});tShop.appendChild(b)});
window.addEventListener('resize',place);place()}
function repaint(){const l=lvl(),a=12*(l-1)*(l-1),b=12*l*l,f=Math.max(1,Math.min(5,Math.round(5*Math.min(1,(S.xp-a)/Math.max(1,b-a))))),g=goal();
if(hud)hud.innerHTML='LVL '+l+' '+'\u2588'.repeat(f)+'\u2591'.repeat(5-f)+' \u00B7 coins '+S.coins+' \u00B7 \u2605 '+S.stars+' stars<br>Daily: '+(S.dailyOK?'done today \u2713':'reach '+g+cfg.unit+' \u00B7 +10 coins');
if(tCard)tCard.innerHTML='Best '+S.best+cfg.unit+' \u00B7 LVL '+l+' \u00B7 \u2605 '+S.stars+' \u00B7 coins '+S.coins+'<br>'+(S.dailyOK?'Daily challenge \u2713 done today':'\u2600 Daily: reach '+g+cfg.unit+' \u2192 +10 coins');
if(tShop)for(let i=0;i<tShop.children.length;i++){const bd=tShop.children[i],s=SKINS[i],own=S.skins.indexOf(s[0])>=0;
bd.textContent=own?(S.skin===s[0]?s[0]+' \u2713':s[0]):s[0]+' \u00B7 '+s[1]+' coins';
bd.style.opacity=own||S.coins>=s[1]?'1':'.55';bd.style.borderColor=S.skin===s[0]?cfg.color:'rgba(255,255,255,.3)'}}
function drawTip(X,w,y){X.save();X.globalAlpha=.85;X.fillStyle='#fff';X.font='13px "Segoe UI",sans-serif';X.textAlign='center';X.fillText('Tip: '+tip(),w/2,y);X.restore()}
const tick0=SKY.tick;
SKY.tick=function(state,score){tick0(state,score);
const sc=state==='ready'?'title':(state==='over'||state==='win'||state==='done'?'over':'play');
if(sc!==lastScene){if(lastScene==='play'&&sc==='over'){awardRun(score||0,state==='win'||state==='done');everOver=true;}lastScene=sc;
if(tCard)tCard.style.display=sc==='title'?'block':'none';if(tShop)tShop.style.display=(sc==='title'&&!everOver)?'flex':'none';if(retryB)retryB.style.display=sc==='over'?'block':'none'}
if(sc==='play'&&typeof score==='number'&&score!==lastScore){lastScore=score;S.cur=score;
if(!S.dailyOK&&!cfg.lower&&score>=goal()){S.dailyOK=true;S.coins+=10;S.stars++;toast('\u2600 Daily challenge done! +10 coins \u00B7 +1 star');SKY.sfx('win',{volume:.45});repaint()}
const n=performance.now();if(n-lastSave>1500){lastSave=n;save()}}};
retryB=document.createElement('button');retryB.type='button';retryB.id='pkRetry';retryB.textContent='▶ Retry';
retryB.style.cssText='position:fixed;left:50%;top:62%;transform:translateX(-50%);z-index:7;display:none;min-width:130px;min-height:48px;border-radius:24px;border:2px solid '+cfg.color+';background:rgba(10,10,46,.92);color:#fff;font:900 16px "Segoe UI",sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5)';
retryB.addEventListener('click',function(e){e.stopPropagation();retryTap();});document.body.appendChild(retryB);
function retryTap(){var c=document.querySelector('canvas');if(!c)return;var r=c.getBoundingClientRect();var x=r.left+r.width/2,y=r.top+r.height*0.42;
['pointerdown','pointerup'].forEach(function(t){try{c.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:1,pointerType:'touch',isPrimary:true}))}catch(e){}});
setTimeout(function(){['pointerdown','pointerup'].forEach(function(t){try{c.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:1,pointerType:'touch',isPrimary:true}))}catch(e){}})},320);}
load();buildUI();repaint();
