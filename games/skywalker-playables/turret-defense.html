<!DOCTYPE html>
<html lang="en"><head><script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Turret Defense</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(255,50,50,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,needDraw=true;function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);W=Math.min(window.innerWidth-20,420);H=Math.min(window.innerHeight-20,720);C.style.width=W+'px';C.style.height=H+'px';C.width=Math.round(W*dpr);C.height=Math.round(H*dpr);X.setTransform(dpr,0,0,dpr,0,0);bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#030308');bgGrad.addColorStop(1,'#080818');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}
let turret,enemies,bullets,particles,wave,waveTimer,kills,targetKills,state,lives,stars=[],mouseAngle=0,mouseX=W/2,mouseY=H/2,shakeTime=0,combo=0,comboTimer=0,waveText='',waveTextTime=0,muzzleFlash=0;
function init(){turret={x:W/2,y:H-60,angle:0};enemies=[];bullets=[];particles=[];wave=1;waveTimer=0;kills=0;targetKills=8;lives=3;state='ready';mouseAngle=0;combo=0;comboTimer=0;waveText='WAVE 1';waveTextTime=60;muzzleFlash=0;makeStars()}
function makeStars(){stars=[];for(let i=0;i<100;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+.3,t:Math.random()*Math.PI*2,nb:Math.random()*1000|0})}
C.addEventListener('pointermove',e=>{let r=C.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;mouseAngle=Math.atan2(mouseY-turret.y,mouseX-turret.x)});
C.addEventListener('pointerdown',()=>{if(state==='over'||state==='win'){init();return}if(state==='ready'){state='play';return}if(state==='play')shoot()});
document.addEventListener('keydown',e=>{if(e.code==='Space'){if(state==='over'||state==='win')init();else if(state==='ready')state='play';else shoot()}});
function shoot(){muzzleFlash=6;let speed=12;bullets.push({x:turret.x,y:turret.y,vx:Math.cos(mouseAngle)*speed,vy:Math.sin(mouseAngle)*speed,life:100,trail:[]})}
function spawnEnemy(){let side=Math.floor(Math.random()*4),ex,ey,spd,hp,col;
if(side===0){ex=Math.random()*W;ey=-25}else if(side===1){ex=W+25;ey=Math.random()*H*.4}else if(side===2){ex=Math.random()*W;ey=H*.25+Math.random()*40}else{ex=-25;ey=Math.random()*H*.4}

function update(dt){if(state!=='play')return;let s=dt*60;waveTimer+=s;if(shakeTime>0)shakeTime-=s;if(comboTimer>0)comboTimer-=s;else combo=0;if(waveTextTime>0)waveTextTime-=s;if(muzzleFlash>0)muzzleFlash-=s;
let spawnInterval=Math.max(25,80-wave*4);if(waveTimer>=spawnInterval){waveTimer-=spawnInterval;spawnEnemy()}
for(let e of enemies){e.x+=e.vx*s;e.y+=e.vy*s}
for(let b of bullets){b.trail.push({x:b.x,y:b.y,life:8});for(let t of b.trail)t.life-=s;prune(b.trail,t=>t.life>0);b.x+=b.vx*s;b.y+=b.vy*s;b.life-=s;
for(let e of enemies){if(e.hp<=0)continue;let dx=b.x-e.x,dy=b.y-e.y;if(dx*dx+dy*dy<(e.rad+4)*(e.rad+4)){b.life=0;e.hp--;
if(particles.length<300)for(let i=0;i<5;i++)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:15,s:Math.random()*3+1,col:'#0ff'});
if(e.hp<=0){kills++;combo++;comboTimer=60;if(particles.length<300)for(let i=0;i<15;i++){let a=Math.PI*2/15*i;particles.push({x:e.x,y:e.y,vx:Math.cos(a)*(Math.random()*5+2),vy:Math.sin(a)*(Math.random()*5+2),life:30,s:Math.random()*4+2,col:e.col})}shakeTime=6;
if(kills>=targetKills){wave++;kills=0;targetKills=8+wave*2;waveTimer=0;enemies=[];waveText='WAVE '+wave;waveTextTime=80;if(wave>10){state='win'}}}}}
prune(enemies,e=>{if(e.hp<=0)return false;let d=Math.hypot(e.x-turret.x,e.y-turret.y);if(d<=60){lives--;shakeTime=10;if(lives<=0)state='over';return false}return true});prune(bullets,b=>b.life>0);
for(let p of particles){p.x+=p.vx*s;p.y+=p.vy*s;p.vx*=Math.pow(.96,s);p.vy*=Math.pow(.96,s);p.life-=s}prune(particles,pLife);
let closest=null,minD=Infinity;for(let e of enemies){let d=Math.hypot(e.x-turret.x,e.y-turret.y);if(d<minD){minD=d;closest=e}}
if(closest)turret.angle+=(Math.atan2(closest.y-turret.y,closest.x-turret.x)-turret.angle)*(1-Math.pow(1-.15,s));

function draw(){X.save();if(shakeTime>0){X.translate((Math.random()-.5)*shakeTime*1.5,(Math.random()-.5)*shakeTime*1.5)}

glowAt('#0ff',b.x,b.y,15);X.fillStyle='#0ff';X.beginPath();X.arc(b.x,b.y,3,0,Math.PI*2);X.fill()}

X.beginPath();for(let i=0;i<6;i++){let a=Math.PI/3*i;X.lineTo(Math.cos(a)*e.rad,Math.sin(a)*e.rad)}X.closePath();X.fill();
X.fillStyle='rgba(0,0,0,.3)';X.beginPath();for(let i=0;i<6;i++){let a=Math.PI/3*i+.3;X.lineTo(Math.cos(a)*e.rad*.5,Math.sin(a)*e.rad*.5)}X.closePath();X.fill();

X.fillStyle='#333';X.beginPath();X.arc(turret.x,turret.y,18,0,Math.PI*2);X.fill();

X.fillStyle='#444';X.fillRect(0,-5,30,10);X.fillStyle='#555';X.fillRect(26,-7,8,14);X.restore();

glowAt('#0f0',turret.x,turret.y,13);X.fillStyle='#0f0';X.beginPath();X.arc(turret.x,turret.y,5,0,Math.PI*2);X.fill();

// HUD
X.fillStyle='#fff';X.font='bold 18px "Segoe UI"';X.textAlign='left';X.fillText('Wave '+wave+'/10',12,28);X.textAlign='right';X.fillText(kills+'/'+targetKills,W-12,28);X.textAlign='center';X.fillStyle='#ff4757';X.fillText('\u2764 '+lives,W/2,28);X.fillStyle='#fff';

if(waveTextTime>0){X.globalAlpha=waveTextTime/80;glowAt('#ffffff',W/2,H/2,120);X.fillStyle='#fff';X.font='bold 36px "Segoe UI"';X.textAlign='center';X.fillText(waveText,W/2,H/2);X.globalAlpha=1}
X.restore();
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#0f0',W/2,H/2-20,110);X.fillStyle='#0f0';X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 VICTORY! \u2728',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('All 10 waves survived!',W/2,H/2+25);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Click to play again',W/2,H/2+55)}
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-20,100);X.fillStyle='#ff4757';X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('OVERRUN!',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Reached Wave '+wave,W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Click to retry',W/2,H/2+50)}
if(state==='ready'){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-30,110);X.fillStyle='#ff4757';X.font='bold 26px "Segoe UI"';X.textAlign='center';X.fillText('TURRET DEFENSE',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Click to shoot. Do not let enemies reach you!',W/2,H/2+5);X.fillStyle='rgba(255,255,255,.5)';X.fillText('\u25B6 Click to start',W/2,H/2+35)}}

</script><script>
(()=>{

const read=(k,f)=>{try{const v=localStorage.getItem(k);return v==null?f:v;}catch(e){return f;}};
const readNum=(k,f=0)=>{const v=parseInt(read(k,''),10);return Number.isFinite(v)?v:f;};
let best=readNum(BEST_KEY,0),difficulty=read(DIFF_KEY,'normal')||'normal',titleOpen=false,resultOpen=false,reportedOver=false,party=false,chill=false,frameAcc=0;

if(typeof saveBest==='function'){const keepSaveBest=saveBest;saveBest=function(){if(window.ArcadeSDK&&ArcadeSDK.cheated)return;return keepSaveBest();};}

function sceneName(){

function hideTitle(){titleOpen=false;overlay.hidden=true;}

function showTitle(forceTutorial){titleOpen=true;resultOpen=false;overlay.hidden=false;results.hidden=true;const first=read(SEEN_KEY,'0')!=='1';titleInfo.innerHTML='<h1>'+TITLE+'</h1><p>'+(forceTutorial||first?'Learn it in three quick steps and jump in.':'Back at the title. Pick a difficulty and play again.')+'</p><ol>'+HOWTO.map(s=>'<li>'+s+'</li>').join('')+'</ol><div class="sky-mini">💡 '+(TIPS[0]||'')+'</div>';setDiffButtons();postScene();}
function showResult(){resultOpen=true;persistBest();resultTitle.textContent=(state==='win'||(typeof won==='boolean'&&won))?'Run complete!':'Run over';resultScore.textContent='Score: '+scoreValue();resultBest.textContent='Best: '+best;results.hidden=false;codesBadge.hidden=!(window.ArcadeSDK&&ArcadeSDK.cheated);postScene();}

function genericBoost(){let changed=false;if(typeof lives==='number'){lives=Math.min(lives+1,9);changed=true;}if(typeof timeLeft==='number'){timeLeft+=10;changed=true;}if(typeof timer==='number'){timer+=8;changed=true;}if(typeof score==='number'){score+=25;changed=true;}if(typeof targetScore==='number'){targetScore=Math.max(20,targetScore-20);changed=true;}if(typeof targetKills==='number'){targetKills=Math.max(1,targetKills-2);changed=true;}return changed;}
function applyBoost(){let changed=genericBoost();if(!changed&&typeof score==='number')score+=10;needDraw=true;return {ok:true,message:CODE_LIST[2].effect};}

const shell=document.createElement('div');
shell.innerHTML=`<style>#sky-codes-on{position:fixed;top:12px;left:12px;z-index:9998;background:#ffd257;color:#111;padding:6px 12px;border-radius:999px;font:900 12px/1 'Segoe UI',system-ui,sans-serif;letter-spacing:.12em}#sky-codes-on[hidden]{display:none}#sky-arcade-ui,#sky-arcade-results{position:fixed;inset:0;display:grid;place-items:center;padding:18px;z-index:9997}#sky-arcade-ui{background:rgba(4,8,18,.62);backdrop-filter:blur(6px)}#sky-arcade-results{background:rgba(4,8,18,.48)}#sky-arcade-ui[hidden],#sky-arcade-results[hidden]{display:none}#sky-arcade-ui .card,#sky-arcade-results .card{width:min(100%,420px);border-radius:22px;padding:22px 20px 18px;background:linear-gradient(180deg,rgba(12,18,42,.96),rgba(7,10,26,.96));border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 55px rgba(0,0,0,.35);font-family:'Segoe UI',system-ui,sans-serif;color:#fff}#sky-arcade-ui h1,#sky-arcade-results h2{margin:0 0 8px;font-size:clamp(28px,8vw,38px);line-height:.95}#sky-arcade-ui p,#sky-arcade-results p,#sky-arcade-ui li{font-size:14px;line-height:1.45;color:rgba(255,255,255,.82)}#sky-arcade-ui ol{padding-left:20px;margin:12px 0}#sky-arcade-ui button,#sky-arcade-results button{appearance:none;border:0;border-radius:16px;min-height:44px;padding:12px 16px;font:800 16px 'Segoe UI',system-ui,sans-serif;cursor:pointer}#sky-arcade-play,#sky-arcade-replay{width:100%;background:linear-gradient(135deg,#43ddff,#1c9ee8);color:#04122b;box-shadow:0 10px 22px rgba(0,180,255,.28)}#sky-arcade-ui .sky-mini,#sky-arcade-results .sky-mini{font-size:13px;color:rgba(255,255,255,.68)}#sky-arcade-ui .diff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}#sky-arcade-ui .diff button{background:rgba(255,255,255,.08);color:#dfe7ff;border:1px solid rgba(255,255,255,.12)}#sky-arcade-ui .diff button.active{background:#ffd257;color:#16171d}@media (prefers-reduced-motion:reduce){#sky-arcade-ui{backdrop-filter:none}}</style><div id="sky-codes-on" hidden>CODES ON</div><div id="sky-arcade-ui"><div class="card"><div id="sky-arcade-info"></div><div class="diff"><button type="button" data-mode="easy">Easy</button><button type="button" data-mode="normal">Normal</button><button type="button" data-mode="hard">Hard</button></div><button id="sky-arcade-play" type="button">Play</button><p class="sky-mini">Keyboard: ${KEYBOARD}</p><p class="sky-mini">Touch: ${TOUCH}</p></div></div><div id="sky-arcade-results" hidden><div class="card"><h2 id="sky-arcade-result-title"></h2><p id="sky-arcade-result-score"></p><p id="sky-arcade-result-best"></p><button id="sky-arcade-replay" type="button">Play again</button><p class="sky-mini">Tip: ${TIPS[1]||TIPS[0]||''}</p></div></div>`;
document.body.appendChild(shell);
const overlay=shell.querySelector('#sky-arcade-ui'),results=shell.querySelector('#sky-arcade-results'),titleInfo=shell.querySelector('#sky-arcade-info'),resultTitle=shell.querySelector('#sky-arcade-result-title'),resultScore=shell.querySelector('#sky-arcade-result-score'),resultBest=shell.querySelector('#sky-arcade-result-best'),codesBadge=shell.querySelector('#sky-codes-on'),diffWrap=overlay.querySelector('.diff');
diffWrap.querySelectorAll('button').forEach(btn=>btn.onclick=()=>setDifficulty(btn.dataset.mode));
overlay.querySelector('#sky-arcade-play').onclick=startRun;results.querySelector('#sky-arcade-replay').onclick=restartRun;
window.addEventListener('keydown',e=>{if(!(titleOpen||resultOpen))return;if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopImmediatePropagation();resultOpen?restartRun():startRun();}},true);
if(typeof update==='function'){
  const coreUpdate=update;
  update=function(...args){
    const scale=difficultyScale();
    if(args.length===0){
      if(typeof dtK==='number'){
        const keep=dtK;dtK*=scale;coreUpdate();dtK=keep;
      }else{
        frameAcc+=scale;
        let guard=0;
        while(frameAcc>=1&&guard<3){coreUpdate();frameAcc-=1;guard++;}
      }
    }else if(args.length===1){
      coreUpdate(args[0]*scale);
    }else if(args.length===2){
      coreUpdate(args[0]*scale,args[1]*scale);
    }else{
      coreUpdate(...args);
    }
    if(reduced){if(typeof shakeTime==='number')shakeTime=0;if(typeof camShake==='number')camShake=0;if(typeof muzzleFlash==='number')muzzleFlash=0;}

  };
}
const monitor=()=>{const scene=sceneName();if(scene==='over'&&!reportedOver){reportedOver=true;showResult();}if(scene==='play')reportedOver=false;requestAnimationFrame(monitor);};requestAnimationFrame(monitor);
if(window.ArcadeSDK) ArcadeSDK.init({onRestart:restartRun,onExit:exitToTitle,onTutorial:()=>showTitle(true),onHint:onHint,cheats:CODE_LIST,onCheat:(code)=>{if(code==='PARTY'){party=true;codesBadge.hidden=false;needDraw=true;return {ok:true,message:CODE_LIST[0].effect};}if(code==='CHILL'){chill=true;codesBadge.hidden=false;applyIntervalScale();needDraw=true;return {ok:true,message:CODE_LIST[1].effect};}if(code==='BOOST'){codesBadge.hidden=false;return applyBoost();}},pauseButton:PAUSE_BUTTON});
showTitle(false);
})();
</script>
