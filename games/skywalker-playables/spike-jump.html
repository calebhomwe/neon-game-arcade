<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Spike Jump</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(255,71,87,.3)</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,needDraw=true;function resize(){W=C.width=Math.min(window.innerWidth-20,420);H=C.height=Math.min(window.innerHeight-20,720);bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#1a0a0a');bgGrad.addColorStop(.5,'#2a1a1a');bgGrad.addColorStop(1,'#1a0a0a');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}
let player,spikes,frame,score,timeLeft,state,jumping,groundY,shakeTimer=0,particles=[],scorePopups=[],nearMisses=0,neonPulse=0;
function init(){player={x:W/2,y:H-80,vx:0,vy:0,onGround:true};spikes=[];frame=0;score=0;timeLeft=40;state='ready';jumping=false;groundY=H-80;shakeTimer=0;particles=[];scorePopups=[];nearMisses=0;neonPulse=0}
C.addEventListener('pointerdown',()=>{if(state==='over'||state==='win'){init();return}if(state==='ready'){state='play';return}if(player.onGround&&!jumping){jumping=true;player.vy=-13;player.onGround=false}});
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){if(state==='over'||state==='win')init();else if(state==='ready')state='play';else if(player.onGround&&!jumping){jumping=true;player.vy=-13;player.onGround=false}}});
function update(){if(state!=='play')return;frame++;neonPulse+=.05;timeLeft-=1/60;player.vy+=.65;player.y+=player.vy;
if(player.y>=groundY){player.y=groundY;player.vy=0;player.onGround=true;jumping=false;
if(!jumping&&frame>5){let dust=frame%5===0;dust&&particles.length<280&&particles.push({x:player.x+(Math.random()-.5)*10,y:groundY,vx:(Math.random()-.5)*2,vy:-Math.random()*2,life:15,s:Math.random()*3+1,col:'rgba(150,150,150,.5)'})}}
if(frame%Math.max(12,35-score)===0){let type=Math.random()<.5?'single':'double';if(type==='single'){spikes.push({x:Math.random()*(W-60)+30,y:groundY-25,w:30,h:25})}else{spikes.push({x:Math.random()*(W-120)+30,y:groundY-25,w:30,h:25});spikes.push({x:spikes[spikes.length-1].x+50,y:groundY-25,w:30,h:25})}}
for(let s of spikes){s.y+=.5;if(s.y>groundY){s.dead=true;score++}
if(player.x>s.x-12&&player.x<s.x+s.w+12&&player.y>s.y&&player.y<groundY+8){
let nearMiss=Math.abs(player.y-s.y)<15;if(nearMiss){nearMisses++;scorePopups.push({x:player.x,y:player.y-30,txt:'NEAR MISS!',life:30,vy:-1.5});if(particles.length<280)for(let i=0;i<5;i++)particles.push({x:player.x,y:player.y-10,vx:(Math.random()-.5)*4,vy:-Math.random()*3,life:15,s:Math.random()*3+1,col:'#ffd700'})}else{state='over';shakeTimer=15;spawnDeathParticles();return}}}
prune(spikes,s=>!s.dead);
if(shakeTimer>0)shakeTimer--;
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life--}prune(particles,pLife);
for(let sp of scorePopups){sp.y+=sp.vy;sp.life--}prune(scorePopups,pLife);
if(timeLeft<=0){state='win';spawnWinParticles()}}
function spawnDeathParticles(){if(particles.length>300)return;for(let i=0;i<25;i++){let a=Math.random()*Math.PI*2;particles.push({x:player.x,y:player.y,vx:Math.cos(a)*(Math.random()*6+2),vy:Math.sin(a)*(Math.random()*6+2),life:35,s:Math.random()*4+2,col:'#ff4757'})}}
function spawnWinParticles(){if(particles.length>300)return;for(let i=0;i<60;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*8+2),vy:Math.sin(a)*(Math.random()*8+2)-3,life:50,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`})}}
function draw(){X.save();if(shakeTimer>0)X.translate((Math.random()-.5)*shakeTimer*2,(Math.random()-.5)*shakeTimer*2);
X.clearRect(-15,-15,W+30,H+30);
// Cave background
X.fillStyle=bgGrad;X.fillRect(0,0,W,H);
// Neon grid floor glow
X.fillStyle=`rgba(255,71,87,${.03+Math.sin(neonPulse)*.02})`;X.fillRect(0,groundY,W,H-groundY);
X.strokeStyle=`rgba(255,71,87,${.1+Math.sin(neonPulse)*.05})`;X.lineWidth=1;X.beginPath();X.moveTo(0,groundY);X.lineTo(W,groundY);X.stroke();
// Spikes
for(let s of spikes){glowAt('#ff4757',s.x+s.w/2,s.y+s.h/2,s.w*.6+8);X.fillStyle='#ff4757';X.beginPath();X.moveTo(s.x,s.y+s.h);X.lineTo(s.x+s.w/2,s.y);X.lineTo(s.x+s.w,s.y+s.h);X.closePath();X.fill();X.fillStyle='rgba(255,255,255,.2)';X.beginPath();X.moveTo(s.x+s.w*.3,s.y+s.h);X.lineTo(s.x+s.w/2,s.y+5);X.lineTo(s.x+s.w*.5,s.y+s.h);X.closePath();X.fill()}
// Player
glowAt('#1e90ff',player.x,player.y,27);X.fillStyle='#1e90ff';X.beginPath();X.arc(player.x,player.y,12,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,.4)';X.beginPath();X.arc(player.x-3,player.y-3,4,0,Math.PI*2);X.fill();
// Eyes
X.fillStyle='#fff';X.beginPath();X.arc(player.x-3,player.y-2,3,0,Math.PI*2);X.fill();X.beginPath();X.arc(player.x+3,player.y-2,3,0,Math.PI*2);X.fill();
X.fillStyle='#1a1a2e';X.beginPath();X.arc(player.x-2,player.y-2,1.5,0,Math.PI*2);X.fill();X.beginPath();X.arc(player.x+4,player.y-2,1.5,0,Math.PI*2);X.fill();
// Particles
for(let p of particles){X.globalAlpha=p.life/35;X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,p.s*(p.life/35),0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Score popups
for(let sp of scorePopups){X.globalAlpha=sp.life/30;X.fillStyle='#ffd700';X.font='bold 16px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y)}X.globalAlpha=1;
// HUD
X.fillStyle='#fff';X.font='bold 20px "Segoe UI"';X.textAlign='center';X.fillText('Dodged: '+score,W/2,30);
if(nearMisses>0){X.fillStyle='#ffd700';X.font='bold 14px "Segoe UI"';X.textAlign='right';X.fillText('Near Miss x'+nearMisses,W-10,30)}
X.textAlign='right';X.fillStyle=timeLeft<10?'#ff4757':'#fff';X.font='bold 18px "Segoe UI"';X.fillText(Math.ceil(timeLeft)+'s',W-10,55);
X.restore();
if(state==='ready'){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-30,110);X.fillStyle='#ff4757';X.font='bold 26px "Segoe UI"';X.textAlign='center';X.fillText('SPIKE JUMP',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Tap to jump over the spikes',W/2,H/2+5);X.fillStyle='rgba(255,255,255,.5)';X.fillText('\u25B6 Tap to start',W/2,H/2+35)}
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-20,100);X.fillStyle='#ff4757';X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('HIT!',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Dodged: '+score+' | Near Misses: '+nearMisses,W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to retry',W/2,H/2+55)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#0f0',W/2,H/2-20,110);X.fillStyle='#0f0';X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 SURVIVED! \u2728',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Dodged: '+score+' | Near Misses: '+nearMisses,W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+55)}}
let pState='';function loop(){if(document.hidden)return requestAnimationFrame(loop);update();if(state!==pState){pState=state;needDraw=true}if(state==='play')needDraw=true;if(needDraw){needDraw=false;draw()}requestAnimationFrame(loop)}init();loop()
</script></body></html>
