<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Rope Swing</title><script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script><script src="sky-arcade.js"></script><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(0,200,100,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,needDraw=true;function resize(){W=Math.min(window.innerWidth-20,420);H=Math.min(window.innerHeight-20,720);SKY.fit(C,X,W,H);bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#0a2a0a');bgGrad.addColorStop(.5,'#1a3a1a');bgGrad.addColorStop(1,'#0a1a0a');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}
// A jungle of vine anchors. Swing on one, tap to let go (you keep your swing speed),
// tap again in the air to grab the next anchor in reach. Reach the landing platform after the last vine.
let anchors,goal,rope,p,state,camX=0,grabs=0,best=0,reach=190,grav=.32,nets=0,particles=[],scorePopups=[],shakeTime=0,pulseT=0,endMsg='',cheat={arms:false,moon:false,net:false};
const PR=12;
function init(){state='ready';grabs=0;lastGrab=0;best=SKY.best();reach=SKY.pick(230,190,160)+(cheat.arms?80:0);grav=.32*(cheat.moon?.6:1);nets=cheat.net?3:0;particles=[];scorePopups=[];shakeTime=0;pulseT=0;
let n=SKY.pick(8,12,16),x=W*.3;anchors=[];for(let i=0;i<n;i++){anchors.push({x,y:70+Math.random()*90});x+=SKY.pick(150,170,190)+Math.random()*50}

rope={a:0,L:H*.3,th:-1.05,om:0};p={x:0,y:0,vx:0,vy:0};place();camX=0}
function place(){let a=anchors[rope.a];p.x=a.x+Math.sin(rope.th)*rope.L;p.y=a.y+Math.cos(rope.th)*rope.L}
function inReach(){let bestA=-1,bd=1e9;for(let i=0;i<anchors.length;i++){let a=anchors[i],d=Math.hypot(p.x-a.x,p.y-a.y);if(a.x>p.x-60&&d<reach&&d>30&&d<bd&&!(rope&&rope.a===i)){bd=d;bestA=i}}return bestA}
function act(){if(state==='over'||state==='win'){start();return}if(state==='ready'){state='play';return}if(state!=='play')return;
if(rope){let a=anchors[rope.a],v=rope.om*rope.L;p.vx=v*Math.cos(rope.th);p.vy=-v*Math.sin(rope.th);rope=null;lastA=-1;SKY.sfx('whoosh',{volume:.5});return}

let a=anchors[i],L=Math.hypot(p.x-a.x,p.y-a.y),th=Math.atan2(p.x-a.x,p.y-a.y);rope={a:i,L,th,om:(p.vx*Math.cos(th)-p.vy*Math.sin(th))/L};
if(i>lastGrab){grabs+=i-lastGrab;lastGrab=i;scorePopups.push({x:a.x,y:a.y-14,txt:'GRAB! '+grabs,life:35,vy:-1});}SKY.sfx('pop',{volume:.6})}
let lastA=-1,lastGrab=0;
C.addEventListener('pointerdown',act);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)act()}});
function update(dts){if(state!=='play')return;pulseT+=.03*dts;
if(rope){let a=anchors[rope.a];rope.om+=-(grav/rope.L)*Math.sin(rope.th)*dts;rope.th+=rope.om*dts;place()}
else{p.vy+=grav*dts;p.x+=p.vx*dts;p.y+=p.vy*dts;
if(p.vy>0&&p.x>goal.x&&p.x<goal.x+goal.w&&p.y+PR>=goal.y&&p.y+PR<goal.y+20){p.y=goal.y-PR;state='win';endMsg='LANDED!';spawnWinParticles();SKY.sfx('win');if(SKY.saveBest(grabs))best=grabs;return}
if(p.y>H+30){if(nets>0){nets--;p.vy=-15;p.y=H;SKY.sfx('jump');scorePopups.push({x:p.x,y:H-40,txt:'NET! '+nets+' left',life:35,vy:-1})}else{state='over';endMsg='FELL!';shakeTime=SKY.shake(10);SKY.sfx('lose');if(SKY.saveBest(grabs))best=grabs;return}}}
camX+=(p.x-W*.35-camX)*Math.min(1,.08*dts);
for(let q of particles){q.x+=q.vx*dts;q.y+=q.vy*dts;q.vy+=.05*dts;q.life-=dts}prune(particles,pLife);
for(let sp of scorePopups){sp.y+=sp.vy*dts;sp.life-=dts}prune(scorePopups,pLife);
if(Math.random()<.2*dts&&particles.length<120)particles.push({x:p.x,y:p.y+PR,vx:(Math.random()-.5)*2,vy:Math.random()*2,life:15,s:Math.random()*3+1,col:'#90EE90'});
if(shakeTime>0)shakeTime-=dts}
function spawnWinParticles(){if(particles.length>180)return;for(let i=0;i<50;i++){let a=Math.random()*Math.PI*2;particles.push({x:p.x,y:p.y,vx:Math.cos(a)*(Math.random()*8+2),vy:Math.sin(a)*(Math.random()*8+2)-3,life:40,s:Math.random()*4+2,col:`hsl(${Math.random()*360},100%,60%)`})}}
function draw(){X.save();if(shakeTime>0)X.translate((Math.random()-.5)*shakeTime*2,(Math.random()-.5)*shakeTime*2);
X.clearRect(-15,-15,W+30,H+30);X.fillStyle=bgGrad;X.fillRect(0,0,W,H);
// far jungle (parallax)
X.fillStyle='rgba(0,80,0,.15)';for(let i=0;i<10;i++){let tx=((i*W/7-camX*.3)%(W*1.4)+W*1.4)%(W*1.4)-W*.2;X.beginPath();X.moveTo(tx-20,H);X.lineTo(tx,H-100-Math.sin(i)*30);X.lineTo(tx+20,H);X.closePath();X.fill()}
X.save();X.translate(-camX,0);
// canopy branch the vines hang from
X.fillStyle='#2E5D2E';X.fillRect(camX-20,0,W+40,18);
let near=rope?-1:inReach();
for(let i=0;i<anchors.length;i++){let a=anchors[i];if(a.x<camX-40||a.x>camX+W+40)continue;X.strokeStyle='rgba(76,120,60,.6)';X.lineWidth=2;X.beginPath();X.moveTo(a.x,18);X.lineTo(a.x,a.y);X.stroke();
let hot=i===near,col=hot?'#b6ff5a':i<lastGrab?'#556b2f':'#7CB342';glowAt(col,a.x,a.y,hot?22:14);X.fillStyle=col;X.beginPath();X.arc(a.x,a.y,hot?8:6,0,Math.PI*2);X.fill();
if(hot){X.strokeStyle='rgba(182,255,90,.35)';X.setLineDash([4,6]);X.beginPath();X.moveTo(a.x,a.y);X.lineTo(p.x,p.y);X.stroke();X.setLineDash([])}}
// landing platform
X.drawImage(glow('#5a8a5a'),goal.x-10,goal.y-20,goal.w+20,50);X.fillStyle='#5a8a5a';X.fillRect(goal.x,goal.y-3,goal.w,6);X.fillStyle='#4a7a4a';X.fillRect(goal.x,goal.y+3,goal.w,H-goal.y);
X.fillStyle='#7CB342';for(let gx=goal.x;gx<goal.x+goal.w;gx+=5){X.beginPath();X.moveTo(gx,goal.y-3);X.lineTo(gx+2,goal.y-8-Math.sin(pulseT+gx)*2);X.lineTo(gx+4,goal.y-3);X.closePath();X.fill()}
X.fillStyle='#fff';X.font='bold 14px "Segoe UI"';X.textAlign='center';X.fillText('LAND HERE',goal.x+goal.w/2,goal.y-16);
// rope
if(rope){let a=anchors[rope.a];X.strokeStyle='#4a2a0a';X.lineWidth=4;X.beginPath();X.moveTo(a.x,a.y);X.lineTo(p.x,p.y);X.stroke();
X.fillStyle='#2E7D32';for(let t=1;t<4;t++){let lx=a.x+(p.x-a.x)*t/4,ly=a.y+(p.y-a.y)*t/4;X.beginPath();X.ellipse(lx+5,ly,6,3,rope.th*.5,0,Math.PI*2);X.fill()}}
// swinger
glowAt(PK.color(),p.x,p.y,PR+10);X.fillStyle=PK.color();X.beginPath();X.arc(p.x,p.y,PR,0,Math.PI*2);X.fill();
X.fillStyle='#fff';X.beginPath();X.arc(p.x+3,p.y-3,4,0,Math.PI*2);X.fill();X.fillStyle='#1a1a2e';X.beginPath();X.arc(p.x+4,p.y-3,2,0,Math.PI*2);X.fill();
X.strokeStyle='#333';X.lineWidth=1.5;X.beginPath();X.arc(p.x+2,p.y+2,3,0,Math.PI);X.stroke();
for(let q of particles){let pr=q.s*(q.life/40);X.globalAlpha=q.life/40;glowAt(q.col,q.x,q.y,pr+4);X.fillStyle=q.col;X.beginPath();X.arc(q.x,q.y,pr,0,Math.PI*2);X.fill()}X.globalAlpha=1;
for(let sp of scorePopups){X.globalAlpha=Math.max(0,sp.life/35);X.fillStyle='#b6ff5a';X.font='bold 15px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y)}X.globalAlpha=1;
X.restore();
X.fillStyle='#fff';X.font='bold 18px "Segoe UI"';X.textAlign='center';X.fillText(rope?'TAP TO LET GO':near>=0?'TAP TO GRAB!':'NO VINE IN REACH',W/2,44);
X.font='bold 14px "Segoe UI"';X.fillStyle='rgba(255,255,255,.75)';X.fillText('Vines '+grabs+' / '+(anchors.length-1)+'   BEST '+best+(nets?'   NETS '+nets:''),W/2,66);
X.restore();
if(state==='ready'&&SKY.tut)SKY.drawTut(X,W,H,{title:'ROPE SWING',color:'#2ed573',gesture:'tap',steps:['You start swinging on a vine.','Tap (or Space) to let go: you fly off with the speed of your swing.','In the air, a vine in reach lights up bright green. Tap again to grab it.','Swing from vine to vine and drop onto the LAND HERE platform at the end.']});
else if(state==='ready'){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,H);glowAt('#2ed573',W/2,H/2-30,110);X.fillStyle='#2ed573';X.font='bold 26px "Segoe UI"';X.textAlign='center';X.fillText('ROPE SWING',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Tap to let go, tap again to grab',W/2,H/2+5);X.fillStyle='rgba(255,255,255,.5)';X.fillText('▶ Tap to start',W/2,H/2+35)}
if(state==='over'||state==='win'){let won=state==='win',col=won?'#0f0':'#ff4757';X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt(col,W/2,H/2-20,100);X.fillStyle=col;X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText(won?'✨ LANDED! ✨':'FELL!',W/2,H/2-20);X.fillStyle='#fff';X.font='20px "Segoe UI"';X.fillText('Vines grabbed: '+grabs+'   Best: '+best,W/2,H/2+14);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText(won?'▶ Tap to play again':'▶ Tap to retry',W/2,H/2+48);PK.drawTip(X,W,H/2+72)}}
let pState='',lastTs=null;function loop(ts){if(document.hidden){lastTs=null;return requestAnimationFrame(loop)}if(lastTs===null)lastTs=ts;let dtMs=ts-lastTs;lastTs=ts;if(dtMs<0)dtMs=0;if(dtMs>50)dtMs=50;const dts=dtMs/1000*60;update(dts);if(state!==pState){pState=state;needDraw=true}if(state==='play'||state==='ready')needDraw=true;SKY.tick(state,grabs);if(needDraw){needDraw=false;draw()}requestAnimationFrame(loop)}
function start(){init();state='play'}
SKY.setup({id:'rope-swing',color:'#2ed573',pauseButton:'tr',
onRestart(){start()},onExit(){init()},onDiff(){init()},
onHint(){if(state!=='play')return 'Tap to start. Let go when you are swinging forwards and upwards.';if(rope){let fwd=rope.om<0?false:true;
return fwd&&rope.th>0.15?'Let go now: you are swinging forwards and rising, the best moment to fly.':'Wait: let go as you swing forwards past the bottom, just as you start rising to the right.'}
let i=inReach();if(i>=0)return 'A vine is in reach (bright green): tap now to grab it.';let a=anchors.find((q,k)=>k>lastGrab);return a?'Keep flying: the next vine is '+Math.round(a.x-p.x)+' px ahead. Grab it when it lights up.':'Drop onto the LAND HERE platform.'},
cheats:{LONGARMS:['Grab vines from 80 px further away',()=>{cheat.arms=true;reach+=80}],MOONSWING:['Gravity drops by 40%: longer, floatier flights',()=>{cheat.moon=true;grav*=.6}],SAFETYNET:['A jungle net bounces you back up 3 times',()=>{cheat.net=true;nets=3}]}});
const PKC={key:'sky-PK-rope-swing',color:'#2ed573',unit:' vines',goals:[5,7,9],lower:false,mile:[4,6,9],shopTop:false,tips:["Let go while rising: you keep your swing speed.","Grab the higher vines for a longer, faster swing.","Fly above the landing platform, then drop onto it."]};
/* ---- arcade progression kit: player level + XP, coins, stars, a date-seeded daily
   challenge, small achievements and buyable skins (one localStorage blob per game) ---- */
const PK=(function(cfg){
const day=()=>new Date().toISOString().slice(0,10);
const SKINS=[['Classic',0],['Sunset',12],['Mint',25],['Galaxy',45]],SKINCOL=['#ffd700','#ff7f50','#2ed573','#a55eea'];
const DEF={best:0,coins:0,xp:0,stars:0,plays:0,wins:0,skins:['Classic'],skin:'Classic',ach:[],daily:'',dailyOK:false,cur:0};
let S=Object.assign({},DEF),hud,tCard,tShop,tst,tstT=0,lastScore=null,lastScene='',lastSave=0;
function seed(s){let h=9;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),387420489)>>>0;return h}
function goal(){return cfg.goals[seed(day())%cfg.goals.length]}
function lvl(){return Math.max(1,Math.floor(Math.sqrt(S.xp/12))+1)}
function load(){try{const v=JSON.parse(localStorage.getItem(cfg.key));if(v&&typeof v==='object')Object.assign(S,v)}catch(e){}
if(S.daily!==day()){S.daily=day();S.dailyOK=false}if(!S.skins.length)S.skins=['Classic']}
function save(){try{localStorage.setItem(cfg.key,JSON.stringify(S))}catch(e){}}
function color(){let i=-1;for(let k=0;k<SKINS.length;k++)if(SKINS[k][0]===S.skin)i=k;return i>=0?SKINCOL[i]:cfg.color}
function tip(){return cfg.tips[S.plays%cfg.tips.length]}
function toast(m){if(!tst){tst=document.createElement('div');tst.id='pkToast';tst.style.cssText='position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:9;background:rgba(10,10,46,.92);border:2px solid '+cfg.color+';color:#fff;font:700 14px "Segoe UI",sans-serif;padding:10px 18px;border-radius:22px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap';document.body.appendChild(tst)}
tst.textContent=m;tst.style.opacity='1';clearTimeout(tstT);tstT=setTimeout(()=>{tst.style.opacity='0'},2600)}
function checkAch(){const list=[];for(let i=0;i<cfg.mile.length;i++)list.push(['m'+i,i,4+i*4,'']);
list.push(['first',-1,4,'First run played'],['rich',-1,6,'Banked 40 coins'],['vet',-1,10,'Reached player level 3']);
for(const it of list){if(S.ach.indexOf(it[0])>=0)continue;let ok=false,label=it[3];
if(it[1]>=0){const m=cfg.mile[it[1]];ok=cfg.lower?(S.best>0&&S.best<=m):S.best>=m;label='Milestone: '+m+cfg.unit+' in one run'}
else if(it[0]==='first')ok=S.plays>=1;else if(it[0]==='rich')ok=S.coins>=40;else ok=lvl()>=3;
if(ok){S.ach.push(it[0]);S.coins+=it[2];S.stars++;toast('\uD83C\uDFC5 '+label+' \u00B7 +'+it[2]+' coins \u00B7 +1 star');SKY.sfx('unlock',{volume:.5})}}}
function awardRun(score,won){if(SKY.cheated){save();return}S.plays++;if(won)S.wins++;
if(!cfg.lower){if(score>S.best)S.best=score}else if(score>0&&(S.best===0||score<S.best))S.best=score;
checkAch();const g=goal();
if(!S.dailyOK&&(cfg.lower?(won&&score>0&&score<=g):score>=g)){S.dailyOK=true;S.coins+=10;S.stars++;toast('\u2600 Daily challenge done! +10 coins \u00B7 +1 star');SKY.sfx('win',{volume:.45})}
const pts=cfg.lower?3:Math.max(1,Math.round(score)),old=lvl();S.xp+=pts+(won?15:0);S.coins+=Math.max(1,Math.round(pts/2))+(won?8:0);
if(lvl()>old){const n=lvl()-old;S.coins+=5*n;toast('\u2B06 Player level '+lvl()+'! +'+(5*n)+' coins');SKY.sfx('levelup',{volume:.5})}
checkAch();save();repaint()}
function el(id,css){const d=document.createElement('div');d.id=id;d.style.cssText=css;document.body.appendChild(d);return d}
function place(){const c=document.querySelector('canvas');if(!c)return;const r=c.getBoundingClientRect();
if(tCard)tCard.style.top=(r.top+6)+'px';if(tShop)tShop.style.top=(cfg.shopTop?r.top+58:r.bottom-124)+'px'}
function buildUI(){hud=el('pkHud','position:fixed;left:10px;bottom:10px;z-index:4;pointer-events:none;font:700 12px "Segoe UI",sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.55;text-align:left;white-space:nowrap');
tCard=el('pkTitle','position:fixed;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;font:700 13px "Segoe UI",sans-serif;color:#fff;background:rgba(8,8,30,.75);border:1px solid '+cfg.color+';border-radius:16px;padding:5px 14px;text-align:center;white-space:nowrap;line-height:1.5');
tShop=el('pkShop','position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px');
SKINS.forEach(s=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',s[0]+' skin');
b.style.cssText='min-width:86px;min-height:40px;border-radius:20px;border:2px solid rgba(255,255,255,.3);background:rgba(10,10,46,.85);color:#fff;font:600 13px "Segoe UI",sans-serif;cursor:pointer;padding:0 10px';
b.addEventListener('pointerdown',e=>e.stopPropagation());
b.addEventListener('click',e=>{e.stopPropagation();
if(S.skins.indexOf(s[0])>=0){S.skin=s[0];SKY.sfx('tap')}
else if(S.coins>=s[1]){S.coins-=s[1];S.skins.push(s[0]);S.skin=s[0];SKY.sfx('unlock',{volume:.5});toast('\u2728 Skin unlocked: '+s[0])}
else{SKY.sfx('error',{volume:.35});toast('Need '+(s[1]-S.coins)+' more coins for '+s[0])}
save();repaint();b.blur()});tShop.appendChild(b)});
window.addEventListener('resize',place);place()}
function repaint(){const l=lvl(),a=12*(l-1)*(l-1),b=12*l*l,f=Math.max(1,Math.min(5,Math.round(5*Math.min(1,(S.xp-a)/Math.max(1,b-a))))),g=goal();
if(hud)hud.innerHTML='LVL '+l+' '+'\u2588'.repeat(f)+'\u2591'.repeat(5-f)+' \u00B7 coins '+S.coins+' \u00B7 \u2605 '+S.stars+' stars<br>Daily: '+(S.dailyOK?'done today \u2713':'reach '+g+cfg.unit+' \u00B7 +10 coins');
if(tCard)tCard.innerHTML='Best '+S.best+cfg.unit+' \u00B7 LVL '+l+' \u00B7 \u2605 '+S.stars+' \u00B7 coins '+S.coins+'<br>'+(S.dailyOK?'Daily challenge \u2713 done today':'\u2600 Daily: reach '+g+cfg.unit+' \u2192 +10 coins');
if(tShop)for(let i=0;i<tShop.children.length;i++){const bd=tShop.children[i],s=SKINS[i],own=S.skins.indexOf(s[0])>=0;
bd.textContent=own?(S.skin===s[0]?s[0]+' \u2713':s[0]):s[0]+' \u00B7 '+s[1]+' coins';
bd.style.opacity=own||S.coins>=s[1]?'1':'.55';bd.style.borderColor=S.skin===s[0]?cfg.color:'rgba(255,255,255,.3)'}}
function drawTip(X,w,y){X.save();X.globalAlpha=.85;X.fillStyle='#fff';X.font='13px "Segoe UI",sans-serif';X.textAlign='center';X.fillText('Tip: '+tip(),w/2,y);X.restore()}
const tick0=SKY.tick;
SKY.tick=function(state,score){tick0(state,score);
const sc=state==='ready'?'title':(state==='over'||state==='win'||state==='done'?'over':'play');
if(sc!==lastScene){if(lastScene==='play'&&sc==='over')awardRun(score||0,state==='win'||state==='done');lastScene=sc;
if(tCard)tCard.style.display=sc==='title'?'block':'none';if(tShop)tShop.style.display=sc==='title'?'flex':'none'}
if(sc==='play'&&typeof score==='number'&&score!==lastScore){lastScore=score;S.cur=score;
if(!S.dailyOK&&!cfg.lower&&score>=goal()){S.dailyOK=true;S.coins+=10;S.stars++;toast('\u2600 Daily challenge done! +10 coins \u00B7 +1 star');SKY.sfx('win',{volume:.45});repaint()}
const n=performance.now();if(n-lastSave>1500){lastSave=n;save()}}};
load();buildUI();repaint();
return {color,tip,drawTip,save,state:S};
})(PKC);

init();requestAnimationFrame(loop)
</script></body></html>
