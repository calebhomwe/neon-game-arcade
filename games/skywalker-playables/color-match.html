<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Color Match</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(255,107,129,.3)</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=Math.min(window.innerWidth-20,420);H=C.height=Math.min(window.innerHeight-20,720)}resize();window.addEventListener('resize',resize);
let bucket,balls,state,correctCaught,wrongCaught,mx=W/2,palette,nextColor,particles=[],scorePopups=[],shakeTime=0,pulseT=0;
const COLORS=['#ff4757','#ffa502','#2ed573','#1e90ff','#a55eea'];
function init(){bucket={x:W/2,y:H-80,w:65,color:0};balls=[];correctCaught=0;wrongCaught=0;state='play';palette=COLORS.slice();nextColor=null;particles=[];scorePopups=[];shakeTime=0;pulseT=0;changeBucketColor()}
function changeBucketColor(){bucket.color=(bucket.color+1)%palette.length}
C.addEventListener('pointermove',e=>{let r=C.getBoundingClientRect();mx=e.clientX-r.left});
document.addEventListener('keydown',e=>{if(e.code==='Space'){if(state==='over'||state==='win')init();else if(state==='play')changeBucketColor()}});
function update(){if(state!=='play')return;pulseT+=.03;bucket.x+=(mx-bucket.x)*.1;
if(Math.floor(Math.random()*28)===0){let col=COLORS[Math.floor(Math.random()*COLORS.length)];balls.push({x:Math.random()*(W-40)+20,y:-20,vx:(Math.random()-.5)*2,vy:Math.random()*2+2,r:13,col})}
for(let b of balls){b.x+=b.vx;b.y+=b.vy;
if(b.y+b.r>bucket.y-bucket.w/2&&b.y-b.r<bucket.y+bucket.w/2&&b.x>bucket.x-bucket.w/2&&b.x<bucket.x+bucket.w/2){
if(b.col===palette[bucket.color]){correctCaught++;scorePopups.push({x:b.x,y:b.y-15,txt:'GOOD!',life:25,vy:-1.5});for(let i=0;i<8;i++)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:20,s:Math.random()*3+2,col:palette[bucket.color]});
if(correctCaught>=20){state='win';spawnWinParticles()}}else{wrongCaught++;shakeTime=8;scorePopups.push({x:b.x,y:b.y-15,txt:'WRONG!',life:25,vy:-1.5});for(let i=0;i<5;i++)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:15,s:Math.random()*3+2,col:'#ff4757'});if(wrongCaught>=3)state='over'}}b.dead=true}}
balls=balls.filter(b=>!b.dead&&b.y<H+20);
if(correctCaught%5===0&&correctCaught<20&&!nextColor){nextColor=COLORS[Math.floor(Math.random()*COLORS.length)];palette=[nextColor,...palette.slice(0,-1)]}
if(shakeTime>0)shakeTime--;
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life--}particles=particles.filter(p=>p.life>0);
for(let sp of scorePopups){sp.y+=sp.vy;sp.life--}scorePopups=scorePopups.filter(sp=>sp.life>0)}
function spawnWinParticles(){for(let i=0;i<60;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*8+2),vy:Math.sin(a)*(Math.random()*8+2)-3,life:50,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`)}}}
function draw(){X.save();if(shakeTime>0)X.translate((Math.random()-.5)*shakeTime*2,(Math.random()-.5)*shakeTime*2);
X.clearRect(-15,-15,W+30,H+30);
// Pastel background
let grad=X.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#1a1a2e');grad.addColorStop(1,'#16213e');X.fillStyle=grad;X.fillRect(0,0,W,H);
// Balls
for(let b of balls){X.fillStyle=b.col;X.shadowColor=b.col;X.shadowBlur=10;X.beginPath();X.arc(b.x,b.y,b.r,0,Math.PI*2);X.fill();X.shadowBlur=0;X.fillStyle='rgba(255,255,255,.3)';X.beginPath();X.arc(b.x-3,b.y-3,b.r*.4,0,Math.PI*2);X.fill()}
// Bucket
let bc=palette[bucket.color];X.fillStyle=bc;X.shadowColor=bc;X.shadowBlur=15+Math.sin(pulseT*2)*5;X.fillRect(bucket.x-bucket.w/2,bucket.y-bucket.w/2,bucket.w,bucket.w);X.shadowBlur=0;
X.strokeStyle='rgba(255,255,255,.3)';X.lineWidth=2;X.strokeRect(bucket.x-bucket.w/2,bucket.y-bucket.w/2,bucket.w,bucket.w);
// Color indicator dots
for(let i=0;i<palette.length;i++){X.fillStyle=palette[i];X.beginPath();X.arc(W/2-palette.length*8+i*16+8,H-15,5,0,Math.PI*2);X.fill();if(i===bucket.color){X.strokeStyle='#fff';X.lineWidth=2;X.beginPath();X.arc(W/2-palette.length*8+i*16+8,H-15,7,0,Math.PI*2);X.stroke()}}
// Particles
for(let p of particles){X.globalAlpha=p.life/25;X.fillStyle=p.col;X.shadowColor=p.col;X.shadowBlur=6;X.beginPath();X.arc(p.x,p.y,p.s*(p.life/25),0,Math.PI*2);X.fill();X.shadowBlur=0}X.globalAlpha=1;
// Score popups
for(let sp of scorePopups){X.globalAlpha=sp.life/25;X.fillStyle=sp.txt==='GOOD!'?'#2ed573':'#ff4757';X.shadowColor=X.fillStyle;X.shadowBlur=8;X.font='bold 16px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y);X.shadowBlur=0}X.globalAlpha=1;
// HUD
X.fillStyle='#fff';X.font='bold 20px "Segoe UI"';X.textAlign='left';X.fillText('Catch: ',10,25);X.fillStyle=palette[bucket.color];X.fillRect(70,14,15,15);X.fillStyle='#fff';X.fillText(' '+correctCaught+'/20',90,25);
X.textAlign='right';X.fillStyle=wrongCaught>=2?'#ff4757':'#fff';X.fillText('Wrong: '+wrongCaught+'/3',W-10,25);
X.textAlign='center';X.fillStyle='rgba(255,255,255,.4)';X.font='14px "Segoe UI"';X.fillText('SPACE to change color',W/2,H-10);
X.restore();
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);X.fillStyle='#ff4757';X.shadowColor='#ff4757';X.shadowBlur=15;X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('TOO MANY WRONG!',W/2,H/2-20);X.shadowBlur=0;X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to retry',W/2,H/2+40)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);X.fillStyle='#ff6b81';X.shadowColor='#ff6b81';X.shadowBlur=20;X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 PERFECT MATCH! \u2728',W/2,H/2-20);X.shadowBlur=0;X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+40)}}
function loop(){update();draw();requestAnimationFrame(loop)}init();loop()
</script></body></html>
