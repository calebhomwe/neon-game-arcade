<!DOCTYPE html>
<html lang="en"><head><script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balance Tile</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(255,165,0,.3)</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,CRECT,needDraw=true;function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);W=Math.min(window.innerWidth-20,420);H=Math.min(window.innerHeight-20,720);C.style.width=W+'px';C.style.height=H+'px';C.width=Math.round(W*dpr);C.height=Math.round(H*dpr);X.setTransform(dpr,0,0,dpr,0,0);CRECT=C.getBoundingClientRect();bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#1a2a3a');bgGrad.addColorStop(.5,'#2a3a5a');bgGrad.addColorStop(1,'#1a2a3a');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}
let tile,player,tilt,tiltSpeed,facing,state,progress,finishLine,particles=[],scorePopups=[],shakeTime=0,pulseT=0,camShake=0,tileGrad=null,tgW=0;
function init(){tile={w:W*.55,h:22};player={x:W/2,y:0};tilt=0;tiltSpeed=.025;facing='left';state='ready';progress=0;finishLine=W*.15;particles=[];scorePopups=[];shakeTime=0;pulseT=0}
C.addEventListener('pointerdown',()=>{if(state==='over'||state==='win'){init();return}if(state==='ready'){state='play';return}facing=facing==='left'?'right':'left';camShake=3});
document.addEventListener('keydown',e=>{if(e.code==='Space'){if(state==='over'||state==='win'){init();return}if(state==='ready'){state='play';return}facing=facing==='left'?'right':'left';camShake=3}});
function update(dt){if(state!=='play')return;pulseT+=.03*dt*60;tilt+=tiltSpeed*(facing==='left'?-1:1)*dt*60;
if(tilt>.75||tilt<-.75)tiltSpeed*=-1;
let centerX=W/2,edge=centerX+tilt*tile.w/2;
if(facing==='left'){player.x-=2.5*dt*60;if(player.x<edge-8){state='over';shakeTime=12;spawnFallParticles();return}}
if(facing==='right'){player.x+=2.5*dt*60;if(player.x>edge+8){state='over';shakeTime=12;spawnFallParticles();return}}
progress+=dt*60;if(progress>=300){state='win';spawnWinParticles()}
tile.w=Math.max(55,W*.55-progress*.0008);
if(camShake>0)camShake-=dt*60;
if(shakeTime>0)shakeTime-=dt*60;
for(let p of particles){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.1*dt*60;p.life-=dt*60}prune(particles,pLife)}
function spawnFallParticles(){if(particles.length>180)return;for(let i=0;i<15;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*5,vy:Math.random()*3+1,life:25,s:Math.random()*3+2,col:'#ffd700'})}
function spawnWinParticles(){if(particles.length>180)return;for(let i=0;i<60;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*8+2),vy:Math.sin(a)*(Math.random()*8+2)-3,life:50,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`})}}
function draw(){X.save();let sx=camShake?(Math.random()-.5)*camShake*2:0,sy=camShake?(Math.random()-.5)*camShake*2:0;X.translate(sx,sy);
X.clearRect(-10,-10,W+20,H+20);
X.fillStyle=bgGrad;X.fillRect(0,0,W,H);
// Clouds
X.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<4;i++){let cx=(i*W/4+pulseT*20)%W;X.beginPath();X.ellipse(cx,80+i*30,30+i*5,12,0,0,Math.PI*2);X.fill()}
let centerY=H*.55;X.save();X.translate(W/2,centerY);X.rotate(tilt);
// Tile body
if(!tileGrad||Math.round(tile.w)!==tgW){tgW=Math.round(tile.w);tileGrad=X.createLinearGradient(-tile.w/2,0,tile.w/2,0);tileGrad.addColorStop(0,'#8B6914');tileGrad.addColorStop(.5,'#A0782C');tileGrad.addColorStop(1,'#8B6914')}X.fillStyle=tileGrad;X.fillRect(-tile.w/2,-tile.h/2,tile.w,tile.h);
// Wood grain
X.strokeStyle='rgba(0,0,0,.1)';X.lineWidth=1;for(let i=-tile.w/2+10;i<tile.w/2;i+=15){X.beginPath();X.moveTo(i,-tile.h/2);X.lineTo(i,tile.h/2);X.stroke()}
// Warning zones
if(Math.abs(tilt)>.5){X.fillStyle=`rgba(255,71,87,${(Math.abs(tilt)-.5)*.5})`;X.fillRect(-tile.w/2,-tile.h/2,tile.w*.15,tile.h);X.fillRect(tile.w/2-tile.w*.15,-tile.h/2,tile.w*.15,tile.h)}
X.restore();
// Edge indicator
let edgeX=W/2+tilt*tile.w/2;X.fillStyle=`rgba(255,200,0,${.3+Math.sin(pulseT*3)*.2})`;X.fillRect(edgeX-2,centerY-35,4,70);
// Finish line
glowAt('#2ed573',finishLine+2,centerY,50);X.fillStyle='#2ed573';X.fillRect(finishLine,centerY-40,4,80);
// Progress bar
let barW=100,barH=6,barX=W/2-barW/2,barY=H-30;X.fillStyle='rgba(255,255,255,.1)';X.fillRect(barX,barY,barW,barH);
let progFill=Math.min(1,progress/300);if(barW*progFill>1)X.drawImage(glow('#ffd700'),barX-6,barY-6,barW*progFill+12,barH+12);X.fillStyle='#ffd700';X.fillRect(barX,barY,barW*progFill,barH);
// Player
player.y=centerY-15;glowAt('#ffd700',player.x,player.y,25);X.fillStyle='#ffd700';X.beginPath();X.arc(player.x,player.y,10,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,.4)';X.beginPath();X.arc(player.x-2,player.y-2,3,0,Math.PI*2);X.fill();
// Eyes on player
X.fillStyle='#1a1a2e';X.beginPath();X.arc(player.x+(facing==='left'?-2:2)-2,player.y-2,1.5,0,Math.PI*2);X.fill();X.beginPath();X.arc(player.x+(facing==='left'?-2:2)+2,player.y-2,1.5,0,Math.PI*2);X.fill();
// Particles
for(let p of particles){let pr=p.s*(p.life/50);X.globalAlpha=p.life/50;glowAt(p.col,p.x,p.y,pr+6);X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,pr,0,Math.PI*2);X.fill()}X.globalAlpha=1;
// HUD
X.fillStyle='#fff';X.font='bold 20px "Segoe UI"';X.textAlign='center';X.fillText('Hold position!',W/2,30);
X.restore();
if(state==='ready'){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,H);glowAt('#ffd700',W/2,H/2-30,110);X.fillStyle='#ffd700';X.font='bold 26px "Segoe UI"';X.textAlign='center';X.fillText('BALANCE TILE',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Tap to flip walking direction',W/2,H/2+5);X.fillStyle='rgba(255,255,255,.5)';X.fillText('\u25B6 Tap to start',W/2,H/2+35)}
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-20,100);X.fillStyle='#ff4757';X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('FELL OFF!',W/2,H/2-20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to retry',W/2,H/2+40)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ffd700',W/2,H/2-20,110);X.fillStyle='#ffd700';X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 BALANCED! \u2728',W/2,H/2-20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+40)}}
let last=performance.now(),pState='';function loop(now){requestAnimationFrame(loop);if(document.hidden){last=now||performance.now();return}const dt=Math.min(((now||performance.now())-last)/1000,.05);last=now||performance.now();update(dt);if(state!==pState){pState=state;needDraw=true}if(state==='play')needDraw=true;if(needDraw){needDraw=false;draw()}}init();requestAnimationFrame(loop)
</script><script>
(()=>{
const GAME_ID='sky-balance-tile',TITLE='Balance Tile',BEST_KEY=GAME_ID+'-best',SEEN_KEY=GAME_ID+'-seen',DIFF_KEY=GAME_ID+'-difficulty',PAUSE_BUTTON='br';
const HOWTO=["Press Play to start balancing the tile.", "Tap or press Space to flip direction before the edge drops too far.", "Stay centered on the safe edge until the finish meter fills."],TIPS=["Flip early instead of waiting for the tile to dip hard.", "Short corrections are safer than panic double-taps.", "Watch the finish meter when you are close to winning."],KEYBOARD="Space flips direction.",TOUCH="Tap anywhere to flip direction.";
const CODE_LIST=[
  {code:'PARTY',effect:'Party lights: hue-shift the whole run.'},
  {code:'CHILL',effect:'Chill mode: slow the whole run down.'},
  {code:'BOOST',effect:'Take a quick advantage for this run.'}
];
const read=(k,f)=>{try{const v=localStorage.getItem(k);return v==null?f:v;}catch(e){return f;}};
const readNum=(k,f=0)=>{const v=parseInt(read(k,''),10);return Number.isFinite(v)?v:f;};
let arcadeBest=readNum(BEST_KEY,0),difficulty=read(DIFF_KEY,'normal')||'normal',titleOpen=false,resultOpen=false,reportedOver=false,party=false,chill=false,frameAcc=0;
const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const rawSetItem=window.localStorage&&localStorage.setItem?localStorage.setItem.bind(localStorage):null;
if(rawSetItem){localStorage.setItem=function(key,val){if(String(key)===BEST_KEY&&window.ArcadeSDK&&ArcadeSDK.cheated)return;return rawSetItem(key,val);};}
if(typeof saveBest==='function'){const keepSaveBest=saveBest;saveBest=function(){if(window.ArcadeSDK&&ArcadeSDK.cheated)return;return keepSaveBest();};}
function difficultyScale(){const base=difficulty==='easy'?0.85:difficulty==='hard'?1.18:1;return chill?base*0.72:base;}
function scoreValue(){try{return Math.max(0,Math.round(Math.round(progress||0)||0));}catch(e){return 0;}}
function persistBest(force){const score=scoreValue();if((force||score>arcadeBest)&&!(window.ArcadeSDK&&ArcadeSDK.cheated)){arcadeBest=score;try{localStorage.setItem(BEST_KEY,String(arcadeBest));}catch(e){}}return arcadeBest;}
function sceneName(){
  if(resultOpen) return 'over';
  if(titleOpen) return 'title';
  if(typeof over==='boolean'&&over) return 'over';
  if(typeof won==='boolean'&&won) return 'over';
  if(state==='play'||state==='aiming') return 'play';
  if(state==='over'||state==='win') return 'over';
  return 'title';
}
function postScene(){if(window.ArcadeSDK)ArcadeSDK.state({scene:sceneName(),score:scoreValue()});}
function applyIntervalScale(){if(typeof interval!=='undefined'&&typeof spd==='number'&&typeof update==='function'){clearInterval(interval);interval=setInterval(update,Math.max(40,Math.round(spd/difficultyScale())));}}
function setDiffButtons(){diffWrap.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===difficulty));}
function setDifficulty(next){difficulty=next;try{localStorage.setItem(DIFF_KEY,difficulty);}catch(e){}setDiffButtons();applyIntervalScale();needDraw=true;}
function hideTitle(){titleOpen=false;overlay.hidden=true;}
function hideResult(){resultOpen=false;results.hidden=true;}
function showTitle(forceTutorial){titleOpen=true;resultOpen=false;overlay.hidden=false;results.hidden=true;const first=read(SEEN_KEY,'0')!=='1';titleInfo.innerHTML='<h1>'+TITLE+'</h1><p>'+(forceTutorial||first?'Learn it in three quick steps and jump in.':'Back at the title. Pick a difficulty and play again.')+'</p><ol>'+HOWTO.map(s=>'<li>'+s+'</li>').join('')+'</ol><div class="sky-mini">💡 '+(TIPS[0]||'')+'</div>';setDiffButtons();postScene();}
function showResult(){resultOpen=true;persistBest();resultTitle.textContent=(state==='win'||(typeof won==='boolean'&&won))?'Run complete!':'Run over';resultScore.textContent='Score: '+scoreValue();resultBest.textContent='Best: '+arcadeBest;results.hidden=false;codesBadge.hidden=!(window.ArcadeSDK&&ArcadeSDK.cheated);postScene();}
function startRun(){reportedOver=false;hideResult();hideTitle();try{localStorage.setItem(SEEN_KEY,'1');}catch(e){}state="play";applyIntervalScale();postScene();needDraw=true;}
function restartRun(){if(typeof init==='function')init();startRun();}
function exitToTitle(){if(typeof init==='function')init();hideResult();showTitle(false);applyIntervalScale();needDraw=true;}
function genericBoost(){let changed=false;if(typeof lives==='number'){lives=Math.min(lives+1,9);changed=true;}if(typeof timeLeft==='number'){timeLeft+=10;changed=true;}if(typeof timer==='number'){timer+=8;changed=true;}if(typeof score==='number'){score+=25;changed=true;}if(typeof targetScore==='number'){targetScore=Math.max(20,targetScore-20);changed=true;}if(typeof targetKills==='number'){targetKills=Math.max(1,targetKills-2);changed=true;}return changed;}
function applyBoost(){let changed=genericBoost();if(!changed&&typeof score==='number')score+=10;needDraw=true;return {ok:true,message:CODE_LIST[2].effect};}
function onHint(){return state!=="play"?"Press Play, then use the quick tutorial steps on the title card.":(TIPS[1]||TIPS[0]||"Stay calm and make the next clean move.");}
const shell=document.createElement('div');
shell.innerHTML=`<style>#sky-codes-on{position:fixed;top:12px;left:12px;z-index:9998;background:#ffd257;color:#111;padding:6px 12px;border-radius:999px;font:900 12px/1 'Segoe UI',system-ui,sans-serif;letter-spacing:.12em}#sky-codes-on[hidden]{display:none}#sky-arcade-ui,#sky-arcade-results{position:fixed;inset:0;display:grid;place-items:center;padding:18px;z-index:9997}#sky-arcade-ui{background:rgba(4,8,18,.62);backdrop-filter:blur(6px)}#sky-arcade-results{background:rgba(4,8,18,.48)}#sky-arcade-ui[hidden],#sky-arcade-results[hidden]{display:none}#sky-arcade-ui .card,#sky-arcade-results .card{width:min(100%,420px);border-radius:22px;padding:22px 20px 18px;background:linear-gradient(180deg,rgba(12,18,42,.96),rgba(7,10,26,.96));border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 55px rgba(0,0,0,.35);font-family:'Segoe UI',system-ui,sans-serif;color:#fff}#sky-arcade-ui h1,#sky-arcade-results h2{margin:0 0 8px;font-size:clamp(28px,8vw,38px);line-height:.95}#sky-arcade-ui p,#sky-arcade-results p,#sky-arcade-ui li{font-size:14px;line-height:1.45;color:rgba(255,255,255,.82)}#sky-arcade-ui ol{padding-left:20px;margin:12px 0}#sky-arcade-ui button,#sky-arcade-results button{appearance:none;border:0;border-radius:16px;min-height:44px;padding:12px 16px;font:800 16px 'Segoe UI',system-ui,sans-serif;cursor:pointer}#sky-arcade-play,#sky-arcade-replay{width:100%;background:linear-gradient(135deg,#43ddff,#1c9ee8);color:#04122b;box-shadow:0 10px 22px rgba(0,180,255,.28)}#sky-arcade-ui .sky-mini,#sky-arcade-results .sky-mini{font-size:13px;color:rgba(255,255,255,.68)}#sky-arcade-ui .diff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}#sky-arcade-ui .diff button{background:rgba(255,255,255,.08);color:#dfe7ff;border:1px solid rgba(255,255,255,.12)}#sky-arcade-ui .diff button.active{background:#ffd257;color:#16171d}@media (prefers-reduced-motion:reduce){#sky-arcade-ui{backdrop-filter:none}}</style><div id="sky-codes-on" hidden>CODES ON</div><div id="sky-arcade-ui"><div class="card"><div id="sky-arcade-info"></div><div class="diff"><button type="button" data-mode="easy">Easy</button><button type="button" data-mode="normal">Normal</button><button type="button" data-mode="hard">Hard</button></div><button id="sky-arcade-play" type="button">Play</button><p class="sky-mini">Keyboard: ${KEYBOARD}</p><p class="sky-mini">Touch: ${TOUCH}</p></div></div><div id="sky-arcade-results" hidden><div class="card"><h2 id="sky-arcade-result-title"></h2><p id="sky-arcade-result-score"></p><p id="sky-arcade-result-best"></p><button id="sky-arcade-replay" type="button">Play again</button><p class="sky-mini">Tip: ${TIPS[1]||TIPS[0]||''}</p></div></div>`;
document.body.appendChild(shell);
const overlay=shell.querySelector('#sky-arcade-ui'),results=shell.querySelector('#sky-arcade-results'),titleInfo=shell.querySelector('#sky-arcade-info'),resultTitle=shell.querySelector('#sky-arcade-result-title'),resultScore=shell.querySelector('#sky-arcade-result-score'),resultBest=shell.querySelector('#sky-arcade-result-best'),codesBadge=shell.querySelector('#sky-codes-on'),diffWrap=overlay.querySelector('.diff');
diffWrap.querySelectorAll('button').forEach(btn=>btn.onclick=()=>setDifficulty(btn.dataset.mode));
overlay.querySelector('#sky-arcade-play').onclick=startRun;results.querySelector('#sky-arcade-replay').onclick=restartRun;
window.addEventListener('keydown',e=>{if(!(titleOpen||resultOpen))return;if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopImmediatePropagation();resultOpen?restartRun():startRun();}},true);
if(typeof update==='function'){
  const coreUpdate=update;
  update=function(...args){
    const scale=difficultyScale();
    if(args.length===0){
      if(typeof dtK==='number'){
        const keep=dtK;dtK*=scale;coreUpdate();dtK=keep;
      }else{
        frameAcc+=scale;
        let guard=0;
        while(frameAcc>=1&&guard<3){coreUpdate();frameAcc-=1;guard++;}
      }
    }else if(args.length===1){
      coreUpdate(args[0]*scale);
    }else if(args.length===2){
      coreUpdate(args[0]*scale,args[1]*scale);
    }else{
      coreUpdate(...args);
    }
    if(reduced){if(typeof shakeTime==='number')shakeTime=0;if(typeof camShake==='number')camShake=0;if(typeof muzzleFlash==='number')muzzleFlash=0;}
    C.style.filter=party?'hue-rotate('+((Date.now()/18)%360)+'deg) saturate(1.25)':'';
  };
}
const monitor=()=>{const scene=sceneName();if(scene==='over'&&!reportedOver){reportedOver=true;showResult();}if(scene==='play')reportedOver=false;requestAnimationFrame(monitor);};requestAnimationFrame(monitor);
if(window.ArcadeSDK) ArcadeSDK.init({onRestart:restartRun,onExit:exitToTitle,onTutorial:()=>showTitle(true),onHint:onHint,cheats:CODE_LIST,onCheat:(code)=>{if(code==='PARTY'){party=true;codesBadge.hidden=false;needDraw=true;return {ok:true,message:CODE_LIST[0].effect};}if(code==='CHILL'){chill=true;codesBadge.hidden=false;applyIntervalScale();needDraw=true;return {ok:true,message:CODE_LIST[1].effect};}if(code==='BOOST'){codesBadge.hidden=false;return applyBoost();}},pauseButton:PAUSE_BUTTON});
showTitle(false);
})();
</script>
</body></html>
