<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balance Tile</title><script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script><script src="sky-arcade.js"></script><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(255,165,0,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,CRECT,needDraw=true;function resize(){W=Math.min(window.innerWidth-20,420);H=Math.min(window.innerHeight-20,720);SKY.fit(C,X,W,H);CRECT=C.getBoundingClientRect();bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#1a2a3a');bgGrad.addColorStop(.5,'#2a3a5a');bgGrad.addColorStop(1,'#1a2a3a');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}
let fallV=0,best=0,cheat={steady:false,slow:false,safe:false},tile,player,tilt,tiltSpeed,facing,state,progress,finishLine,particles=[],scorePopups=[],shakeTime=0,pulseT=0,camShake=0,tileGrad=null,tgW=0;
function init(){tile={w:W*.55,h:22};player={x:W/2,y:0};tilt=0;tiltSpeed=SKY.pick(.018,.025,.032);best=SKY.best();facing='left';state='ready';progress=0;finishLine=W*.15;particles=[];scorePopups=[];shakeTime=0;pulseT=0}
function flip(){facing=facing==='left'?'right':'left';camShake=SKY.shake(3);SKY.sfx('swap',{volume:.5})}
C.addEventListener('pointerdown',()=>{if(state==='over'||state==='win'){init();state='play';return}if(state==='ready'){state='play';return}flip()});
document.addEventListener('keydown',e=>{if(e.code==='Space'){if(state==='over'||state==='win'){init();state='play';return}if(state==='ready'){state='play';return}flip()}});
function update(dt){if(state==='over'||state==='win'){for(let p of particles){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.1*dt*60;p.life-=dt*60}prune(particles,pLife);if(state==='over'&&player.y<H+40){fallV+=.4*dt*60;player.y+=fallV*dt*60}return}if(state!=='play')return;pulseT+=.03*dt*60;tilt+=tiltSpeed*(cheat.steady?.5:1)*(facing==='left'?-1:1)*dt*60;
if(tilt>.75||tilt<-.75)tiltSpeed*=-1;
let centerX=W/2,edge=centerX+tilt*tile.w/2,walk=2.5*(cheat.slow?.5:1)*dt*60,room=cheat.safe?20:8;
if(facing==='left'){player.x-=walk;if(player.x<edge-room){fall();return}}
if(facing==='right'){player.x+=walk;if(player.x>edge+room){fall();return}}
progress+=dt*60;if(progress>=300){state='win';spawnWinParticles();SKY.sfx('win');if(SKY.saveBest(100))best=100}
tile.w=Math.max(55,W*.55-progress*.0008);
if(camShake>0)camShake-=dt*60;
if(shakeTime>0)shakeTime-=dt*60;
for(let p of particles){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.1*dt*60;p.life-=dt*60}prune(particles,pLife)}
function pct(){return Math.min(100,Math.floor(progress/3))}
function fall(){fallV=-3;state='over';shakeTime=SKY.shake(12);spawnFallParticles();SKY.sfx('lose');if(SKY.saveBest(pct()))best=pct()}
function spawnFallParticles(){if(particles.length>180)return;for(let i=0;i<15;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*5,vy:Math.random()*3+1,life:25,s:Math.random()*3+2,col:'#ffd700'})}
function spawnWinParticles(){if(particles.length>180)return;for(let i=0;i<60;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*8+2),vy:Math.sin(a)*(Math.random()*8+2)-3,life:50,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`})}}
function draw(){X.save();let sx=camShake?(Math.random()-.5)*camShake*2:0,sy=camShake?(Math.random()-.5)*camShake*2:0;X.translate(sx,sy);
X.clearRect(-10,-10,W+20,H+20);
X.fillStyle=bgGrad;X.fillRect(0,0,W,H);
// Clouds
X.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<4;i++){let cx=(i*W/4+pulseT*20)%W;X.beginPath();X.ellipse(cx,80+i*30,30+i*5,12,0,0,Math.PI*2);X.fill()}
let centerY=H*.55;X.save();X.translate(W/2,centerY);X.rotate(tilt);
// Tile body
if(!tileGrad||Math.round(tile.w)!==tgW){tgW=Math.round(tile.w);tileGrad=X.createLinearGradient(-tile.w/2,0,tile.w/2,0);tileGrad.addColorStop(0,'#8B6914');tileGrad.addColorStop(.5,'#A0782C');tileGrad.addColorStop(1,'#8B6914')}X.fillStyle=tileGrad;X.fillRect(-tile.w/2,-tile.h/2,tile.w,tile.h);
// Wood grain
X.strokeStyle='rgba(0,0,0,.1)';X.lineWidth=1;for(let i=-tile.w/2+10;i<tile.w/2;i+=15){X.beginPath();X.moveTo(i,-tile.h/2);X.lineTo(i,tile.h/2);X.stroke()}
// Warning zones
if(Math.abs(tilt)>.5){X.fillStyle=`rgba(255,71,87,${(Math.abs(tilt)-.5)*.5})`;X.fillRect(-tile.w/2,-tile.h/2,tile.w*.15,tile.h);X.fillRect(tile.w/2-tile.w*.15,-tile.h/2,tile.w*.15,tile.h)}
X.restore();
// Edge indicator
let edgeX=W/2+tilt*tile.w/2;X.fillStyle=`rgba(255,200,0,${.3+Math.sin(pulseT*3)*.2})`;X.fillRect(edgeX-2,centerY-35,4,70);
// Finish line
glowAt('#2ed573',finishLine+2,centerY,50);X.fillStyle='#2ed573';X.fillRect(finishLine,centerY-40,4,80);
// Progress bar
let barW=100,barH=6,barX=W/2-barW/2,barY=H-30;X.fillStyle='rgba(255,255,255,.1)';X.fillRect(barX,barY,barW,barH);
let progFill=Math.min(1,progress/300);if(barW*progFill>1)X.drawImage(glow('#ffd700'),barX-6,barY-6,barW*progFill+12,barH+12);X.fillStyle='#ffd700';X.fillRect(barX,barY,barW*progFill,barH);
// Player
if(state!=='over')player.y=centerY-15;glowAt(PK.color(),player.x,player.y,25);X.fillStyle=PK.color();X.beginPath();X.arc(player.x,player.y,10,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,.4)';X.beginPath();X.arc(player.x-2,player.y-2,3,0,Math.PI*2);X.fill();
// Eyes on player
X.fillStyle='#1a1a2e';X.beginPath();X.arc(player.x+(facing==='left'?-2:2)-2,player.y-2,1.5,0,Math.PI*2);X.fill();X.beginPath();X.arc(player.x+(facing==='left'?-2:2)+2,player.y-2,1.5,0,Math.PI*2);X.fill();
// Particles
for(let p of particles){let pr=p.s*(p.life/50);X.globalAlpha=p.life/50;glowAt(p.col,p.x,p.y,pr+6);X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,pr,0,Math.PI*2);X.fill()}X.globalAlpha=1;
// HUD
X.fillStyle='#fff';X.font='bold 20px "Segoe UI"';X.textAlign='center';X.fillText('Hold position! '+pct()+'%',W/2,30);X.font='bold 14px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('BEST '+best+'%',W/2,52);
X.restore();
if(state==='ready'&&SKY.tut)SKY.drawTut(X,W,H,{title:'BALANCE TILE',color:'#ffd700',gesture:'tap',steps:['Your ball walks along a tilting plank.','Tap (or Space) to turn it around.','Keep the ball near the pulsing yellow edge line: walk past it and you fall.','Fill the bar at the bottom to win.']});
else if(state==='ready'){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,H);glowAt('#ffd700',W/2,H/2-30,110);X.fillStyle='#ffd700';X.font='bold 26px "Segoe UI"';X.textAlign='center';X.fillText('BALANCE TILE',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Tap to flip walking direction',W/2,H/2+5);X.fillStyle='rgba(255,255,255,.5)';X.fillText('\u25B6 Tap to start',W/2,H/2+35)}
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-20,100);X.fillStyle='#ff4757';X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('FELL OFF!',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText(pct()+'% balanced   Best: '+best+'%',W/2,H/2+12);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to retry',W/2,H/2+40);PK.drawTip(X,W,H/2+64)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ffd700',W/2,H/2-20,110);X.fillStyle='#ffd700';X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 BALANCED! \u2728',W/2,H/2-20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+40);PK.drawTip(X,W,H/2+64)}}
let last=performance.now(),pState='';function loop(now){requestAnimationFrame(loop);if(document.hidden){last=now||performance.now();return}const dt=Math.min(((now||performance.now())-last)/1000,.05);last=now||performance.now();update(dt);if(state!==pState){pState=state;needDraw=true}if(state==='play'||state==='ready'||particles.length||(state==='over'&&player.y<H+40))needDraw=true;SKY.tick(state,pct());if(needDraw){needDraw=false;draw()}}SKY.setup({id:'balance-tile',color:'#ffd700',pauseButton:'tr',
onRestart(){init();state='play'},onExit(){init()},onDiff(){init()},
onHint(){if(state!=='play')return 'Tap to start. Then tap each time your ball is about to walk past the yellow edge line.';let edge=W/2+tilt*tile.w/2,gap=Math.round(facing==='left'?player.x-edge:edge-player.x);
return gap<25?'Turn now: you are '+Math.max(0,gap)+' px from the edge line.':'You are walking '+facing+' with '+gap+' px to spare. Turn when the gap closes to about 20 px.'},
cheats:{STEADY:['The plank tilts at half speed',()=>{cheat.steady=true}],SLOWWALK:['Your ball walks at half speed',()=>{cheat.slow=true}],SAFEZONE:['12 px of extra room past the edge line before you fall',()=>{cheat.safe=true}]}});
const PKC={key:'sky-PK-balance-tile',color:'#ffd700',unit:'%',goals:[40,50,60],lower:false,mile:[25,50,80],shopTop:false,tips:["Turn early: once the ball is past the yellow line there is no saving it.","The tilt swings back on its own at the ends, so the safe side keeps changing.","Red shading at both plank ends means it is steep: expect the line to race."]};
/* ---- arcade progression kit: player level + XP, coins, stars, a date-seeded daily
   challenge, small achievements and buyable skins (one localStorage blob per game) ---- */
const PK=(function(cfg){
const day=()=>new Date().toISOString().slice(0,10);
const SKINS=[['Classic',0],['Sunset',12],['Mint',25],['Galaxy',45]],SKINCOL=['#ffd700','#ff7f50','#2ed573','#a55eea'];
const DEF={best:0,coins:0,xp:0,stars:0,plays:0,wins:0,skins:['Classic'],skin:'Classic',ach:[],daily:'',dailyOK:false,cur:0};
let S=Object.assign({},DEF),hud,tCard,tShop,tst,tstT=0,lastScore=null,lastScene='',lastSave=0;
function seed(s){let h=9;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),387420489)>>>0;return h}
function goal(){return cfg.goals[seed(day())%cfg.goals.length]}
function lvl(){return Math.max(1,Math.floor(Math.sqrt(S.xp/12))+1)}
function load(){try{const v=JSON.parse(localStorage.getItem(cfg.key));if(v&&typeof v==='object')Object.assign(S,v)}catch(e){}
if(S.daily!==day()){S.daily=day();S.dailyOK=false}if(!S.skins.length)S.skins=['Classic']}
function save(){try{localStorage.setItem(cfg.key,JSON.stringify(S))}catch(e){}}
function color(){let i=-1;for(let k=0;k<SKINS.length;k++)if(SKINS[k][0]===S.skin)i=k;return i>=0?SKINCOL[i]:cfg.color}
function tip(){return cfg.tips[S.plays%cfg.tips.length]}
function toast(m){if(!tst){tst=document.createElement('div');tst.id='pkToast';tst.style.cssText='position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:9;background:rgba(10,10,46,.92);border:2px solid '+cfg.color+';color:#fff;font:700 14px "Segoe UI",sans-serif;padding:10px 18px;border-radius:22px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap';document.body.appendChild(tst)}
tst.textContent=m;tst.style.opacity='1';clearTimeout(tstT);tstT=setTimeout(()=>{tst.style.opacity='0'},2600)}
function checkAch(){const list=[];for(let i=0;i<cfg.mile.length;i++)list.push(['m'+i,i,4+i*4,'']);
list.push(['first',-1,4,'First run played'],['rich',-1,6,'Banked 40 coins'],['vet',-1,10,'Reached player level 3']);
for(const it of list){if(S.ach.indexOf(it[0])>=0)continue;let ok=false,label=it[3];
if(it[1]>=0){const m=cfg.mile[it[1]];ok=cfg.lower?(S.best>0&&S.best<=m):S.best>=m;label='Milestone: '+m+cfg.unit+' in one run'}
else if(it[0]==='first')ok=S.plays>=1;else if(it[0]==='rich')ok=S.coins>=40;else ok=lvl()>=3;
if(ok){S.ach.push(it[0]);S.coins+=it[2];S.stars++;toast('\uD83C\uDFC5 '+label+' \u00B7 +'+it[2]+' coins \u00B7 +1 star');SKY.sfx('unlock',{volume:.5})}}}
function awardRun(score,won){if(SKY.cheated){save();return}S.plays++;if(won)S.wins++;
if(!cfg.lower){if(score>S.best)S.best=score}else if(score>0&&(S.best===0||score<S.best))S.best=score;
checkAch();const g=goal();
if(!S.dailyOK&&(cfg.lower?(won&&score>0&&score<=g):score>=g)){S.dailyOK=true;S.coins+=10;S.stars++;toast('\u2600 Daily challenge done! +10 coins \u00B7 +1 star');SKY.sfx('win',{volume:.45})}
const pts=cfg.lower?3:Math.max(1,Math.round(score)),old=lvl();S.xp+=pts+(won?15:0);S.coins+=Math.max(1,Math.round(pts/2))+(won?8:0);
if(lvl()>old){const n=lvl()-old;S.coins+=5*n;toast('\u2B06 Player level '+lvl()+'! +'+(5*n)+' coins');SKY.sfx('levelup',{volume:.5})}
checkAch();save();repaint()}
function el(id,css){const d=document.createElement('div');d.id=id;d.style.cssText=css;document.body.appendChild(d);return d}
function place(){const c=document.querySelector('canvas');if(!c)return;const r=c.getBoundingClientRect();
if(tCard)tCard.style.top=(r.top+6)+'px';if(tShop)tShop.style.top=(cfg.shopTop?r.top+58:r.bottom-124)+'px'}
function buildUI(){hud=el('pkHud','position:fixed;left:10px;bottom:10px;z-index:4;pointer-events:none;font:700 12px "Segoe UI",sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.55;text-align:left;white-space:nowrap');
tCard=el('pkTitle','position:fixed;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;font:700 13px "Segoe UI",sans-serif;color:#fff;background:rgba(8,8,30,.75);border:1px solid '+cfg.color+';border-radius:16px;padding:5px 14px;text-align:center;white-space:nowrap;line-height:1.5');
tShop=el('pkShop','position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px');
SKINS.forEach(s=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',s[0]+' skin');
b.style.cssText='min-width:86px;min-height:40px;border-radius:20px;border:2px solid rgba(255,255,255,.3);background:rgba(10,10,46,.85);color:#fff;font:600 13px "Segoe UI",sans-serif;cursor:pointer;padding:0 10px';
b.addEventListener('pointerdown',e=>e.stopPropagation());
b.addEventListener('click',e=>{e.stopPropagation();
if(S.skins.indexOf(s[0])>=0){S.skin=s[0];SKY.sfx('tap')}
else if(S.coins>=s[1]){S.coins-=s[1];S.skins.push(s[0]);S.skin=s[0];SKY.sfx('unlock',{volume:.5});toast('\u2728 Skin unlocked: '+s[0])}
else{SKY.sfx('error',{volume:.35});toast('Need '+(s[1]-S.coins)+' more coins for '+s[0])}
save();repaint();b.blur()});tShop.appendChild(b)});
window.addEventListener('resize',place);place()}
function repaint(){const l=lvl(),a=12*(l-1)*(l-1),b=12*l*l,f=Math.max(1,Math.min(5,Math.round(5*Math.min(1,(S.xp-a)/Math.max(1,b-a))))),g=goal();
if(hud)hud.innerHTML='LVL '+l+' '+'\u2588'.repeat(f)+'\u2591'.repeat(5-f)+' \u00B7 coins '+S.coins+' \u00B7 \u2605 '+S.stars+' stars<br>Daily: '+(S.dailyOK?'done today \u2713':'reach '+g+cfg.unit+' \u00B7 +10 coins');
if(tCard)tCard.innerHTML='Best '+S.best+cfg.unit+' \u00B7 LVL '+l+' \u00B7 \u2605 '+S.stars+' \u00B7 coins '+S.coins+'<br>'+(S.dailyOK?'Daily challenge \u2713 done today':'\u2600 Daily: reach '+g+cfg.unit+' \u2192 +10 coins');
if(tShop)for(let i=0;i<tShop.children.length;i++){const bd=tShop.children[i],s=SKINS[i],own=S.skins.indexOf(s[0])>=0;
bd.textContent=own?(S.skin===s[0]?s[0]+' \u2713':s[0]):s[0]+' \u00B7 '+s[1]+' coins';
bd.style.opacity=own||S.coins>=s[1]?'1':'.55';bd.style.borderColor=S.skin===s[0]?cfg.color:'rgba(255,255,255,.3)'}}
function drawTip(X,w,y){X.save();X.globalAlpha=.85;X.fillStyle='#fff';X.font='13px "Segoe UI",sans-serif';X.textAlign='center';X.fillText('Tip: '+tip(),w/2,y);X.restore()}
const tick0=SKY.tick;
SKY.tick=function(state,score){tick0(state,score);
const sc=state==='ready'?'title':(state==='over'||state==='win'||state==='done'?'over':'play');
if(sc!==lastScene){if(lastScene==='play'&&sc==='over')awardRun(score||0,state==='win'||state==='done');lastScene=sc;
if(tCard)tCard.style.display=sc==='title'?'block':'none';if(tShop)tShop.style.display=sc==='title'?'flex':'none'}
if(sc==='play'&&typeof score==='number'&&score!==lastScore){lastScore=score;S.cur=score;
if(!S.dailyOK&&!cfg.lower&&score>=goal()){S.dailyOK=true;S.coins+=10;S.stars++;toast('\u2600 Daily challenge done! +10 coins \u00B7 +1 star');SKY.sfx('win',{volume:.45});repaint()}
const n=performance.now();if(n-lastSave>1500){lastSave=n;save()}}};
load();buildUI();repaint();
return {color,tip,drawTip,save,state:S};
})(PKC);

init();requestAnimationFrame(loop)
</script></body></html>
