<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Brick Breaker</title><script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script><script src="sky-arcade.js"></script><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(255,100,50,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H,bgGrad,padGrad,CRECT,needDraw=true;function resize(){W=Math.min(window.innerWidth-20,420);H=Math.min(window.innerHeight-20,720);SKY.fit(C,X,W,H);CRECT=C.getBoundingClientRect();bgGrad=X.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#0a0a1a');bgGrad.addColorStop(1,'#1a0a2a');padGrad=X.createLinearGradient(0,H-50,0,H-50+16);padGrad.addColorStop(0,'#00d2d3');padGrad.addColorStop(1,'#01a3a4');needDraw=true}resize();window.addEventListener('resize',resize);
const GLOWC=new Map();function glow(col){let g=GLOWC.get(col);if(!g){g=document.createElement('canvas');g.width=g.height=64;let c=g.getContext('2d'),r=c.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.beginPath();c.arc(32,32,32,0,Math.PI*2);c.fill();if(GLOWC.size>80)GLOWC.clear();GLOWC.set(col,g)}return g}function glowAt(col,x,y,r){X.drawImage(glow(col),x-r,y-r,r*2,r*2)}
function prune(a,f){let n=0;for(let i=0;i<a.length;i++){let v=a[i];if(f(v))a[n++]=v}a.length=n}function pLife(p){return p.life>0}function pAlive(b){return b.alive}
let heartSpr={};function hearts(n){let s=heartSpr[n];if(!s){s=document.createElement('canvas');s.width=170;s.height=32;let g=s.getContext('2d');g.font='bold 22px "Segoe UI"';g.textAlign='right';g.textBaseline='alphabetic';g.fillStyle='#fff';g.fillText(n>6?'\u2764 x'+n:'\u2764'.repeat(n),168,24);heartSpr[n]=s}return s}
const BW=55,BH=16,BR=7,BCOLS=7,BROWS=6,BPAD=5,BTOP=70;
const COLORS=['#ff4757','#ffa502','#2ed573','#1e90ff','#a55eea','#ff6b81'];
let best=0,cheat={fire:false,slow:false},ball,paddle,bricks,score,lives,state,trail=[],particles=[],scorePopups=[],shakeTime=0,neonPulse=0,combo=0,comboTimer=0;
function init(){let sp=SKY.pick(3,3.5,4.2);paddle={x:W/2-BW/2,y:H-50,w:cheat.big?BW*2:BW};ball={x:W/2,y:H-70,r:BR,vx:sp,vy:-sp};score=0;lives=SKY.pick(5,3,2);best=SKY.best();combo=0;comboTimer=0;state='ready';trail=[];particles=[];scorePopups=[];shakeTime=0;neonPulse=0;makeBricks()}
function makeBricks(){bricks=[];for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){let bx=c*(BW+BPAD)+15,bby=r*(BH+BPAD)+BTOP;bricks.push({x:bx,y:bby,w:BW,h:BH,alive:true,color:COLORS[r],hp:1,flash:0})}}
C.addEventListener('pointermove',e=>{paddle.x=e.clientX-CRECT.left-paddle.w/2;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));needDraw=true});
C.addEventListener('pointerdown',()=>{if(state==='over'||state==='win'){init();return}if(state==='ready')state='play'});
document.addEventListener('keydown',e=>{if(e.code==='ArrowLeft')paddle.x-=25;if(e.code==='ArrowRight')paddle.x+=25;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));if(e.code==='Space'){if(state==='over'||state==='win'){init();return}if(state==='ready')state='play'}if(state==='ready'&&(e.code==='ArrowLeft'||e.code==='ArrowRight'))state='play'});
let over=false,won=false;const MAX_VY=9;
function update(dt){if(state!=='play')return;let s=dt*60;neonPulse+=.05*s;
if(comboTimer>0)comboTimer-=s;else combo=0;
let bs=cheat.slow?.6:1;ball.x+=ball.vx*s*bs;ball.y+=ball.vy*s*bs;
if(ball.x-BR<=0){ball.x=BR;ball.vx=Math.abs(ball.vx);SKY.sfx('tap',{volume:.4})}if(ball.x+BR>=W){ball.x=W-BR;ball.vx=-Math.abs(ball.vx);SKY.sfx('tap',{volume:.4})}if(ball.y-BR<=0){ball.y=BR;ball.vy=Math.abs(ball.vy);SKY.sfx('tap',{volume:.4})}
if(ball.y+BR>=paddle.y&&ball.y+BR<=paddle.y+BH&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.vy>0){ball.vy*=-1;let hit=(ball.x-paddle.x)/paddle.w-.5;ball.vx=hit*7;ball.vy=-Math.min(Math.abs(ball.vy)*1.01,MAX_VY);SKY.sfx('pop',{volume:.6});
if(particles.length<220)for(let i=0;i<4;i++)particles.push({x:ball.x,y:paddle.y,vx:(Math.random()-.5)*4,vy:-Math.random()*3,life:15,s:Math.random()*3+1,col:'#0ff'})}
if(ball.y+BR>H){lives--;if(lives<=0){state='over';shakeTime=SKY.shake(15);SKY.sfx('lose');if(SKY.saveBest(score))best=score}else{SKY.sfx('hurt');ball.x=paddle.x+paddle.w/2;ball.y=H-70;ball.vx=3.5*(Math.random()>.5?1:-1);ball.vy=-3.5}}
for(let b of bricks){if(!b.alive)continue;b.flash=Math.max(0,b.flash-s);
if(ball.x+BR>b.x&&ball.x-BR<b.x+b.w&&ball.y+BR>b.y&&ball.y-BR<b.y+b.h){b.alive=false;if(!cheat.fire)ball.vy*=-1;combo++;comboTimer=60;score+=10*combo;b.flash=10;shakeTime=SKY.shake(4);SKY.sfx(combo>2?'combo':'hit',{volume:.6});
if(particles.length<220)for(let i=0;i<10;i++){let a=Math.PI*2/10*i;particles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:Math.cos(a)*(Math.random()*4+2),vy:Math.sin(a)*(Math.random()*4+2),life:25,s:Math.random()*4+2,col:b.color})}
scorePopups.push({x:b.x+b.w/2,y:b.y,txt:'+'+(10*combo),life:25,vy:-1.5});if(!cheat.fire)break}}
prune(bricks,pAlive);
if(bricks.length===0){won=true;state='win';spawnWinParticles();SKY.sfx('win');if(SKY.saveBest(score))best=score}
trail.push({x:ball.x,y:ball.y,life:8});for(let t of trail)t.life-=s;prune(trail,pLife);
if(shakeTime>0)shakeTime-=s;
for(let p of particles){p.x+=p.vx*s;p.y+=p.vy*s;p.vy+=.05*s;p.life-=s}prune(particles,pLife);
for(let sp of scorePopups){sp.y+=sp.vy*s;sp.life-=s}prune(scorePopups,pLife)}
function spawnWinParticles(){if(particles.length>180)return;for(let i=0;i<80;i++){let a=Math.random()*Math.PI*2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(Math.random()*10+2),vy:Math.sin(a)*(Math.random()*10+2)-3,life:60,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`})}}
function draw(){X.save();if(shakeTime>0)X.translate((Math.random()-.5)*shakeTime*2,(Math.random()-.5)*shakeTime*2);
X.clearRect(-15,-15,W+30,H+30);
X.fillStyle=bgGrad;X.fillRect(0,0,W,H);
// Grid lines
X.strokeStyle=`rgba(255,100,50,${.05+Math.sin(neonPulse)*.02})`;X.lineWidth=1;for(let y=0;y<H;y+=30){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
// Trail
for(let t of trail){X.globalAlpha=t.life/8*.4;X.fillStyle='#fff';X.beginPath();X.arc(t.x,t.y,BR*(t.life/8),0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Bricks
for(let b of bricks){if(!b.alive)continue;let bl=b.flash>0?15:6;X.drawImage(glow(b.color),b.x+b.w/2-(b.w/2+bl),b.y+b.h/2-(b.h/2+bl),(b.w/2+bl)*2,(b.h/2+bl)*2);X.fillStyle=b.flash>0?'#fff':b.color;
X.beginPath();X.roundRect(b.x,b.y,b.w,b.h,3);X.fill();
X.fillStyle='rgba(255,255,255,.2)';X.fillRect(b.x+2,b.y+2,b.w-4,3)}
// Paddle
X.drawImage(glow('#00d2d3'),paddle.x+paddle.w/2-(paddle.w/2+12),paddle.y+BH/2-(BH/2+12),(paddle.w/2+12)*2,(BH/2+12)*2);X.fillStyle=padGrad;X.beginPath();X.roundRect(paddle.x,paddle.y,paddle.w,BH,6);X.fill();
// Ball
glowAt(cheat.fire?'#ff6a00':'#fff',ball.x,ball.y,BR+15);X.fillStyle=cheat.fire?'#ffb347':'#fff';X.beginPath();X.arc(ball.x,ball.y,BR,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,.5)';X.beginPath();X.arc(ball.x-2,ball.y-2,BR*.4,0,Math.PI*2);X.fill();
// Combo
if(combo>1){X.fillStyle='#ffd700';X.font='bold 16px "Segoe UI"';X.textAlign='right';X.fillText(combo+'x COMBO',W-10,30)}
// Particles
for(let p of particles){let pr=p.s*(p.life/25);X.globalAlpha=p.life/25;glowAt(p.col,p.x,p.y,pr+6);X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,pr,0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Score popups
for(let sp of scorePopups){X.globalAlpha=sp.life/25;X.fillStyle='#ffd700';X.font='bold 16px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y)}X.globalAlpha=1;
// HUD
X.fillStyle='#fff';X.font='bold 22px "Segoe UI"';X.textAlign='left';X.fillText(score,10,30);X.font='bold 14px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('BEST '+best,10,50);X.textAlign='right';X.drawImage(hearts(Math.max(0,lives)),W-10-170,30-24);
X.restore();
if(state==='ready'&&SKY.tut)SKY.drawTut(X,W,H,{title:'BRICK BREAKER',color:'#00d2d3',gesture:'swipe',steps:['Slide your finger or mouse (or use the arrow keys) to move the paddle.','Bounce the ball into the bricks. Hitting near a paddle end sends it off at a sharp angle.','Break bricks quickly for a combo. Clear all 42 to win.']});
else if(state==='ready'){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,0,W,H);glowAt('#00d2d3',W/2,H/2-30,110);X.fillStyle='#00d2d3';X.font='bold 26px "Segoe UI"';X.textAlign='center';X.fillText('BRICK BREAKER',W/2,H/2-30);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.7)';X.fillText('Move mouse or use arrow keys',W/2,H/2+5);X.fillStyle='rgba(255,255,255,.5)';X.fillText('\u25B6 Tap to start',W/2,H/2+35)}
if(state==='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#ff4757',W/2,H/2-20,100);X.fillStyle='#ff4757';X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('GAME OVER',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Score: '+score+'   Best: '+best,W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to retry',W/2,H/2+55)}
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);glowAt('#0f0',W/2,H/2-20,110);X.fillStyle='#0f0';X.font='bold 40px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 ALL CLEAR! \u2728',W/2,H/2-20);X.fillStyle='#fff';X.font='22px "Segoe UI"';X.fillText('Score: '+score+'   Best: '+best,W/2,H/2+20);X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+55)}}
let pState='',lastT=performance.now();function loop(){if(document.hidden){lastT=performance.now();return requestAnimationFrame(loop)}let now=performance.now(),dt=Math.min(.05,(now-lastT)/1000);lastT=now;update(dt);if(state!==pState){pState=state;needDraw=true}if(state==='play'||state==='ready')needDraw=true;SKY.tick(state,score);if(needDraw){needDraw=false;draw()}requestAnimationFrame(loop)}SKY.setup({id:'breakout',color:'#00d2d3',pauseButton:'tl',
onRestart(){init();state='play'},onExit(){init()},onDiff(){init()},
onHint(){if(state!=='play')return 'Move the paddle, then tap or press Space to launch.';if(ball.vy<0){let low=bricks.reduce((m,b)=>b.y>m.y?b:m,bricks[0]);return low?'Aim for the gap under the lowest bricks: a ball that gets above them bounces around the top for free points.':''}
let t=(paddle.y-ball.y)/Math.max(.1,ball.vy),x=ball.x+ball.vx*t;while(x<0||x>W)x=x<0?-x:2*W-x;let d=Math.round(x-(paddle.x+paddle.w/2));
return 'The ball will come down about '+Math.abs(d)+' px to the '+(d>0?'right':'left')+' of your paddle centre. Meet it with a paddle end to angle it.'},
cheats:{BIGPADDLE:['Paddle twice as wide',()=>{cheat.big=true;paddle.w=BW*2;paddle.x=Math.min(paddle.x,W-paddle.w)}],EXTRALIFE:['3 extra lives this run',()=>{lives+=3}],SLOWBALL:['The ball moves at 60% speed',()=>{cheat.slow=true}],FIREBALL:['The ball smashes straight through bricks',()=>{cheat.fire=true}]}});
init();loop()
</script></body></html>
