<style>

<body><canvas id="gl" aria-hidden="true"></canvas><canvas id="ov" class="c" aria-label="Hole Eater: steer the hole and swallow the city"></canvas>
<button id="gfx" type="button">Graphics: High</button>

<script type="module">
/* Hole Eater: the same rules as before (12 objects, swallow the ones smaller than you, a red-ringed one
 * chokes you), now drawn in 3D with the shared hole stage (../kit3d/hole3d.js, three.js r180).
 * The simulation still runs in its original board units (px); M turns them into metres. */
import * as THREE from 'three';
import { HoleWorld, REDUCED } from '../kit3d/hole3d.js';

const GL=document.getElementById('gl'), C=document.getElementById('ov'), X=C.getContext('2d');
const AW=420, AH=680, M=0.1;                  // the board (px) and metres per px
const wx=px=>(px-AW/2)*M, wz=py=>(py-AH/2)*M;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
let GFX=ls('sky-hole-eater-gfx')||'auto';
const W3=new HoleWorld(GL,{quality:GFX==='auto'?'auto':GFX,skyTop:'#4f9dff',skyLow:'#e3f3ff'});
W3.sun.intensity=2.6; W3.hemi.intensity=1.35;
let VW=0,VH=0;
function resize(){VW=innerWidth;VH=innerHeight;SKY.fit(C,X,VW,VH);W3.resize();placeGfx()}

/* ---------- rules (unchanged from the 2D game) ---------- */
let best=0,runT=0,edge=1.3,grow=2.5,keys={},cheat={iron:false,magnet:false,big:false},hole,objects,eaten,state,size,
  mx=AW/2,my=AH/2,pulseT=0,pops=[],sinking=[],shakeT=0,pulse=0,squash=0,ptr=null,camD=40,camX=0,camZ=0,winT=0;
function init(){hole={x:AW/2,y:AH/2,r:cheat.big?27:18};mx=AW/2;my=AH/2;runT=0;best=SKY.best();edge=SKY.pick(1.5,1.3,1.15);grow=SKY.pick(3,2.5,2);
  objects=[];eaten=0;size=0;state='ready';pops=[];sinking=[];shakeT=0;pulse=0;squash=0;winT=0;spawnObjects();camX=wx(hole.x);camZ=wz(hole.y)}
function spawnObjects(){while(objects.filter(o=>o.alive).length<12){let sz=4+Math.random()*28,x,y,t=0;
  // keep them off the starting spot so a run never opens with a choke
  do{x=30+Math.random()*(AW-60);y=30+Math.random()*(AH-60);t++}while(t<30&&Math.hypot(x-AW/2,y-AH/2)<70);
  const o={x,y,sz,alive:true,orbitAngle:Math.random()*Math.PI*2,orbitSpeed:(Math.random()-.5)*.02,orbitDist:0,inZone:false,yaw:Math.random()*Math.PI*2,vx:x,vy:y,wob:Math.random()*6};
  o.mod=modelFor(sz*M/2);objects.push(o)}}
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='BUTTON')return;if(e.code.startsWith('Arrow')){keys[e.code]=true;ptr=null;e.preventDefault();if(state==='ready')start()}if(e.code==='Space'){e.preventDefault();if(state==='over'||state==='win')again();else if(state==='ready')start()}});
C.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)ptr={x:e.clientX,y:e.clientY}});
// a finger steers while it is down; lifting it stops the hole where it is
const lift=e=>{if(e.pointerType!=='mouse'){ptr=null;mx=hole.x;my=hole.y}};C.addEventListener('pointerup',lift);C.addEventListener('pointercancel',lift);
C.addEventListener('pointerdown',e=>{ptr={x:e.clientX,y:e.clientY};if(state==='over'||state==='win'){if(performance.now()-winT>600)again();return}if(state==='ready')start()});
function start(){state='play';SKY.sfx('whoosh',{volume:.5})}
function again(){init();state='play'}
function update(dt){pulseT+=dt*1.8;pulse=Math.max(0,pulse-dt*2.5);squash=Math.max(0,squash-dt*3.5);shakeT=Math.max(0,shakeT-dt*14);
  stepSinking(dt);if(state!=='play')return;let s=dt*60;runT+=dt;
  if(ptr){const g=W3.pick(ptr.x,ptr.y);if(g){mx=g.x/M+AW/2;my=g.z/M+AH/2}}
  let kv=5*s;if(keys.ArrowLeft)mx-=kv;if(keys.ArrowRight)mx+=kv;if(keys.ArrowUp)my-=kv;if(keys.ArrowDown)my+=kv;mx=Math.max(0,Math.min(AW,mx));my=Math.max(0,Math.min(AH,my));
  let ease=1-Math.pow(1-.08,s);hole.x+=(mx-hole.x)*ease;hole.y+=(my-hole.y)*ease;
  // objects close to the hole are pulled into orbit (they start from where they stand)
  for(let o of objects){if(!o.alive)continue;let dist=Math.hypot(hole.x-o.x,hole.y-o.y);
    if(dist<hole.r*(cheat.magnet?6:3)&&dist>hole.r){if(!o.inZone){o.inZone=true;o.orbitAngle=Math.atan2(o.y-hole.y,o.x-hole.x);o.orbitDist=Math.max(0,Math.min(50,dist-hole.r*2))}
      o.orbitAngle+=o.orbitSpeed*s;o.orbitDist=Math.max(0,o.orbitDist-.5*s);o.x=hole.x+Math.cos(o.orbitAngle)*(hole.r*2+o.orbitDist);o.y=hole.y+Math.sin(o.orbitAngle)*(hole.r*2+o.orbitDist)}
    else{o.inZone=false;o.orbitDist=Math.min(50,o.orbitDist+.3*s)}}
  for(let o of objects){if(!o.alive)continue;let dist=Math.hypot(hole.x-o.x,hole.y-o.y);
    if(dist<hole.r+o.sz*.4){if(o.sz<hole.r*edge){o.alive=false;eaten++;size++;hole.r+=grow;swallow(o);
        if(eaten>=12){state='win';winT=performance.now();SKY.sfx('win');let t=Math.round(runT*10)/10;if(SKY.saveBest(t*10,true))best=t*10;celebrate()}}
      else if(cheat.iron){let a=Math.atan2(o.y-hole.y,o.x-hole.x);o.x=hole.x+Math.cos(a)*(hole.r+o.sz*.5+6);o.y=hole.y+Math.sin(a)*(hole.r+o.sz*.5+6);o.orbitDist=50;o.inZone=false;SKY.sfx('hit',{volume:.5});W3.burst(wx(o.x),1,wz(o.y),'#ffd166',6,5,.3)}
      else{state='over';winT=performance.now();shakeT=SKY.shake(1.6);SKY.sfx('lose');W3.burst(wx(hole.x),.5,wz(hole.y),'#ff4757',REDUCED?8:26,7,.4);return}}}
  // visual positions ease after the logical ones, so a pull into orbit glides instead of jumping
  const k=1-Math.exp(-dt*12);for(const o of objects){o.vx+=(o.x-o.vx)*k;o.vy+=(o.y-o.vy)*k}}
function swallow(o){pulse=1;squash=Math.min(1,.4+o.sz/30);shakeT=SKY.shake(.35);SKY.sfx('collect',{volume:.6,rate:.8+size*.04});
  sinking.push({mod:o.mod,x:o.vx,y:o.vy,sz:o.sz,yaw:o.yaw,t:0});
  W3.burst(wx(o.vx),.6,wz(o.vy),'#ffffff',REDUCED?4:12,5,.22);
  pops.push({txt:size>=12?'CLEARED!':'+1  GROW!',x:wx(hole.x),z:wz(hole.y),t:0,big:size>=12})}
function stepSinking(dt){for(let i=sinking.length-1;i>=0;i--){const p=sinking[i];p.t+=dt;p.x+=(hole.x-p.x)*Math.min(1,dt*4);p.y+=(hole.y-p.y)*Math.min(1,dt*4);if(p.t>.9)sinking.splice(i,1)}
  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>1)pops.splice(i,1)}}
function celebrate(){if(REDUCED){W3.burst(wx(hole.x),1,wz(hole.y),'#ffd166',10,6,.35);return}
  const cols=['#ffd166','#ef476f','#06d6a0','#118ab2','#ffffff'];for(let i=0;i<5;i++)W3.burst(wx(hole.x),1,wz(hole.y),cols[i],18,9,.4)}

/* ---------- the city: which Kenney model stands for an object of a given size ---------- */
const CLASSES=[[0.35,['cone','cone2','coin']],[0.6,['barrier','bench','planter']],[0.9,['treeS','treeDef','pineR','treeOak']],
  [1.25,['sedan','taxi','hatch','police','suv']],[9,['van','delivery','ambulance','truck','garbage','firetruck','houseA','houseC','houseF']]];
function modelFor(r){const c=CLASSES.find(c=>r<c[0])||CLASSES[CLASSES.length-1];const ids=c[1].filter(id=>!W3.kinds.size||W3.has(id));return ids[Math.floor(Math.random()*ids.length)]||'cone'}
const RED=new THREE.Color('#ff5a5a'),HOLEC=new THREE.Color('#7fd0ff');
let ring=null;
function makeRings(){const g=new THREE.RingGeometry(1,1.14,40).rotateX(-Math.PI/2);
  ring=new THREE.InstancedMesh(g,new THREE.MeshBasicMaterial({color:'#ff3b4e',transparent:true,opacity:.85,depthWrite:false,fog:false}),16);
  ring.frustumCulled=false;ring.renderOrder=2;ring.count=0;W3.scene.add(ring)}
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_s=new THREE.Vector3(),_p=new THREE.Vector3();
function paintPlaza(g,P){// a 16 m park tile: mown lawn with a paved path cross
  g.fillStyle='#63b548';g.fillRect(0,0,P,P);
  for(let i=0;i<8;i++){g.fillStyle=i%2?'rgba(255,255,255,.045)':'rgba(0,40,0,.04)';g.fillRect(0,i*P/8,P,P/8)}
  for(let i=0;i<P*P/120;i++){g.fillStyle=Math.random()<.5?'rgba(20,70,10,.10)':'rgba(190,255,150,.08)';g.fillRect(Math.random()*P,Math.random()*P,2,3)}
  const w=P*.19,c=P/2;g.fillStyle='#d8c9a8';g.fillRect(c-w/2,0,w,P);g.fillRect(0,c-w/2,P,w);
  const q=w/3;g.strokeStyle='rgba(110,90,60,.35)';g.lineWidth=Math.max(1.5,P/400);
  for(let y=0;y<P;y+=q){g.beginPath();g.moveTo(c-w/2,y);g.lineTo(c+w/2,y);g.stroke()}for(let x=0;x<P;x+=q){g.beginPath();g.moveTo(x,c-w/2);g.lineTo(x,c+w/2);g.stroke()}
  g.beginPath();g.moveTo(c,0);g.lineTo(c,c-w/2);g.moveTo(c,c+w/2);g.lineTo(c,P);g.moveTo(0,c);g.lineTo(c-w/2,c);g.moveTo(c+w/2,c);g.lineTo(P,c);g.stroke();
  g.strokeStyle='rgba(40,70,20,.45)';g.lineWidth=Math.max(2,P/220);g.strokeRect(c-w/2,-2,w,P+4);g.strokeRect(-2,c-w/2,P+4,w);
  g.fillStyle='#8a7a5c';g.beginPath();g.arc(c,c,w*.62,0,Math.PI*2);g.fill();g.fillStyle='#d8c9a8';g.beginPath();g.arc(c,c,w*.52,0,Math.PI*2);g.fill()}
function strip(x,z,w,d,paint,rep){const cv=document.createElement('canvas');cv.width=cv.height=W3.quality==='high'?512:256;paint(cv.getContext('2d'),cv.width);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);t.anisotropy=4;
  const m=new THREE.MeshLambertMaterial({map:t});m.stencilWrite=true;m.stencilRef=1;m.stencilFunc=THREE.NotEqualStencilFunc;
  const me=new THREE.Mesh(new THREE.PlaneGeometry(w,d).rotateX(-Math.PI/2),m);me.position.set(x,0.01,z);me.receiveShadow=true;me.renderOrder=-1;W3.scene.add(me)}
function paintRoad(vertical){return(g,P)=>{g.fillStyle='#5b6170';g.fillRect(0,0,P,P);for(let i=0;i<P*P/80;i++){g.fillStyle=Math.random()<.5?'rgba(0,0,0,.06)':'rgba(255,255,255,.05)';g.fillRect(Math.random()*P,Math.random()*P,2,2)}
  g.fillStyle='#f4d35e';const lw=P/40;if(vertical){g.fillRect(P/2-lw/2,P*.1,lw,P*.45)}else{g.fillRect(P*.1,P/2-lw/2,P*.45,lw)}
  g.fillStyle='#c9c3b6';const k=P*.14;if(vertical){g.fillRect(0,0,k,P);g.fillRect(P-k,0,k,P)}else{g.fillRect(0,0,P,k);g.fillRect(0,P-k,P,k)}
  g.fillStyle='rgba(0,0,0,.25)';if(vertical){g.fillRect(k,0,P/80,P);g.fillRect(P-k-P/80,0,P/80,P)}else{g.fillRect(0,k,P,P/80);g.fillRect(0,P-k-P/80,P,P/80)}}}
function dress(){
  const A=AW*M,B=AH*M,R=8;
  W3.setGround(-A/2-R-60,-B/2-R-60,Math.max(A,B)+2*R+120,13,paintPlaza,0);
  strip(-A/2-R/2,0,R,B+2*R,paintRoad(true),[1,(B+2*R)/R]);strip(A/2+R/2,0,R,B+2*R,paintRoad(true),[1,(B+2*R)/R]);
  strip(0,-B/2-R/2,A,R,paintRoad(false),[A/R,1]);strip(0,B/2+R/2,A,R,paintRoad(false),[A/R,1]);
  const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
  // barriers mark the edge of the plaza; lamps and trees line the kerb
  const bar=[],bs=W3.scaleFor('barrier',.55);for(let x=-A/2;x<=A/2;x+=1.7){bar.push({x,z:-B/2-1,s:bs,yaw:0},{x,z:B/2+1,s:bs,yaw:0})}
  for(let z=-B/2;z<=B/2;z+=1.7){bar.push({x:-A/2-1,z,s:bs,yaw:Math.PI/2},{x:A/2+1,z,s:bs,yaw:Math.PI/2})}W3.addStatic('barrier',bar,false);
  const lamps=[],lsc=W3.scaleFor('lamp',.35);for(let z=-B/2+6;z<B/2;z+=18){lamps.push({x:-A/2-3,z,s:lsc,yaw:Math.PI/2},{x:A/2+3,z,s:lsc,yaw:-Math.PI/2})}W3.addStatic('lamp',lamps,true);
  // the skyline beyond the roads frames the plaza (out of reach)
  const ring2={},ids=['skyA','skyB','skyC','skyE','towerA','towerC','towerE','towerG'],hs=['houseA','houseB','houseC','houseD','houseF','houseH','houseK','houseM'];
  const side=(x,z,yaw,row)=>{const id=row?pick(ids):pick(hs),sc=W3.scaleFor(id,row?rnd(6,7.5):rnd(4.2,5.2));(ring2[id]=ring2[id]||[]).push({x,z,s:sc,yaw})};
  for(let row=0;row<2;row++){const off=R+8+row*16;
    for(let s=-B/2-off;s<=B/2+off;s+=12){side(-A/2-off,s+rnd(-2,2),Math.PI/2,row);side(A/2+off,s+rnd(-2,2),-Math.PI/2,row)}
    for(let s=-A/2-off+15;s<=A/2+off-15;s+=12){side(s+rnd(-2,2),-B/2-off,0,row);side(s+rnd(-2,2),B/2+off,Math.PI,row)}}
  for(const id in ring2)W3.addStatic(id,ring2[id],true);
  const trees={},tl=['treeL','treeOak','treeDef','pineR'];for(let i=0;i<46;i++){const id=pick(tl),a=Math.random()<.5;const x=a?(Math.random()<.5?-1:1)*(A/2+R+rnd(3,7)):rnd(-A/2,A/2),z=a?rnd(-B/2,B/2):(Math.random()<.5?-1:1)*(B/2+R+rnd(3,7));
    (trees[id]=trees[id]||[]).push({x,z,s:W3.scaleFor(id,rnd(1.2,1.8)),yaw:rnd(0,6)})}
  for(const id in trees)W3.addStatic(id,trees[id],true)}

/* ---------- drawing ---------- */
function draw3D(dt,now){
  // the camera follows the hole and pulls back as it grows; on the title it drifts round the plaza
  const hx=wx(hole.x),hz=wz(hole.y),want=(24+hole.r*M*8)*(VW<VH?1.35:1);
  camD+=(want-camD)*Math.min(1,dt*2.5);camX+=(hx-camX)*Math.min(1,dt*5);camZ+=(hz-camZ)*Math.min(1,dt*5);
  const yaw=state==='ready'&&!REDUCED?Math.sin(now/5200)*.35:0;
  W3.view(camX,camZ+2,camD,state==='ready'?.92:1.02,yaw,shakeT);
  W3.begin();let rc=0;
  for(const o of objects){if(!o.alive)continue;const x=wx(o.vx),z=wz(o.vy),r=o.sz*M/2,s=W3.scaleFor(o.mod,r);
    let ang=0,tx=0,tz=0;if(o.inZone&&state==='play'){tx=hx-x;tz=hz-z;ang=Math.min(.45,.12+(1-o.orbitDist/50)*.3)+Math.sin(now/90+o.wob)*.03}
    W3.put(o.mod,x,0,z,o.yaw+(o.inZone?now/900:0),s,1,tx,tz,ang,null);
    if(o.sz>=hole.r*edge&&rc<16){const rr=r*1.25+.3+(REDUCED?0:Math.sin(now/180)*.12);_q.identity();_s.set(rr,1,rr);_p.set(x,.05,z);_m.compose(_p,_q,_s);ring.setMatrixAt(rc++,_m)}}
  for(const p of sinking){const x=wx(p.x),z=wz(p.y),r=p.sz*M/2,s=W3.scaleFor(p.mod,r),k=Math.min(1,p.t/.9);
    W3.put(p.mod,x,-Math.pow(k,1.5)*(W3.heightOf(p.mod,s)+r*1.4),z,p.yaw+k*2,s,1,hx-x,hz-z,Math.min(1.35,k*2),null)}
  W3.end();ring.count=rc;ring.instanceMatrix.needsUpdate=true;
  W3.setHoleCount(1);HOLEC.set(state==='over'?'#ff5a5a':PK.color());W3.setHole(0,hx,hz,hole.r*M,HOLEC,pulse,squash);
  W3.render(dt)}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function pill(x,y,w,h){rr(x,y,w,h,h/2);X.fillStyle='rgba(12,28,58,.62)';X.fill();X.lineWidth=2;X.strokeStyle='rgba(255,255,255,.35)';X.stroke()}
function txt(t,x,y,size,col,al,wt){X.font=(wt||800)+' '+size+'px "Segoe UI",system-ui,sans-serif';X.textAlign=al||'center';X.textBaseline='middle';X.lineWidth=Math.max(3,size/5);X.strokeStyle='rgba(8,20,48,.55)';X.strokeText(t,x,y);X.fillStyle=col||'#fff';X.fillText(t,x,y)}
function card(title,col,lines,foot){const w=Math.min(VW-32,380),h=62+lines.length*34+56,x=(VW-w)/2,y=VH*.46-h/2;
  X.fillStyle='rgba(6,16,40,.35)';X.fillRect(0,0,VW,VH);
  rr(x,y,w,h,26);const g=X.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'rgba(255,255,255,.97)');g.addColorStop(1,'rgba(226,238,255,.97)');X.fillStyle=g;X.fill();
  X.lineWidth=4;X.strokeStyle=col;X.stroke();
  X.font='900 32px "Segoe UI",system-ui,sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillStyle=col;X.fillText(title,VW/2,y+40);
  lines.forEach((l,i)=>{const ly=y+84+i*34;X.font='600 16px "Segoe UI",sans-serif';X.fillStyle='#4a5a78';X.textAlign='left';X.fillText(l[0],x+26,ly);X.font='800 19px "Segoe UI",sans-serif';X.fillStyle='#0b2350';X.textAlign='right';X.fillText(l[1],x+w-26,ly)});
  const by=y+h-38,bw=w-52;rr(x+26,by-20,bw,42,21);const bg=X.createLinearGradient(0,by-20,0,by+22);bg.addColorStop(0,'#ffcf4a');bg.addColorStop(1,'#ff9f1c');X.fillStyle=bg;X.fill();
  X.font='900 17px "Segoe UI",sans-serif';X.textAlign='center';X.fillStyle='#4a2500';X.fillText(foot,VW/2,by+1)}
function drawHUD(now){X.setTransform(SKY.dpr(),0,0,SKY.dpr(),0,0);X.clearRect(0,0,VW,VH);
  const big=Math.min(1,VW/420);
  // floating pop-ups
  for(const p of pops){const s=W3.project(p.x,2+p.t*4,p.z);if(!s)continue;X.globalAlpha=1-Math.pow(p.t,2);txt(p.txt,s.x,s.y,p.big?30:22,p.big?'#ffe066':'#ffffff');X.globalAlpha=1}
  if(state==='play'||state==='over'||state==='win'){
    // timer and best, top left

const PKC={key:'sky-PK-hole-eater',color:'#29b6ff',unit:' eaten',goals:[6,8,10],lower:false,mile:[],shopTop:true,tips:["Start with the smallest objects: cones and coins grow you fast.","Red-ringed objects are too big: one touch chokes the run.","Sweep in loops around the plaza so new targets stay close."]};
/* ---- arcade progression kit: player level + XP, coins, stars, a date-seeded daily
   challenge, small achievements and buyable skins (one localStorage blob per game) ---- */
const PK=(function(cfg){
const day=()=>new Date().toISOString().slice(0,10);
const SKINS=[['Classic',0],['Sunset',12],['Mint',25],['Galaxy',45]],SKINCOL=['#ffd700','#ff7f50','#2ed573','#a55eea'];
const DEF={best:0,coins:0,xp:0,stars:0,plays:0,wins:0,skins:['Classic'],skin:'Classic',ach:[],daily:'',dailyOK:false,cur:0};
let S=Object.assign({},DEF),hud,tCard,tShop,tst,tstT=0,lastScore=null,lastScene='',lastSave=0,everOver=false,retryB=null;
function seed(s){let h=9;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),387420489)>>>0;return h}
function goal(){return cfg.goals[seed(day())%cfg.goals.length]}
function lvl(){return Math.max(1,Math.floor(Math.sqrt(S.xp/12))+1)}
function load(){try{const v=JSON.parse(localStorage.getItem(cfg.key));if(v&&typeof v==='object')Object.assign(S,v)}catch(e){}
if(S.daily!==day()){S.daily=day();S.dailyOK=false}if(!S.skins.length)S.skins=['Classic']}
function save(){try{localStorage.setItem(cfg.key,JSON.stringify(S))}catch(e){}}
function color(){let i=-1;for(let k=0;k<SKINS.length;k++)if(SKINS[k][0]===S.skin)i=k;return i>=0?SKINCOL[i]:cfg.color}
function tip(){return cfg.tips[S.plays%cfg.tips.length]}
function toast(m){if(!tst){tst=document.createElement('div');tst.id='pkToast';tst.style.cssText='position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:9;background:rgba(10,10,46,.92);border:2px solid '+cfg.color+';color:#fff;font:700 14px "Segoe UI",sans-serif;padding:10px 18px;border-radius:22px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap';document.body.appendChild(tst)}
tst.textContent=m;tst.style.opacity='1';clearTimeout(tstT);tstT=setTimeout(()=>{tst.style.opacity='0'},2600)}
function checkAch(){const list=[];for(let i=0;i<cfg.mile.length;i++)list.push(['m'+i,i,4+i*4,'']);
list.push(['first',-1,4,'First run played'],['rich',-1,6,'Banked 40 coins'],['vet',-1,10,'Reached player level 3']);
for(const it of list){if(S.ach.indexOf(it[0])>=0)continue;let ok=false,label=it[3];
if(it[1]>=0){const m=cfg.mile[it[1]];ok=cfg.lower?(S.best>0&&S.best<=m):S.best>=m;label='Milestone: '+m+cfg.unit+' in one run'}
else if(it[0]==='first')ok=S.plays>=1;else if(it[0]==='rich')ok=S.coins>=40;else ok=lvl()>=3;
if(ok){S.ach.push(it[0]);S.coins+=it[2];S.stars++;toast('\uD83C\uDFC5 '+label+' \u00B7 +'+it[2]+' coins \u00B7 +1 star');SKY.sfx('unlock',{volume:.5})}}}
function awardRun(score,won){if(SKY.cheated){save();return}S.plays++;if(won)S.wins++;
if(!cfg.lower){if(score>S.best)S.best=score}else if(score>0&&(S.best===0||score<S.best))S.best=score;
checkAch();const g=goal();
if(!S.dailyOK&&(cfg.lower?(won&&score>0&&score<=g):score>=g)){S.dailyOK=true;S.coins+=10;S.stars++;toast('\u2600 Daily challenge done! +10 coins \u00B7 +1 star');SKY.sfx('win',{volume:.45})}
const pts=cfg.lower?3:Math.max(1,Math.round(score)),old=lvl();S.xp+=pts+(won?15:0);S.coins+=Math.max(1,Math.round(pts/2))+(won?8:0);
if(lvl()>old){const n=lvl()-old;S.coins+=5*n;toast('\u2B06 Player level '+lvl()+'! +'+(5*n)+' coins');SKY.sfx('levelup',{volume:.5})}
checkAch();save();repaint()}
function el(id,css){const d=document.createElement('div');d.id=id;d.style.cssText=css;document.body.appendChild(d);return d}
function place(){const c=document.querySelector('canvas');if(!c)return;const r=c.getBoundingClientRect();

tShop=el('pkShop','position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px');
SKINS.forEach(s=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',s[0]+' skin');
b.style.cssText='min-width:86px;min-height:40px;border-radius:20px;border:2px solid rgba(255,255,255,.3);background:rgba(10,10,46,.85);color:#fff;font:600 13px "Segoe UI",sans-serif;cursor:pointer;padding:0 10px';
b.addEventListener('pointerdown',e=>e.stopPropagation());

else{SKY.sfx('error',{volume:.35});toast('Need '+(s[1]-S.coins)+' more coins for '+s[0])}
save();repaint();b.blur()});tShop.appendChild(b)});

function repaint(){const l=lvl(),a=12*(l-1)*(l-1),b=12*l*l,f=Math.max(1,Math.min(5,Math.round(5*Math.min(1,(S.xp-a)/Math.max(1,b-a))))),g=goal();
if(hud)hud.innerHTML='LVL '+l+' '+'\u2588'.repeat(f)+'\u2591'.repeat(5-f)+' \u00B7 coins '+S.coins+' \u00B7 \u2605 '+S.stars+' stars<br>Daily: '+(S.dailyOK?'done today \u2713':'reach '+g+cfg.unit+' \u00B7 +10 coins');
if(tCard)tCard.innerHTML='Best '+S.best+cfg.unit+' \u00B7 LVL '+l+' \u00B7 \u2605 '+S.stars+' \u00B7 coins '+S.coins+'<br>'+(S.dailyOK?'Daily challenge \u2713 done today':'\u2600 Daily: reach '+g+cfg.unit+' \u2192 +10 coins');
if(tShop)for(let i=0;i<tShop.children.length;i++){const bd=tShop.children[i],s=SKINS[i],own=S.skins.indexOf(s[0])>=0;

bd.style.opacity=own||S.coins>=s[1]?'1':'.55';bd.style.borderColor=S.skin===s[0]?cfg.color:'rgba(255,255,255,.3)'}}

const tick0=SKY.tick;

if(!S.dailyOK&&!cfg.lower&&score>=goal()){S.dailyOK=true;S.coins+=10;S.stars++;toast('\u2600 Daily challenge done! +10 coins \u00B7 +1 star');SKY.sfx('win',{volume:.45});repaint()}

retryB.style.cssText='position:fixed;left:50%;top:62%;transform:translateX(-50%);z-index:7;display:none;min-width:130px;min-height:48px;border-radius:24px;border:2px solid '+cfg.color+';background:rgba(10,10,46,.92);color:#fff;font:900 16px "Segoe UI",sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5)';

['pointerdown','pointerup'].forEach(function(t){try{c.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:1,pointerType:'touch',isPrimary:true}))}catch(e){}});
