<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hole Eater</title><style>*{margin:0;padding:0}body{background:#0a0a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}.c{border-radius:12px;box-shadow:0 0 60px rgba(0,200,255,.3)}</style></head>
<body><canvas class="c"></canvas>
<script>
const C=document.querySelector('canvas'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=Math.min(window.innerWidth-20,420);H=C.height=Math.min(window.innerHeight-20,720)}resize();window.addEventListener('resize',resize);
let hole,objects,eaten,state,size,trail=[],particles=[],scorePopups=[],shakeTime=0,mx=W/2,my=H/2,pulseT=0,suctionParticles=[];
function init(){hole={x:W/2,y:H/2,r:18};objects=[];eaten=0;size=0;state='play';trail=[];particles=[];scorePopups=[];suctionParticles=[];shakeTime=0;pulseT=0;spawnObjects()}
function spawnObjects(){while(objects.filter(o=>o.alive).length<12){let sz=4+Math.random()*28;objects.push({x:30+Math.random()*(W-60),y:30+Math.random()*(H-60),sz,baseSz:sz,col:`hsl(${Math.random()*360},70%,60%)`,alive:true,orbitAngle:Math.random()*Math.PI*2,orbitSpeed:(Math.random()-.5)*.02,orbitDist:0,glow:Math.random()})}}
C.addEventListener('pointermove',e=>{let r=C.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
document.addEventListener('keydown',e=>{if(e.code==='Space'){if(state==='over'||state==='win')init()}});
function update(){if(state!=='play')return;pulseT+=.03;
hole.x+=(mx-hole.x)*.08;hole.y+=(my-hole.y)*.08;
// Trail
trail.push({x:hole.x,y:hole.y,life:10});for(let t of trail)t.life--;trail=trail.filter(t=>t.life>0);
// Orbit objects
for(let o of objects){if(!o.alive)continue;o.orbitAngle+=o.orbitSpeed;
let dist=Math.hypot(hole.x-o.x,hole.y-o.y);if(dist<hole.r*3&&dist>hole.r){o.orbitDist=Math.max(0,o.orbitDist-.5);o.x=hole.x+Math.cos(o.orbitAngle)*(hole.r*2+o.orbitDist);o.y=hole.y+Math.sin(o.orbitAngle)*(hole.r*2+o.orbitDist)}
else{o.orbitDist=Math.min(50,o.orbitDist+.3)}}
// Eat
for(let o of objects){if(!o.alive)continue;let dist=Math.hypot(hole.x-o.x,hole.y-o.y);
if(dist<hole.r+o.sz*.4){if(o.sz<hole.r*1.3){o.alive=false;eaten++;size++;hole.r+=2.5;shakeTime=4;
scorePopups.push({x:o.x,y:o.y,txt:'GROW!',life:30,vy:-1.5});
for(let i=0;i<8;i++)particles.push({x:o.x,y:o.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:20,s:Math.random()*3+2,col:o.col});
if(eaten>=12){state='win';spawnWinParticles()}}else{suctionParticles.push({x:o.x,y:o.y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:15,s:3,col:'#ff4757'})}}}
// Suction particles toward hole
for(let o of objects){if(!o.alive)continue;let dist=Math.hypot(hole.x-o.x,hole.y-o.y);if(dist<hole.r*2&&o.sz>=hole.r*1.3){suctionParticles.push({x:o.x+(Math.random()-.5)*10,y:o.y+(Math.random()-.5)*10,vx:(hole.x-o.x)*.01,vy:(hole.y-o.y)*.01,life:10,s:1.5,col:o.col+'88'})}}
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.life--}particles=particles.filter(p=>p.life>0);
for(let sp of scorePopups){sp.y+=sp.vy;sp.life--}scorePopups=scorePopups.filter(sp=>sp.life>0);
for(let s of suctionParticles){s.x+=s.vx;s.y+=s.vy;s.vx*=.95;s.vy*=.95;s.life--}suctionParticles=suctionParticles.filter(s=>s.life>0);
if(shakeTime>0)shakeTime--}
function spawnWinParticles(){for(let i=0;i<80;i++){let a=Math.random()*Math.PI*2;particles.push({x:hole.x,y:hole.y,vx:Math.cos(a)*(Math.random()*10+2),vy:Math.sin(a)*(Math.random()*10+2)-3,life:60,s:Math.random()*5+3,col:`hsl(${Math.random()*360},100%,60%)`)}}}
function draw(){X.save();if(shakeTime>0)X.translate((Math.random()-.5)*shakeTime*2,(Math.random()-.5)*shakeTime*2);
X.clearRect(-15,-15,W+30,H+30);
// Deep space background
let grad=X.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.7);grad.addColorStop(0,'#0a0a2a');grad.addColorStop(.5,'#050520');grad.addColorStop(1,'#020210');X.fillStyle=grad;X.fillRect(0,0,W,H);
// Nebula clouds
for(let i=0;i<3;i++){let nx=W*.3+i*W*.25+Math.sin(pulseT+i)*20,ny=H*.4+Math.cos(pulseT*.7+i)*30;let ng=X.createRadialGradient(nx,ny,0,nx,ny,80);ng.addColorStop(0,`hsla(${260+i*40},80%,30%,.08)`);ng.addColorStop(1,'transparent');X.fillStyle=ng;X.fillRect(nx-80,ny-80,160,160)}
// Stars
for(let i=0;i<40;i++){let sx=(i*97+pulseT*10)%W,sy=(i*53+pulseT*5)%H;X.fillStyle=`rgba(255,255,255,${.2+Math.sin(pulseT*2+i)*.15})`;X.beginPath();X.arc(sx,sy,1,0,Math.PI*2);X.fill()}
// Trail
for(let t of trail){X.globalAlpha=t.life/10*.15;X.fillStyle='#0cf';X.beginPath();X.arc(t.x,t.y,hole.r*(t.life/10),0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Objects
for(let o of objects){if(!o.alive)continue;let danger=o.sz>=hole.r*1.3;
X.fillStyle=danger?'rgba(255,71,87,.6)':o.col;X.shadowColor=danger?'#ff4757':o.col;X.shadowBlur=danger?12:6;
X.beginPath();X.arc(o.x,o.y,o.sz*.5,0,Math.PI*2);X.fill();X.shadowBlur=0;
// Shine
X.fillStyle='rgba(255,255,255,.3)';X.beginPath();X.arc(o.x-o.sz*.15,o.y-o.sz*.15,o.sz*.15,0,Math.PI*2);X.fill();
// Danger indicator
if(danger){X.strokeStyle='rgba(255,71,87,.3)';X.lineWidth=1;X.beginPath();X.arc(o.x,o.y,o.sz*.5+4+Math.sin(pulseT*3)*2,0,Math.PI*2);X.stroke()}}
// Suction particles
for(let s of suctionParticles){X.globalAlpha=s.life/10*.4;X.fillStyle=s.col;X.beginPath();X.arc(s.x,s.y,s.s,0,Math.PI*2);X.fill()}X.globalAlpha=1;
// Hole - outer glow
X.fillStyle='rgba(0,200,255,.08)';X.beginPath();X.arc(hole.x,hole.y,hole.r+15+Math.sin(pulseT)*5,0,Math.PI*2);X.fill();
// Hole rim spiral
X.strokeStyle='rgba(0,200,255,.6)';X.lineWidth=2;X.beginPath();for(let a=0;a<Math.PI*4;a+=.1){let sr=hole.r*.3+a*hole.r*.12;X.lineTo(hole.x+Math.cos(a+pulseT*2)*sr,hole.y+Math.sin(a+pulseT*2)*sr)}X.stroke();
// Hole center
X.fillStyle='rgba(0,0,0,.9)';X.beginPath();X.arc(hole.x,hole.y,hole.r*.5,0,Math.PI*2);X.fill();
// Size meter
let meterW=100,meterH=8,meterX=W/2-meterW/2,meterY=H-30;X.fillStyle='rgba(255,255,255,.1)';X.fillRect(meterX,meterY,meterW,meterH);
let fill=Math.min(1,size/12);let mg=X.createLinearGradient(meterX,0,meterX+meterW,0);mg.addColorStop(0,'#0cf');mg.addColorStop(1,'#0984e3');X.fillStyle=mg;X.fillRect(meterX,meterY,meterW*fill,meterH);
X.fillStyle='#fff';X.font='bold 12px "Segoe UI"';X.textAlign='center';X.fillText(size+'/12',W/2,meterY-5);
// Particles
for(let p of particles){X.globalAlpha=p.life/60;X.fillStyle=p.col;X.shadowColor=p.col;X.shadowBlur=8;X.beginPath();X.arc(p.x,p.y,p.s*(p.life/60),0,Math.PI*2);X.fill();X.shadowBlur=0}X.globalAlpha=1;
// Score popups
for(let sp of scorePopups){X.globalAlpha=sp.life/30;X.fillStyle='#0cf';X.shadowColor='#0cf';X.shadowBlur=8;X.font='bold 18px "Segoe UI"';X.textAlign='center';X.fillText(sp.txt,sp.x,sp.y);X.shadowBlur=0}X.globalAlpha=1;
X.restore();
if(state==='win'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);X.fillStyle='#0cf';X.shadowColor='#0cf';X.shadowBlur=20;X.font='bold 38px "Segoe UI"';X.textAlign='center';X.fillText('\u2728 COSMIC HOLE! \u2728',W/2,H/2-20);X.shadowBlur=0;X.font='16px "Segoe UI"';X.fillStyle='rgba(255,255,255,.6)';X.fillText('\u25B6 Tap to play again',W/2,H/2+40)}}
function loop(){update();draw();requestAnimationFrame(loop)}init();loop()
</script></body></html>
