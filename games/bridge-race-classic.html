                    pCtx.beginPath(); pCtx.arc(headX - 16, headY - 12, 3, 0, Math.PI * 2); pCtx.fill();
                    pCtx.beginPath(); pCtx.arc(headX, headY - 14, 3, 0, Math.PI * 2); pCtx.fill();
                    pCtx.beginPath(); pCtx.arc(headX + 16, headY - 12, 3, 0, Math.PI * 2); pCtx.fill();
                    pCtx.fillStyle = '#fff';
                    pCtx.beginPath(); pCtx.arc(headX - 16, headY - 13, 1, 0, Math.PI * 2); pCtx.fill();
                    pCtx.beginPath(); pCtx.arc(headX, headY - 15, 1, 0, Math.PI * 2); pCtx.fill();
                    pCtx.beginPath(); pCtx.arc(headX + 16, headY - 13, 1, 0, Math.PI * 2); pCtx.fill();
                    break;
                case 'necklace':

                    pCtx.arc(headX, headY + 48, 4, 0, Math.PI * 2);

                    pCtx.arc(headX - 1, headY + 47, 1, 0, Math.PI * 2);

        function drawWingsBehind() {
            const acc = items.accessory[F.accessory];
            if (acc.type !== 'wings') return;
            pCtx.save();
            const flap = Math.sin(F.sparkleAnim * 2) * 0.08;
            pCtx.translate(PRINCESS_X, 280);

            // Left wing

            pCtx.rotate(-0.2 + flap);
            const wingGrad1 = pCtx.createLinearGradient(0, 0, -80, -40);
            wingGrad1.addColorStop(0, acc.color);
            wingGrad1.addColorStop(1, acc.accent);
            pCtx.fillStyle = wingGrad1;
            pCtx.globalAlpha = 0.7;
            pCtx.beginPath();
            pCtx.moveTo(0, 0);
            pCtx.quadraticCurveTo(-50, -30, -80, -10);
            pCtx.quadraticCurveTo(-70, 20, -40, 25);
            pCtx.quadraticCurveTo(-20, 15, 0, 0);
            pCtx.closePath();
            pCtx.fill();
            pCtx.strokeStyle = 'rgba(255,255,255,0.4)';

            pCtx.restore();

            pCtx.restore();

        // ─── MAIN: drawPrincess ───
        function drawPrincess() {
            drawBackground();
            drawFloor();
            drawWingsBehind();
            drawShadow();

            // Body parts in render order
            drawLegs(items.dresses[F.dress]);
            drawShoes();
            drawDress();
            drawNeckAndHead();
            drawAccessory();

            // Particles overlay
            for (const pt of F.particles) {
                const a = pt.life / pt.maxLife;
                pCtx.globalAlpha = a;
                pCtx.fillStyle = pt.color;
                pCtx.shadowColor = pt.color;
                pCtx.shadowBlur = 8;
                pCtx.beginPath();
                pCtx.arc(pt.x, pt.y, pt.size * a, 0, Math.PI * 2);
                pCtx.fill();
            }
            pCtx.globalAlpha = 1;
            pCtx.shadowBlur = 0;
        }

        function drawItemPreview(category, item, x, y) {
            switch (category) {
                case 'dresses':
                    const dressGrad = pCtx.createLinearGradient(x, y - 20, x, y + 20);
                    dressGrad.addColorStop(0, item.c1);
                    dressGrad.addColorStop(1, item.c2);
                    pCtx.fillStyle = dressGrad;
                    pCtx.beginPath();
                    pCtx.moveTo(x - 12, y - 18);
                    pCtx.lineTo(x - 8, y - 8);
                    pCtx.lineTo(x - 22, y + 18);
                    pCtx.lineTo(x + 22, y + 18);
                    pCtx.lineTo(x + 8, y - 8);
                    pCtx.lineTo(x + 12, y - 18);
                    pCtx.closePath();
                    pCtx.fill();
                    pCtx.fillStyle = item.accent;
                    pCtx.fillRect(x - 22, y + 14, 44, 2);
                    break;
                case 'hair':
                    pCtx.fillStyle = item.color;
                    pCtx.beginPath();
                    pCtx.arc(x, y - 8, 14, 0, Math.PI * 2);
                    pCtx.fill();
                    pCtx.fillStyle = lightenColor(item.color, 0.3);
                    pCtx.globalAlpha = 0.5;
                    pCtx.beginPath();
                    pCtx.ellipse(x - 4, y - 12, 4, 2, -0.3, 0, Math.PI * 2);
                    pCtx.fill();
                    pCtx.globalAlpha = 1;
                    break;
                case 'shoes':
                    pCtx.fillStyle = item.color;
                    pCtx.beginPath();
                    if (item.type === 'heels') {
                        pCtx.moveTo(x - 14, y + 4);
                        pCtx.lineTo(x - 8, y);
                        pCtx.lineTo(x + 10, y);
                        pCtx.lineTo(x + 14, y + 4);
                        pCtx.lineTo(x + 14, y + 8);
                        pCtx.lineTo(x - 14, y + 8);
                        pCtx.closePath();
                    } else if (item.type === 'boots' || item.type === 'combat') {
                        pCtx.fillRect(x - 8, y - 8, 16, 16);
                    } else {
                        pCtx.ellipse(x, y + 4, 14, 5, 0, 0, Math.PI * 2);
                    }
                    pCtx.fill();
                    pCtx.fillStyle = item.accent;
                    pCtx.beginPath();
                    pCtx.ellipse(x + 4, y + 2, 4, 1.5, 0, 0, Math.PI * 2);
                    pCtx.fill();
                    break;
                case 'accessory':
                    if (item.type === 'none') {
                        pCtx.fillStyle = 'rgba(255,255,255,0.3)';
                        pCtx.font = '20px sans-serif';
                        pCtx.textAlign = 'center';
                        pCtx.fillText('∅', x, y);
                    } else if (item.type === 'tiara' || item.type === 'crown') {
                        pCtx.fillStyle = item.color;
                        pCtx.beginPath();
                        pCtx.moveTo(x - 14, y + 6);
                        pCtx.lineTo(x - 14, y - 2);
                        pCtx.lineTo(x + 14, y - 2);
                        pCtx.lineTo(x + 14, y + 6);
                        pCtx.lineTo(x + 8, y);
                        pCtx.lineTo(x, y - 8);
                        pCtx.lineTo(x - 8, y);
                        pCtx.closePath();
                        pCtx.fill();
                        if (item.gem) {
                            pCtx.fillStyle = item.gem;
                            pCtx.beginPath();
                            pCtx.arc(x, y - 4, 2, 0, Math.PI * 2);
                            pCtx.fill();
                        }
                    } else if (item.type === 'wings') {
                        pCtx.fillStyle = item.color;
                        pCtx.globalAlpha = 0.7;
                        pCtx.beginPath();
                        pCtx.ellipse(x - 10, y, 8, 14, 0.3, 0, Math.PI * 2);
                        pCtx.fill();
                        pCtx.beginPath();
                        pCtx.ellipse(x + 10, y, 8, 14, -0.3, 0, Math.PI * 2);
                        pCtx.fill();
                        pCtx.globalAlpha = 1;
                    } else if (item.type === 'necklace') {
                        pCtx.strokeStyle = item.color;
                        pCtx.lineWidth = 2;
                        pCtx.beginPath();
                        pCtx.arc(x, y - 6, 14, 0.3, Math.PI - 0.3);
                        pCtx.stroke();
                        pCtx.fillStyle = item.gem || '#fff';
                        pCtx.beginPath();
                        pCtx.arc(x, y + 6, 4, 0, Math.PI * 2);
                        pCtx.fill();
                    } else {
                        pCtx.strokeStyle = item.color;
                        pCtx.lineWidth = 3;
                        pCtx.lineCap = 'round';
                        pCtx.beginPath();
                        pCtx.moveTo(x - 8, y + 8);
                        pCtx.lineTo(x + 8, y - 10);
                        pCtx.stroke();
                        pCtx.fillStyle = item.gem;
                        pCtx.beginPath();
                        pCtx.arc(x + 9, y - 11, 4, 0, Math.PI * 2);
                        pCtx.fill();
                    }
                    break;
                case 'bg':
                    const bgGrad = pCtx.createLinearGradient(x - 16, y - 16, x + 16, y + 16);
                    bgGrad.addColorStop(0, item.c1);
                    bgGrad.addColorStop(1, item.c2);
                    pCtx.fillStyle = bgGrad;
                    pCtx.beginPath();
                    pCtx.roundRect(x - 16, y - 16, 32, 32, 6);
                    pCtx.fill();
                    break;
            }
        }

        function getSelectedIdx() {
            return F[F.category];
        }

        function truncate(str, n) {
            return str.length > n ? str.substring(0, n - 1) + '…' : str;
        }

        function capitalize(s) {
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        // ─── Click handling ───
        function getCanvasCoords(e) {
            const rect = pCanvas.getBoundingClientRect();
            const scaleX = PW / rect.width;
            const scaleY = PH / rect.height;
            let clientX, clientY;
            if (e.touches && e.touches[0]) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
            };
        }

        function handlePrincessClick(e) {
            if (currentGame !== 'princess') return;
            const { x, y } = getCanvasCoords(e);

            // Category tabs
            const tabs = ['dresses', 'hair', 'shoes', 'accessory', 'bg'];
            const tabW = 60;
            const tabH = 50;
            const tabY = 64;
            const tabsTotalW = tabs.length * tabW + (tabs.length - 1) * 4;
            const tabsStartX = SIDEBAR_X + (SIDEBAR_W - tabsTotalW) / 2;
            for (let i = 0; i < tabs.length; i++) {
                const tx = tabsStartX + i * (tabW + 4);
                if (x >= tx && x <= tx + tabW && y >= tabY && y <= tabY + tabH) {
                    F.category = tabs[i];
                    return;
                }
            }

            // Item grid
            const list = items[F.category];
            const cols = 4;
            const cellW = 65;
            const cellH = 80;
            const gridW = cols * cellW + (cols - 1) * 6;
            const gridStartX = SIDEBAR_X + (SIDEBAR_W - gridW) / 2;
            const gridStartY = 130;
            for (let i = 0; i < list.length; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const ix = gridStartX + col * (cellW + 6);
                const iy = gridStartY + row * (cellH + 6);
                if (x >= ix && x <= ix + cellW && y >= iy && y <= iy + cellH) {
                    F[F.category] = i;
                    spawnSparkles(PRINCESS_X, 280, 14);
                    updatePrincessHUD();
                    return;
                }
            }

            // Buttons
            const btnY = PH - 70;
            const btnW = 130;
            const btnGap = 10;
            const totalW = btnW * 2 + btnGap;
            const btnStartX = SIDEBAR_X + (SIDEBAR_W - totalW) / 2;
            // Random
            if (x >= btnStartX && x <= btnStartX + btnW && y >= btnY && y <= btnY + 36) {
                randomizePrincess();
                return;
            }
            // Reset
            if (x >= btnStartX + btnW + btnGap && x <= btnStartX + btnW + btnGap + btnW && y >= btnY && y <= btnY + 36) {
                resetPrincess();
                return;
            }
        }

        function randomizePrincess() {
            F.dress = Math.floor(Math.random() * items.dresses.length);
            F.hair = Math.floor(Math.random() * items.hair.length);
            F.shoes = Math.floor(Math.random() * items.shoes.length);
            F.accessory = Math.floor(Math.random() * items.accessory.length);
            F.bg = Math.floor(Math.random() * items.bg.length);
            spawnSparkles(PRINCESS_X, 250, 30);
            spawnSparkles(PRINCESS_X + 50, 280, 20);
            updatePrincessHUD();
        }

        function resetPrincess() {
            F.dress = 0; F.hair = 0; F.shoes = 0; F.accessory = 0; F.bg = 0;
            F.category = 'dresses';
            spawnSparkles(PRINCESS_X, 280, 25);
            updatePrincessHUD();
        }

        function updatePrincessHUD() {
            dressNameEl.textContent = items.dresses[F.dress].name;
            hairNameEl.textContent = items.hair[F.hair].name;
        }

        pCanvas.addEventListener('click', handlePrincessClick);
        pCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handlePrincessClick(e);
        }, { passive: false });

        document.getElementById('randomBtn').addEventListener('click', randomizePrincess);
        document.getElementById('resetBtn').addEventListener('click', resetPrincess);

        // ─── Render Princess ───
        function renderPrincess() {
            fitCanvas(pCanvas, pCtx, PW, PH);
            pCtx.clearRect(0, 0, PW, PH);
            drawPrincess();
            drawSidebar();
        }

        // ─── Main loop (princess) ───
        function princessLoop() {
            updatePrincess();
            if (currentGame === 'princess') {
                renderPrincess();
            }
            requestAnimationFrame(princessLoop);
        }

        // Initialize princess HUD
        updatePrincessHUD();
        princessLoop();
    </script>

</body>
