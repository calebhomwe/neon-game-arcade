<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mini Life Sim</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --good: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 12px 16px;
      background: #020617;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-right: 8px;
    }

    .stat {
      background: var(--panel-2);
      padding: 8px 10px;
      border-radius: 10px;
      min-width: 80px;
      text-align: center;
    }

    .stat.small {
      min-width: 56px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }

    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.15);
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    label {
      display: flex;
      gap: 6px;
      align-items: center;
      background: var(--panel-2);
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    main {
      display: flex;
      gap: 12px;
      padding: 12px;
      align-items: flex-start;
    }

    aside {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
    }

    #needs {
      width: 240px;
      display: grid;
      gap: 10px;
    }

    #side {
      width: 300px;
      display: grid;
      gap: 12px;
    }

    #canvas-wrap {
      flex: 1;
      display: grid;
      place-items: center;
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      overflow: auto;
    }

    canvas {
      background: white;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .need {
      display: grid;
      gap: 4px;
    }

    .need-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
    }

    .bar {
      height: 14px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 50%;
      transition: width 0.15s linear;
    }

    .bar-fill.good {
      background: var(--good);
    }

    .bar-fill.warn {
      background: var(--warn);
    }

    .bar-fill.bad {
      background: var(--bad);
    }

    #objectName {
      font-size: 18px;
      margin-bottom: 10px;
    }

    #objectActions {
      display: grid;
      gap: 8px;
    }

    .action {
      display: grid;
      gap: 2px;
      text-align: left;
      padding: 10px;
    }

    .action small {
      color: var(--muted);
    }

    .current {
      background: var(--panel-2);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .notification {
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px solid #334155;
      color: #e5e7eb;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    @media (max-width: 1200px) {
      main {
        flex-wrap: wrap;
      }

      #needs,
      #side {
        width: 100%;
      }
    }

    /* Keep the desktop 3-column layout at every width above the phone
       breakpoint instead of letting the side panels stack full-width and
       push the page taller than the viewport; each panel scrolls within
       its own bounded height instead. */
    @media (min-width: 701px) {
      body {
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1 1 auto;
        min-height: 0;
        flex-wrap: nowrap;
        align-items: stretch;
        overflow: hidden;
      }

      #needs {
        width: 240px;
        max-height: 100%;
        overflow-y: auto;
      }

      #side {
        width: 300px;
        max-height: 100%;
        overflow-y: auto;
      }

      #canvas-wrap {
        max-height: 100%;
      }
    }
  
    /* iPhone/touch playability */
    button, label, canvas { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    body { min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
    @media (max-width: 700px) {
      header { padding: calc(8px + env(safe-area-inset-top)) 8px 8px; gap: 6px; position: relative; }
      .title { width: 100%; font-size: 18px; }
      .stat, .stat.small { min-width: 0; flex: 1; padding: 7px 6px; font-size: 13px; }
      .controls { width: 100%; margin-left: 0; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 3px; }
      .controls button, .controls label { flex: 0 0 auto; min-height: 42px; }
      main { display: grid; grid-template-columns: 1fr; padding: 6px; gap: 8px; }
      #canvas-wrap { order: -3; width: 100%; padding: 3px; overflow: hidden; border-radius: 10px; }
      canvas { width: 100%; height: auto; border-radius: 8px; }
      #needs { order: -2; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      #needs h2 { grid-column: 1 / -1; margin: 0; }
      #side { order: -1; }
      #needs, #side { width: 100%; padding: 10px; }
      #objectActions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .notification { font-size: 12px; }
    }
    /* ── arcade additions: title card, coach, goals, inventory, day summary ── */
    button { min-height: 40px; min-width: 40px; }
    .overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
      background: rgba(2, 6, 23, 0.82); }
    .overlay[hidden] { display: none; }
    .card { width: min(440px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--panel);
      border: 1px solid #334155; border-radius: 16px; padding: 20px; text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
    .card h1 { margin: 0 0 4px; font-size: 30px; }
    .card p { color: var(--muted); margin: 6px 0 12px; line-height: 1.45; font-size: 15px; }
    .card .big { font-size: 44px; line-height: 1; margin: 6px 0; }
    .card button { width: 100%; margin: 6px 0; min-height: 44px; font-size: 16px; }
    .card button.primary { background: var(--accent); border-color: var(--accent); font-weight: bold; }
    .seg { display: flex; gap: 6px; margin: 4px 0 8px; }
    .seg button { flex: 1; margin: 0; }
    .row { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px solid #334155; font-size: 15px; }
    #coach { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 40; width: min(460px, calc(100vw - 20px)); background: #0b1224; border: 2px solid var(--accent);
      border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 12px 34px rgba(0,0,0,.6); }
    #coach[hidden] { display: none; }
    #coach .ct { flex: 1; font-size: 15px; line-height: 1.4; }
    #coach .ct b { color: #93c5fd; }
    #coach .step { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
    .goal { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 4px 0; color: #e5e7eb; }
    .goal.done { color: var(--good); }
    .goal .box { flex: 0 0 auto; }
    .inv { display: flex; flex-wrap: wrap; gap: 6px; }
    .inv span { background: var(--panel-2); border-radius: 8px; padding: 6px 8px; font-size: 14px; }
    #codesOn { position: fixed; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 45;
      background: var(--warn); color: #111827; font: bold 12px Arial, sans-serif; letter-spacing: .1em;
      text-transform: uppercase; border-radius: 8px; padding: 5px 9px; pointer-events: none; }
    #autonomy[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
    @media (prefers-reduced-motion: reduce) {
      .bar-fill { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Mini Life Sim</div>
    <div class="stat" id="clock">Day 1 08:00</div>
    <div class="stat small" id="money">$120</div>
    <div class="stat small" id="mood">🙂</div>

    <div class="controls">
      <button id="pauseBtn">Pause</button>
      <button class="speed" data-speed="1">1x</button>
      <button class="speed active" data-speed="5">5x</button>
      <button class="speed" data-speed="15">15x</button>
      <button class="speed" data-speed="60">60x</button>
      <button id="autonomy" aria-pressed="true" title="Let your Sim look after itself">Autonomy: on</button>
      <button id="saveBtn">Save</button>
      <button id="loadBtn">Load</button>
      <button id="resetBtn">Reset</button>
    </div>
  </header>

  <main>
    <aside id="needs"></aside>

    <div id="canvas-wrap">
      <canvas id="game" width="960" height="600"></canvas>
    </div>

    <aside id="side">
      <div>
        <h2>Selected</h2>
        <div id="objectName">None</div>
        <div id="objectActions"></div>
      </div>

      <div>
        <h2 id="goalsTitle">Today's goals</h2>
        <div id="goalList"></div>
      </div>
      <div>
        <h2>Inventory</h2>
        <div class="inv" id="invList"></div>
      </div>
      <div>
        <h2>Log</h2>
        <div id="notificationList"></div>
      </div>
    </aside>
  </main>
  <div id="codesOn" hidden>Codes on</div>
  <div id="coach" hidden role="status" aria-live="polite">
    <div class="ct"><span class="step" id="coachStep"></span><span id="coachTxt"></span></div>
    <button id="coachNext">Next</button>
    <button id="coachSkip">Skip</button>
  </div>
  <div class="overlay" id="titleCard" role="dialog" aria-modal="true" aria-labelledby="titleH">
    <div class="card">
      <div class="big" aria-hidden="true">🏠🙂</div>
      <h1 id="titleH">Mini Life Sim</h1>
      <p>Look after your Sim: keep six needs healthy, earn money at the computer and finish each day's goals.</p>
      <div class="seg" role="group" aria-label="Difficulty">
        <button class="diff" data-diff="relaxed">Relaxed</button>
        <button class="diff" data-diff="normal">Normal</button>
        <button class="diff" data-diff="hard">Hard</button>
      </div>
      <p id="diffNote" style="margin-top:0;font-size:13px"></p>
      <button class="primary" id="continueBtn" hidden>Continue</button>
      <button class="primary" id="newBtn">New life</button>
      <button id="gfxBtn">Graphics: High</button>
      <p id="bestLine" style="font-size:13px"></p>
    </div>
  </div>
  <div class="overlay" id="dayCard" hidden role="dialog" aria-modal="true" aria-labelledby="dayH">
    <div class="card">
      <h1 id="dayH">Day 1 done</h1>
      <div class="big" id="dayMood"></div>
      <div id="dayRows"></div>
      <button class="primary" id="dayNext">Start the next day</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    /* The house is laid out on a 960x600 board; the backing store follows the screen's pixel ratio. */
    const LW = 960, LH = 600;
    let RES = 1;
    /* Graphics: High draws at the screen's pixel ratio (up to 2x), Low at 1x for slower devices. */
    let gfxLow = false; try { gfxLow = localStorage.getItem("mls_gfx") === "low"; } catch (e) {}
    function fitCanvas() {
      RES = gfxLow ? 1 : Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(LW * RES); canvas.height = Math.round(LH * RES);
    }
    fitCanvas();
    window.addEventListener("resize", () => { if ((gfxLow ? 1 : Math.min(window.devicePixelRatio || 1, 2)) !== RES) fitCanvas(); });
    /* Caleb's Arcade SDK (guarded: the game still runs without it) */
    const SDK = window.ArcadeSDK || null;
    const sdkState = (scene, score) => { try { SDK && SDK.state(score == null ? { scene } : { scene, score }); } catch (e) {} };
    const sfx = (n) => { try { SDK && SDK.sfx(n); } catch (e) {} };
    const DIFF = { relaxed: { decay: 0.6, note: "Needs drop 40% slower and groceries are cheaper." }, normal: { decay: 1, note: "The standard pace." },
      hard: { decay: 1.4, note: "Needs drop 40% faster and groceries cost more." } };
    const GROCERY_PRICE = { relaxed: 15, normal: 18, hard: 24 };

    const NEEDS = [
      { id: "hunger", label: "Hunger" },
      { id: "bladder", label: "Bladder" },
      { id: "energy", label: "Energy" },
      { id: "hygiene", label: "Hygiene" },
      { id: "fun", label: "Fun" },
      { id: "social", label: "Social" }
    ];

    const OBJECTS = [
      { id: "fridge", name: "Fridge", emoji: "🧊", x: 45, y: 70, w: 64, h: 64 },
      { id: "stove", name: "Stove", emoji: "🍳", x: 135, y: 70, w: 64, h: 64 },
      { id: "sink", name: "Sink", emoji: "🚰", x: 225, y: 70, w: 64, h: 64 },
      { id: "trash", name: "Trash", emoji: "🗑️", x: 315, y: 150, w: 50, h: 50 },
      { id: "toilet", name: "Toilet", emoji: "🚽", x: 665, y: 70, w: 64, h: 64 },
      { id: "shower", name: "Shower", emoji: "🚿", x: 775, y: 70, w: 64, h: 64 },
      { id: "bathSink", name: "Sink", emoji: "🧼", x: 880, y: 70, w: 64, h: 64 },
      { id: "bed", name: "Bed", emoji: "🛏️", x: 45, y: 430, w: 130, h: 80 },
      { id: "tv", name: "TV", emoji: "📺", x: 665, y: 430, w: 80, h: 50 },
      { id: "sofa", name: "Sofa", emoji: "🛋️", x: 780, y: 480, w: 100, h: 50 },
      { id: "computer", name: "Computer", emoji: "💻", x: 875, y: 390, w: 64, h: 64 },
      { id: "phone", name: "Phone", emoji: "📱", x: 470, y: 290, w: 48, h: 48 }
    ];

    const ACTIONS = {
      snack: {
        label: "Grab Snack",
        objectIds: ["fridge"],
        duration: 10,
        uses: { groceries: 1 },
        effects: { hunger: 25, hygiene: -1, fun: 1 },
        notify: "Ate a snack."
      },
      cook: {
        label: "Cook Meal",
        objectIds: ["stove"],
        duration: 35,
        uses: { groceries: 2 },
        effects: { hunger: 65, fun: 4, energy: -4, hygiene: -2 },
        notify: "Cooked and ate a meal."
      },
      wash: {
        label: "Wash Hands",
        objectIds: ["sink", "bathSink"],
        duration: 4,
        effects: { hygiene: 6, fun: 1 },
        notify: "Washed hands."
      },
      toilet: {
        label: "Use Toilet",
        objectIds: ["toilet"],
        duration: 10,
        effects: { bladder: 95, hygiene: -1 },
        notify: "Used the toilet."
      },
      shower: {
        label: "Take Shower",
        objectIds: ["shower"],
        duration: 25,
        effects: { hygiene: 85, energy: 3, fun: 2 },
        notify: "Took a shower."
      },
      nap: {
        label: "Nap",
        objectIds: ["bed"],
        duration: 60,
        effects: { energy: 35, hunger: -4, bladder: -4 },
        notify: "Took a nap."
      },
      sleep: {
        label: "Sleep",
        objectIds: ["bed"],
        duration: 360,
        effects: { energy: 95, hunger: -8, bladder: -8, hygiene: -2 },
        notify: "Slept and recovered energy."
      },
      watch: {
        label: "Watch TV",
        objectIds: ["tv"],
        duration: 35,
        effects: { fun: 50, energy: -2, social: 4 },
        notify: "Watched TV."
      },
      sit: {
        label: "Relax on Sofa",
        objectIds: ["sofa"],
        duration: 20,
        effects: { energy: 12, fun: 10, social: 2 },
        notify: "Relaxed on the sofa."
      },
      work: {
        label: "Work",
        objectIds: ["computer"],
        duration: 120,
        money: 140,
        effects: { energy: -18, fun: -12, hygiene: -6, social: -4 },
        notify: "Finished work and earned money."
      },
      browse: {
        label: "Browse Internet",
        objectIds: ["computer"],
        duration: 20,
        effects: { fun: 22, social: 6, energy: -2 },
        notify: "Browsed the internet."
      },
      call: {
        label: "Call Friend",
        objectIds: ["phone"],
        duration: 25,
        effects: { social: 65, fun: 12, energy: -3 },
        notify: "Called a friend."
      },
      groceries: {
        label: "Order Groceries",
        objectIds: ["phone"],
        duration: 10,
        cost: 18,
        gives: { groceries: 6 },
        effects: { fun: 2 },
        notify: "Groceries delivered: +6 in the fridge."
      },
      clean: {
        label: "Clean Up",
        objectIds: ["trash"],
        duration: 25,
        effects: { hygiene: 10, fun: -4, energy: -6 },
        notify: "Cleaned up the house."
      }
    };

    const DECAY = {
      hunger: -0.045,
      bladder: -0.055,
      energy: -0.035,
      hygiene: -0.035,
      fun: -0.040,
      social: -0.025
    };

    function createInitialState() {
      return {
        time: 8 * 60,
        day: 1,
        speed: 5,
        paused: false,
        autonomy: true,
        money: 120,
        needs: {
          hunger: 80,
          bladder: 80,
          energy: 80,
          hygiene: 80,
          fun: 80,
          social: 80
        },
        char: {
          x: 480,
          y: 300
        },
        moveTarget: null,
        currentAction: null,
        selectedObject: null,
        notifications: [],
        warnings: {},
        autonomyCooldown: 0,
        diff: "normal",
        inventory: { groceries: 6, trophies: 0 },
        stats: { earned: 0, meals: 0, showers: 0, calls: 0, actions: 0 },
        goals: [],
        lastHour: 8,
        daysDone: 0
      };
    }

    let state = createInitialState();

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function formatClock() {
      const h = Math.floor(state.time / 60) % 24;
      const m = Math.floor(state.time % 60);
      return `Day ${state.day} ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function notify(msg) {
      state.notifications.unshift({ time: formatClock(), msg });
      state.notifications = state.notifications.slice(0, 10);
      renderNotifications();
    }

    /* ── daily goals, inventory, autosave ── */
    const GOAL_POOL = [
      { id: "earn", text: (n) => `Earn $${n} at the computer`, n: [140, 280], check: (s, n) => s.stats.earned >= n },
      { id: "cook", text: () => "Cook a meal", n: [1, 1], check: (s) => s.stats.meals >= 1 },
      { id: "shower", text: () => "Take a shower", n: [1, 1], check: (s) => s.stats.showers >= 1 },
      { id: "call", text: () => "Call a friend", n: [1, 1], check: (s) => s.stats.calls >= 1 },
      { id: "happy", text: () => "Get your mood to 😄", n: [1, 1], check: () => moodEmoji() === "😄" },
      { id: "busy", text: (n) => `Finish ${n} activities`, n: [8, 12], check: (s, n) => s.stats.actions >= n }
    ];
    function newGoals() {
      const pool = GOAL_POOL.slice(); const out = [];
      while (out.length < 3 && pool.length) {
        const g = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        const n = g.n[0] + Math.floor(Math.random() * (g.n[1] - g.n[0] + 1));
        out.push({ id: g.id, n, text: g.text(n), done: false });
      }
      state.goals = out;
      state.stats = { earned: 0, meals: 0, showers: 0, calls: 0, actions: 0 };
      renderGoals();
    }
    function checkGoals() {
      let changed = false;
      state.goals.forEach((g) => {
        const def = GOAL_POOL.find((d) => d.id === g.id);
        if (!g.done && def && def.check(state, g.n)) {
          g.done = true; changed = true; state.money += 25;
          notify(`Goal done: ${g.text} (+$25)`); sfx("levelup");
        }
      });
      if (changed) renderGoals();
    }
    function renderGoals() {
      const el = document.getElementById("goalList"); if (!el) return;
      document.getElementById("goalsTitle").textContent = `Day ${state.day} goals`;
      el.innerHTML = "";
      state.goals.forEach((g) => {
        const d = document.createElement("div");
        d.className = "goal" + (g.done ? " done" : "");
        d.innerHTML = `<span class="box">${g.done ? "✅" : "⬜"}</span><span></span>`;
        d.lastChild.textContent = g.text + (g.done ? "" : "  (+$25)");
        el.appendChild(d);
      });
    }
    function renderInventory() {
      const el = document.getElementById("invList"); if (!el) return;
      const inv = state.inventory;
      el.innerHTML = "";
      [["🥫 Groceries", inv.groceries], ["🏆 Trophies", inv.trophies]].forEach(([k, v]) => {
        const s = document.createElement("span"); s.textContent = `${k}: ${v}`; el.appendChild(s);
      });
    }
    function cheatedNow() { return !!((SDK && SDK.cheated) || Object.keys(cheat).some((k) => cheat[k])); }
    function autosave() {
      try { localStorage.setItem("miniLifeSimSave", JSON.stringify(state)); } catch (e) {}
    }
    function readBest() { try { return JSON.parse(localStorage.getItem("mls_best")) || { days: 0, trophies: 0 }; } catch (e) { return { days: 0, trophies: 0 }; } }
    function endOfDay() {
      /* end-of-day summary: goals, money, mood; a trophy for a clean sweep */
      const done = state.goals.filter((g) => g.done).length;
      if (done === state.goals.length && done) { state.inventory.trophies += 1; }
      state.daysDone += 1;
      const best = readBest();
      if (!cheatedNow()) {
        best.days = Math.max(best.days, state.daysDone); best.trophies = Math.max(best.trophies, state.inventory.trophies);
        try { localStorage.setItem("mls_best", JSON.stringify(best)); } catch (e) {}
      }
      document.getElementById("dayH").textContent = `Day ${state.day - 1} done`;
      document.getElementById("dayMood").textContent = moodEmoji();
      const rows = [["Goals", `${done} of ${state.goals.length}` + (done === state.goals.length ? " 🏆" : "")],
        ["Money earned", `$${Math.round(state.stats.earned)}`], ["Money now", `$${Math.round(state.money)}`],
        ["Groceries left", state.inventory.groceries], ["Days lived", state.daysDone], ["Best", `${best.days} days`]];
      if (cheatedNow()) rows.push(["Codes on", "Best not saved"]);
      const box = document.getElementById("dayRows"); box.innerHTML = "";
      rows.forEach(([a, b]) => { const r = document.createElement("div"); r.className = "row";
        r.innerHTML = "<span></span><b></b>"; r.firstChild.textContent = a; r.lastChild.textContent = b; box.appendChild(r); });
      document.getElementById("dayCard").hidden = false;
      state.paused = true; dayPause = true;
      sfx(done === state.goals.length ? "win" : "reward");
      sdkState("over", state.daysDone);
      newGoals(); autosave(); updateHUD();
    }
    let dayPause = false;

    function renderNotifications() {
      const el = document.getElementById("notificationList");
      el.innerHTML = "";

      state.notifications.forEach((n) => {
        const div = document.createElement("div");
        div.className = "notification";
        div.textContent = `[${n.time}] ${n.msg}`;
        el.appendChild(div);
      });
    }

    function buildNeedsUI() {
      const needsPanel = document.getElementById("needs");
      needsPanel.innerHTML = "<h2>Needs</h2>";

      NEEDS.forEach((need) => {
        const div = document.createElement("div");
        div.className = "need";
        div.innerHTML = `
          <div class="need-label">
            <span>${need.label}</span>
            <span id="value-${need.id}">0</span>
          </div>
          <div class="bar">
            <div id="bar-${need.id}" class="bar-fill good"></div>
          </div>
        `;
        needsPanel.appendChild(div);
      });
    }

    function moodEmoji() {
      const avg =
        NEEDS.reduce((sum, need) => sum + state.needs[need.id], 0) /
        NEEDS.length;

      if (avg > 75) return "😄";
      if (avg > 55) return "🙂";
      if (avg > 35) return "😐";
      if (avg > 20) return "😟";
      return "😭";
    }

    function updateHUD() {
      document.getElementById("clock").textContent = formatClock();
      document.getElementById("money").textContent = `$${Math.round(state.money)}`;
      document.getElementById("mood").textContent = moodEmoji();
      const ab = document.getElementById("autonomy");
      ab.setAttribute("aria-pressed", String(!!state.autonomy)); ab.textContent = "Autonomy: " + (state.autonomy ? "on" : "off");
      renderInventory();

      NEEDS.forEach((need) => {
        const value = Math.round(state.needs[need.id]);
        const bar = document.getElementById(`bar-${need.id}`);
        const label = document.getElementById(`value-${need.id}`);

        if (bar) {
          bar.style.width = `${value}%`;
          bar.className = `bar-fill ${value > 60 ? "good" : value > 30 ? "warn" : "bad"}`;
        }

        if (label) {
          label.textContent = value;
        }
      });

      document.querySelectorAll(".speed").forEach((btn) => {
        btn.classList.toggle(
          "active",
          Number(btn.dataset.speed) === state.speed && !state.paused
        );
      });
    }

    function renderPanel() {
      const objectName = document.getElementById("objectName");
      const objectActions = document.getElementById("objectActions");

      objectActions.innerHTML = "";

      if (state.currentAction) {
        const action = state.currentAction;

        objectName.textContent = action.label;

        const current = document.createElement("div");
        current.className = "current";
        current.innerHTML = `
          <strong>${action.label}</strong><br />
          ${action.phase === "move" ? `Moving to ${action.targetName}` : "Doing action"}<br />
          ${action.phase === "doing" ? `${Math.floor(action.elapsed)} / ${action.duration} min` : ""}
        `;

        const cancel = document.createElement("button");
        cancel.textContent = "Cancel Action";
        cancel.onclick = () => {
          state.currentAction = null;
          state.moveTarget = null;
          notify("Action cancelled.");
          renderPanel();
        };

        objectActions.appendChild(current);
        objectActions.appendChild(cancel);
        return;
      }

      const obj = OBJECTS.find((o) => o.id === state.selectedObject);

      if (!obj) {
        objectName.textContent = "None";
        objectActions.innerHTML = `
          <div class="hint">
            Click an object to choose an interaction.<br /><br />
            Click the floor to move.<br /><br />
            Keep needs healthy, earn money, and survive the day.
          </div>
        `;
        return;
      }

      objectName.textContent = `${obj.emoji} ${obj.name}`;

      const actions = Object.entries(ACTIONS).filter(([, action]) =>
        action.objectIds.includes(obj.id)
      );

      if (!actions.length) {
        objectActions.innerHTML = `<div class="hint">No interactions available.</div>`;
        return;
      }

      actions.forEach(([id, action]) => {
        const btn = document.createElement("button");
        btn.className = "action";

        const costText = action.cost ? `-$${action.cost}` : "";
        const moneyText = action.money ? `+$${action.money}` : "";
        const moneyParts = [costText, moneyText].filter(Boolean).join(" ");

        btn.innerHTML = `
          <span>${action.label}</span>
          <small>${action.duration} min ${moneyParts}</small>
        `;

        btn.onclick = () => startAction(id);
        objectActions.appendChild(btn);
      });
    }

    function applyEffects(effects) {
      if (!effects) return;

      for (const [key, value] of Object.entries(effects)) {
        if (state.needs[key] !== undefined) {
          state.needs[key] = clamp(state.needs[key] + value, 0, 100);
        }
      }
    }

    function startAction(id) {
      const action = ACTIONS[id];
      if (!action) return;

      const price = actionCost(action);
      if (price && state.money < price) {
        notify(`Not enough money for ${action.label}.`); sfx("error");
        return;
      }
      if (action.uses && Object.entries(action.uses).some(([k, n]) => (state.inventory[k] || 0) < n)) {
        notify(`No groceries left: order some on the phone.`); sfx("error");
        return;
      }

      const targetId =
        state.selectedObject && action.objectIds.includes(state.selectedObject)
          ? state.selectedObject
          : action.objectIds[0];

      const obj = OBJECTS.find((o) => o.id === targetId);
      if (!obj) return;

      state.selectedObject = obj.id;
      state.moveTarget = null;

      state.currentAction = {
        id,
        label: action.label,
        duration: action.duration,
        cost: price || 0,
        money: action.money || 0,
        uses: action.uses || null,
        gives: action.gives || null,
        effects: action.effects || {},
        notify: action.notify || `${action.label} finished.`,
        phase: "move",
        elapsed: 0,
        targetX: obj.x + obj.w / 2,
        targetY: obj.y + obj.h / 2,
        targetName: obj.name
      };

      renderPanel();
    }

    function completeAction() {
      const action = state.currentAction;
      if (!action) return;

      if (action.cost) {
        state.money -= action.cost;
      }

      if (action.money) {
        state.money += action.money; state.stats.earned += action.money; sfx("coin");
      } else sfx("collect");
      if (action.uses) for (const [k, n] of Object.entries(action.uses)) state.inventory[k] = Math.max(0, (state.inventory[k] || 0) - n);
      if (action.gives) for (const [k, n] of Object.entries(action.gives)) state.inventory[k] = (state.inventory[k] || 0) + n;
      state.stats.actions += 1;
      if (action.id === "cook") state.stats.meals += 1;
      if (action.id === "shower") state.stats.showers += 1;
      if (action.id === "call") state.stats.calls += 1;
      applyEffects(action.effects);
      notify(action.notify);
      state.currentAction = null;
      state.autonomyCooldown = 3;
      renderPanel(); checkGoals(); autosave();
    }
    function actionCost(action) {
      if (!action || !action.cost) return 0;
      return action === ACTIONS.groceries ? GROCERY_PRICE[state.diff] || action.cost : action.cost;
    }

    function moveTowards(target, dt) {
      const dx = target.x - state.char.x;
      const dy = target.y - state.char.y;
      const dist = Math.hypot(dx, dy);

      const step = 170 * dt * Math.max(1, Math.min(state.speed, 10));

      if (dist <= step || dist < 2) {
        state.char.x = target.x;
        state.char.y = target.y;
        return true;
      }

      state.char.x += (dx / dist) * step;
      state.char.y += (dy / dist) * step;
      return false;
    }

    function decayNeeds(gameMinutes) {
      if (cheat.SERENITY) return;
      const k = (DIFF[state.diff] || DIFF.normal).decay;
      for (const [key, rate] of Object.entries(DECAY)) {
        state.needs[key] = clamp(state.needs[key] + rate * k * gameMinutes, 0, 100);
      }
    }

    function checkWarnings() {
      NEEDS.forEach((need) => {
        const value = state.needs[need.id];

        if (value < 20 && !state.warnings[need.id]) {
          notify(`${need.label} is critically low!`);
          state.warnings[need.id] = true;
        } else if (value > 30 && state.warnings[need.id]) {
          state.warnings[need.id] = false;
        }
      });
    }

    function chooseAutonomous() {
      const n = state.needs;
      const candidates = [];

      if (n.bladder < 70) {
        candidates.push({
          id: "toilet",
          score: 110 - n.bladder + (n.bladder < 30 ? 30 : 0)
        });
      }

      if (n.hunger < 70) {
        const g = state.inventory.groceries;
        const wantsCook = n.hunger < 35 && g >= 2;
        candidates.push({
          id: g < 1 ? "groceries" : wantsCook ? "cook" : "snack",
          score: 105 - n.hunger + (n.hunger < 30 ? 25 : 0)
        });
      }

      if (n.energy < 65) {
        candidates.push({
          id: n.energy < 25 ? "sleep" : "nap",
          score: 100 - n.energy + (n.energy < 20 ? 25 : 0)
        });
      }

      if (n.hygiene < 65) {
        candidates.push({
          id: "shower",
          score: 95 - n.hygiene
        });
      }

      if (n.fun < 60) {
        candidates.push({
          id: "watch",
          score: 90 - n.fun
        });
      }

      if (n.social < 60) {
        candidates.push({
          id: "call",
          score: 90 - n.social
        });
      }

      if (state.money < 80 && n.energy > 35 && n.bladder > 35 && n.hunger > 35) {
        candidates.push({
          id: "work",
          score: 80
        });
      }

      if (!candidates.length) {
        candidates.push(
          { id: "sit", score: 10 },
          { id: "browse", score: 8 },
          { id: "clean", score: 6 }
        );
      }

      let affordable = candidates.filter((candidate) => {
        const action = ACTIONS[candidate.id];
        return state.money >= actionCost(action) &&
          !(action.uses && Object.entries(action.uses).some(([k, q]) => (state.inventory[k] || 0) < q));
      });

      if (!affordable.length) {
        affordable = [
          { id: "sit", score: 10 },
          { id: "browse", score: 8 },
          { id: "clean", score: 6 },
          { id: "work", score: 5 }
        ];
      }

      const chosen = affordable.sort((a, b) => b.score - a.score)[0];

      if (chosen) {
        startAction(chosen.id);
      }
    }

    function update(dt) {
      const gameMinutes = dt * state.speed;

      state.time += gameMinutes;

      if (state.time >= 1440) {
        state.time -= 1440;
        state.day += 1;
        notify("A new day begins.");
        endOfDay();
        return;
      }
      const hour = Math.floor(state.time / 60);
      if (hour !== state.lastHour) { state.lastHour = hour; autosave(); }   /* autosave every game hour */
      checkGoals();

      decayNeeds(gameMinutes);

      if (state.currentAction) {
        const action = state.currentAction;

        if (action.phase === "move") {
          const arrived = moveTowards(
            { x: action.targetX, y: action.targetY },
            dt
          );

          if (arrived) {
            action.phase = "doing";
          }
        } else {
          action.elapsed += gameMinutes;

          if (action.elapsed >= action.duration) {
            completeAction();
          }
        }
      } else if (state.moveTarget) {
        const arrived = moveTowards(state.moveTarget, dt);

        if (arrived) {
          state.moveTarget = null;
        }
      }

      if (state.autonomy && !state.currentAction && !state.moveTarget) {
        state.autonomyCooldown -= gameMinutes;

        if (state.autonomyCooldown <= 0) {
          chooseAutonomous();
          state.autonomyCooldown = 5;
        }
      }

      checkWarnings();
      updateHUD();
    }

    function drawRooms() {
      ctx.setTransform(RES, 0, 0, RES, 0, 0);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, LW, LH);

      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(20, 20, 920, 560);

      const rooms = [
        { name: "Kitchen", x: 20, y: 20, w: 300, h: 220, color: "#fde68a" },
        { name: "Bathroom", x: 640, y: 20, w: 300, h: 220, color: "#bae6fd" },
        { name: "Bedroom", x: 20, y: 360, w: 300, h: 220, color: "#ddd6fe" },
        { name: "Living Room", x: 640, y: 360, w: 300, h: 220, color: "#bbf7d0" }
      ];

      rooms.forEach((room) => {
        ctx.fillStyle = room.color;
        ctx.fillRect(room.x, room.y, room.w, room.h);

        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 3;
        ctx.strokeRect(room.x, room.y, room.w, room.h);

        ctx.fillStyle = "#334155";
        ctx.font = "16px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.fillText(room.name, room.x + 10, room.y + 24);
      });
    }

    function drawObjects() {
      OBJECTS.forEach((obj) => {
        const selected = state.selectedObject === obj.id;

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(obj.x, obj.y, obj.w, obj.h);

        ctx.strokeStyle = selected ? "#2563eb" : "#334155";
        ctx.lineWidth = selected ? 4 : 2;
        ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);

        ctx.font = `${Math.min(obj.w, obj.h) * 0.45}px serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#111827";
        ctx.fillText(obj.emoji, obj.x + obj.w / 2, obj.y + obj.h / 2);

        ctx.font = "11px Arial";
        ctx.fillStyle = "#334155";
        ctx.textBaseline = "alphabetic";
        ctx.fillText(obj.name, obj.x + obj.w / 2, obj.y + obj.h + 12);
      });
    }

    function drawCharacter() {
      let status = "Idle";

      if (state.currentAction) {
        const action = state.currentAction;

        status =
          action.phase === "move"
            ? `Moving to ${action.targetName}`
            : `${action.label} ${Math.floor(action.elapsed)}/${action.duration}m`;
      } else if (state.moveTarget) {
        status = "Moving";
      }

      ctx.beginPath();
      ctx.arc(state.char.x, state.char.y, 16, 0, Math.PI * 2);
      ctx.fillStyle = "#f97316";
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.font = "20px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#111827";
      ctx.fillText(moodEmoji(), state.char.x, state.char.y);

      ctx.font = "14px Arial";
      ctx.fillStyle = "#111827";
      ctx.fillText(status, state.char.x, state.char.y - 34);

      if (state.currentAction && state.currentAction.phase === "doing") {
        const action = state.currentAction;
        const pct = clamp(action.elapsed / action.duration, 0, 1);

        ctx.fillStyle = "#111827";
        ctx.fillRect(state.char.x - 40, state.char.y - 54, 80, 8);

        ctx.fillStyle = "#22c55e";
        ctx.fillRect(state.char.x - 40, state.char.y - 54, 80 * pct, 8);
      }
    }

    function draw() {
      drawRooms();
      drawObjects();
      drawCharacter();
    }

    function getObjectAt(x, y) {
      for (let i = OBJECTS.length - 1; i >= 0; i--) {
        const obj = OBJECTS[i];

        if (x >= obj.x && x <= obj.x + obj.w && y >= obj.y && y <= obj.y + obj.h) {
          return obj;
        }
      }

      return null;
    }

    function selectObject(obj) {
      state.selectedObject = obj.id; sfx("tap");
      renderPanel();
    }

    function saveGame() {
      autosave();
      notify("Game saved.");
    }

    function loadGame() {
      const raw = localStorage.getItem("miniLifeSimSave");

      if (!raw) {
        notify("No save found.");
        return;
      }

      try {
        const data = JSON.parse(raw);
        const base = createInitialState();

        state = {
          ...base,
          ...data,
          needs: { ...base.needs, ...(data.needs || {}) },
          char: { ...base.char, ...(data.char || {}) },
          warnings: { ...base.warnings, ...(data.warnings || {}) }
        };

        state.inventory = { ...base.inventory, ...(data.inventory || {}) };
        state.stats = { ...base.stats, ...(data.stats || {}) };
        if (!Array.isArray(state.goals) || !state.goals.length) newGoals();
        state.currentAction = null;
        state.moveTarget = null;
        state.paused = false;
        renderPanel();
        renderNotifications(); renderGoals();
        notify("Game loaded.");
      } catch (err) {
        notify("Save could not be loaded.");
      }
    }

    function resetGame() {
      const diff = state.diff;
      localStorage.removeItem("miniLifeSimSave");
      state = createInitialState();
      state.diff = diff;
      if (cheat.MONEYBAGS) state.money += 1000;
      newGoals();
      renderPanel();
      renderNotifications();
      notify("New game started.");
      autosave();
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();

      const scaleX = LW / rect.width;
      const scaleY = LH / rect.height;

      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      const obj = getObjectAt(x, y);

      if (obj) {
        selectObject(obj);
      } else {
        state.currentAction = null;
        state.moveTarget = { x, y };
        renderPanel();
      }
    });

    /* one pause: the header button opens the arcade pause menu (or pauses the house without it) */
    function togglePause() {
      if (SDK) { if (SDK.paused) SDK.resume(); else SDK.showMenu(); return; }
      state.paused = !state.paused; updateHUD();
    }
    document.getElementById("pauseBtn").onclick = togglePause;

    document.querySelectorAll(".speed").forEach((btn) => {
      btn.onclick = () => {
        state.speed = Number(btn.dataset.speed);
        if (!dayPause && document.getElementById("titleCard").hidden) state.paused = false;
        updateHUD();
      };
    });

    document.getElementById("autonomy").onclick = () => {
      state.autonomy = !state.autonomy; updateHUD();
      notify(`Autonomy ${state.autonomy ? "enabled" : "disabled"}.`);
    };

    document.getElementById("saveBtn").onclick = saveGame;
    document.getElementById("loadBtn").onclick = loadGame;
    document.getElementById("resetBtn").onclick = resetGame;

    window.addEventListener("keydown", (e) => {
      if (e.target && /INPUT|BUTTON/.test(e.target.tagName)) return;
      if (!document.getElementById("titleCard").hidden || !document.getElementById("dayCard").hidden) return;
      if (e.code === "Space") {
        e.preventDefault();
        togglePause();
      }

      if (e.key === "1") {
        state.speed = 1;
        if (!dayPause) state.paused = false;
        updateHUD();
      }

      if (e.key === "2") {
        state.speed = 5;
        if (!dayPause) state.paused = false;
        updateHUD();
      }

      if (e.key === "3") {
        state.speed = 15;
        if (!dayPause) state.paused = false;
        updateHUD();
      }

      if (e.key === "4") {
        state.speed = 60;
        if (!dayPause) state.paused = false;
        updateHUD();
      }
    });

    /* ── title card, first-run coach, codes, hints ── */
    const CODES = { MONEYBAGS: "+$1000 (and every new life starts with it)", SERENITY: "Needs stop dropping",
      PANTRY: "+20 groceries in the fridge" };
    const cheat = { MONEYBAGS: false, SERENITY: false, PANTRY: false };
    function applyCode(code) {
      code = String(code || "").trim().toUpperCase();
      if (!CODES[code]) return { ok: false };
      cheat[code] = true; document.getElementById("codesOn").hidden = false;
      if (code === "MONEYBAGS") state.money += 1000;
      if (code === "PANTRY") state.inventory.groceries += 20;
      updateHUD(); sfx("unlock");
      return { ok: true, message: CODES[code] };
    }
    const COACH = [
      { txt: "Click the <b>🧊 Fridge</b> in the kitchen.", done: () => state.selectedObject === "fridge" },
      { txt: "Now choose <b>Grab Snack</b>. Your Sim walks over and eats (it uses 1 grocery).", done: () => !!state.currentAction || state.stats.actions > 0 },
      { txt: "The <b>Needs</b> bars drop all day. Green is fine; red means act now.", next: true },
      { txt: "Work at the <b>💻 Computer</b> for $140, and order groceries on the <b>📱 Phone</b>. Tick off today's goals!", next: true }
    ];
    let coachIx = -1;
    function coachShow(i) {
      coachIx = i;
      const c = COACH[i];
      if (!c) { coachEnd(); return; }
      document.getElementById("coachStep").textContent = `Tutorial ${i + 1} of ${COACH.length}`;
      document.getElementById("coachTxt").innerHTML = c.txt;
      document.getElementById("coachNext").hidden = !c.next;
      document.getElementById("coach").hidden = false;
    }
    function coachEnd() { coachIx = -1; document.getElementById("coach").hidden = true; try { localStorage.setItem("mls_tut", "1"); } catch (e) {} }
    function coachTick() { if (coachIx >= 0 && COACH[coachIx].done && COACH[coachIx].done()) { sfx("correct"); coachShow(coachIx + 1); } }
    document.getElementById("coachNext").onclick = () => coachShow(coachIx + 1);
    document.getElementById("coachSkip").onclick = coachEnd;
    function hasSave() { try { return !!localStorage.getItem("miniLifeSimSave"); } catch (e) { return false; } }
    function setDiff(d) {
      state.diff = d;
      document.querySelectorAll(".diff").forEach((b) => b.classList.toggle("active", b.dataset.diff === d));
      document.getElementById("diffNote").textContent = DIFF[d].note;
    }
    document.querySelectorAll(".diff").forEach((b) => (b.onclick = () => { setDiff(b.dataset.diff); sfx("tap"); }));
    let pickedDiff = "normal";
    function showTitle() {
      coachIx = -1; document.getElementById("coach").hidden = true;
      document.getElementById("dayCard").hidden = true; dayPause = false;
      state.paused = true;
      document.getElementById("continueBtn").hidden = !hasSave();
      const best = readBest();
      document.getElementById("bestLine").textContent = best.days ? `Best: ${best.days} days lived, ${best.trophies} trophies` : "";
      setDiff(state.diff || "normal");
      updateHUD();
      document.getElementById("titleCard").hidden = false;
      try { document.getElementById("newBtn").focus({ preventScroll: true }); } catch (e) {}
      sdkState("title");
    }
    function beginPlay(fresh) {
      const d = state.diff;
      document.getElementById("titleCard").hidden = true;
      if (fresh || !hasSave()) { state.diff = d; resetGame(); } else loadGame();
      state.paused = false; updateHUD(); sfx("go");
      sdkState("play", 0);
      let seen = false; try { seen = localStorage.getItem("mls_tut") === "1"; } catch (e) {}
      if (!seen) coachShow(0);
    }
    function syncGfx() { document.getElementById("gfxBtn").textContent = "Graphics: " + (gfxLow ? "Low" : "High"); }
    document.getElementById("gfxBtn").onclick = () => { gfxLow = !gfxLow; try { localStorage.setItem("mls_gfx", gfxLow ? "low" : "high"); } catch (e) {} fitCanvas(); syncGfx(); sfx("tap"); };
    syncGfx();
    document.getElementById("newBtn").onclick = () => beginPlay(true);
    document.getElementById("continueBtn").onclick = () => beginPlay(false);
    document.getElementById("dayNext").onclick = () => {
      document.getElementById("dayCard").hidden = true; dayPause = false; state.paused = false; updateHUD(); sdkState("play", 0);
    };
    function hintNow() {
      if (!document.getElementById("titleCard").hidden) return "Pick a difficulty and press New life.";
      const low = NEEDS.slice().sort((a, b) => state.needs[a.id] - state.needs[b.id])[0];
      const fix = { hunger: state.inventory.groceries ? "the Fridge (snack) or Stove (meal)" : "the Phone to order groceries, then the Fridge",
        bladder: "the Toilet", energy: "the Bed (nap or sleep)", hygiene: "the Shower", fun: "the TV", social: "the Phone (call a friend)" }[low.id];
      if (state.needs[low.id] < 45) return `${low.label} is lowest (${Math.round(state.needs[low.id])}): use ${fix}.`;
      if (state.money < 30) return "Money is low: work at the Computer for $140.";
      const g = state.goals.find((x) => !x.done);
      if (g) return `Next goal: ${g.text}. Each goal pays $25.`;
      return "All goals done today: keep everyone happy until midnight for a trophy.";
    }
    /* With the arcade SDK its round pause button (bottom right) is the one pause button; Space still pauses. */
    if (SDK) document.getElementById("pauseBtn").hidden = true;
    if (SDK) { try { window.ArcadeSDK.init({
      pauseKeys: "p+esc", pauseButton: "br",
      onPause() { state.paused = true; updateHUD(); },
      onResume() { if (document.getElementById("titleCard").hidden && !dayPause) state.paused = false; updateHUD(); },
      onRestart() { beginPlay(true); },
      onExit() { autosave(); showTitle(); },
      onTutorial() { document.getElementById("titleCard").hidden = true; if (!dayPause) state.paused = false; coachShow(0); },
      onHint: hintNow,
      onCheat: applyCode
    }); } catch (e) {} }

    buildNeedsUI();
    newGoals();
    renderPanel();
    renderNotifications();
    notify("Welcome! Click objects to interact.");
    showTitle();

    let last = performance.now();

    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;

      if (!state.paused) {
        update(dt);
      }
      coachTick();

      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
