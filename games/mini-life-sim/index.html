    * { box-sizing: border-box; }

    #pauseBtn[hidden] { display: none; }

    /* needs */
    #needs { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10; width: 300px; padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }

    .bar-fill { height: 100%; width: 50%; border-radius: 999px; transition: width 0.25s linear, background-color 0.3s; }

    /* right column: goals, inventory, log */
    #side { position: fixed; right: 12px; top: calc(70px + env(safe-area-inset-top)); z-index: 9; width: 270px; padding: 12px 14px; display: grid; gap: 12px; max-height: calc(100dvh - 160px); overflow: auto; }

    /* interaction menu at the object, and the action card */

    }

    const canvas = document.getElementById("game");
    /* Graphics: High renders at the screen's pixel ratio (up to 2x) with shadows and night lamps; Low at 1x
       without them. With no saved choice, a device that renders WebGL on the CPU starts on Low. */
    let gfxPref = null; try { gfxPref = localStorage.getItem("mls_gfx"); } catch (e) {}
    let gfxLow = gfxPref === "low";
    /* Caleb's Arcade SDK (guarded: the game still runs without it) */
    const SDK = window.ArcadeSDK || null;
    const sdkState = (scene, score) => { try { SDK && SDK.state(score == null ? { scene } : { scene, score }); } catch (e) {} };
    const sfx = (n) => { try { SDK && SDK.sfx(n); } catch (e) {} };

    const icon = (id) => `<svg class="i"><use href="#i-${id}"/></svg>`;

    /* ── daily goals, inventory, autosave ── */
    const GOAL_POOL = [
      { id: "earn", text: (n) => `Earn $${n} at the computer`, n: [140, 280], check: (s, n) => s.stats.earned >= n },
      { id: "cook", text: () => "Cook a meal", n: [1, 1], check: (s) => s.stats.meals >= 1 },
      { id: "shower", text: () => "Take a shower", n: [1, 1], check: (s) => s.stats.showers >= 1 },
      { id: "call", text: () => "Call a friend", n: [1, 1], check: (s) => s.stats.calls >= 1 },

    ];
    function newGoals() {
      const pool = GOAL_POOL.slice(); const out = [];
      while (out.length < 3 && pool.length) {
        const g = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        const n = g.n[0] + Math.floor(Math.random() * (g.n[1] - g.n[0] + 1));
        out.push({ id: g.id, n, text: g.text(n), done: false });
      }
      state.goals = out;
      state.stats = { earned: 0, meals: 0, showers: 0, calls: 0, actions: 0 };
      renderGoals();
    }
    function checkGoals() {
      let changed = false;
      state.goals.forEach((g) => {
        const def = GOAL_POOL.find((d) => d.id === g.id);
        if (!g.done && def && def.check(state, g.n)) {
          g.done = true; changed = true; state.money += 25;
          notify(`Goal done: ${g.text} (+$25)`); sfx("levelup");
          cheer = 1.6; if (window.H3) { H3.fx("goal"); floatText("+$25", H3.simAnchor()); }

    function endOfDay() {

    function moodAvg() { return NEEDS.reduce((sum, need) => sum + state.needs[need.id], 0) / NEEDS.length; }
    /* 4 very happy, 3 happy, 2 fine, 1 uncomfortable, 0 miserable (the plumbob turns from green to red) */
    function moodLevel() { const avg = moodAvg(); return avg > 75 ? 4 : avg > 55 ? 3 : avg > 35 ? 2 : avg > 20 ? 1 : 0; }
    function moodWord() { return ["Miserable", "Uncomfortable", "Fine", "Happy", "Very happy"][moodLevel()]; }

    function updateHUD() {
      document.getElementById("clock").textContent = formatClock();
      document.getElementById("money").textContent = `$${Math.round(state.money)}`;
      const mood = document.getElementById("mood"), ml = moodLevel();
      if (mood && mood.dataset.l !== String(ml)) { mood.dataset.l = ml; const c = ["#e8474b", "#f08a24", "#f5c400", "#7ccf3a", "#2fb846"][moodLevel()]; mood.innerHTML = `<svg viewBox="0 0 22 30" width="11" height="15" aria-hidden="true"><path d="M11 0 22 15 11 30 0 15z" fill="${c}"/></svg>`; mood.appendChild(document.createTextNode(moodWord())); }

    /* the action card: what the Sim is doing now, with its progress and a cancel button */
    let queueKey = "";
    function renderQueue() {
      const q = document.getElementById("queue"), a = state.currentAction;
      if (!a) { if (queueKey) { q.classList.remove("on"); q.innerHTML = ""; queueKey = ""; } return; }
      const obj = OBJECTS.find((o) => o.id === a.obj) || {};
      const key = a.id + a.phase;
      if (key !== queueKey) {
        queueKey = key;
        q.innerHTML = `<span class="qi">${icon(obj.icon || "play")}</span><div class="qt"><span id="qLabel"></span><small id="qSub"></small><div class="bar"><div class="bar-fill" id="qBar"></div></div></div><button id="qCancel" aria-label="Cancel action">${icon("x")}</button>`;
        document.getElementById("qLabel").textContent = a.label;
        document.getElementById("qCancel").onclick = () => {
          state.currentAction = null;
          state.moveTarget = null; state.path = null;
          notify("Action cancelled.");
          renderPanel();
        };
        q.classList.add("on");
      }
      document.getElementById("qSub").textContent = a.phase === "move" ? `Walking to the ${a.targetName}` : `${Math.floor(a.elapsed)} / ${a.duration} min`;
      document.getElementById("qBar").style.width = (a.phase === "move" ? 0 : clamp(a.elapsed / a.duration, 0, 1) * 100) + "%";
    }

    /* the interaction menu: bubbles over the chosen object, like a pie menu */
    function closeMenu() { document.getElementById("menu").classList.remove("on"); }
    function renderPanel() {
      const objectName = document.getElementById("objectName");
      const objectActions = document.getElementById("objectActions");
      const menu = document.getElementById("menu");

      objectActions.innerHTML = "";
      renderQueue();

      const obj = OBJECTS.find((o) => o.id === state.selectedObject);

      if (!obj || state.currentAction) {
        objectName.textContent = "None";
        menu.classList.remove("on");
        return;
      }

      objectName.textContent = obj.name;

      const actions = Object.entries(ACTIONS).filter(([, action]) =>
        action.objectIds.includes(obj.id)
      );

      actions.forEach(([id, action]) => {
        const btn = document.createElement("button");
        btn.className = "action";

        const price = actionCost(action);
        const costText = price ? `<b class="cost">-$${price}</b>` : "";
        const moneyText = action.money ? `<b>+$${action.money}</b>` : "";
        const useText = action.uses ? ` · ${action.uses.groceries} grocer${action.uses.groceries > 1 ? "ies" : "y"}` : "";

        btn.innerHTML = `<span class="dot">${icon(obj.icon)}</span>
          <span><span></span>
          <small>${action.duration} min${useText} ${costText}${moneyText}</small></span>`;
        btn.querySelector("span span").textContent = action.label;

        btn.onclick = (e) => { e.stopPropagation(); sfx("tap"); startAction(id); };
        objectActions.appendChild(btn);
      });

    function placeMenu() {
      const menu = document.getElementById("menu");
      if (!menu.classList.contains("on") || !window.H3) return;
      const p = H3.anchor(state.selectedObject); if (!p) return;
      const r = menu.getBoundingClientRect(), w = r.width || 220, h = r.height || 120;
      const x = clamp(p.x, w / 2 + 8, innerWidth - w / 2 - 8), y = clamp(p.y, h + 70, innerHeight - 8);
      menu.style.left = x + "px"; menu.style.top = y + "px";
    }

    function applyEffects(effects) {
      if (!effects) return;

      for (const [key, value] of Object.entries(effects)) {
        if (state.needs[key] !== undefined) {
          state.needs[key] = clamp(state.needs[key] + value, 0, 100);
        }
      }
    }

    function startAction(id) {
      const action = ACTIONS[id];
      if (!action) return;

      const price = actionCost(action);
      if (price && state.money < price) {
        notify(`Not enough money for ${action.label}.`); sfx("error");
        return;
      }
      if (action.uses && Object.entries(action.uses).some(([k, n]) => (state.inventory[k] || 0) < n)) {
        notify(`No groceries left: order some on the phone.`); sfx("error");
        return;
      }

      const targetId =
        state.selectedObject && action.objectIds.includes(state.selectedObject)
          ? state.selectedObject
          : action.objectIds[0];

      const obj = OBJECTS.find((o) => o.id === targetId);
      if (!obj) return;

      state.selectedObject = obj.id;
      state.moveTarget = null;
      const spot = toBoard(obj.use[0], obj.use[1]);

      state.currentAction = {
        id,
        obj: obj.id,
        label: action.label,
        duration: action.duration,
        cost: price || 0,
        money: action.money || 0,
        uses: action.uses || null,
        gives: action.gives || null,
        effects: action.effects || {},
        notify: action.notify || `${action.label} finished.`,
        phase: "move",
        elapsed: 0,
        targetX: spot.x,
        targetY: spot.y,
        targetName: obj.name
      };
      state.path = route(state.char, spot);
      renderPanel();
    }

    function completeAction() {
      const action = state.currentAction;
      if (!action) return;

      if (action.cost) {
        state.money -= action.cost;
      }

      if (action.money) {
        state.money += action.money; state.stats.earned += action.money; sfx("coin");
        if (window.H3) { H3.fx("money"); floatText(`+$${action.money}`, H3.simAnchor()); }
      } else { sfx("collect"); if (window.H3) H3.fx("done", action.obj); }
      if (action.cost && window.H3) floatText(`-$${action.cost}`, H3.simAnchor());
      if (action.uses) for (const [k, n] of Object.entries(action.uses)) state.inventory[k] = Math.max(0, (state.inventory[k] || 0) - n);
      if (action.gives) for (const [k, n] of Object.entries(action.gives)) state.inventory[k] = (state.inventory[k] || 0) + n;
      state.stats.actions += 1;
      if (action.id === "cook") state.stats.meals += 1;
      if (action.id === "shower") state.stats.showers += 1;
      if (action.id === "call") state.stats.calls += 1;
      applyEffects(action.effects);
      notify(action.notify);
      state.currentAction = null;
      state.autonomyCooldown = 3;
      renderPanel(); checkGoals(); autosave();
    }
    function actionCost(action) {
      if (!action || !action.cost) return 0;
      return action === ACTIONS.groceries ? GROCERY_PRICE[state.diff] || action.cost : action.cost;
    }

    /* walks along the route (door to door); true once the last point is reached */
    function moveTowards(target, dt) {
      if (!state.path || !state.path.length) state.path = [{ x: target.x, y: target.y }];
      let step = 170 * dt * Math.max(1, Math.min(state.speed, 10));
      while (step > 0 && state.path.length) {
        const p = state.path[0];
        const dx = p.x - state.char.x;
        const dy = p.y - state.char.y;
        const dist = Math.hypot(dx, dy);
        if (dist <= step || dist < 2) {
          state.char.x = p.x; state.char.y = p.y; step -= dist; state.path.shift();
        } else {
          state.char.x += (dx / dist) * step;
          state.char.y += (dy / dist) * step;
          step = 0;
        }
      }
      if (!state.path.length) { state.path = null; return true; }
      return false;
    }

    function decayNeeds(gameMinutes) {
      if (cheat.SERENITY) return;
      const k = (DIFF[state.diff] || DIFF.normal).decay;
      for (const [key, rate] of Object.entries(DECAY)) {
        state.needs[key] = clamp(state.needs[key] + rate * k * gameMinutes, 0, 100);
      }
    }

    function checkWarnings() {
      NEEDS.forEach((need) => {
        const value = state.needs[need.id];

        if (value < 20 && !state.warnings[need.id]) {
          notify(`${need.label} is critically low!`); sfx("error");
          state.warnings[need.id] = true;
        } else if (value > 30 && state.warnings[need.id]) {
          state.warnings[need.id] = false;
        }
      });
    }

    function chooseAutonomous() {
      const n = state.needs;
      const candidates = [];

      if (n.bladder < 70) {
        candidates.push({
          id: "toilet",
          score: 110 - n.bladder + (n.bladder < 30 ? 30 : 0)
        });
      }

      if (n.hunger < 70) {
        const g = state.inventory.groceries;
        const wantsCook = n.hunger < 35 && g >= 2;
        candidates.push({
          id: g < 1 ? "groceries" : wantsCook ? "cook" : "snack",
          score: 105 - n.hunger + (n.hunger < 30 ? 25 : 0)
        });
      }

      if (n.energy < 65) {
        candidates.push({
          id: n.energy < 25 ? "sleep" : "nap",
          score: 100 - n.energy + (n.energy < 20 ? 25 : 0)
        });
      }

      if (n.hygiene < 65) {
        candidates.push({
          id: "shower",
          score: 95 - n.hygiene
        });
      }

      if (n.fun < 60) {
        candidates.push({
          id: "watch",
          score: 90 - n.fun
        });
      }

      if (n.social < 60) {
        candidates.push({
          id: "call",
          score: 90 - n.social
        });
      }

      if (state.money < 80 && n.energy > 35 && n.bladder > 35 && n.hunger > 35) {
        candidates.push({
          id: "work",
          score: 80
        });
      }

      if (!candidates.length) {
        candidates.push(
          { id: "sit", score: 10 },
          { id: "browse", score: 8 },
          { id: "clean", score: 6 }
        );
      }

      let affordable = candidates.filter((candidate) => {
        const action = ACTIONS[candidate.id];
        return state.money >= actionCost(action) &&
          !(action.uses && Object.entries(action.uses).some(([k, q]) => (state.inventory[k] || 0) < q));
      });

      if (!affordable.length) {
        affordable = [
          { id: "sit", score: 10 },
          { id: "browse", score: 8 },
          { id: "clean", score: 6 },
          { id: "work", score: 5 }
        ];
      }

      const chosen = affordable.sort((a, b) => b.score - a.score)[0];

      if (chosen) {
        startAction(chosen.id);
      }
    }

    function update(dt) {
      const gameMinutes = dt * state.speed;

      state.time += gameMinutes;

      if (state.time >= 1440) {
        state.time -= 1440;
        state.day += 1;
        notify("A new day begins.");
        endOfDay();
        return;
      }
      const hour = Math.floor(state.time / 60);
      if (hour !== state.lastHour) { state.lastHour = hour; autosave(); }   /* autosave every game hour */
      checkGoals();

      decayNeeds(gameMinutes);

      if (state.currentAction) {
        const action = state.currentAction;

        if (action.phase === "move") {
          const arrived = moveTowards(
            { x: action.targetX, y: action.targetY },
            dt
          );

          if (arrived) {
            action.phase = "doing";
          }
        } else {
          action.elapsed += gameMinutes;

          if (action.elapsed >= action.duration) {
            completeAction();
          }
        }
      } else if (state.moveTarget) {
        const arrived = moveTowards(state.moveTarget, dt);

        if (arrived) {
          state.moveTarget = null;
        }
      }

      if (state.autonomy && !state.currentAction && !state.moveTarget) {
        state.autonomyCooldown -= gameMinutes;

        if (state.autonomyCooldown <= 0) {
          chooseAutonomous();
          state.autonomyCooldown = 5;
        }
      }

      checkWarnings();
      updateHUD();
    }

    function selectObject(id) {
      state.selectedObject = id; sfx("tap");
      renderPanel();
    }
    /* a click in the house (from house3d.js): an object opens its menu; the floor walks the Sim there */
    function boardClick(hit) {
      if (!document.getElementById("titleCard").hidden || !document.getElementById("dayCard").hidden) return;
      if (hit && hit.obj) { selectObject(hit.obj); return; }
      if (hit && hit.floor) {
        state.currentAction = null;
        state.selectedObject = null;
        state.moveTarget = { x: hit.floor.x, y: hit.floor.y };
        state.path = route(state.char, state.moveTarget);
        renderPanel();
        return;
      }
      state.selectedObject = null; renderPanel();
    }

    function saveGame() {
      autosave();
      notify("Game saved.");
    }

    function loadGame() {
      const raw = localStorage.getItem("miniLifeSimSave");

      if (!raw) {
        notify("No save found.");
        return;
      }

      try {
        const data = JSON.parse(raw);
        const base = createInitialState();

        state = {
          ...base,
          ...data,
          needs: { ...base.needs, ...(data.needs || {}) },
          char: { ...base.char, ...(data.char || {}) },
          warnings: { ...base.warnings, ...(data.warnings || {}) }
        };

        state.inventory = { ...base.inventory, ...(data.inventory || {}) };
        state.stats = { ...base.stats, ...(data.stats || {}) };
        if (!Array.isArray(state.goals) || !state.goals.length) newGoals();
        state.currentAction = null;
        state.moveTarget = null;
        state.path = null;
        state.paused = false;
        renderPanel();
        renderNotifications(); renderGoals();
        notify("Game loaded.");
      } catch (err) {
        notify("Save could not be loaded.");
      }
    }

    function resetGame() {
      const diff = state.diff;
      localStorage.removeItem("miniLifeSimSave");
      state = createInitialState();
      state.diff = diff;
      if (cheat.MONEYBAGS) state.money += 1000;
      newGoals();
      renderPanel();
      renderNotifications();
      notify("New game started.");
      autosave();
    }

    /* one pause: the arcade pause menu (or pauses the house without it) */
    function togglePause() {
      if (SDK) { if (SDK.paused) SDK.resume(); else SDK.showMenu(); return; }
      state.paused = !state.paused; updateHUD();
    }
    document.getElementById("pauseBtn").onclick = togglePause;

    document.querySelectorAll(".speed").forEach((btn) => {
      btn.onclick = () => {
        state.speed = Number(btn.dataset.speed);
        if (!dayPause && document.getElementById("titleCard").hidden) state.paused = false;
        sfx("tap"); updateHUD();
      };
    });

    document.getElementById("autonomy").onclick = () => {
      state.autonomy = !state.autonomy; updateHUD(); sfx("tap");
      notify(`Autonomy ${state.autonomy ? "enabled" : "disabled"}.`);
    };

    document.getElementById("saveBtn").onclick = saveGame;
    document.getElementById("loadBtn").onclick = loadGame;
    document.getElementById("resetBtn").onclick = resetGame;
    document.getElementById("saveBtn2").onclick = saveGame;
    document.getElementById("loadBtn2").onclick = loadGame;
    document.getElementById("resetBtn2").onclick = resetGame;
    document.getElementById("sideBtn").onclick = () => {
      const s = document.getElementById("side"), open = !s.classList.contains("open");
      s.classList.toggle("open", open); document.getElementById("sideBtn").setAttribute("aria-expanded", String(open)); sfx("tap");
    };

    window.addEventListener("keydown", (e) => {
      if (e.target && /INPUT|BUTTON/.test(e.target.tagName)) return;
      if (!document.getElementById("titleCard").hidden || !document.getElementById("dayCard").hidden) return;
      if (e.code === "Space") {
        e.preventDefault();
        togglePause();
      }
      if (e.key === "Escape" && document.getElementById("menu").classList.contains("on")) { state.selectedObject = null; renderPanel(); }

      if (e.key === "1") {
        state.speed = 1;
        if (!dayPause) state.paused = false;
        updateHUD();
      }

      if (e.key === "2") {
        state.speed = 5;
        if (!dayPause) state.paused = false;
        updateHUD();
      }

      if (e.key === "3") {
        state.speed = 15;
        if (!dayPause) state.paused = false;
        updateHUD();
      }

      if (e.key === "4") {
        state.speed = 60;
        if (!dayPause) state.paused = false;
        updateHUD();
      }
    });

    /* ── title card, first-run coach, codes, hints ── */
    const CODES = { MONEYBAGS: "+$1000 (and every new life starts with it)", SERENITY: "Needs stop dropping",
      PANTRY: "+20 groceries in the fridge" };
    const cheat = { MONEYBAGS: false, SERENITY: false, PANTRY: false };
    function applyCode(code) {
      code = String(code || "").trim().toUpperCase();
      if (!CODES[code]) return { ok: false };
      cheat[code] = true; document.getElementById("codesOn").hidden = false;
      if (code === "MONEYBAGS") state.money += 1000;
      if (code === "PANTRY") state.inventory.groceries += 20;
      updateHUD(); sfx("unlock");
      return { ok: true, message: CODES[code] };
    }
    const COACH = [
      { txt: "Click the <b>Fridge</b> in the kitchen (top left).", done: () => state.selectedObject === "fridge" },
      { txt: "Now choose <b>Grab Snack</b>. Your Sim walks over and eats (it uses 1 grocery).", done: () => !!state.currentAction || state.stats.actions > 0 },
      { txt: "The <b>Needs</b> bars drop all day. Green is fine; red means act now.", next: true },
      { txt: "Work at the <b>Computer</b> for $140, and order groceries on the <b>Phone</b>. Tick off today's goals!", next: true }
    ];
    let coachIx = -1;
    function coachShow(i) {
      coachIx = i;
      const c = COACH[i];
      if (!c) { coachEnd(); return; }
      document.getElementById("coachStep").textContent = `Tutorial ${i + 1} of ${COACH.length}`;
      document.getElementById("coachTxt").innerHTML = c.txt;
      document.getElementById("coachNext").hidden = !c.next;
      document.getElementById("coach").hidden = false;
    }
    function coachEnd() { coachIx = -1; document.getElementById("coach").hidden = true; try { localStorage.setItem("mls_tut", "1"); } catch (e) {} }
    function coachTick() { if (coachIx >= 0 && COACH[coachIx].done && COACH[coachIx].done()) { sfx("correct"); coachShow(coachIx + 1); } }
    document.getElementById("coachNext").onclick = () => coachShow(coachIx + 1);
    document.getElementById("coachSkip").onclick = coachEnd;
    function hasSave() { try { return !!localStorage.getItem("miniLifeSimSave"); } catch (e) { return false; } }
    function setDiff(d) {
      state.diff = d;
      document.querySelectorAll(".diff").forEach((b) => b.classList.toggle("active", b.dataset.diff === d));
      document.getElementById("diffNote").textContent = DIFF[d].note;
    }
    document.querySelectorAll(".diff").forEach((b) => (b.onclick = () => { setDiff(b.dataset.diff); sfx("tap"); }));
    function showTitle() {
      coachIx = -1; document.getElementById("coach").hidden = true;
      document.getElementById("dayCard").hidden = true; dayPause = false;
      state.paused = true; closeMenu();
      document.getElementById("continueBtn").hidden = !hasSave();
      const best = readBest();
      document.getElementById("bestLine").textContent = best.days ? `Best: ${best.days} days lived, ${best.trophies} trophies` : "";
      setDiff(state.diff || "normal");
      updateHUD();
      document.getElementById("titleCard").hidden = false;
      try { document.getElementById("newBtn").focus({ preventScroll: true }); } catch (e) {}
      sdkState("title");
    }
    function beginPlay(fresh) {
      const d = state.diff;
      document.getElementById("titleCard").hidden = true;
      if (fresh || !hasSave()) { state.diff = d; resetGame(); } else loadGame();
      state.paused = false; updateHUD(); sfx("go");
      sdkState("play", 0);
      let seen = false; try { seen = localStorage.getItem("mls_tut") === "1"; } catch (e) {}
      if (!seen) coachShow(0);
    }
    function syncGfx() { document.getElementById("gfxBtn").textContent = "Graphics: " + (gfxLow ? "Low" : "High"); }
    document.getElementById("gfxBtn").onclick = () => { gfxLow = !gfxLow; try { localStorage.setItem("mls_gfx", gfxLow ? "low" : "high"); } catch (e) {} if (window.H3) H3.setQuality(gfxLow ? "low" : "high"); syncGfx(); sfx("tap"); };
    syncGfx();
    document.getElementById("newBtn").onclick = () => beginPlay(true);
    document.getElementById("continueBtn").onclick = () => beginPlay(false);
    document.getElementById("dayNext").onclick = () => {
      document.getElementById("dayCard").hidden = true; dayPause = false; state.paused = false; updateHUD(); sdkState("play", 0); sfx("go");
    };
    function hintNow() {
      if (!document.getElementById("titleCard").hidden) return "Pick a difficulty and press New life.";
      const low = NEEDS.slice().sort((a, b) => state.needs[a.id] - state.needs[b.id])[0];
      const fix = { hunger: state.inventory.groceries ? "the Fridge (snack) or Stove (meal)" : "the Phone to order groceries, then the Fridge",
        bladder: "the Toilet", energy: "the Bed (nap or sleep)", hygiene: "the Shower", fun: "the TV", social: "the Phone (call a friend)" }[low.id];
      if (state.needs[low.id] < 45) return `${low.label} is lowest (${Math.round(state.needs[low.id])}): use ${fix}.`;
      if (state.money < 30) return "Money is low: work at the Computer for $140.";
      const g = state.goals.find((x) => !x.done);
      if (g) return `Next goal: ${g.text}. Each goal pays $25.`;
      return "All goals done today: keep everyone happy until midnight for a trophy.";
    }
    /* With the arcade SDK its round pause button (top right) is the one pause button; Space still pauses. */
    if (SDK) document.getElementById("pauseBtn").hidden = true;
    if (SDK) { try { window.ArcadeSDK.init({
      pauseKeys: "p+esc", pauseButton: "tr",
      onPause() { state.paused = true; updateHUD(); },
      onResume() { if (document.getElementById("titleCard").hidden && !dayPause) state.paused = false; updateHUD(); },
      onRestart() { beginPlay(true); },
      onExit() { autosave(); showTitle(); },
      onTutorial() { document.getElementById("titleCard").hidden = true; if (!dayPause) state.paused = false; coachShow(0); },
      onHint: hintNow,
      onCheat: applyCode
    }); } catch (e) {} }

    buildNeedsUI();
    newGoals();
    renderPanel();
    renderNotifications();
    notify("Welcome! Click objects to interact.");
    showTitle();

    /* the free part of the screen (not under the panels) that the house is framed in */
    function freeRect() {
      const W = innerWidth, H = innerHeight;
      if (W <= 700) { const top = 104, bottom = 176; return { x: 0, y: top, w: W, h: Math.max(160, H - top - bottom) }; }
      if (W <= 1100 || H <= 620) { const top = 56, bottom = 116; return { x: 0, y: top, w: W, h: Math.max(160, H - top - bottom) }; }
      const top = 64, left = W > 1000 ? 0 : 0, right = 290;
      return { x: left, y: top, w: Math.max(300, W - right - left), h: Math.max(200, H - top - 10) };
    }
    let last = performance.now();
    function view() {
      return { char: state.char, action: state.currentAction, moving: !!(state.path && state.path.length) && !state.paused, fast: state.speed >= 15,
        selected: state.selectedObject, time: state.time, mood: moodAvg(), target: state.moveTarget || (state.currentAction && state.currentAction.phase === "move" ? { x: state.currentAction.targetX, y: state.currentAction.targetY } : null),
        title: !document.getElementById("titleCard").hidden, cheer };
    }
    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;

      if (!state.paused) {
        update(dt);
      }
      cheer = Math.max(0, cheer - dt);
      coachTick();
      if (window.H3) { H3.frame(dt, now, view()); placeMenu(); }
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
  <script type="module">
    import { createHouse } from "./house3d.js";
    const q = gfxPref === "low" || gfxPref === "high" ? gfxPref : "auto";
    createHouse(canvas, { quality: q, objects: OBJECTS }).then((H) => {
      window.H3 = H;
      gfxLow = H.quality === "low"; syncGfx();
      const fit = () => H.resize(freeRect());
      fit(); addEventListener("resize", fit);
      canvas.addEventListener("click", (e) => boardClick(H.pick(e.clientX, e.clientY)));
      document.getElementById("load").hidden = true;
    }).catch((e) => { document.getElementById("load").textContent = "The house could not load."; console.warn(e); });
  </script>
</body>
</html>
