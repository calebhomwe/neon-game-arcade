name: Deploy to GitHub Pages
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # Runs on the repository's default branch whatever it is called, so this
    # keeps working if the branch is ever renamed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage publishable files
        run: |
          mkdir -p _site
          # index.html is the hub -- it is the only page here that links a game
          # library (32 links, all resolving). games.html, games-arcade.html,
          # bridge-race.html and dashboard.html each resolve zero links: they are
          # standalone pages, not competing landings, and nothing links to them.
          cp index.html _site/
          cp -r games _site/
          # Not published: research/ (a design research note), setup.ps1 (an
          # operator script), WORKFLOW_GUIDE.md, skywalker-studio/ (a second,
          # unlinked copy of the games). A Pages URL is public even when the
          # repo is not, so the site is an allowlist rather than path: '.'.
          echo "--- staged for publication ---"
          du -sh _site
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
